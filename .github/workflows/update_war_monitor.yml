name: Actualizar Monitor de Guerra Rusia-Ucrania

on:
  schedule:
    # Se ejecuta automáticamente cada 4 horas
    - cron: '0 */4 * * *'
  workflow_dispatch: # Permite ejecutarlo manualmente con un clic en GitHub Actions

permissions:
  contents: write

jobs:
  update-monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: |
          pip install feedparser requests beautifulsoup4

      - name: Recopilar fuentes, traducir y compilar monitor
        run: |
          cd guerra-rusia-ucrania
          python build_monitor.py

      - name: Guardar y publicar cambios si hay nuevas noticias
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add guerra-rusia-ucrania/
          if ! git diff --staged --quiet; then
            git commit -m "Auto-actualización del Monitor Rusia-Ucrania [skip ci]"
            git push
          else
            echo "No hay noticias nuevas para publicar."
          fi
