  <script id="historic-data" type="application/json">[{"id": "62ba2973d264", "title_original": "В Волгограде выписали из больницы одного из пострадавших из-за атаки ВСУ", "text_original": "", "link": "https://ria.ru/20260916/vsu-2118113145.html", "source_id": "ria_novosti", "source_name": "RIA Novosti (РИА)", "perspective": "russia_official", "language": "ru", "bias_note": "Medio de comunicación estatal ruso subordinado a Rossiya Segodnya.", "published": "2026-09-16T15:57:52+00:00", "category": "frente", "relevance_score": 7, "date_added": "2026-09-16", "title_es": "En Volgogrado, una de las víctimas del ataque de las Fuerzas Armadas de Ucrania fue dada de alta del hospital", "text_es": ""}, {"id": "8f062b957994", "title_original": "ООН приняла меры, чтобы Трамп больше не застрял на эскалаторе", "text_original": "", "link": "https://ria.ru/20260916/oon-2118110106.html", "source_id": "ria_novosti", "source_name": "RIA Novosti (РИА)", "perspective": "russia_official", "language": "ru", "bias_note": "Medio de comunicación estatal ruso subordinado a Rossiya Segodnya.", "published": "2026-09-16T15:49:03+00:00", "category": "frente", "relevance_score": 5, "date_added": "2026-09-16", "title_es": "La ONU ha tomado medidas para garantizar que Trump ya no se quede atrapado en una escalera mecánica.", "text_es": ""}, {"id": "66a4580e0926", "title_original": "Замкомбата Кобра: пехота ВСУ не осведомлена об остановке в Алексеево-Дружковке", "text_original": "Заместитель командира второго мотострелкового батальона 1465-го полка Южной группировки войск отметил, что украинское командование сознательно заводит их в окружение, чтобы не допустить падения боевого духа", "link": "https://tass.ru/armiya-i-opk/28118297", "source_id": "tass_ru", "source_name": "TASS (ТАСС)", "perspective": "russia_official", "language": "ru", "bias_note": "Agencia de noticias estatal de la Federación Rusa (postura oficial del Kremlin).", "published": "2026-09-16T15:39:33+00:00", "category": "frente", "relevance_score": 7, "date_added": "2026-09-16", "title_es": "Subcomandante del batallón Kobra: La infantería de las Fuerzas Armadas de Ucrania no tiene conocimiento de la parada en Alekseevo-Druzhkovka", "text_es": "El subcomandante del segundo batallón de fusileros motorizados del 1465.º regimiento del Grupo de Fuerzas del Sur señaló que el mando ucraniano los rodea deliberadamente para evitar una caída de la moral."}, {"id": "2bfcf953d303", "title_original": "Путин: новые регионы впервые после воссоединения будут выбирать депутатов", "text_original": "", "link": "https://ria.ru/20260916/putin-2118107222.html", "source_id": "ria_novosti", "source_name": "RIA Novosti (РИА)", "perspective": "russia_official", "language": "ru", "bias_note": "Medio de comunicación estatal ruso subordinado a Rossiya Segodnya.", "published": "2026-09-16T15:26:24+00:00", "category": "frente", "relevance_score": 5, "date_added": "2026-09-16", "title_es": "Putin: las nuevas regiones elegirán diputados por primera vez después de la reunificación", "text_es": ""}, {"id": "06b0a43a156b", "title_original": "В погранслужбе Украины заявили, что Беларусь снова включила ретрансляторы, которые помогают наводиться российским дронам", "text_original": "Беларусь снова включила ретрансляторы у своей границы, которые помогают российским беспилотникам наводиться на цели, заявил представитель Государственной пограничной службы Украины Андрей Демченко. По состоянию на сегодняшний день Беларусь оказывает активную помощь России в обстрелах территории Украины. В том числе и ретрансляторами, которые включаются на территории Беларуси и подпитывают сигнал для российских «Шахедов» и «Гербер».\n\nЧто это за ретрансляторы? Комментарий отдела «Разбор»\n\nУкраина давно заявляет, что на территории Беларуси находятся антенны, входящие в комплексы двусторонней видеосвязи с российскими дальнобойными дронами типа «Герань» и «Гербера», атакующими Киев. ВС РФ, как и ВСУ, используют для видеосвязи с дронами mesh-сети: БПЛА с видеокамерами и со специальными модемами выступают в качестве воздушных ретрансляторов друг для друга, что позволяет поддерживать с ними связь на десятки и сотни километров. Но первичный сигнал они получают от ретрансляторов с земли. Украина считает, что российские ретрансляторы для mesh-сетей в районе Киева находятся в Беларуси.\n\nПо словам Демченко, беспилотники, прилетающие из России, держатся вблизи границы с Беларусью, чтобы получать сигнал и иметь возможность глубже заходить на территорию Украины — в частности в западные области страны.\n\nРабота ретрансляторов, как утверждает Демченко, также сделала возможной атаку на пункт пропуска «Ягодин» на границе с Польшей в ночь на 13 сентября. Тогда российские войска атаковали дронами АЗС недалеко от пункта пропуска и пассажирский поезд на железнодорожной линии Киев — Варшава.\n\nВ середине июня Зеленский потребовал, чтобы Александр Лукашенко убрал от границы с Украиной ретрансляторы для корректировки атак российских дронов, пригрозив, что «если он это не сделает, сделаем мы». Ме...", "link": "https://meduza.io/news/2026/09/16/v-pogransluzhbe-ukrainy-zayavili-chto-belarus-snova-vklyuchila-retranslyatory-kotorye-pomogayut-navoditsya-rossiyskim-dronam", "source_id": "meduza_ru", "source_name": "Meduza (RU)", "perspective": "russia_independent", "language": "ru", "bias_note": "Principal medio ruso de investigación en el exilio (prohibido por Moscú, sede en Letonia).", "published": "2026-09-16T14:44:59+00:00", "category": "frente", "relevance_score": 13, "date_added": "2026-09-16", "title_es": "El servicio fronterizo de Ucrania informó que Bielorrusia ha vuelto a activar repetidores que ayudan a guiar a los drones rusos.", "text_es": "Bielorrusia ha vuelto a recurrir a repetidores cerca de su frontera, que ayudan a los drones rusos a apuntar a sus objetivos, dijo Andrei Demchenko, portavoz del Servicio Estatal de Fronteras de Ucrania. A día de hoy, Bielorrusia ayuda activamente a Rusia a bombardear el territorio de Ucrania. Incluidos los repetidores que se activan en el territorio de Bielorrusia y transmiten la señal a los \"Shaheds\" y \"Gerbers\" rusos.\n\n¿Qué tipo de repetidores son estos? Comentario del departamento de “Análisis”\n\nUcrania ha afirmado durante mucho tiempo que en el territorio de Bielorrusia hay antenas que forman parte de sistemas de comunicación por vídeo bidireccionales con drones rusos de largo alcance como “Geranium” y “Gerbera” que atacan a Kiev. Las Fuerzas Armadas de Rusia, al igual que las Fuerzas Armadas de Ucrania, utilizan redes de malla para la comunicación por vídeo con drones: los vehículos aéreos no tripulados con cámaras de vídeo y módems especiales actúan como repetidores aéreos entre sí, lo que permite mantener la comunicación con ellos a lo largo de decenas y cientos de kilómetros. Pero reciben la señal principal de los repetidores en tierra. Ucrania cree que los repetidores rusos para redes en malla en la zona de Kiev están ubicados en Bielorrusia.\n\nSegún Demchenko, los drones que vuelan desde Rusia permanecen cerca de la frontera con Bielorrusia para recibir una señal y poder penetrar más profundamente en el territorio de Ucrania, en particular en las regiones occidentales del país.\n\nEl trabajo de los repetidores, según Demchenko, también permitió atacar el puesto de control de Yagodin en la frontera con Polonia la noche del 13 de septiembre. Luego, las tropas rusas atacaron con drones una gasolinera cerca del puesto de control y un tren de pasajeros en la línea ferroviaria Kiev-Varsovia."}, {"id": "ad417d9d7815", "title_original": "Drone Downed in Lithuania Was Russian and Likely Aimed at Ukraine, President Nausėda Says", "text_original": "A drone that was shot down by a NATO fighter jet in the skies above Lithuania for the first time was likely directed at Ukraine and veered off course, Lithuanian President Gitanas Nausėda said Wednesday.\n\n“Most likely, it was a Russian drone intended for Ukraine that was diverted from its course by Ukrainian electronic warfare measures and entered our territory, where it was shot down,” Nausėda told reporters after a state defense council meeting.\n\nNausėda identified the drone as a Gerbera, a low-cost plywood long-range aerial drone used by Russia. Gerberas are often employed as decoys to overwhelm air defenses, but they can also carry explosives.\n\nAn Italian fighter jet that is part of NATO’s Baltic air policing mission intercepted the unmanned aircraft over central Lithuania early Tuesday.\n\nRussia has not commented on the incident.", "link": "https://www.themoscowtimes.com/2026/09/16/drone-downed-in-lithuania-was-russian-and-likely-aimed-at-ukraine-president-nausda-says-a93725", "source_id": "the_moscow_times", "source_name": "The Moscow Times", "perspective": "russia_independent", "language": "en", "bias_note": "Diario ruso independiente en el exilio crítico con las políticas de Putin.", "published": "2026-09-16T14:31:29+00:00", "category": "drones", "relevance_score": 11, "date_added": "2026-09-16", "title_es": "El dron derribado en Lituania era ruso y probablemente apuntaba a Ucrania, dice el presidente Nausėda", "text_es": "Un dron que fue derribado por primera vez por un avión de combate de la OTAN en los cielos de Lituania probablemente estaba dirigido a Ucrania y se desvió de su rumbo, dijo el miércoles el presidente lituano, Gitanas Nausėda.\n\n\"Lo más probable es que se tratara de un dron ruso destinado a Ucrania que fue desviado de su rumbo por las medidas de guerra electrónica ucranianas y entró en nuestro territorio, donde fue derribado\", dijo Nausėda a los periodistas después de una reunión del consejo de defensa estatal.\n\nNausėda identificó el dron como un Gerbera, un dron aéreo de largo alcance de madera contrachapada de bajo costo utilizado por Rusia. Las gerberas se emplean a menudo como señuelos para abrumar las defensas aéreas, pero también pueden transportar explosivos.\n\nUn avión de combate italiano que forma parte de la misión de vigilancia aérea del Báltico de la OTAN interceptó el avión no tripulado sobre el centro de Lituania el martes por la mañana.\n\nRusia no ha comentado sobre el incidente."}, {"id": "2f65ea78a1ca", "title_original": "Russian forces strike Sumy with guided aerial bombs: six injured, including teenager", "text_original": "Russian forces have struck the Kovpakivskyi and Zarichnyi districts of Sumy with guided aerial bombs, injuring six people.\n\nSource: Oleh Hryhorov , Head of Sumy Oblast Military Administration; Artem Kobzar , acting mayor of Sumy\n\nDetails: \"Six people are currently known to have been injured in the guided aerial bomb strikes on Sumy,\" Hryhorov said.\n\nOne of those injured is a 14-year-old girl.\n\nThe Russians attacked residential areas and the city's industrial zone.\n\nThe strikes destroyed two houses and damaged another 10 homes and an educational institution.\n\nYour support on Patreon helps us keep the news free and accessible.", "link": "https://www.pravda.com.ua/eng/news/2026/09/16/8053735/", "source_id": "ukrainska_pravda_en", "source_name": "Ukrainska Pravda (EN)", "perspective": "ukraine", "language": "en", "bias_note": "Uno de los periódicos más leídos e históricos de Ucrania.", "published": "2026-09-16T13:01:00+00:00", "category": "frente", "relevance_score": 14, "date_added": "2026-09-16", "title_es": "Las fuerzas rusas atacan Sumy con bombas aéreas guiadas: seis heridos, entre ellos un adolescente", "text_es": "Las fuerzas rusas atacaron los distritos de Kovpakivskyi y Zarichnyi de Sumy con bombas aéreas guiadas, hiriendo a seis personas.\n\nFuente: Oleh Hryhorov, Jefe de la Administración Militar del Óblast de Sumy; Artem Kobzar, alcalde en funciones de Sumy\n\nDetalles: \"Actualmente se sabe que seis personas resultaron heridas en los bombardeos aéreos dirigidos sobre Sumy\", dijo Hryhorov.\n\nUno de los heridos es una niña de 14 años.\n\nLos rusos atacaron zonas residenciales y la zona industrial de la ciudad."}, {"id": "22b0c792d5fa", "title_original": "EU to propose new security meeting format for leaders including Ukraine", "text_original": "The European Union will propose creating a European Security Council involving the UK, Canada, Norway, Ukraine and possibly other countries.\n\nSource: European Commission President Ursula von der Leyen in her annual State of the Union address to the European Parliament on 16 September, as reported by European Pravda\n\nQuote: \" For a long time, we have discussed a leaders' format focused on the security of our continent. With partners like Canada, Norway, Ukraine, the United Kingdom and others involved .\"\n\nDetails: Von der Leyen stressed that the issue \" is even more urgent now, given the nature and scale of the risks at play \".\n\n\" This is why we will set out our ideas to make a European Security Council a reality ,\" the European Commission president said.\n\nVon der Leyen also said that together with EU foreign policy chief Kaja Kallas, she will present a new EU security strategy designed to complement Article 4 of the NATO Treaty.\n\nFor Ukraine, the European Commission president promised the procurement of US Patriot interceptor missiles and the creation of a joint EU-Ukraine missile defence system based on the Freyja project.\n\nIn her State of the Union address, von der Leyen also proposed making Canada an associated member of the EU.\n\nSubscribe on Patreon to back our journalism long-term.", "link": "https://www.pravda.com.ua/eng/news/2026/09/16/8053721/", "source_id": "ukrainska_pravda_en", "source_name": "Ukrainska Pravda (EN)", "perspective": "ukraine", "language": "en", "bias_note": "Uno de los periódicos más leídos e históricos de Ucrania.", "published": "2026-09-16T12:26:00+00:00", "category": "drones", "relevance_score": 11, "date_added": "2026-09-16", "title_es": "La UE propondrá un nuevo formato de reunión de seguridad para líderes como Ucrania", "text_es": "La Unión Europea propondrá la creación de un Consejo de Seguridad Europeo en el que participarán el Reino Unido, Canadá, Noruega, Ucrania y posiblemente otros países.\n\nFuente: La presidenta de la Comisión Europea, Ursula von der Leyen, en su discurso anual sobre el estado de la Unión ante el Parlamento Europeo el 16 de septiembre, según informó European Pravda.\n\nCita: \"Durante mucho tiempo hemos discutido un formato de líderes centrado en la seguridad de nuestro continente. Con socios como Canadá, Noruega, Ucrania, el Reino Unido y otros involucrados\".\n\nDetalles: Von der Leyen enfatizó que la cuestión \" es aún más urgente ahora, dada la naturaleza y escala de los riesgos en juego \".\n\n\" Por eso expondremos nuestras ideas para hacer realidad un Consejo de Seguridad Europeo \", afirmó el presidente de la Comisión Europea."}, {"id": "526b79f0acfb", "title_original": "Ukrainian foreign minister: Putin seeks to trigger migration to Europe by causing food crisis", "text_original": "Ukrainian Foreign Minister Andrii Sybiha has said Kremlin ruler Vladimir Putin's plan is to provoke a new wave of migration to Europe through a food crisis caused by the blockade of Ukrainian exports via the Black Sea.\n\nSource: Sybiha on X (Twitter) , as reported by European Pravda\n\nDetails: Sybiha said Russian terrorism also threatens countries in Africa, the Middle East and Asia.\n\nHe added that Moscow plans to destabilise Europe through similar actions.\n\nQuote: \" Putin is betting that hunger and food shortages can cause an influx of migrants. That is precisely what he aims for, particularly ahead of elections in EU member states next year. Putin knows that migration is one of the most sensitive and divisive issues in European election campaigns – especially after seeing how effectively Russian-linked networks exploited the recent Ceuta crisis. \"\n\nDetails: Sybiha believes that Putin will use all available methods to increase migration to Europe, with the blockade of the Black Sea being just one of them. Another is the Lukashenko regime in Belarus, he added.\n\nQuote: \" Moscow believes its strategy will create tension, sow division, strengthen radical anti-European movements, and ultimately weaken Europe's support for Ukraine. That is why supporting Ukraine's agricultural exports and unblocking freedom of navigation in the Black Sea are of strategic and existential value for the European Union, as well as the wider international community.\"\n\nDetails: In this context, the minister said urgent measures are needed to ensure uninterrupted commercial shipping from Ukrainian seaports, develop all possible alternative routes and mechanisms for transporting cargo through the EU, and provide maximum support to Ukrainian farmers.\n\n\" Another critical priority is to develop and jo...", "link": "https://www.pravda.com.ua/eng/news/2026/09/16/8053719/", "source_id": "ukrainska_pravda_en", "source_name": "Ukrainska Pravda (EN)", "perspective": "ukraine", "language": "en", "bias_note": "Uno de los periódicos más leídos e históricos de Ucrania.", "published": "2026-09-16T12:13:00+00:00", "category": "economia", "relevance_score": 13, "date_added": "2026-09-16", "title_es": "Ministro de Asuntos Exteriores de Ucrania: Putin busca desencadenar la migración a Europa provocando una crisis alimentaria", "text_es": "El Ministro de Asuntos Exteriores de Ucrania, Andrii Sybiha, ha dicho que el plan del gobernante del Kremlin, Vladimir Putin, es provocar una nueva ola de migración a Europa a través de una crisis alimentaria provocada por el bloqueo de las exportaciones ucranianas a través del Mar Negro.\n\nFuente: Sybiha en X (Twitter), según lo informado por la Pravda europea\n\nDetalles: Sybiha dijo que el terrorismo ruso también amenaza a países de África, Medio Oriente y Asia.\n\nAñadió que Moscú planea desestabilizar Europa mediante acciones similares.\n\nCita: \" Putin apuesta a que el hambre y la escasez de alimentos pueden provocar una afluencia de inmigrantes. Eso es precisamente lo que pretende, especialmente antes de las elecciones en los estados miembros de la UE el próximo año. Putin sabe que la migración es uno de los temas más delicados y divisivos en las campañas electorales europeas, especialmente después de ver con qué eficacia las redes vinculadas a Rusia explotaron la reciente crisis de Ceuta. \""}, {"id": "30b512c0a20a", "title_original": "Angelina Jolie visited Kharkiv during 3rd wartime trip to Ukraine in August - The Kyiv Independent", "text_original": "Angelina Jolie visited Kharkiv during 3rd wartime trip to Ukraine in August The Kyiv Independent", "link": "https://news.google.com/rss/articles/CBMiwwFBVV95cUxPNHlyUnVZYW9DWkQ1UDFwWXZldXhGeDNPS2JVT1VjcC1oMGRvZVAxOWFqQXExaGJmcmhlT2d2cHc0eDBvT01GLWF3VnItUWw0U3dOX01BTEc2NGpXQ21hSVpESVZyUWhuWEpqdFMzUzN1T2NlVzUwZzk0YzhKZnh4bVp1cWNKSklOb0tvYnBBOU1XbFJPakdRRC1qaUZtakFJSXhJZFVFSUgtRVhPd3JTb3hfTEl1LThMcExUclNzUXlOeFk?oc=5", "source_id": "kyiv_independent", "source_name": "The Kyiv Independent", "perspective": "ukraine", "language": "en", "bias_note": "Principal medio ucraniano independiente en inglés fundado por periodistas locales.", "published": "2026-09-16T11:10:00+00:00", "category": "frente", "relevance_score": 8, "date_added": "2026-09-16", "title_es": "Angelina Jolie visitó Kharkiv durante su tercer viaje a Ucrania en tiempos de guerra en agosto - The Kyiv Independent", "text_es": "Angelina Jolie visitó Kharkiv durante su tercer viaje a Ucrania en tiempos de guerra en agosto The Kyiv Independent"}, {"id": "9451b2b2e91c", "title_original": "Russian General Who Oversaw Capture of Ukraine’s Kostiantynivka Dies", "text_original": "A military commander who President Vladimir Putin recently awarded Russia’s highest state honor for the capture of the eastern Ukrainian city of Kostiantynivka has died, Russian and Ukrainian military officials said Wednesday.\n\nMajor General Apti Alaudinov, who serves as serves as deputy chief of the Defense Ministry’s ideological arm and commander of the Akhmat special forces, said Major General Anton Grunis “passed on to another world” in a short post on Telegram.\n\n“He left us as a hero who carried out his sacred duty,” Alaudinov said without specifying when Grunis died or the circumstances of his death.\n\nUkraine’s Unmanned Systems Forces commander, Robert “Madyar” Brovdi, later claimed that Grunis was “eliminated” in a nighttime raid in the eastern Donetsk region on Sept. 12.\n\nThe Moscow Times could not independently verify the claim.", "link": "https://www.themoscowtimes.com/2026/09/16/russian-general-who-oversaw-capture-of-ukraines-kostiantynivka-dies-a93722", "source_id": "the_moscow_times", "source_name": "The Moscow Times", "perspective": "russia_independent", "language": "en", "bias_note": "Diario ruso independiente en el exilio crítico con las políticas de Putin.", "published": "2026-09-16T10:36:00+00:00", "category": "frente", "relevance_score": 13, "date_added": "2026-09-16", "title_es": "Muere el general ruso que supervisó la captura de Kostiantynivka en Ucrania", "text_es": "Un comandante militar a quien el presidente Vladimir Putin recientemente otorgó el más alto honor estatal de Rusia por la captura de la ciudad de Kostiantynivka, en el este de Ucrania, murió, dijeron el miércoles funcionarios militares rusos y ucranianos.\n\nEl general de división Apti Alaudinov, que se desempeña como subjefe del brazo ideológico del Ministerio de Defensa y comandante de las fuerzas especiales de Akhmat, dijo que el general de división Anton Grunis “pasó a otro mundo” en una breve publicación en Telegram.\n\n\"Nos dejó como un héroe que cumplió con su deber sagrado\", dijo Alaudinov sin especificar cuándo murió Grunis ni las circunstancias de su muerte.\n\nEl comandante de las Fuerzas de Sistemas No Tripulados de Ucrania, Robert “Madyar” Brovdi, afirmó más tarde que Grunis fue “eliminado” en una incursión nocturna en la región oriental de Donetsk el 12 de septiembre.\n\nEl Moscow Times no pudo verificar de forma independiente la afirmación."}, {"id": "972d204e731c", "title_original": "Russians attack energy infrastructure in six regions", "text_original": "A large-scale Russian attack has caused new power outages in six Ukrainian regions.\n\nSource: Ukrenergo , Ukraine's state-owned electricity transmission operator\n\nDetails: The affected regions are Sumy, Cherkasy, Donetsk, Zaporizhzhia, Kherson and Kharkiv oblasts.\n\n\"Emergency repair work is already underway wherever safety conditions currently allow. Power engineers are working to repair equipment damaged by Russian forces and resume its operation as soon as possible,\" Ukrenergo said.\n\nElectricity consumption has decreased. As of 09:30 on 10 September, it was 7% lower than on the previous day.\n\nPower engineers are asking consumers to shift their active use of electricity to 11:00-15:00.\n\nBackground: A power line has been damaged by debris from Russian aerial assets, leaving 18 settlements in Mykolaiv Oblast without electricity .\n\nYour support on Patreon helps us keep the news free and accessible.", "link": "https://www.pravda.com.ua/eng/news/2026/09/16/8053694/", "source_id": "ukrainska_pravda_en", "source_name": "Ukrainska Pravda (EN)", "perspective": "ukraine", "language": "en", "bias_note": "Uno de los periódicos más leídos e históricos de Ucrania.", "published": "2026-09-16T09:55:00+00:00", "category": "frente", "relevance_score": 8, "date_added": "2026-09-16", "title_es": "Los rusos atacan infraestructuras energéticas en seis regiones", "text_es": "Un ataque ruso a gran escala ha provocado nuevos cortes de energía en seis regiones de Ucrania.\n\nFuente: Ukrenergo, operador estatal de transmisión de electricidad de Ucrania.\n\nDetalles: Las regiones afectadas son las provincias de Sumy, Cherkasy, Donetsk, Zaporizhzhia, Kherson y Kharkiv.\n\n\"Los trabajos de reparación de emergencia ya están en marcha siempre que las condiciones de seguridad lo permitan. Los ingenieros energéticos están trabajando para reparar los equipos dañados por las fuerzas rusas y reanudar su funcionamiento lo antes posible\", dijo Ukrenergo.\n\nEl consumo de electricidad ha disminuido. A las 09:30 horas del 10 de septiembre, era un 7% más bajo que el día anterior."}, {"id": "1be8d3c550de", "title_original": "Ukrainian forces strike Russian bomber in Crimea and drone ground control stations in Donetsk Oblast", "text_original": "Ukraine's defence forces struck a Russian Su-24 tactical bomber in Saky in temporarily occupied Crimea and a number of other important Russian military assets on 15 September and on the night of 15-16 September.\n\nSource: Ukraine's General Staff\n\nDetails: The Ukrainian military reported that a Su-24 aircraft had been hit at the Saky airfield in temporarily occupied Crimea. The extent of the damage is still being assessed.\n\nA site used by Russian forces to store, prepare and launch attack UAVs was also struck near the city of Donetsk.\n\nRussian UAV ground control stations were hit in Staromlynivka and Pokrovsk in Donetsk Oblast and Pokrovske in Zaporizhzhia Oblast.\n\nIn addition, a Russian ammunition depot was struck in Dovzhansk, Luhansk Oblast. Fuel and lubricant storage facilities used by Russian forces were hit in Rovenky, Luhansk Oblast, and Berdiansk, Zaporizhzhia Oblast.\n\nUkrainian forces struck sites in Suvorove and Rysove in temporarily occupied Crimea equipped with Russian automated surveillance systems known as Grenader, used to monitor and detect movement.\n\nYour support on Patreon helps us keep the news free and accessible.", "link": "https://www.pravda.com.ua/eng/news/2026/09/16/8053690/", "source_id": "ukrainska_pravda_en", "source_name": "Ukrainska Pravda (EN)", "perspective": "ukraine", "language": "en", "bias_note": "Uno de los periódicos más leídos e históricos de Ucrania.", "published": "2026-09-16T09:40:00+00:00", "category": "frente", "relevance_score": 14, "date_added": "2026-09-16", "title_es": "Las fuerzas ucranianas atacan un bombardero ruso en Crimea y estaciones de control terrestre de drones en la región de Donetsk", "text_es": "Las fuerzas de defensa de Ucrania atacaron un bombardero táctico ruso Su-24 en Saky, en la Crimea ocupada temporalmente, y varios otros activos militares rusos importantes el 15 de septiembre y la noche del 15 al 16 de septiembre.\n\nFuente: Estado Mayor de Ucrania\n\nDetalles: El ejército ucraniano informó que un avión Su-24 había sido alcanzado en el aeródromo de Saky en la Crimea temporalmente ocupada. Aún se está evaluando el alcance de los daños.\n\nUn sitio utilizado por las fuerzas rusas para almacenar, preparar y lanzar vehículos aéreos no tripulados de ataque también fue atacado cerca de la ciudad de Donetsk.\n\nLas estaciones de control terrestre de vehículos aéreos no tripulados rusos fueron alcanzadas en Staromlynivka y Pokrovsk en el óblast de Donetsk y en Pokrovske en el óblast de Zaporizhzhia."}, {"id": "56036e5c3ec6", "title_original": "Zelenskyy explains steps Ukraine is prepared to take towards energy ceasefire", "text_original": "Ukraine's President Volodymyr Zelenskyy has said there is currently no formal agreement on an energy ceasefire with Russia, although Ukraine remains willing to agree to one provided Russia stops its attacks on Ukrainian energy infrastructure.\n\nSource: Zelenskyy in an interview with CBS, cited by his press service\n\nQuote: \" When Steve Witkoff and Jared Kushner were here, they proposed thinking about refineries and other energy. I told them we are ready for an energy ceasefire, but you need to know what that means for Ukraine. For Putin, energy is selling oil and gas. For us, energy is having electricity and gas supplies for our people. My message was: If the Russians are ready for an energy ceasefire, it means no strikes of any kind with any type of weapon...\n\nIf they say, 'We don't attack these facilities,' they have to put a list of their facilities on the table – the ones they don't want us to attack. Even during the war, you can find some moments to de-escalate. If you negotiate, that means you are showing your goodwill, or political will, to end the war.\"\n\nOn 14 September, US President Donald Trump claimed that Ukraine has agreed not to strike Russian energy facilities.\n\nIn his evening address on 14 September, Zelenskyy commented on a US proposal regarding a mutual halt to strikes on critical infrastructure. \" If this can become the first de-escalatory step – a step towards ending Russian strikes on our critical infrastructure and our strikes in response – then Ukraine is ready to support de-escalation ,\" he noted.\n\nThe Financial Times, citing sources familiar with the matter, reported that negotiations on a halt to attacks on energy facilities have been underway for some time, but Kremlin leader Vladimir Putin does not want to reach an agreement before winter.\n\n...", "link": "https://www.pravda.com.ua/eng/news/2026/09/16/8053686/", "source_id": "ukrainska_pravda_en", "source_name": "Ukrainska Pravda (EN)", "perspective": "ukraine", "language": "en", "bias_note": "Uno de los periódicos más leídos e históricos de Ucrania.", "published": "2026-09-16T09:33:00+00:00", "category": "armamento", "relevance_score": 11, "date_added": "2026-09-16", "title_es": "Zelenskyy explica los pasos que Ucrania está dispuesta a dar para lograr un alto el fuego energético", "text_es": "El presidente de Ucrania, Volodymyr Zelenskyy, ha dicho que actualmente no existe ningún acuerdo formal sobre un alto el fuego energético con Rusia, aunque Ucrania sigue dispuesta a aceptarlo siempre que Rusia detenga sus ataques a la infraestructura energética ucraniana.\n\nFuente: Zelenskyy en una entrevista con CBS, citado por su servicio de prensa.\n\nCita: \" Cuando Steve Witkoff y Jared Kushner estuvieron aquí, propusieron pensar en refinerías y otras energías. Les dije que estamos listos para un alto el fuego energético, pero necesitan saber lo que eso significa para Ucrania. Para Putin, la energía es vender petróleo y gas. Para nosotros, la energía es tener suministro de electricidad y gas para nuestro pueblo. Mi mensaje fue: Si los rusos están listos para un alto el fuego energético, significa que no habrá ataques de ningún tipo con ningún tipo de arma...\n\nSi dicen: 'No atacamos estas instalaciones', tienen que poner sobre la mesa una lista de sus instalaciones: aquellas que no quieren que ataquemos. Incluso durante la guerra, puedes encontrar algunos momentos para reducir la tensión. Si negocias, eso significa que estás mostrando tu buena voluntad o voluntad política para poner fin a la guerra\".\n\nEl 14 de septiembre, el presidente estadounidense, Donald Trump, afirmó que Ucrania había acordado no atacar las instalaciones energéticas rusas."}, {"id": "f27d1cb48ec1", "title_original": "EU proposes new security strategy to complement NATO's Article 4 amid Russian attacks", "text_original": "In response to Russia's intensifying hybrid attacks on Europe, European Commission President Ursula von der Leyen has announced plans for a new security strategy for European countries to complement NATO's Article 4.\n\nSource: von der Leyen during her annual address to the European Parliament on 16 September, as reported by European Pravda\n\nQuote: \" As the threat level climbs, so must Europe's preparedness. This is why I will propose, together with the HRVP [Kaja Kallas – ed.] , a new European security strategy.\n\nI believe it is time for Europe's own Article 4 – or an Emergency Security Protocol. When triggered by one member state, all member states would convene. To coordinate a European response. To deter further escalation. And to mitigate the impact.\"\n\nDetails: Von der Leyen noted that cyberattacks, sabotage, arson and drone incursions into the EU are intensifying every day.\n\nShe stressed that Europe needs its own response plan for hybrid threats.\n\n\"We urgently need a consensus on how to respond to certain incidents. Those which fall below armed aggression but clearly threaten our national security. In other words, a mechanism to flank NATO's Article 4 ,\" the Commission president said.\n\nFor reference: NATO's Article 4 enables any member state to request consultations with its allies if it considers that its territorial integrity is under threat. It is considered a preliminary step towards invoking NATO's Article 5.\n\nIn August, members of German Chancellor Friedrich Merz's party called for NATO Treaty Article 4 consultations after a drone was spotted near a Ukrainian aircraft in Leipzig.\n\nIn May, Romanian Foreign Minister Oana Țoiu also said that a Russian drone crashing into a residential building in Galați could justify invoking Article 4 for consultations with N...", "link": "https://www.pravda.com.ua/eng/news/2026/09/16/8053678/", "source_id": "ukrainska_pravda_en", "source_name": "Ukrainska Pravda (EN)", "perspective": "ukraine", "language": "en", "bias_note": "Uno de los periódicos más leídos e históricos de Ucrania.", "published": "2026-09-16T09:24:00+00:00", "category": "drones", "relevance_score": 11, "date_added": "2026-09-16", "title_es": "La UE propone una nueva estrategia de seguridad para complementar el Artículo 4 de la OTAN en medio de los ataques rusos", "text_es": "En respuesta a la intensificación de los ataques híbridos de Rusia contra Europa, la presidenta de la Comisión Europea, Ursula von der Leyen, ha anunciado planes para una nueva estrategia de seguridad para los países europeos que complemente el Artículo 4 de la OTAN.\n\nFuente: von der Leyen durante su discurso anual ante el Parlamento Europeo el 16 de septiembre, según informó European Pravda\n\nCita: \"A medida que aumenta el nivel de amenaza, también debe hacerlo la preparación de Europa. Por eso propondré, junto con la Alta Representante [Kaja Kallas – ed.], una nueva estrategia de seguridad europea.\n\nCreo que es hora de adoptar el propio Artículo 4 de Europa, o un Protocolo de Seguridad de Emergencia. Cuando lo activara un estado miembro, todos los estados miembros se reunirían. Coordinar una respuesta europea. Para disuadir una mayor escalada. Y para mitigar el impacto.\"\n\nDetalles: Von der Leyen señaló que los ciberataques, los sabotajes, los incendios provocados y las incursiones con drones en la UE se intensifican cada día."}, {"id": "d6e5c9c5ba57", "title_original": "На войне погиб генерал-майор Антон Грунис, который докладывал Путину о захвате Константиновки. Две недели назад ему вручили Звезду Героя России", "text_original": "Погиб российский генерал-майор Антон Грунис, командир 4-й мотострелковой бригады Южной группировки войск. Смерть Груниса, о которой ранее сообщали украинские и российские источники, подтвердил замначальника Главного военно-политического управления ВС РФ, командир «Ахмата» генерал-лейтенант Апты Алаудинов.\n\nПодробности Алаудинов сообщать не стал. В посте в мессенджере «Макс», который цитирует ТАСС, он лишь заявил, что Грунис «погиб героем, до конца выполнив свой священный долг».\n\nКомандующий Силами беспилотных систем ВСУ Роберт Бровди (позывной «Мадяр»), в свою очередь, объявил, что Грунис был убит 12 сентября 2026 года в Донецкой области в результате удара украинского беспилотника.\n\nБровди напомнил, что именно Грунис в июле докладывал президенту РФ о взятии Константиновки . Этот город российские войска до сих пор не контролируют полностью. Путин тогда заявил, что Грунис — «человек с литовской фамилией, родился в Казани, воюет блестяще».\n\nПо словам Бровди, Грунис — седьмой высокопоставленный российский военный, убитый в результате ударов Сил беспилотных систем ВСУ.\n\nВ конце августа Минобороны РФ сообщало, что глава ведомства Андрей Белоусов вручил Грунису Звезду Героя России «за мужество и героизм, проявленные при исполнении воинского долга».\n\nПутин объявил о захвате Константиновки. Украинское командование настаивает на том, что город контролируют ВСУ. А как на самом деле? Карта боев на 8 июля", "link": "https://meduza.io/news/2026/09/16/na-voyne-pogib-general-mayor-anton-grunis-kotoryy-dokladyval-putinu-o-zahvate-konstantinovki-dve-nedeli-nazad-emu-vruchili-zvezdu-geroya-rossii", "source_id": "meduza_ru", "source_name": "Meduza (RU)", "perspective": "russia_independent", "language": "ru", "bias_note": "Principal medio ruso de investigación en el exilio (prohibido por Moscú, sede en Letonia).", "published": "2026-09-16T09:14:20+00:00", "category": "frente", "relevance_score": 12, "date_added": "2026-09-16", "title_es": "El general de división Anton Grunis, que informó a Putin sobre la captura de Konstantinovka, murió durante la guerra. Hace dos semanas le concedieron la Estrella del Héroe de Rusia", "text_es": "Murió el mayor general ruso Anton Grunis, comandante de la 4.ª brigada de fusileros motorizados del Grupo de Fuerzas del Sur. La muerte de Grunis, informada anteriormente por fuentes ucranianas y rusas, fue confirmada por el subjefe de la Dirección Político-Militar Principal de las Fuerzas Armadas de Rusia, comandante de Akhmat, el teniente general Apty Alaudinov.\n\nAlaudinov no proporcionó detalles. En una publicación en el mensajero Max, citada por TASS, se limitó a afirmar que Grunis “murió como un héroe, cumpliendo con su deber sagrado hasta el final”.\n\nEl comandante de las Fuerzas Armadas de los Sistemas No Tripulados de las Fuerzas Armadas, Robert Brovdi (distintivo de llamada \"Madyar\"), a su vez, anunció que Grunis fue asesinado el 12 de septiembre de 2026 en la región de Donetsk como resultado de un ataque con drones ucranianos.\n\nBrovdi recordó que fue Grunis quien informó al presidente de la Federación Rusa sobre la captura de Konstantinovka en julio. Las tropas rusas aún no controlan completamente esta ciudad. Putin luego dijo que Grunis es “un hombre de apellido lituano, nacido en Kazán, que lucha de manera brillante”.\n\nSegún Brovdi, Grunis es el séptimo oficial militar ruso de alto rango muerto como resultado de ataques de las Fuerzas de Sistemas No Tripulados de las Fuerzas Armadas de Ucrania."}, {"id": "5eeb44f3b3d3", "title_original": "Ukrainian drones behind killing of Russian general who \"captured\" Kostiantynivka", "text_original": "Robert \"Magyar\" Brovdi, Commander of Ukraine's Unmanned Systems Forces (USF), has reported that USF drones killed Major General Anton Grunis, Commander of Russia's 4th Separate Motor Rifle Brigade, in temporarily occupied Donetsk Oblast on 12 September.\n\nSource: Robert \"Magyar\" Brovdi on social media\n\nQuote: \"As a man with a Hungarian surname, born in Ukraine and using the birds [drones – ed.] to fight for the motherland, I report loud and clear: General Grunis was eliminated by the USF birds' champion department of retribution on 12 September 2026 in his night-time lair in the temporarily occupied territory of Donetsk Oblast.\"\n\nDetails: Brovdi said the Russian general was killed by drones operated by the Rarog unit – Ukraine's 427th Separate Unmanned Systems Brigade.\n\nHe also noted that Grunis is the seventh Russian military commander at brigade, division or army level confirmed to have been killed by USF drones.\n\nBackground: Reports previously emerged in Russia that Grunis had been killed in the war against Ukraine shortly after reporting to Russian leader Vladimir Putin on the purported \"capture\" of Kostiantynivka.\n\nSupport Ukrainska Pravda on Patreon to help us keep reporting!", "link": "https://www.pravda.com.ua/eng/news/2026/09/16/8053677/", "source_id": "ukrainska_pravda_en", "source_name": "Ukrainska Pravda (EN)", "perspective": "ukraine", "language": "en", "bias_note": "Uno de los periódicos más leídos e históricos de Ucrania.", "published": "2026-09-16T08:46:00+00:00", "category": "frente", "relevance_score": 13, "date_added": "2026-09-16", "title_es": "Drones ucranianos detrás del asesinato del general ruso que \"capturó\" Kostiantynivka", "text_es": "Robert \"Magyar\" Brovdi, comandante de las Fuerzas de Sistemas No Tripulados (USF) de Ucrania, informó que drones de las USF mataron al mayor general Anton Grunis, comandante de la 4.ª Brigada Separada de Fusileros Motorizados de Rusia, en el Óblast de Donetsk temporalmente ocupado el 12 de septiembre.\n\nFuente: Robert \"Hungría\" Brovdi en las redes sociales\n\nCita: \"Como hombre de apellido húngaro, nacido en Ucrania y que utiliza pájaros [drones - ed.] para luchar por la patria, informo alto y claro: el general Grunis fue eliminado por el departamento de represalia campeón de aves de las USF el 12 de septiembre de 2026 en su guarida nocturna en el territorio temporalmente ocupado de la provincia de Donetsk\".\n\nDetalles: Brovdi dijo que el general ruso fue asesinado por drones operados por la unidad Rarog, la 427.ª Brigada Separada de Sistemas No Tripulados de Ucrania.\n\nTambién señaló que Grunis es el séptimo comandante militar ruso a nivel de brigada, división o ejército que se ha confirmado que ha sido asesinado por drones de las USF."}, {"id": "255d59e5741b", "title_original": "Российские войска нанесли удар по Киеву. В одном из районов загорелся склад, один человек пострадал", "text_original": "Войска РФ в ночь на 16 сентября атаковали Киев реактивными беспилотниками, пишет «Украинская правда». В Святошинском районе в результате падения «обломков дронов» загорелся склад, один человек пострадал, сообщили местные власти .\n\nКому принадлежит загоревшийся склад, не уточняется.\n\nТакже под удар попал пассажирский поезд «Киев—Николаев», сообщила «Укрзализныця» («Украинские железные дороги»). Бригада поезда и пассажиры заранее были эвакуированы, никто не пострадал.\n\nКакими дронами Россия бьет по Украине\n\nВойна 1664-й день. Россия совершила прорыв в модификации дронов «Герань» — теперь они лучше обходят ПВО. Но серийное производство зависит от китайских комплектующих", "link": "https://meduza.io/news/2026/09/16/rossiyskie-voyska-nanesli-udar-po-kievu-v-odnom-iz-rayonov-zagorelsya-sklad-odin-chelovek-postradal", "source_id": "meduza_ru", "source_name": "Meduza (RU)", "perspective": "russia_independent", "language": "ru", "bias_note": "Principal medio ruso de investigación en el exilio (prohibido por Moscú, sede en Letonia).", "published": "2026-09-16T06:16:16+00:00", "category": "frente", "relevance_score": 13, "date_added": "2026-09-16", "title_es": "Las tropas rusas atacaron Kyiv. Un almacén se incendió en uno de los distritos y una persona resultó herida", "text_es": "La noche del 16 de septiembre, las tropas rusas atacaron Kiev con aviones no tripulados, escribe Ukrayinska Pravda. En el distrito de Svyatoshinsky, un almacén se incendió como resultado de la caída de \"restos de drones\" y una persona resultó herida, informaron las autoridades locales.\n\nNo está claro quién es el propietario del almacén que se incendió.\n\nEl tren de pasajeros Kyiv-Nikolaev también fue alcanzado, informó Ukrzaliznytsia (Ferrocarriles de Ucrania). La tripulación del tren y los pasajeros fueron evacuados con antelación y nadie resultó herido.\n\n¿Qué tipo de drones utiliza Rusia para atacar a Ucrania?\n\nGuerra 1664 día. Rusia ha logrado un gran avance en la modificación de los drones Geranium: ahora pueden evitar mejor la defensa aérea. Pero la producción en masa depende de componentes chinos."}, {"id": "a108f2790cf9", "title_original": "Russian Offensive Campaign Assessment, September 15, 2026 - Institute for the Study of War", "text_original": "Russian Offensive Campaign Assessment, September 15, 2026 Institute for the Study of War", "link": "https://news.google.com/rss/articles/CBMirgFBVV95cUxORktkay1Tb3p5NUdPZ2ViaXVrS1VTbWpybnEyaUpUTGM3SnNucXQwOV9MYWlua1E0WUlrUjRKcnVTNmNDU3FVaWxOQXMyTnZ4NjYySTF0VVREX1NaMEU4czM3MHVTMWRtYnQ4aGZyazRvRksxV3UtMkxWMGFKXzRNcWpCbG1ydDhOSlBEY0VQMjEyMUVPNUp4WGhQRTV1cjFnNkdhaVZMY1NFbEtmblE?oc=5", "source_id": "isw_assessments", "source_name": "Institute for the Study of War (ISW)", "perspective": "international", "language": "en", "bias_note": "Centro de estudios estratégicos estadounidense líder mundial en mapas y análisis del frente.", "published": "2026-09-16T02:58:58+00:00", "category": "frente", "relevance_score": 7, "date_added": "2026-09-16", "title_es": "Evaluación de la campaña ofensiva rusa, 15 de septiembre de 2026 - Instituto para el Estudio de la Guerra", "text_es": "Evaluación de la campaña ofensiva rusa, 15 de septiembre de 2026 Instituto para el Estudio de la Guerra"}, {"id": "87922c0eb642", "title_original": "Denmark says Russian warship fired flares at military helicopter", "text_original": "Denmark has accused a Russian warship of firing two emergency flares at one of its helicopters while it was tracking the vessel in the Baltic Sea.\n\nThe Danish government has summoned the Russian ambassador over the incident, which it said happened during a \"routine\" monitoring operation on Monday.\n\nPrime Minister Mette Frederiksen branded the Russian action \"reckless\" and said it was designed to \"intimidate and divide\".\n\nRussia said it would \"thoroughly investigate\" the incident but accused Danish helicopters of making \"dangerous manoeuvres\" near Russian warships.\n\nIt came on the same day that Nato forces shot down a drone over Lithuania in the latest security scare on the alliance's eastern flank, where tensions remain high amid Russia's full-scale invasion of Ukraine.", "link": "https://www.bbc.co.uk/news/articles/cwn8mjl31p5yo?at_medium=RSS&at_campaign=rss", "source_id": "bbc_europe", "source_name": "BBC News (Europa)", "perspective": "international", "language": "en", "bias_note": "Servicio público británico con amplia red de corresponsales internacionales.", "published": "2026-09-15T11:40:00+00:00", "category": "drones", "relevance_score": 11, "date_added": "2026-09-16", "title_es": "Dinamarca dice que un buque de guerra ruso disparó bengalas contra un helicóptero militar", "text_es": "Dinamarca acusó a un buque de guerra ruso de disparar dos bengalas de emergencia a uno de sus helicópteros mientras rastreaba al buque en el Mar Báltico.\n\nEl gobierno danés convocó al embajador ruso por el incidente, que según dijo ocurrió durante una operación de monitoreo \"rutinaria\" el lunes.\n\nLa primera ministra Mette Frederiksen calificó la acción rusa de \"imprudente\" y dijo que estaba diseñada para \"intimidar y dividir\".\n\nRusia dijo que \"investigaría a fondo\" el incidente, pero acusó a los helicópteros daneses de realizar \"maniobras peligrosas\" cerca de los buques de guerra rusos.\n\nSe produjo el mismo día en que las fuerzas de la OTAN derribaron un dron sobre Lituania en el último susto de seguridad en el flanco oriental de la alianza, donde las tensiones siguen siendo altas en medio de la invasión a gran escala de Ucrania por parte de Rusia."}, {"id": "2c2921d292bc", "title_original": "Ukrainian Attack Kills One in Belgorod, Hits Commercial and Industrial Sites Across Russia", "text_original": "Overnight Ukrainian drone and missile strikes across southern Russia killed one person and struck commercial and industrial sites, regional officials said Tuesday.\n\nActing Belgorod region Governor Alexander Shuvayev confirmed one death in an attack near the border with Ukraine. He also said that a woman who was hospitalized for her injuries following strikes earlier this month had died.\n\nIn the nearby Rostov region, Governor Yury Slyusar said an Ozon warehouse was among several sites damaged during a missile attack on the port city of Taganrog.\n\nOzon confirmed that it suspended operations at the facility, where it said a fire broke out. No one was hurt, the company said.\n\nFederal investigators launched a criminal probe into terrorism over the attacks on Taganrog, citing damage to Ozon and other residential and agricultural buildings.", "link": "https://www.themoscowtimes.com/2026/09/15/ukrainian-attack-kills-one-in-belgorod-hits-commercial-and-industrial-sites-across-russia-a93708", "source_id": "the_moscow_times", "source_name": "The Moscow Times", "perspective": "russia_independent", "language": "en", "bias_note": "Diario ruso independiente en el exilio crítico con las políticas de Putin.", "published": "2026-09-15T08:22:00+00:00", "category": "drones", "relevance_score": 14, "date_added": "2026-09-16", "title_es": "Ataque ucraniano mata a una persona en Belgorod y alcanza sitios comerciales e industriales en toda Rusia", "text_es": "Los ataques nocturnos con drones y misiles ucranianos en el sur de Rusia mataron a una persona y afectaron sitios comerciales e industriales, dijeron el martes funcionarios regionales.\n\nEl gobernador en funciones de la región de Belgorod, Alexander Shuvayev, confirmó una muerte en un ataque cerca de la frontera con Ucrania. También dijo que una mujer que fue hospitalizada por sus heridas tras los ataques de principios de este mes había muerto.\n\nEn la cercana región de Rostov, el gobernador Yury Slyusar dijo que un almacén de Ozon se encontraba entre varios sitios dañados durante un ataque con misiles contra la ciudad portuaria de Taganrog.\n\nOzon confirmó que suspendió las operaciones en la instalación, donde dijo que se produjo un incendio. Nadie resultó herido, dijo la empresa.\n\nLos investigadores federales iniciaron una investigación penal sobre terrorismo por los ataques a Taganrog, citando daños a Ozon y otros edificios residenciales y agrícolas."}, {"id": "77726de857b6", "title_original": "Russian Offensive Campaign Assessment, September 14, 2026 - Institute for the Study of War", "text_original": "Russian Offensive Campaign Assessment, September 14, 2026 Institute for the Study of War", "link": "https://news.google.com/rss/articles/CBMirgFBVV95cUxQZzNxZkhBV1RsOV9yZVBYNnRzYnpRZkd2S2xYRS1HU0tUbGV4YXRJaXp5X010bVI1eW1jbVA1X1dEWDVlMGRjWGdfemYxd0dHR1B2c25mbzRHaEg0dGxKbXpMclZINFl6Q1hlSG9CMXBsS2xFd1dXS0dWRDFPZ2ZoMHhPZ2o4UXhwUG5QOXh2MHVNQUduTzNSeG5VX3NySEI2Y1dQd1VITUJpVWZTblE?oc=5", "source_id": "isw_assessments", "source_name": "Institute for the Study of War (ISW)", "perspective": "international", "language": "en", "bias_note": "Centro de estudios estratégicos estadounidense líder mundial en mapas y análisis del frente.", "published": "2026-09-14T23:06:08+00:00", "category": "frente", "relevance_score": 7, "date_added": "2026-09-16", "title_es": "Evaluación de la campaña ofensiva rusa, 14 de septiembre de 2026 - Instituto para el Estudio de la Guerra", "text_es": "Evaluación de la campaña ofensiva rusa, 14 de septiembre de 2026 Instituto para el Estudio de la Guerra"}, {"id": "f3a1597bb1e2", "title_original": "Ukrainian Drone Strike in Sochi Wounds 5", "text_original": "Five people including a child were wounded in an overnight Ukrainian drone attack on the Black Sea resort city of Sochi, local officials said Monday.\n\nEmergency authorities said only one of the victims was hospitalized for their injuries. Three homes were also damaged as a result of the air assault, they added.\n\nSochi Mayor Andrei Proshunin said firefighters extinguished fires that had broken out from the attack. He warned people not to approach any drone debris.\n\nProshunin later announced the closure of Sochis beache’s due to the ongoing risk of drone strikes.\n\nIn the neighboring Rostov region, Governor Yury Slyusar said air defense systems intercepted 50 drones over the region. He reported damage to civilian infrastructure but said that no one was hurt.", "link": "https://www.themoscowtimes.com/2026/09/14/ukrainian-drone-strike-in-sochi-wounds-5-a93699", "source_id": "the_moscow_times", "source_name": "The Moscow Times", "perspective": "russia_independent", "language": "en", "bias_note": "Diario ruso independiente en el exilio crítico con las políticas de Putin.", "published": "2026-09-14T09:25:00+00:00", "category": "drones", "relevance_score": 21, "date_added": "2026-09-16", "title_es": "Ataque ucraniano con drones en Sochi deja cinco heridos", "text_es": "Cinco personas, incluido un niño, resultaron heridas en un ataque nocturno con aviones no tripulados ucranianos en la ciudad turística de Sochi, en el Mar Negro, dijeron funcionarios locales el lunes.\n\nLas autoridades de emergencia dijeron que solo una de las víctimas fue hospitalizada por sus heridas. Tres viviendas también resultaron dañadas como consecuencia del ataque aéreo, añadieron.\n\nEl alcalde de Sochi, Andrei Proshunin, dijo que los bomberos extinguieron los incendios que se habían desatado tras el ataque. Advirtió a la gente que no se acercara a los restos de ningún dron.\n\nProshunin anunció más tarde el cierre de las playas de Sochis debido al riesgo constante de ataques con aviones no tripulados.\n\nEn la vecina región de Rostov, el gobernador Yury Slyusar dijo que los sistemas de defensa aérea interceptaron 50 drones sobre la región. Informó de daños a la infraestructura civil, pero dijo que nadie resultó herido."}, {"id": "c0320b32cc27", "title_original": "Малую Токмачку так и не взяли. Чей Купянск? А Святогорск? Вместе с экспертами подводим итоги весенне-летнего наступления России и контратак ВСУ - Новая газета Европа", "text_original": "Малую Токмачку так и не взяли. Чей Купянск? А Святогорск? Вместе с экспертами подводим итоги весенне-летнего наступления России и контратак ВСУ Новая газета Европа", "link": "https://news.google.com/rss/articles/CBMiggFBVV95cUxOd0tuN0cxbmNfYnR2dWtOdUlobGFBMHdCSVp4OHRBZ0lEWkFHcDItYzYwV0g0SnBja0h1YVRNanZxZnlYcmwwODB4S2xfdXJGSlZVNXhDRkRIZTRRbFBNbFNINVVCOWNkZmdCal81Y2hNeXVuMlZlWU1meGtkdnRtb1FR0gGHAUFVX3lxTE83cTU5Vlp4ZDd6cVZPMmlPVGEyZDhhenNsYUVDTHNfdzk2azl4RTJWUlpCX1J5RkgyRWZCSERfR2pyZm1hcXBOMV9jdER2VTNHeDd1eFk0cmhDLUhIMVZJb1RneC0xUGxhNy14MFczU2dEQkxpTFFZTlg3Y280YlJaUEZXVTN2TQ?oc=5", "source_id": "novaya_gazeta", "source_name": "Novaya Gazeta Europe", "perspective": "russia_independent", "language": "ru", "bias_note": "Diario fundado por el Nobel de la Paz Dmitry Muratov, operando desde Europa.", "published": "2026-09-14T09:13:06+00:00", "category": "frente", "relevance_score": 15, "date_added": "2026-09-16", "title_es": "Malaya Tokmachka nunca fue secuestrada. ¿De quién es Kupyansk? ¿Y Sviatogorsk? Junto con los expertos, resumimos los resultados de la ofensiva rusa de primavera-verano y los contraataques de las Fuerzas Armadas de Ucrania - Novaya Gazeta Europa", "text_es": "Malaya Tokmachka nunca fue secuestrada. ¿De quién es Kupyansk? ¿Y Sviatogorsk? Junto con los expertos, resumimos los resultados de la ofensiva rusa de primavera-verano y los contraataques de las Fuerzas Armadas de Ucrania Novaya Gazeta Europa"}, {"id": "24e610c121ee", "title_original": "Russian attacks kill three civilians and injure 13 in Donetsk region over past 24 hours - ukrinform.net", "text_original": "Russian attacks kill three civilians and injure 13 in Donetsk region over past 24 hours ukrinform.net", "link": "https://news.google.com/rss/articles/CBMi0wFBVV95cUxNU3lIc3EwaUctSmo5WkFGTU1OUlV1TlVmdEhKVkFyNFptQUtkUzBocUZ5bTZZZHNETHgtMDd1TlJLVkdZd1JGaXp6UXY0X3JzTUNWNnA2dm1wWTNlYkowNE5SWmNYOUJlbFlTYUpTaGsydndweGxJaXFPREk2dENVQ3RscFVKOE43TWQtYzNwQmJwc0NjcnBrQ2xqTDhIX2JKUnR2bmVpVkk0ZkRCbTQ4SUkxczZ2ZXp4TWVIbkVjOFJ1VEplX3YxX0VYOVFQaHJ2eU9j0gHYAUFVX3lxTFBfdGJIMXpWWVJWN2ZTWlJPWGVZRGplRUtmN3hDb0U3T1pmdUhObHFzYkEwdy02dWRTTDBOLXZ0Z0t3VHB5VUVIRnRLclFVTjNkSTdvbE1pYWMtenZ3OWhNNUlJem0tVkU2QzMzaGgyRGhoRk9iNVdWYlVQX20zTjBYOXQ3eWxFYXFiT0pRTlE0OUlTN29SYUZFVlg0eG1aOEVzc3VOSElyN2FSMGRwMlJqYmF4cFJSdEZrbTdsNGJOTVBPUE1yUGFQSmx3eW9oZzZra1ZMRmVjcQ?oc=5", "source_id": "ukrinform", "source_name": "Ukrinform", "perspective": "ukraine", "language": "en", "bias_note": "Agencia nacional de noticias oficial del Estado ucraniano.", "published": "2026-09-14T07:58:00+00:00", "category": "frente", "relevance_score": 8, "date_added": "2026-09-16", "title_es": "Los ataques rusos matan a tres civiles y hirieron a 13 en la región de Donetsk en las últimas 24 horas - ukrinform.net", "text_es": "Los ataques rusos en las últimas 24 horas matan a tres civiles y hirieron a 13 en la región de Donetsk ukrinform.net"}, {"id": "4484da9560a5", "title_original": "Russian Offensive Campaign Assessment, September 13, 2026 - Institute for the Study of War", "text_original": "Russian Offensive Campaign Assessment, September 13, 2026 Institute for the Study of War", "link": "https://news.google.com/rss/articles/CBMirgFBVV95cUxPSXJmOXN4N2cxeDRkUzVNSE51MFdtSGlQQXpkaXN6TzNLSk1RakdaUF9BMFgwVG0tOXRtZHpjYnNnbWF2STlieFpyV2pPWDFWQ3Q1Zzk1cWpTdkdhRmhGb0l5M3RUUnkyY0dHek00SVRna2QzQVBKREZkZUYzdWxtbEI5NlpZTUdQZUVoS1JOVTBwUm9qSGhEa3dsc2xlMjRjQ3lwRzJpOVl2cTFFVVE?oc=5", "source_id": "isw_assessments", "source_name": "Institute for the Study of War (ISW)", "perspective": "international", "language": "en", "bias_note": "Centro de estudios estratégicos estadounidense líder mundial en mapas y análisis del frente.", "published": "2026-09-14T01:59:46+00:00", "category": "frente", "relevance_score": 7, "date_added": "2026-09-16", "title_es": "Evaluación de la campaña ofensiva rusa, 13 de septiembre de 2026 - Instituto para el Estudio de la Guerra", "text_es": "Evaluación de la campaña ofensiva rusa, 13 de septiembre de 2026 Instituto para el Estudio de la Guerra"}, {"id": "bb4c4b69c066", "title_original": "Watch: Why a Russian strike on train near Ukraine-Poland border could mark an escalation", "text_original": "A Russian drone struck a train near the Ukraine-Poland border shortly after the former UK Prime Minister Boris Johnson and top European security officials had passed through.\n\nNo casualties were reported after the strike at Yahodyn, which hit the train's engine. All the passengers had been evacuated, Ukrainian authorities said.\n\nJohnson and other European national security advisers, including the UK's Jonathan Powell, had passed along the same line on a different train on their way back from a conference in Kyiv.\n\nBBC's James Landale explains why the incident could signal an escalation in Russia's war against Ukraine.", "link": "https://www.bbc.co.uk/news/videos/cx2z5gjj838o?at_medium=RSS&at_campaign=rss", "source_id": "bbc_europe", "source_name": "BBC News (Europa)", "perspective": "international", "language": "en", "bias_note": "Servicio público británico con amplia red de corresponsales internacionales.", "published": "2026-09-14T01:12:20+00:00", "category": "drones", "relevance_score": 10, "date_added": "2026-09-16", "title_es": "Ver: Por qué un ataque ruso a un tren cerca de la frontera entre Ucrania y Polonia podría marcar una escalada", "text_es": "Un dron ruso chocó contra un tren cerca de la frontera entre Ucrania y Polonia poco después de que el ex primer ministro del Reino Unido, Boris Johnson, y altos funcionarios de seguridad europeos hubieran pasado por allí.\n\nNo se registraron víctimas tras el ataque en Yahodyn, que alcanzó el motor del tren. Todos los pasajeros fueron evacuados, dijeron las autoridades ucranianas.\n\nJohnson y otros asesores de seguridad nacional europeos, incluido el británico Jonathan Powell, habían pasado por la misma línea en un tren diferente cuando regresaban de una conferencia en Kiev.\n\nJames Landale de la BBC explica por qué el incidente podría indicar una escalada en la guerra de Rusia contra Ucrania."}, {"id": "2ce0b8c27a25", "title_original": "Trump Tells Ukraine's Zelensky to Stop Hitting Russian Diesel", "text_original": "U.S. President Donald Trump on Sunday called on Ukrainian President Volodymyr Zelensky to stop targeting Russian diesel infrastructure, saying the attacks were causing a shortage of the fuel that is “hurting the world.”\n\nA wave of long-distance Ukrainian drone attacks on Russian oil refineries in recent months has reduced that country's fuel production, triggering gasoline shortages across the country.\n\nUkraine, which faces regular Russian attacks on its own energy infrastructure, says refineries are legitimate military targets.\n\nThe U.S. national average price for diesel, which is used by trucks, trains, ships and farm equipment, rose over $6 a gallon for the first time on Thursday, according to price tracker GasBuddy.\n\n“Mr. Zelensky has to do one thing: He has to stop knocking out diesel fuel in Russia,” Trump told journalists during a visit to the Irish Open, which is being held in the west of Ireland on a golf course owned by his family.", "link": "https://www.themoscowtimes.com/2026/09/13/trump-tells-ukraines-zelensky-to-stop-hitting-russian-diesel-a93696", "source_id": "the_moscow_times", "source_name": "The Moscow Times", "perspective": "russia_independent", "language": "en", "bias_note": "Diario ruso independiente en el exilio crítico con las políticas de Putin.", "published": "2026-09-13T16:15:05+00:00", "category": "drones", "relevance_score": 11, "date_added": "2026-09-16", "title_es": "Trump le dice a Zelensky de Ucrania que deje de atacar el diésel ruso", "text_es": "El presidente de Estados Unidos, Donald Trump, pidió el domingo al presidente ucraniano, Volodymyr Zelensky, que deje de atacar la infraestructura diésel rusa, diciendo que los ataques estaban provocando una escasez del combustible que está “perjudicando al mundo”.\n\nUna ola de ataques con aviones no tripulados ucranianos de larga distancia contra refinerías de petróleo rusas en los últimos meses ha reducido la producción de combustible de ese país, provocando escasez de gasolina en todo el país.\n\nUcrania, que enfrenta ataques rusos regulares a su propia infraestructura energética, dice que las refinerías son objetivos militares legítimos.\n\nEl precio promedio nacional del diésel en Estados Unidos, que se utiliza en camiones, trenes, barcos y equipos agrícolas, aumentó más de 6 dólares el galón por primera vez el jueves, según el rastreador de precios GasBuddy.\n\n\"El señor Zelensky tiene que hacer una cosa: tiene que dejar de consumir combustible diésel en Rusia\", dijo Trump a los periodistas durante una visita al Abierto de Irlanda, que se celebra en el oeste de Irlanda en un campo de golf propiedad de su familia."}, {"id": "840e699bd42b", "title_original": "Rosatom’s Likhachev Says Ukraine Attacked Fuel Trucks, Endangered Zaporizhzhia Plant", "text_original": "The head of Russia's state nuclear energy corporation accused Ukraine on Sunday of attacking diesel fuel trucks, killing two Russian servicemen and deliberately jeopardizing safety at the Russian-held Zaporizhzhia nuclear power plant in Ukraine.\n\nAlexei Likhachev said the attack took place on Friday and also resulted in injuries to other Russian soldiers.\n\nThe Zaporizhzhia plant, Europe's largest with six reactors, was seized by Russian forces in the early weeks of the Ukraine war that broke out in February 2022. Each side has regularly accused the other of actions that endanger safety at the plant and increase the risk of a nuclear accident.\n\nLikhachev issued a statement saying Ukrainian forces had launched “a series of combined strikes” on Friday on fuel trucks which deliver diesel to the station.\n\n“The strikes hit very close to the perimeter of the station's site,” he said.", "link": "https://www.themoscowtimes.com/2026/09/13/rosatoms-likhachev-says-ukraine-attacked-fuel-trucks-endangered-zaporizhzhia-plant-a93695", "source_id": "the_moscow_times", "source_name": "The Moscow Times", "perspective": "russia_independent", "language": "en", "bias_note": "Diario ruso independiente en el exilio crítico con las políticas de Putin.", "published": "2026-09-13T10:17:00+00:00", "category": "frente", "relevance_score": 8, "date_added": "2026-09-16", "title_es": "Likhachev de Rosatom dice que Ucrania atacó camiones de combustible y puso en peligro la planta de Zaporizhzhia", "text_es": "El jefe de la corporación estatal de energía nuclear de Rusia acusó a Ucrania el domingo de atacar camiones de combustible diésel, matar a dos militares rusos y poner en peligro deliberadamente la seguridad en la central nuclear de Zaporizhzhia, en Ucrania, controlada por los rusos.\n\nAlexei Likhachev dijo que el ataque tuvo lugar el viernes y que también provocó heridas a otros soldados rusos.\n\nLa planta de Zaporizhzhia, la más grande de Europa con seis reactores, fue capturada por las fuerzas rusas en las primeras semanas de la guerra de Ucrania que estalló en febrero de 2022. Cada parte ha acusado regularmente a la otra de acciones que ponen en peligro la seguridad de la planta y aumentan el riesgo de un accidente nuclear.\n\nLikhachev emitió un comunicado diciendo que las fuerzas ucranianas habían lanzado \"una serie de ataques combinados\" el viernes contra los camiones de combustible que entregan diésel a la estación.\n\n\"Los ataques alcanzaron muy cerca del perímetro del emplazamiento de la estación\", dijo."}, {"id": "e84f123d9253", "title_original": "Russian Offensive Campaign Assessment, September 12, 2026 - Institute for the Study of War", "text_original": "Russian Offensive Campaign Assessment, September 12, 2026 Institute for the Study of War", "link": "https://news.google.com/rss/articles/CBMirgFBVV95cUxNeE9PN2U1WC01VjlGV2tEaG1EZVFNNGotbk5hV0NBVTJoV0MyVG5LbEh4dW4zLUt2MFM5MndSc1JJamttWHFlRW1wdm1RelROQkJyU2daV2xkZU9la3dYTDNfOGk0WlVYTDhJLWRXZTR4OFdJYkFTMlBxcHc2WnZLbTdranN2ZFp2bk5paDhNaC1USGI2QTV2cnVwWFBRcGF2ZmNTMVh6NXUxWEtiVVE?oc=5", "source_id": "isw_assessments", "source_name": "Institute for the Study of War (ISW)", "perspective": "international", "language": "en", "bias_note": "Centro de estudios estratégicos estadounidense líder mundial en mapas y análisis del frente.", "published": "2026-09-13T05:08:41+00:00", "category": "frente", "relevance_score": 7, "date_added": "2026-09-16", "title_es": "Evaluación de la campaña ofensiva rusa, 12 de septiembre de 2026 - Instituto para el Estudio de la Guerra", "text_es": "Evaluación de la campaña ofensiva rusa, 12 de septiembre de 2026 Instituto para el Estudio de la Guerra"}, {"id": "72cdd459e63e", "title_original": "Russians seek answers over hundreds missing after Ukraine's 2024 incursion", "text_original": "Russian families complain their government did little to help locate the missing\n\n\"I used to have complete faith in our country,\" says Lyubov. The last time she spoke to her mother was a day after Ukrainian forces broke into Russia's Kursk region more than two years ago.\n\nNow she feels \"resentful towards the [Russian] state\", in a country where most people avoid criticising the full-scale invasion unleashed on Ukraine in February 2022.\n\nThe local governor says more than 300 Russians are still missing in Kursk region, but no-one really knows the true figure.\n\nLyubov says she tried to persuade her mother to leave her village in the Sudzha area, but blames Russian state TV \"propaganda\" for her refusal to listen. Some 2,000 people remained in the settlements captured by Ukraine's military, Russian authorities estimate.", "link": "https://www.bbc.co.uk/news/articles/c62ene9kr71o?at_medium=RSS&at_campaign=rss", "source_id": "bbc_europe", "source_name": "BBC News (Europa)", "perspective": "international", "language": "en", "bias_note": "Servicio público británico con amplia red de corresponsales internacionales.", "published": "2026-09-12T23:51:05+00:00", "category": "frente", "relevance_score": 8, "date_added": "2026-09-16", "title_es": "Los rusos buscan respuestas sobre los cientos desaparecidos tras la incursión de Ucrania en 2024", "text_es": "Las familias rusas se quejan de que el gobierno hizo poco para ayudar a localizar a los desaparecidos\n\n\"Yo tenía plena fe en nuestro país\", dice Lyubov. La última vez que habló con su madre fue un día después de que las fuerzas ucranianas irrumpieran en la región rusa de Kursk hace más de dos años.\n\nAhora se siente \"resentida con el Estado [ruso]\", en un país donde la mayoría de la gente evita criticar la invasión a gran escala desatada en Ucrania en febrero de 2022.\n\nEl gobernador local dice que más de 300 rusos siguen desaparecidos en la región de Kursk, pero nadie sabe realmente la cifra real.\n\nLyubov dice que intentó persuadir a su madre para que abandonara su aldea en el área de Sudzha, pero culpa a la \"propaganda\" de la televisión estatal rusa por su negativa a escuchar. Unas 2.000 personas permanecían en los asentamientos capturados por el ejército ucraniano, estiman las autoridades rusas."}, {"id": "36eb9fe5f242", "title_original": "Russian Offensive Campaign Assessment, September 11, 2026 - Institute for the Study of War", "text_original": "Russian Offensive Campaign Assessment, September 11, 2026 Institute for the Study of War", "link": "https://news.google.com/rss/articles/CBMirgFBVV95cUxPYUgtVTR5Mjlqa3ZrYmJkaU9iTmtwbFdoLTdRQnFhSlh4Y3B0MTktUGpHb2ZRYjlHWnppTzgwRUN2M08zaURrU0lYMFM0ZHJCZFZrU1hZV2hkdm1uYWZVUnhnZUphZ3RaRnBCc0tJZHA3bG5Md0M4UENzNkN6RnVmcXBzNE1sUW5oN2k5eWZRVHRTb0RSTXNMM0phZG4ycXVVUmdCeEtVWnlMTmpKSkE?oc=5", "source_id": "isw_assessments", "source_name": "Institute for the Study of War (ISW)", "perspective": "international", "language": "en", "bias_note": "Centro de estudios estratégicos estadounidense líder mundial en mapas y análisis del frente.", "published": "2026-09-12T02:49:25+00:00", "category": "frente", "relevance_score": 7, "date_added": "2026-09-16", "title_es": "Evaluación de la campaña ofensiva rusa, 11 de septiembre de 2026 - Instituto para el Estudio de la Guerra", "text_es": "Evaluación de la campaña ofensiva rusa, 11 de septiembre de 2026 Instituto para el Estudio de la Guerra"}, {"id": "5eaee122fbca", "title_original": "Russian Offensive Campaign Assessment, September 10, 2026 - Institute for the Study of War", "text_original": "Russian Offensive Campaign Assessment, September 10, 2026 Institute for the Study of War", "link": "https://news.google.com/rss/articles/CBMirgFBVV95cUxQYUxQUjNYeU15V093N0VURjVlWVJYX3FjOVFCTmIteldnRUdTOGtJYUVzQkhfSVJDX1BEZjd6MmR5RU5xcEE4RGZzdDV1YTVJa1VUUU1SNVNpNWVURVgxT3RkaGdDaUowdkJSRjBPQkp4bVdjclQxVG1sSk4zVEFrc0dKR193U2pWa0R0VllIS2w0Vk5Ma0lZbktjbE83R2JlNXFsWGI5Ti1ITG1sOHc?oc=5", "source_id": "isw_assessments", "source_name": "Institute for the Study of War (ISW)", "perspective": "international", "language": "en", "bias_note": "Centro de estudios estratégicos estadounidense líder
