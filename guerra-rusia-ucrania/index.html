 goes to the 82nd and 95th Separate Airborne Assault Brigades. We are proud of you, warriors,” Zelenskyy added,", "link": "https://en.interfax.com.ua/news/general/1206079.html", "source_id": "interfax_ukraine", "source_name": "Interfax-Ucrania", "perspective": "ukraine", "language": "en", "bias_note": "Agencia de noticias ucraniana de referencia para despachos militares y declaraciones gubernamentales.", "published": "2026-09-17T15:54:15+00:00", "category": "frente", "relevance_score": 41, "date_added": "2026-09-17", "title_es": "Zelenskyy informa del derribo de un avión no tripulado por un interceptor ucraniano", "text_es": "Durante las pruebas de un interceptor ucraniano diseñado para contrarrestar los aviones teledirigidos Shahed, uno de estos vehículos aéreos no tripulados rusos fue derribado, anunció el presidente ucraniano, Volodymyr Zelenskyy, tras una sesión informativa del comandante en jefe de las Fuerzas Armadas de Ucrania, Mykhailo Drapaty.\n\n\"Es importante que haya otro resultado positivo de las pruebas de interceptores contra Shaheds propulsados ​​por aviones: un derribo. Gracias a todos los desarrolladores y a nuestros guerreros. Lo ampliaremos\", dijo Zelenskyy el jueves X.\n\nEl Presidente también anunció que Ucrania está preparando nuevas operaciones activas de largo alcance.\n\nAdemás, el Jefe de Estado destacó el impulso necesario en la región de Donetsk e informó sobre los preparativos para reforzar el sector de Kupyansk.\n\nSegún sus palabras, las Fuerzas de Defensa están destruyendo las posiciones de los ocupantes en dirección a Oleksandrivka.\n\n\"Nuestro agradecimiento especial va a las Brigadas Separadas de Asalto Aerotransportado 82 y 95. Estamos orgullosos de ustedes, guerreros\", añadió Zelenskyy."}, {"id": "913ff2d78725", "title_original": "СМИ: Киев испытывает дефицит турбореактивных двигателей для перехватчиков", "text_original": "МОСКВА, 17 сен - РИА Новости. Украина испытывает дефицит поставок турбореактивных двигателей для перехватчиков, сообщает портал Intelligence Online.\n\n\"Программы по разработке перехватчиков (Украины - ред.)... тормозятся дефицитом в поставках турбореактивных двигателей\", - говорится в сообщении.\n\nВ то время как Россия наращивает производство реактивных двигателей, Киев \"в отчаянии\" ищет поставщиков, подчеркивает портал.\n\nВладимир Зеленский ранее признавал, что ВСУ не могут сбивать баллистические ракеты из-за дефицита ракет ПВО. Глава комитета Верховной рады по вопросам национальной безопасности, обороны и разведки Егор Чернев, в свою очередь, заявлял, что ситуация с системами ПВО на Украине стала наихудшей за все время конфликта.\n\nРоссия считает, что поставки вооружений Украине мешают урегулированию, напрямую вовлекают страны НАТО в конфликт и являются \"игрой с огнем\". Глава МИД РФ Сергей Лавров отмечал, что любые грузы, которые содержат вооружение для Украины, станут законной целью для России. В Кремле заявляли, что накачивание Украины оружием со стороны Запада не способствует переговорам и будет иметь негативный эффект.", "link": "https://ria.ru/20260917/ukraina-2118321803.html", "source_id": "ria_novosti", "source_name": "RIA Novosti (РИА)", "perspective": "russia_official", "language": "ru", "bias_note": "Agencia estatal rusa del conglomerado Rossiya Segodnya. Postura y partes de guerra oficiales del Kremlin.", "published": "2026-09-17T15:51:13+00:00", "category": "frente", "relevance_score": 19, "date_added": "2026-09-17", "title_es": "Medios de comunicación: Kyiv sufre escasez de turborreactores para interceptores", "text_es": "MOSCÚ, 17 de septiembre - RIA Novosti. Ucrania está experimentando una escasez de suministros de motores turborreactores para interceptores, informa el portal Intelligence Online.\n\n\"Los programas para el desarrollo de interceptores (de Ucrania - ed.)... se ven obstaculizados por la escasez de suministro de motores turborreactores\", dice el informe.\n\nMientras Rusia aumenta la producción de motores a reacción, Kiev busca \"desesperadamente\" proveedores, subraya el portal.\n\nVladimir Zelensky admitió anteriormente que las Fuerzas Armadas de Ucrania no pueden derribar misiles balísticos debido a la escasez de misiles de defensa aérea. El jefe del Comité de Seguridad Nacional, Defensa e Inteligencia de la Rada Suprema, Yegor Chernev, a su vez, afirmó que la situación con los sistemas de defensa aérea en Ucrania se ha convertido en la peor durante todo el conflicto.\n\nRusia cree que el suministro de armas a Ucrania interfiere con el acuerdo, involucra directamente a los países de la OTAN en el conflicto y está “jugando con fuego”. El Ministro de Asuntos Exteriores ruso, Sergei Lavrov, señaló que cualquier cargamento que contenga armas para Ucrania se convertirá en un objetivo legítimo para Rusia. El Kremlin afirmó que inflar a Ucrania con armas de Occidente no contribuye a las negociaciones y tendrá un efecto negativo."}, {"id": "5dc656d0087f", "title_original": "Таджикистан рассмотрел возможность выхода из Международного уголовного суда", "text_original": "Нижняя палата парламента Таджикистана рассмотрела проект постановления «О прекращении действия статута Международного уголовного суда» (МУС). Об этом сообщает пресс-служба парламента. Какое именно решение вынесли участники заседания, не уточняется.\n\nМеждународный уголовный суд, к юрисдикции которого относятся военные преступления и преступления против человечности, был создан в 1998 году на основании международного договора, принятого в Риме. Поскольку Таджикистан является его участником с момента основания, он обязуется исполнять решения суда.\n\nВ марте 2023 года МУС выдал ордер на арест Владимира Путина и Марии Львовой-Беловой, обвинив их в ряде международных преступлений. Тогда же секретариат суда направил всем государствам-участникам запросы об их аресте. Однако в 2025 году, во время государственного визита Владимира Путина в Душанбе, власти страны отказались исполнять это решение. Страны Евросоюза заявили, что Таджикистан не выполнил свои обязательства.", "link": "https://www.kommersant.ru/doc/8957316", "source_id": "kommersant", "source_name": "Kommersant (Коммерсантъ)", "perspective": "russia_official", "language": "ru", "bias_note": "Diario de referencia ruso sobre política exterior, sanciones, industria militar y economía de guerra.", "published": "2026-09-17T15:33:18+00:00", "category": "diplomacia", "relevance_score": 11, "date_added": "2026-09-17", "title_es": "Tayikistán ha considerado la posibilidad de retirarse de la Corte Penal Internacional", "text_es": "La cámara baja del Parlamento de Tayikistán examinó el proyecto de resolución “Sobre la terminación del estatuto de la Corte Penal Internacional” (CPI). Así lo informó el servicio de prensa del parlamento. No se especifica cuál fue exactamente la decisión que tomaron los participantes de la reunión.\n\nLa Corte Penal Internacional, que tiene jurisdicción sobre crímenes de guerra y crímenes contra la humanidad, fue creada en 1998 mediante un tratado internacional adoptado en Roma. Como Tayikistán es miembro desde su fundación, está obligado a cumplir las decisiones judiciales.\n\nEn marzo de 2023, la CPI emitió una orden de arresto contra Vladimir Putin y Maria Lvova-Belova, acusándolos de varios crímenes internacionales. Al mismo tiempo, la secretaría del tribunal envió solicitudes de arresto a todos los estados participantes. Sin embargo, en 2025, durante la visita de Estado de Vladimir Putin a Dushanbe, las autoridades del país se negaron a implementar esta decisión. Los países de la UE declararon que Tayikistán no había cumplido sus obligaciones."}, {"id": "cea8e18c2e87", "title_original": "В Польше признали, что передавать Украине оружие заставляют США и НАТО", "text_original": "ВАРШАВА, 17 сен - РИА Новости. Министр национальной обороны Польши Владислав Косиняк-Камыш признал, что передавать Украине оружие его заставляют США и НАТО.\n\n\"Мы планируем очередной донат\", - сказал Косиняк-Камыш, отвечая на вопрос о передаче Украине вооружения.\n\n\"Просьбу Соединенных штатов - нашего самого главного союзника - и генерального секретаря НАТО я рассматриваю очень серьезно\", - добавил он.\n\nПри этом польский министр уклонился от ответа на вопрос, будут ли переданы Украине из Польши очередные ракеты для американских зенитно-ракетных комплексов Patriot.\n\n\"Это слишком серьезный вопрос\", - сказал он.\n\nРанее вице-спикер сейма Польши от коалиции националистов и евроскептиков \"Конфедерация\" Кшиштоф Босак сообщил, что Польша отдала Украине свои ракеты для ЗРК Patriot, которые были куплены Варшавой для создания своей системы противовоздушной обороны, а глава Бюро международной политики канцелярии президента Польши Марчин Пшидач заявил, что Польша в свое время уступила очередь на покупку в США ракет ЗРК Patriot Украине.", "link": "https://ria.ru/20260917/polsha-2118317945.html", "source_id": "ria_novosti", "source_name": "RIA Novosti (РИА)", "perspective": "russia_official", "language": "ru", "bias_note": "Agencia estatal rusa del conglomerado Rossiya Segodnya. Postura y partes de guerra oficiales del Kremlin.", "published": "2026-09-17T15:21:53+00:00", "category": "frente", "relevance_score": 23, "date_added": "2026-09-17", "title_es": "Polonia admitió que Estados Unidos y la OTAN están obligando a transferir armas a Ucrania", "text_es": "VARSOVIA, 17 de septiembre - RIA Novosti. El ministro polaco de Defensa Nacional, Wladyslaw Kosiniak-Kamysh, admitió que Estados Unidos y la OTAN lo obligan a transferir armas a Ucrania.\n\n\"Estamos planeando otra donación\", dijo Kosinyak-Kamysh, respondiendo a una pregunta sobre la transferencia de armas a Ucrania.\n\n\"Me tomo muy en serio la petición de Estados Unidos -nuestro aliado más importante- y del secretario general de la OTAN\", añadió.\n\nAl mismo tiempo, el Ministro polaco evitó responder a la pregunta de si los próximos misiles para el sistema antiaéreo Patriot estadounidense serán transferidos a Ucrania desde Polonia.\n\n\"Ésta es una cuestión demasiado seria\", afirmó.\n\nAnteriormente, Krzysztof Bosak, vicepresidente del Sejm polaco de la coalición de nacionalistas y euroescépticos “Confederación”, dijo que Polonia entregó a Ucrania sus misiles para el sistema de defensa aérea Patriot, que fueron adquiridos por Varsovia para crear su sistema de defensa aérea, y el jefe de la Oficina de Política Internacional de la Oficina del Presidente de Polonia, Marcin Przydacz, dijo que Polonia en un momento abandonó el turno de comprar misiles de defensa aérea Patriot de Estados Unidos a Ucrania."}, {"id": "b515b096d91a", "title_original": "Polish Defence Ministry says its military was ready to shoot down Russian drone near border", "text_original": "Cezary Tomczyk, Polish Deputy Minister of National Defence, has stated that the operational commander had issued an order to shoot down a Russian drone in the event of it crossing the border.\n\nSource: European Pravda, citing Polish media outlet Onet\n\nDetails: Journalists in the Sejm asked Tomczyk whether Poland was ready to shoot down the Russian drone that crashed near the border on Thursday. He replied that \"we were not only ready, but the operational commander had also issued an order to shoot it down in the event of it crossing the state border\".\n\nQuote: \"This is an order with pre-authorisation, meaning the pilot no longer has to check with the operational commander whether the object is within range and whether they can fire but can automatically, upon detecting the object, shoot down such a drone or missile.\"\n\nDetails: When asked whether the principle requiring an object to be visually identified first before opening fire on it is losing relevance given the speed of jet drones, Tomczyk denied this.\n\nAs he noted, \"identification in peacetime is absolutely necessary\" also due to the \"enormous\" risk of a potential mistake and, for example, shooting down a civilian aircraft.", "link": "https://www.pravda.com.ua/eng/news/2026/09/17/8053952/", "source_id": "ukrainska_pravda_en", "source_name": "Ukrainska Pravda (EN)", "perspective": "ukraine", "language": "en", "bias_note": "Uno de los periódicos más leídos e históricos de Ucrania (versión internacional en inglés).", "published": "2026-09-17T15:19:00+00:00", "category": "frente", "relevance_score": 23, "date_added": "2026-09-17", "title_es": "El Ministerio de Defensa polaco dice que su ejército estaba listo para derribar un dron ruso cerca de la frontera", "text_es": "Cezary Tomczyk, viceministro polaco de Defensa Nacional, ha afirmado que el comandante operativo había dado la orden de derribar un dron ruso en caso de que cruzara la frontera.\n\nFuente: Pravda europea, citando al medio de comunicación polaco Onet.\n\nDetalles: Los periodistas del Sejm preguntaron a Tomczyk si Polonia estaba dispuesta a derribar el dron ruso que se estrelló cerca de la frontera el jueves. Respondió que \"no sólo estábamos preparados, sino que el comandante operativo también había dado la orden de derribarlo en caso de que cruzara la frontera estatal\".\n\nCita: \"Se trata de una orden con autorización previa, lo que significa que el piloto ya no tiene que comprobar con el comandante operativo si el objeto está dentro del alcance y si puede disparar, sino que puede automáticamente, al detectar el objeto, derribar dicho dron o misil\".\n\nDetalles: Cuando se le preguntó si el principio de identificar visualmente un objeto antes de disparar contra él está perdiendo relevancia dada la velocidad de los aviones no tripulados, Tomczyk lo negó.\n\nSegún señaló, \"la identificación en tiempos de paz es absolutamente necesaria\", también debido al riesgo \"enorme\" de un posible error, como por ejemplo el derribo de un avión civil."}, {"id": "bfed54daa7f4", "title_original": "На арестованном в Индии танкере Unity оказались 20 российских моряков", "text_original": "На борту нефтяного танкера Unity, арестованного у берегов Индии четыре месяца назад, находятся 23 человека. Среди них есть гражданин Казахстана и два гражданина Египта. Остальные 20 человек — российские моряки. По оценке капитана судна, запасов еды и воды, которые им доставили месяц назад, хватит только до конца сентября.\n\n«Генеральное консульство России в Калькутте находится на связи с капитаном судна и местными властями, оказывается необходимое содействие», — сообщили в диппредставительстве (цитата по ТАСС). Там отметили, что намерены посетить экипаж в ближайшее время. Одновременно с этим консульство пытается оформить морякам визы, чтобы они смогли выехать в Россию.\n\nТанкер Unity, шедший под флагом Камеруна, прибыл в индийский порт Парадип с российской нефтью 9 мая. Два дня спустя Высокий суд штата Одиша наложил на него арест из-за финансовых претензий к владельцу. Ранее компания Tresta International FZE поставила судну топливо, за которое, как утверждает, получила лишь часть денег. За топливо, с учетом всех процентов и расходов, компания потребовала $423,8 тыс.", "link": "https://www.kommersant.ru/doc/8957106", "source_id": "kommersant", "source_name": "Kommersant (Коммерсантъ)", "perspective": "russia_official", "language": "ru", "bias_note": "Diario de referencia ruso sobre política exterior, sanciones, industria militar y economía de guerra.", "published": "2026-09-17T15:07:43+00:00", "category": "economia", "relevance_score": 15, "date_added": "2026-09-17", "title_es": "En la India fueron detenidos 20 marineros rusos a bordo del petrolero Unity", "text_es": "Hay 23 personas a bordo del petrolero Unity, que fue capturado frente a las costas de la India hace cuatro meses. Entre ellos se encuentran un ciudadano de Kazajstán y dos ciudadanos de Egipto. Las 20 personas restantes son marineros rusos. Según el capitán del barco, los suministros de alimentos y agua que les entregaron hace un mes sólo les durarán hasta finales de septiembre.\n\n\"El Consulado General de Rusia en Calcuta está en contacto con el capitán del barco y las autoridades locales y se está proporcionando la asistencia necesaria\", informó la misión diplomática (citada por TASS). Señalaron que tienen la intención de visitar a la tripulación en un futuro próximo. Al mismo tiempo, el consulado está intentando expedir visados ​​a los marineros para que puedan viajar a Rusia.\n\nEl petrolero Unity, que navega bajo bandera de Camerún, llegó al puerto indio de Paradip con petróleo ruso el 9 de mayo. Dos días después, el Tribunal Superior de Odisha lo embargó debido a reclamaciones financieras contra su propietario. Anteriormente, Tresta International FZE suministró combustible al barco, por lo que afirma haber recibido sólo una parte del dinero. Por el combustible, teniendo en cuenta todos los intereses y gastos, la empresa exigió 423,8 mil dólares."}, {"id": "b44b0aa6591b", "title_original": "ФСБ снова вызывает на допросы ученых, подписавших письмо против войны. А руководители вузов и НИИ не продлевают им контракты", "text_original": "ФСБ и руководство вузов и НИИ оказывают давление на ученых, подписавших антивоенное письмо в 2022 году, а также на тех сотрудников, фамилии которых оказались в утечке данных пользователей «Умного голосования», сообщает T-invariant.\n\nУченых вызывают на допросы или отказываются продлевать с ними рабочие контракты, рассказали изданию сотрудники вузов и НИИ из разных регионов страны.\n\nТак, один из уральских ученых сообщил, что из-за подписи под письмом его вызвал на беседу прикомандированный к университету сотрудник ФСБ. Он спрашивал ученого об отношении к войне в 2022 году и сейчас. По словам, ученого, за четыре года после подписания письма никаких проблем из-за него не возникало, а теперь удалять подпись бессмысленно — сотрудник ФСБ предъявил ему распечатку с архивной копией сайта с письмом от весны 2022-го.\n\nСотрудницу сибирского НИИ вызвали на допрос к представителю ФСБ по запросу из Москвы. Он спрашивал ее, откуда она взяла ссылку на письмо и кому сама его пересылала.\n\nОсобенно широко, по данным T-invariant, практика давления на ученых из-за оппозиционных взглядов применяется в Санкт-Петербургском государственном университете (СПбГУ). Там заместителем проректора по безопасности работает бывший начальник политического отдела местного центра «Э» Олег Шайдулин.\n\nНесколько бывших сотрудников СПбГУ рассказали, что непосредственные руководители объяснили им отказ продлить контракты попаданием в черный список. Бывшая сотрудница одного из IT-факультетов СПбГУ назвала эту систему «светофором»: там сотрудники поделены на желтые и красные списки. Сама она попала во внутренний список «неблагонадежных» из-за регистрации на сайте «Умного голосования».", "link": "https://meduza.io/news/2026/09/17/fsb-snova-vyzyvaet-na-doprosy-uchenyh-podpisavshih-pismo-protiv-voyny-a-rukovoditili-vuzov-i-nii-ne-prodlevayut-im-kontrakty", "source_id": "meduza_ru", "source_name": "Meduza (RU)", "perspective": "russia_independent", "language": "ru", "bias_note": "Principal medio ruso de investigación independiente prohibido por el Kremlin (sede en Letonia).", "published": "2026-09-17T15:00:20+00:00", "category": "drones", "relevance_score": 13, "date_added": "2026-09-17", "title_es": "El FSB vuelve a citar para interrogar a los científicos que firmaron la carta contra la guerra. Y los directores de universidades e institutos de investigación no renuevan sus contratos.", "text_es": "El FSB y la dirección de universidades e institutos de investigación están presionando a los científicos que firmaron la carta contra la guerra en 2022, así como a aquellos empleados cuyos nombres se encontraron en la filtración de datos de usuarios de Smart Voting, informa T-invariant.\n\nLos científicos son citados para ser interrogados o se les niega la renovación de sus contratos de trabajo, dijeron a la publicación empleados de universidades e institutos de investigación de diferentes regiones del país.\n\nAsí, uno de los científicos de los Urales informó que debido a la firma de la carta, un oficial del FSB asignado a la universidad lo convocó a una conversación. Preguntó al científico sobre su actitud ante la guerra en 2022 y ahora. Según el científico, durante cuatro años después de firmar la carta, no surgieron problemas a causa de ella, y ahora no tiene sentido borrar la firma: un oficial del FSB le mostró una copia impresa con una copia archivada del sitio con la carta fechada en la primavera de 2022.\n\nUn empleado de un instituto de investigación siberiano fue citado para ser interrogado por un representante del FSB a petición de Moscú. Le preguntó de dónde sacó el enlace a la carta y a quién se la envió.\n\nSegún el invariante T, la práctica de presionar a los científicos debido a opiniones opuestas está especialmente extendida en la Universidad Estatal de San Petersburgo (SPbSU). Allí trabaja como vicerrector adjunto de seguridad Oleg Shaidulin, ex jefe del departamento político del centro local “E”.\n\nVarios ex empleados de la Universidad Estatal de San Petersburgo dijeron que sus superiores inmediatos les explicaron que su negativa a renovar sus contratos se debía a que estaban en la lista negra. Un ex empleado de uno de los departamentos de TI de la Universidad Estatal de San Petersburgo llamó a este sistema un \"semáforo\": los empleados están divididos en listas amarillas y rojas. Ella misma fue incluida en la lista interna de “poco confiables” debido a su registro en el sitio web “Smart Voting”."}, {"id": "7e5358b996df", "title_original": "Zelensky appoints new chief prosecutor after predecessor's corruption scandal", "text_original": "Ukrainian President Volodymyr Zelensky has appointed a new acting prosecutor general, after the predecessor resigned over an anti-corruption investigation.\n\nAnton Kovalskyi, 42, was appointed on Thursday to replace Ruslan Kravchenko, who stood down last week following searches of his offices by Ukrainian anti-corruption officials related to illegal call centres in the country.\n\nOfficials said they identified a money-laundering scheme led by an official in Kravchenko's office, a claim he rejected.\n\nThe investigation into Kravchenko's office is the latest corruption scandal impacting Kyiv during the war against Russia. Accusations have been levelled at several members of Zelensky's inner circle.\n\nAccording to Ukraine's National Anti-Corruption Bureau (Nabu) and Specialised Anti-Corruption Prosecutor's Office (Sap), the network in Kravchenko's office received money to protect call centres that carried out phone scams and \"laundered millions in assets\".\n\nThe money was then used to buy property, jewellery, and other valuables, according to Nabu.", "link": "https://www.bbc.co.uk/news/articles/c539mwvl10g4o?at_medium=RSS&at_campaign=rss", "source_id": "bbc_europe", "source_name": "BBC News (Europa)", "perspective": "international", "language": "en", "bias_note": "Servicio público británico con amplia red de corresponsales de guerra e investigación OSINT.", "published": "2026-09-17T14:52:24+00:00", "category": "frente", "relevance_score": 21, "date_added": "2026-09-17", "title_es": "Zelensky nombra nuevo fiscal jefe tras el escándalo de corrupción de su predecesor", "text_es": "El presidente ucraniano, Volodymyr Zelensky, nombró un nuevo fiscal general interino, luego de que su predecesor renunciara por una investigación anticorrupción.\n\nAnton Kovalskyi, de 42 años, fue designado el jueves para reemplazar a Ruslan Kravchenko, quien renunció la semana pasada luego de registros en sus oficinas por parte de funcionarios anticorrupción ucranianos relacionados con centros de llamadas ilegales en el país.\n\nLos funcionarios dijeron que identificaron un plan de lavado de dinero dirigido por un funcionario de la oficina de Kravchenko, afirmación que él rechazó.\n\nLa investigación sobre la oficina de Kravchenko es el último escándalo de corrupción que afecta a Kiev durante la guerra contra Rusia. Se han formulado acusaciones contra varios miembros del círculo íntimo de Zelensky.\n\nSegún la Oficina Nacional Anticorrupción (Nabu) y la Fiscalía Especializada Anticorrupción (SAP) de Ucrania, la red de la oficina de Kravchenko recibió dinero para proteger los centros de llamadas que llevaban a cabo estafas telefónicas y \"lavaban activos millonarios\".\n\nLuego, el dinero se utilizó para comprar propiedades, joyas y otros objetos de valor, según Nabu."}, {"id": "10cef463e123", "title_original": "Greenpeace exposes Russian disinformation over strikes on Zaporizhzhia Nuclear Power Plant", "text_original": "Russia is deliberately sabotaging power supply lines at the Zaporizhzhia Nuclear Power Plant (ZNPP). More than half of all cases of total loss of off-site power at the plant since 2022 have occurred over the last seven months.\n\nDetails: A new analysis by Greenpeace Ukraine found no evidence of the claimed Ukrainian strikes.\n\nQuote: \"Russia is intentionally carrying out sabotage and deliberately disabling ZNPP power supply lines.\"\n\nDetails: The new investigation by Greenpeace Ukraine, conducted jointly with London-based McKenzie Intelligence Services (MIS), exposes a Russian disinformation campaign claiming that Ukrainian artillery strikes and drone attacks caused severe damage to critical infrastructure providing power to the ZNPP.\n\nAnalysis of high-resolution satellite imagery conducted by MIS found no evidence to support Russian claims of a Ukrainian artillery strike on 10 February 2026 or a UAV attack on 4 June 2026 targeting the Ferrosplavna 330 kV switchyard near the Zaporizhzhia Thermal Power Plant.\n\nThe analysis found no evidence of the claimed attack by over 20 Ukrainian UAVs on 4 June 2026 as asserted by Russia. The damage attributed by Russia to an alleged drone attack on 4 June was already present before that date.", "link": "https://www.pravda.com.ua/eng/news/2026/09/17/8053946/", "source_id": "ukrainska_pravda_en", "source_name": "Ukrainska Pravda (EN)", "perspective": "ukraine", "language": "en", "bias_note": "Uno de los periódicos más leídos e históricos de Ucrania (versión internacional en inglés).", "published": "2026-09-17T14:37:00+00:00", "category": "frente", "relevance_score": 25, "date_added": "2026-09-17", "title_es": "Greenpeace expone la desinformación rusa sobre los ataques a la central nuclear de Zaporizhzhia", "text_es": "Rusia está saboteando deliberadamente las líneas de suministro de energía en la central nuclear de Zaporizhzhia (ZNPP). Más de la mitad de todos los casos de pérdida total de energía externa en la planta desde 2022 se han producido en los últimos siete meses.\n\nDetalles: Un nuevo análisis de Greenpeace Ucrania no encontró evidencia de los supuestos ataques ucranianos.\n\nCita: \"Rusia está llevando a cabo intencionalmente sabotajes y desactivando deliberadamente las líneas de suministro de energía ZNPP\".\n\nDetalles: La nueva investigación de Greenpeace Ucrania, realizada conjuntamente con McKenzie Intelligence Services (MIS), con sede en Londres, expone una campaña de desinformación rusa que afirma que los ataques de artillería y drones ucranianos causaron graves daños a la infraestructura crítica que proporciona energía al ZNPP.\n\nEl análisis de imágenes satelitales de alta resolución realizado por MIS no encontró evidencia que respalde las afirmaciones rusas de un ataque de artillería ucraniano el 10 de febrero de 2026 o un ataque de vehículos aéreos no tripulados el 4 de junio de 2026 contra el patio de distribución de 330 kV de Ferrosplavna cerca de la central térmica de Zaporizhzhia.\n\nEl análisis no encontró pruebas del presunto ataque perpetrado por más de 20 vehículos aéreos no tripulados ucranianos el 4 de junio de 2026, como afirma Rusia. Los daños atribuidos por Rusia a un presunto ataque con drones el 4 de junio ya estaban presentes antes de esa fecha."}, {"id": "c313955eded0", "title_original": "С Генконсульства Германии в Петербурге сняли флаги", "text_original": "Флаги Евросоюза и Германии сняли со здания генерального консульства ФРГ в центре Санкт-Петербурга. С фасада особняка демонтировали таблички, а с окон стирают гербы, передает «Фонтанка».\n\nНемецкое консульство работало в здании на Фурштатской улице с 1972 года. Оно должно закрыться к 18 сентября, а сотрудники — покинуть Россию. Российская сторона пошла на эти меры после того, как Германия решила закрыть Генконсульство РФ в Бонне и Русский дом в Берлине.\n\nПричиной власти ФРГ назвали инциденты с дронами в аэропорту Лейпцига, ответственными за которые Берлин считает Москву. Германия также пообещала ужесточить контроль за въездом россиян в страну и расширить список санкций.", "link": "https://www.kommersant.ru/doc/8957218", "source_id": "kommersant", "source_name": "Kommersant (Коммерсантъ)", "perspective": "russia_official", "language": "ru", "bias_note": "Diario de referencia ruso sobre política exterior, sanciones, industria militar y economía de guerra.", "published": "2026-09-17T14:25:35+00:00", "category": "drones", "relevance_score": 15, "date_added": "2026-09-17", "title_es": "Se retiraron las banderas del Consulado General de Alemania en San Petersburgo", "text_es": "Las banderas de la Unión Europea y de Alemania fueron retiradas del edificio del Consulado General de Alemania en el centro de San Petersburgo. Se quitaron los carteles de la fachada de la mansión y se borraron los escudos de armas de las ventanas, informa Fontanka.\n\nEl consulado alemán funciona desde 1972 en un edificio de la calle Furshtatskaya. Debe cerrar antes del 18 de septiembre y los empleados deben abandonar Rusia. La parte rusa tomó estas medidas después de que Alemania decidiera cerrar el Consulado General de Rusia en Bonn y la Casa Rusa en Berlín.\n\nLas autoridades alemanas citaron el motivo como incidentes con drones en el aeropuerto de Leipzig, de los que Berlín considera responsable a Moscú. Alemania también prometió reforzar los controles sobre la entrada de rusos al país y ampliar la lista de sanciones."}, {"id": "c5090cf97a45", "title_original": "Sybiha discusses further defense support, Ukraine's EU integration with Slovenian foreign minister", "text_original": "Ukrainian Foreign Minister Andriy Sybiha, during talks in Kyiv with Slovenian Minister of Foreign and European Affairs Tone Kajzer, discussed further defense support for Ukraine, opportunities for joint production, and Slovenia's support for Ukraine's accession to the European Union.\n\n\"I briefed my colleague on the situation on the battlefield, the consequences of Russia's ongoing strikes on Ukraine, and the latest dynamics of peace efforts. We discussed the steps needed to strengthen Ukraine and advance a comprehensive and lasting peace,\" Sybiha wrote on the social network X.\n\nHe said defense cooperation was a key topic of the talks. Sybiha thanked Slovenia for its military assistance, including its contribution through PURL and the Czech ammunition initiative.\n\nThe two sides also discussed further support for Ukraine, opportunities for mutually beneficial defense cooperation, including joint production, Ukraine's accession to the EU and Slovenia's support in advancing this process, as well as regional cooperation and preparations for the next Ukraine-Southeast Europe summit, which Slovenia will host in 2027.\n\nSybiha expressed gratitude to Slovenia for joining the Shelter Coalition, for supporting reconstruction projects in the Khmelnytsky and Zhytomyr regions and in Kharkiv, and for its readiness to take on new projects.\n\n\"We also appreciate Slovenia's support for humanitarian demining, energy resilience, and the rehabilitation of Ukrainian children,\" the foreign minister said.", "link": "https://en.interfax.com.ua/news/general/1206024.html", "source_id": "interfax_ukraine", "source_name": "Interfax-Ucrania", "perspective": "ukraine", "language": "en", "bias_note": "Agencia de noticias ucraniana de referencia para despachos militares y declaraciones gubernamentales.", "published": "2026-09-17T14:10:06+00:00", "category": "frente", "relevance_score": 27, "date_added": "2026-09-17", "title_es": "Sybiha analiza con el ministro de Asuntos Exteriores esloveno un mayor apoyo a la defensa y la integración de Ucrania en la UE", "text_es": "El Ministro de Asuntos Exteriores de Ucrania, Andriy Sybiha, durante las conversaciones en Kiev con el Ministro de Asuntos Exteriores y Europeos de Eslovenia, Tone Kajzer, discutió un mayor apoyo de defensa a Ucrania, oportunidades para la producción conjunta y el apoyo de Eslovenia a la adhesión de Ucrania a la Unión Europea.\n\n\"Informé a mi colega sobre la situación en el campo de batalla, las consecuencias de los actuales ataques de Rusia contra Ucrania y la última dinámica de los esfuerzos de paz. Discutimos los pasos necesarios para fortalecer Ucrania y promover una paz integral y duradera\", escribió Sybiha en la red social X.\n\nDijo que la cooperación en materia de defensa era un tema clave de las conversaciones. Sybiha agradeció a Eslovenia por su asistencia militar, incluida su contribución a través de PURL y la iniciativa checa sobre municiones.\n\nLas dos partes también discutieron un mayor apoyo a Ucrania, oportunidades para una cooperación de defensa mutuamente beneficiosa, incluida la producción conjunta, la adhesión de Ucrania a la UE y el apoyo de Eslovenia para avanzar en este proceso, así como la cooperación regional y los preparativos para la próxima cumbre entre Ucrania y el Sudeste de Europa, que Eslovenia será la anfitriona en 2027.\n\nSybiha expresó su gratitud a Eslovenia por unirse a la Shelter Coalition, por apoyar los proyectos de reconstrucción en las regiones de Khmelnytsky y Zhytomyr y en Kharkiv, y por su disposición a asumir nuevos proyectos.\n\n\"También apreciamos el apoyo de Eslovenia al desminado humanitario, la resiliencia energética y la rehabilitación de los niños ucranianos\", afirmó el Ministro de Asuntos Exteriores."}, {"id": "f5581e46b3a5", "title_original": "Two-Time Olympic Biathlon Champion and State Duma Lawmaker Sergei Tchepikov Dies at 59", "text_original": "Two-time Olympic biathlon champion and State Duma lawmaker Sergei Tchepikov has died at age 59, the Russian Biathlon Union said Thursday.\n\nDuring his international career spanning two decades and six Winter Olympic Games, Tchepikov won a gold medal in the biathlon relay in 1988 and another in the sprint in 1994.\n\nTchepikov was also a two-time World Champion, taking gold in the team event in 1989 and the mixed relay in 2006, with a less successful career in cross-country skiing in between.\n\nIn 2006, he joined the ruling United Russia party, which is backed by President Vladimir Putin, and was elected to the Sverdlovsk region’s legislative assembly in 2011. He has served in the Duma since 2016.\n\nThe United States, the EU and other Western countries sanctioned Tchepikov in 2022 for voting in support of the full-scale invasion of Ukraine.\n\nWe are facing unprecedented challenges. Russia's Prosecutor General's Office has designated The Moscow Times as an \"undesirable\" organization, criminalizing our work and putting our staff at risk of prosecution. This follows our earlier unjust labeling as a \"foreign agent.\"", "link": "https://www.themoscowtimes.com/2026/09/17/two-time-olympic-biathlon-champion-and-state-duma-lawmaker-sergei-chepikov-dies-at-59-a93739", "source_id": "the_moscow_times", "source_name": "The Moscow Times", "perspective": "russia_independent", "language": "en", "bias_note": "Diario independiente ruso en el exilio crítico con Putin y con cobertura de ataques en territorio ruso.", "published": "2026-09-17T13:54:36+00:00", "category": "economia", "relevance_score": 21, "date_added": "2026-09-17", "title_es": "Muere Sergei Tchepikov, bicampeón olímpico de biatlón y legislador de la Duma estatal, a los 59 años", "text_es": "El dos veces campeón olímpico de biatlón y legislador de la Duma estatal Sergei Tchepikov murió a los 59 años, informó el jueves la Unión Rusa de Biatlón.\n\nDurante su carrera internacional que abarca dos décadas y seis Juegos Olímpicos de Invierno, Tchepikov ganó una medalla de oro en el relevo de biatlón en 1988 y otra en el sprint en 1994.\n\nTchepikov también fue dos veces campeón del mundo, consiguiendo el oro en la prueba por equipos en 1989 y en el relevo mixto en 2006, con una carrera menos exitosa en el esquí de fondo en el medio.\n\nEn 2006, se unió al partido gobernante Rusia Unida, respaldado por el presidente Vladimir Putin, y fue elegido miembro de la asamblea legislativa de la región de Sverdlovsk en 2011. Ha servido en la Duma desde 2016.\n\nEstados Unidos, la UE y otros países occidentales sancionaron a Tchepikov en 2022 por votar a favor de la invasión a gran escala de Ucrania.\n\nNos enfrentamos a desafíos sin precedentes. La Fiscalía General de Rusia ha designado a The Moscow Times como una organización \"indeseable\", criminalizando nuestro trabajo y poniendo a nuestro personal en riesgo de ser procesado. Esto sigue a nuestra anterior etiqueta injusta como \"agente extranjero\"."}, {"id": "15ec49e5879e", "title_original": "Эксперт: Генпрокурор Украины действовал так, как ему разрешила система", "text_original": "Верховная рада уволила Руслана Кравченко с должности генерального прокурора. Через два дня президент Владимир Зеленский возложил исполнение обязанностей генпрокурора на Антона Ковальского. Незадолго до увольнения Кравченко объявил о подозрении директору НАБУ Семену Кривоносу\n\nО том, что стоит за этим конфликтом и какие последствия он может иметь для антикоррупционной системы и евроинтеграции Украины, DW поговорила с заместителем исполнительного директора антикоррупционной организации Transparency International Ukraine Екатериной Рыженко.\n\nDW: Госпожа Рыженко, после заявлений Руслана Кравченко и его обвинений в адрес НАБУ и САП конфликт между Офисом генпрокурора и антикоррупционными органами резко обострился. Что на самом деле происходит?\n\nЕкатерина Рыженко: По моему мнению, это результат той системы, которую выстраивали последние годы. Особенно отчетливо в публичном пространстве она проявилась в прошлом году, когда была предпринята попытка законодательно ограничить независимость НАБУ. Проблема в том, что должность генерального прокурора является политической. Человек назначается на нее без конкурса, и мы неоднократно слышали от представителей власти в отношении предыдущих генпрокуроров формулировки вроде \"свой человек\". Именно поэтому сегодня мы имеем такую ситуацию. Кравченко фактически действовал так, как это поощрялось и допускалось Офисом президента и Верховной радой через ряд политических инициатив и заявлений. Поэтому я считаю это давлением на антикоррупционные институты.\n\n- Вы имеете в виду заявления Кравченко о подозрении руководителю НАБУ Семену Кривоносу в подделке официальных документов для получения неправомерной выгоды в особо крупном размере?\n\n- Да. Это дело лежало уже не один год, и его, очевидно, зарегистрировали, но не расследовали, не вкладывали ресурсы, которые должны вкладываться в дело, чтобы оно было обоснованным и полноценно подкрепленным доказательствами. Его просто достали в удобный момент и таким образом пытаются оказать давление на антикоррупционные органы через медийное и публичное пространство. Поэтому важно иметь независимые институты: и Генеральная прокуратура, и сам генеральный прокурор должны быть максимально независимыми как в своих действиях, так и в процессе отбора и назначения. А когда этого нет, мы, к сожалению, получаем такой результат: генеральный прокурор, очевидно ожидая подозрения или любых других упоминаний своего имени в деле \"Карфаген\" либо, возможно, в других эпизодах или новых делах, начинает действовать, используя свою фактическую политическую власть и полномочия, чтобы попытаться дискредитировать антикоррупционные органы.", "link": "https://www.dw.com/ru/эксперт-генпрокурор-украины-действовал-так-как-ему-разрешила-система/a-79311607?maca=rus-rss-ru-all-1126-xml-mrss", "source_id": "dw_russian", "source_name": "Deutsche Welle (DW Ruso)", "perspective": "international", "language": "ru", "bias_note": "Radiodifusora pública internacional de Alemania con análisis exhaustivo del conflicto para la audiencia rusoparlante.", "published": "2026-09-17T13:44:00+00:00", "category": "frente", "relevance_score": 21, "date_added": "2026-09-17", "title_es": "Experto: El Fiscal General de Ucrania actuó como le permitía el sistema", "text_es": "La Rada Suprema destituyó a Ruslan Kravchenko de su cargo de fiscal general. Dos días después, el presidente Vladimir Zelensky asignó las funciones de fiscal general a Anton Kovalsky. Poco antes de su despido, Kravchenko comunicó sus sospechas al director de NABU, Semyon Krivonos.\n\nDW habló con la directora ejecutiva adjunta de la organización anticorrupción Transparencia Internacional Ucrania, Ekaterina Ryzhenko, sobre lo que hay detrás de este conflicto y las consecuencias que puede tener para el sistema anticorrupción y la integración europea de Ucrania.\n\nDW: Señora Ryzhenko, después de las declaraciones de Ruslan Kravchenko y sus acusaciones contra NABU y SAP, el conflicto entre la Fiscalía General y las autoridades anticorrupción se intensificó considerablemente. ¿Qué está pasando realmente?\n\nEkaterina Ryzhenko: En mi opinión, este es el resultado del sistema que se ha construido en los últimos años. Esto se manifestó especialmente claramente en el espacio público el año pasado, cuando se intentó limitar legislativamente la independencia de NABU. El problema es que el cargo de fiscal general es político. Se nombra a una persona para ese cargo sin concurso, y hemos escuchado repetidas veces de funcionarios del gobierno declaraciones como \"nuestra propia persona\" en relación con los fiscales generales anteriores. Por eso tenemos esta situación hoy. Kravchenko en realidad actuó de una manera que fue alentada y permitida por la Oficina del Presidente y la Rada Suprema a través de\n\n- ¿Se refiere a las declaraciones de Kravchenko sobre la sospecha del jefe de NABU, Semión Krivonos, de haber falsificado documentos oficiales para obtener beneficios ilícitos a gran escala?\n\n- Sí. Este caso lleva más de un año dando vueltas, y evidentemente fue registrado, pero no fue investigado, y no se invirtieron los recursos que debían invertirse en el caso para que fuera fundamentado y sustentado plenamente con pruebas. Simplemente lo pillaron en el momento oportuno y por ello intentan presionar a las autoridades anticorrupción a través de los medios de comunicación y el espacio público. Por ello, es importante contar con instituciones independientes: tanto la Fiscalía General como el propio Fiscal General deben ser lo más independientes posible, tanto en sus actuaciones como en el proceso de selección y nombramiento. Y cuando no es así, lamentablemente obtenemos el siguiente resultado: el Fiscal General"}, {"id": "efe41ba5f354", "title_original": "Swedish PM Kristersson resigns after election loss", "text_original": "Sweden's Prime Minister Ulf Kristersson has resigned after his ruling right-wing bloc was narrowly defeated by the centre-left opposition in the country's general election.\n\nHe made the announcement in a post on X on Thursday afternoon, after preliminary votes from Sunday's election showed about 50,000 votes separated the two blocs in the country of about 10 million people.\n\nOpposition parties led by Magdalena Andersson of the Social Democrats look set  to win 176 seats in the 349-seat Riksdag, Sweden's parliament.\n\nKristersson, a conservative, had been supported in government by the anti-immigration hard-right Sweden Democrats (SD), and had promised them cabinet jobs if he won the election.\n\nHis right-wing bloc looks set to win 173 seats in the Riksdag, according to data from  the Swedish Election Authority.\n\nThe results will be subject to formal certification in the coming days and are expected to finalised this weekend.", "link": "https://www.bbc.co.uk/news/articles/cxr50l3d762po?at_medium=RSS&at_campaign=rss", "source_id": "bbc_europe", "source_name": "BBC News (Europa)", "perspective": "international", "language": "en", "bias_note": "Servicio público británico con amplia red de corresponsales de guerra e investigación OSINT.", "published": "2026-09-17T12:41:05+00:00", "category": "frente", "relevance_score": 15, "date_added": "2026-09-17", "title_es": "El primer ministro sueco Kristersson dimite tras perder las elecciones", "text_es": "El Primer Ministro de Suecia, Ulf Kristersson, dimitió después de que su bloque gobernante de derecha fuera derrotado por estrecho margen por la oposición de centro izquierda en las elecciones generales del país.\n\nHizo el anuncio en una publicación en X el jueves por la tarde, después de que las votaciones preliminares de las elecciones del domingo mostraran que unos 50.000 votos separaban a los dos bloques en el país de unos 10 millones de habitantes.\n\nLos partidos de oposición liderados por Magdalena Andersson, de los socialdemócratas, parecen encaminados a ganar 176 escaños en el Riksdag, el parlamento sueco, de 349 escaños.\n\nKristersson, un conservador, había sido apoyado en el gobierno por los Demócratas Suecos (SD), de extrema derecha y antiinmigración, y les había prometido puestos en el gabinete si ganaba las elecciones.\n\nSu bloque de derecha probablemente obtendrá 173 escaños en el Riksdag, según datos de la autoridad electoral sueca.\n\nLos resultados estarán sujetos a certificación formal en los próximos días y se espera que estén finalizados este fin de semana."}, {"id": "de15bd8647c5", "title_original": "Киев: Беларусь вновь включила ретрансляторы для российских БПЛА", "text_original": "По данным украинских властей, Беларусь вновь включила ретрансляторы, которые РФ использует для управления беспилотниками в ходе атак вглубь территории Украины. Благодаря этому была произведена атака на железную дорогу у пропускного пункта \"Ягодин\" на украинско-польской границе, заявил в комментарии агентству \"Укринформ\" представитель Государственной пограничной службы Украины Андрей Демченко в среду, 16 сентября.\n\n\"Беларусь оказывает активную помощь России в обстрелах территории Украины. В том числе и ретрансляторами, которые включаются на территории Беларуси, подпитывают сигнал для российских \"Шахедов\" и \"Гербер\", - заявил он. По словам Демченко, ударные БПЛА заходят с территории РФ на Украину и держатся у границы с Беларусью, чтобы получать сигнал ретрансляторов и иметь возможность более глубокого захода на территорию Украины, в частности на западные области.\n\nВ ночь на 13 сентября РФ атаковала железную дорогу поблизости от пропускного пункта \"Ягодин\" на украинско-польской границе. Под удар России попал локомотив украинского пассажирского поезда.\n\nПо данным СМИ, в этот момент к границе приблизился спецпоезд, в котором ехали ближайший советник канцлера ФРГ Фридриха Мерца (Friedrich Merz) Гюнтер Зауттер (Günter Sautter), а также советники по вопросам безопасности из других европейских стран, депутаты бундестага, дипломаты и ученые. Кроме того, этим же спецпоездом в Польшу возвращался бывший премьер-министр Великобритании Борис Джонсон.\n\nВ конце июня президент Украины Владимир Зеленский заявил, что Киев зафиксировал отключение белорусских ретрансляторов, которые Россия использовала для ударов БПЛА по его стране. \"Демонтировали их или нет, я, честно говоря, пока что не знаю, - сказал он журналистам. - Факт, что ретрансляторы на сегодня не работают\".\n\nВпервые украинский лидер публично поднял в опрос о ретрансляторах 19 июня. Он заявил, что на белорусских вышках в приграничных районах размещено оборудование, помогающее российским военным наводить БПЛА на украинские цели. Правителю Беларуси Александру Лукашенко был предъявлен ультиматум: убрать технику в течение недели, иначе Украина возьмется за дело сама.", "link": "https://www.dw.com/ru/киев-беларусь-вновь-включила-ретрансляторы-для-российских-бпла/a-79310006?maca=rus-rss-ru-all-1126-xml-mrss", "source_id": "dw_russian", "source_name": "Deutsche Welle (DW Ruso)", "perspective": "international", "language": "ru", "bias_note": "Radiodifusora pública internacional de Alemania con análisis exhaustivo del conflicto para la audiencia rusoparlante.", "published": "2026-09-17T12:14:00+00:00", "category": "frente", "relevance_score": 19, "date_added": "2026-09-17", "title_es": "Kyiv: Bielorrusia ha reactivado repetidores para vehículos aéreos no tripulados rusos", "text_es": "Según las autoridades ucranianas, Bielorrusia ha reactivado los repetidores que la Federación Rusa utiliza para controlar los drones durante los ataques en territorio ucraniano. Gracias a esto se llevó a cabo un ataque al ferrocarril en el puesto de control de Yagodin en la frontera entre Ucrania y Polonia, dijo Andriy Demchenko, representante del Servicio Estatal de Fronteras de Ucrania, en un comentario a la agencia Ukrinform el miércoles 16 de septiembre.\n\n\"Bielorrusia presta asistencia activa a Rusia en el bombardeo del territorio de Ucrania. Incluyendo repetidores que se activan en el territorio de Bielorrusia, envían la señal a los Shaheds y Gerbers rusos\", dijo. Según Demchenko, los vehículos aéreos no tripulados de ataque entran en Ucrania desde el territorio de la Federación Rusa y permanecen cerca de la frontera con Bielorrusia para recibir la señal de los repetidores y poder penetrar más profundamente en el territorio de Ucrania, en particular en las regiones occidentales.\n\nLa noche del 13 de septiembre, la Federación Rusa atacó el ferrocarril cerca del puesto de control de Yagodin en la frontera entre Ucrania y Polonia. La locomotora de un tren de pasajeros ucraniano fue atacada por Rusia.\n\nSegún los medios de comunicación, en ese momento se acercaba a la frontera un tren especial en el que viajaba el asesor más cercano al canciller alemán, Friedrich Merz, Günter Sautter, así como asesores de seguridad de otros países europeos, diputados del Bundestag, diplomáticos y científicos. Además, el ex primer ministro británico, Boris Johnson, regresó a Polonia en el mismo tren especial.\n\nA finales de junio, el presidente ucraniano, Vladimir Zelensky, afirmó que Kiev había detectado el apagado de los repetidores bielorrusos que Rusia estaba utilizando para llevar a cabo ataques con vehículos aéreos no tripulados en su país. \"Para ser honesto, todavía no sé si fueron desmantelados o no\", dijo a los periodistas. \"El caso es que los repetidores no funcionan hoy\".\n\nPor primera vez, el líder ucraniano planteó públicamente preguntas sobre los repetidores el 19 de junio. Afirmó que las torres bielorrusas en las zonas fronterizas tienen equipos que ayudan al ejército ruso a dirigir los vehículos aéreos no tripulados hacia objetivos ucranianos. Al gobernante de Bielorrusia, Alexander Lukashenko, se le presentó un ultimátum: retirar el equipo en el plazo de una semana, de lo contrario Ucrania se hará cargo del asunto."}, {"id": "3f87dfb61586", "title_original": "Ukraine sees energy and Black Sea ceasefire as possible key outcome of Zelenskyy-Trump meeting in New York", "text_original": "Ukrainian Foreign Minister Andrii Sybiha has said at a joint event with Slovenian Foreign Minister Tone Kajzer that a key outcome of a meeting between Ukrainian President Volodymyr Zelenskyy and US President Donald Trump in New York could be an agreement on energy and maritime ceasefires in the Russia-Ukraine war.\n\nSource: European Pravda, citing Ukrinform\n\nQuote: \"We welcome the efforts of our partners, the efforts of the United States, to make this happen, and we believe that with the active involvement of the US in particular, this can realistically be achieved. We are preparing for a meeting between President Zelenskyy and President Trump on the sidelines of the UN General Assembly, and I believe that this could be one of the main outcomes of this meeting – reaching a ceasefire.\"\n\nDetails: Sybiha said this could involve both a ceasefire on attacks against energy infrastructure and a ceasefire in the Black Sea.\n\nThe minister stressed that Ukraine wants to end the war.\n\n\"We have proposals, we have a vision of how to get there. We need the support of the world, and [we need] to abandon any illusions about Russia's good intentions. Russia understands only pressure,\" the foreign minister said.", "link": "https://www.pravda.com.ua/eng/news/2026/09/17/8053896/", "source_id": "ukrainska_pravda_en", "source_name": "Ukrainska Pravda (EN)", "perspective": "ukraine", "language": "en", "bias_note": "Uno de los periódicos más leídos e históricos de Ucrania (versión internacional en inglés).", "published": "2026-09-17T11:06:00+00:00", "category": "diplomacia", "relevance_score": 33, "date_added": "2026-09-17", "title_es": "Ucrania ve el alto el fuego en energía y en el Mar Negro como posible resultado clave de la reunión entre Zelenskyy y Trump en Nueva York", "text_es": "El Ministro de Asuntos Exteriores de Ucrania, Andrii Sybiha, dijo en un evento conjunto con el Ministro de Asuntos Exteriores de Eslovenia, Tone Kajzer, que un resultado clave de una reunión entre el Presidente de Ucrania, Volodymyr Zelenskyy, y el Presidente de Estados Unidos, Donald Trump, en Nueva York podría ser un acuerdo sobre ceses del fuego energético y marítimo en la guerra entre Rusia y Ucrania.\n\nFuente: Pravda europea, citando a Ukrinform.\n\nCita: \"Damos la bienvenida a los esfuerzos de nuestros socios, los esfuerzos de los Estados Unidos, para que esto suceda, y creemos que con la participación activa de los EE. UU. en particular, esto se puede lograr de manera realista. Nos estamos preparando para una reunión entre el Presidente Zelenskyy y el Presidente Trump al margen de la Asamblea General de la ONU, y creo que este podría ser uno de los principales resultados de esta reunión: alcanzar un alto el fuego\".\n\nDetalles: Sybiha dijo que esto podría implicar tanto un alto el fuego en los ataques contra la infraestructura energética como un alto el fuego en el Mar Negro.\n\nEl ministro subrayó que Ucrania quiere poner fin a la guerra.\n\n\"Tenemos propuestas, tenemos una visión de cómo llegar allí. Necesitamos el apoyo del mundo y [necesitamos] abandonar cualquier ilusión sobre las buenas intenciones de Rusia. Rusia sólo entiende la presión\", dijo el ministro de Asuntos Exteriores."}, {"id": "37f7ad2fbd64", "title_original": "В правящей коалиции ФРГ назвали предстоящие выборы в РФ \"фарсом\"", "text_original": "В правящей коалиции Германии не считают легитимными предстоящие выборы в Государственную думу РФ. Эксперт по внешней политике парламентской фракции консервативного блока ХДС/ХСС Юрген Хардт (Jürgen Hardt) в комментарии для DW в четверг, 17 сентября, назвал предстоящее голосование \"фарсом\", результаты которого предрешены заранее.\n\nНа российских парламентских выборах, которые пройдут 18-20 сентября, отсутствует \"реальная свобода выбора\". \"В конечном счете, результат известен еще до начала подсчета голосов\", - отметил депутат бундестага.\n\nОтстранив от участия в выборах партию \"Яблоко\", президент РФ Владимир Путин \"исключил из избирательного процесса последний значимый голос оппозиции\", отметил немецкий политик. \"Это признак слабости, ведь Путин понимает, что на фоне растущей инфляции, большого числа жертв войны и все более ощутимых ответных ударов Украины по российской территории его рейтинг популярности снизился\", - подчеркнул он.\n\nХардт напомнил, что и ранее наблюдатели критиковали выборы в Госдуму, называя их несвободными и нечестными. Учитывая падение рейтингов российского президента, \"следует ожидать, что диктаторское руководство страны будет еще настойчивее добиваться такого результата для путинской партии \"Единая Россия\", который позволил бы сохранить видимость легитимности\".\n\n\"На проведение выборов, соответствующих принципам правового государства и демократии, рассчитывать не приходится\", - констатировал немецкий консерватор.\n\nФедеральный список партии \"Яблоко\" сняли с выборов в Госдуму 10 августа решением Верховного суда по иску \"Родины\", которая обвинила \"Яблоко\" в нарушении авторских прав и незаконных выплатах за предвыборную агитацию.", "link": "https://www.dw.com/ru/в-правящей-коалиции-фрг-назвали-предстоящие-выборы-в-рф-фарсом/a-79309081?maca=rus-rss-ru-all-1126-xml-mrss", "source_id": "dw_russian", "source_name": "Deutsche Welle (DW Ruso)", "perspective": "international", "language": "ru", "bias_note": "Radiodifusora pública internacional de Alemania con análisis exhaustivo del conflicto para la audiencia rusoparlante.", "published": "2026-09-17T11:00:00+00:00", "category": "drones", "relevance_score": 19, "date_added": "2026-09-17", "title_es": "La coalición gobernante en Alemania calificó las próximas elecciones en la Federación Rusa de “farsa”", "text_es": "La coalición gobernante en Alemania no considera legítimas las próximas elecciones a la Duma Estatal de la Federación de Rusia. El experto en política exterior de la facción parlamentaria del bloque conservador CDU/CSU, Jürgen Hardt, calificó en un comentario para DW el jueves 17 de septiembre la próxima votación como una “farsa”, cuyos resultados están predeterminados de antemano.\n\nEn las elecciones parlamentarias rusas, que se celebrarán del 18 al 20 de septiembre, no existe una “verdadera libertad de elección”. \"En última instancia, el resultado se conoce incluso antes de que comience el recuento de votos\", afirmó el diputado del Bundestag.\n\nAl retirar al partido Yabloko de la participación en las elecciones, el presidente ruso Vladimir Putin “excluyó del proceso electoral a la última voz importante de la oposición”, señaló el político alemán. \"Esto es un signo de debilidad, porque Putin comprende que en un contexto de inflación creciente, un gran número de víctimas de la guerra y ataques de represalia cada vez más notables de Ucrania en territorio ruso, su índice de popularidad ha disminuido\", enfatizó.\n\nHardt recordó que los observadores ya habían criticado anteriormente las elecciones a la Duma estatal, calificándolas de poco libres e injustas. Dada la caída en las calificaciones del presidente ruso, \"uno debería esperar que el liderazgo dictatorial del país sea aún más persistente en buscar un resultado para el partido Rusia Unida de Putin que les permita mantener la apariencia de legitimidad\".\n\n\"No podemos contar con la celebración de elecciones que respeten los principios del Estado de derecho y la democracia\", afirmó el conservador alemán.\n\nLa lista federal del partido Yábloko fue eliminada de las elecciones a la Duma estatal el 10 de agosto por decisión del Tribunal Supremo tras una demanda de Rodina, que acusaba a Yábloko de infracción de derechos de autor y pagos ilegales por campañas electorales."}, {"id": "c5170d7b8f11", "title_original": "Poland scrambles military aircraft due to Russian attack on western Ukraine", "text_original": "The Operational Command of the Polish Armed Forces reported that due to Russian strikes on the western regions of Ukraine, military aviation operations have commenced in Polish airspace, and ground-based air defense and radar reconnaissance systems have been placed on alert.\n\n\"Due to the strikes carried out by Russia using jet-powered unmanned aerial vehicles against the western territory of Ukraine, military aviation operations have begun in Polish airspace,\" the Operational Command of the Polish Armed Forces stated in a post on the social network X on Thursday.\n\nThe command noted that the necessary forces and assets available to the air forces have been activated, while ground-based air defense systems and radar reconnaissance systems have also been placed on a state of readiness.\n\nIt was emphasized that these actions are preventive in nature and aimed at ensuring the security of airspace and protecting it. The Operational Command of the Polish Armed Forces stated that it is monitoring the current situation and that subordinate forces and assets remain ready for immediate response.\n\nOn the night of Thursday, September 17, Russian occupiers attacked Ukraine with Onyx missiles, ballistic missiles, Kalibrs, 157 drones, and a dozen \"Banderoly\" drones, targeting the Kyiv region, Zaporizhia, and the Odesa region.\n\nRecent massive Russian attacks on the western regions of Ukraine took place during the day on September 12 and on the night of September 13, 2026, lasting for over 24 hours. The enemy deployed hundreds of drones, including Shahed-type strike drones and jet-powered UAVs, targeting Volyn, Lviv (including Stry), Ivano-Frankivsk, Ternopil, Khmelnytsky, Rivne, and Zhytomyr regions.", "link": "https://en.interfax.com.ua/news/general/1205874.html", "source_id": "interfax_ukraine", "source_name": "Interfax-Ucrania", "perspective": "ukraine", "language": "en", "bias_note": "Agencia de noticias ucraniana de referencia para despachos militares y declaraciones gubernamentales.", "published": "2026-09-17T10:53:38+00:00", "category": "drones", "relevance_score": 25, "date_added": "2026-09-17", "title_es": "Polonia despacha aviones militares debido al ataque ruso al oeste de Ucrania", "text_es": "El Comando Operacional de las Fuerzas Armadas de Polonia informó que debido a los ataques rusos en las regiones occidentales de Ucrania, las operaciones de aviación militar han comenzado en el espacio aéreo polaco y los sistemas de defensa aérea terrestre y de reconocimiento por radar se han puesto en alerta.\n\n\"Debido a los ataques llevados a cabo por Rusia con vehículos aéreos no tripulados propulsados ​​por reactores contra el territorio occidental de Ucrania, comenzaron las operaciones de aviación militar en el espacio aéreo polaco\", afirmó el jueves el Comando Operacional de las Fuerzas Armadas de Polonia en una publicación en la red social X.\n\nEl comando señaló que se han activado las fuerzas y medios necesarios disponibles para las fuerzas aéreas, mientras que los sistemas de defensa aérea terrestres y los sistemas de reconocimiento por radar también se han puesto en estado de preparación.\n\nSe destacó que estas acciones son de carácter preventivo y tienen como objetivo garantizar la seguridad del espacio aéreo y protegerlo. El Comando Operacional de las Fuerzas Armadas de Polonia declaró que está monitoreando la situación actual y que las fuerzas y recursos subordinados permanecen listos para una respuesta inmediata.\n\nEn la noche del jueves 17 de septiembre, los ocupantes rusos atacaron Ucrania con misiles Onyx, misiles balísticos, Kalibrs, 157 drones y una docena de drones \"Banderoly\", apuntando a la región de Kiev, Zaporizhia y la región de Odesa.\n\nLos recientes ataques rusos masivos contra las regiones occidentales de Ucrania tuvieron lugar durante el día 12 de septiembre y la noche del 13 de septiembre de 2026, y duraron más de 24 horas. El enemigo desplegó cientos de drones, incluidos drones de ataque tipo Shahed y vehículos aéreos no tripulados a reacción, dirigidos a las regiones de Volyn, Lviv (incluido Stry), Ivano-Frankivsk, Ternopil, Khmelnytsky, Rivne y Zhytomyr."}, {"id": "5842023db0de", "title_original": "Russia has attacked shut-down Zaporizhzhia Steelworks for fourth time in a month: one injured  – photos", "text_original": "Russia attacked the shut-down Zaporizhstal (Zaporizhzhia Steelworks), a major iron and steel manufacturing plant in the city of Zaporizhzhia, with two ballistic missiles on the morning of 17 September. One employee has been taken to hospital. Production equipment and railway infrastructure have been significantly damaged.\n\nSource: Metinvest, an international mining and steel group headquartered in Ukraine\n\nDetails: Metinvest said the employee was unable to reach shelter in time. He was freed from under the rubble and taken to hospital with shrapnel wounds and concussion. There were no fatalities.\n\nThe strike damaged the main and auxiliary equipment, workshop buildings and railway infrastructure. Workers at the steelworks are clearing the rubble and assessing the damage.\n\nThis was the fourth attack on Zaporizhstal since August. According to Metinvest's estimates, Russia has launched a total of 17 ballistic missiles at the steelworks during this period.\n\nSubscribe on Patreon to back our journalism long-term.", "link": "https://www.pravda.com.ua/eng/news/2026/09/17/8053882/", "source_id": "ukrainska_pravda_en", "source_name": "Ukrainska Pravda (EN)", "perspective": "ukraine", "language": "en", "bias_note": "Uno de los periódicos más leídos e históricos de Ucrania (versión internacional en inglés).", "published": "2026-09-17T09:51:00+00:00", "category": "armamento", "relevance_score": 25, "date_added": "2026-09-17", "title_es": "Rusia ataca por cuarta vez en un mes la acería Zaporizhzhia, que está cerrada: un herido – fotos", "text_es": "Rusia atacó la cerrada Zaporizhstal (Zaporizhzhia Steelworks), una importante planta de fabricación de hierro y acero en la ciudad de Zaporizhzhia, con dos misiles balísticos en la mañana del 17 de septiembre. Un empleado ha sido trasladado al hospital. Los equipos de producción y la infraestructura ferroviaria sufrieron daños importantes.\n\nFuente: Metinvest, un grupo minero y siderúrgico internacional con sede en Ucrania.\n\nDetalles: Metinvest dijo que el empleado no pudo llegar a tiempo al refugio. Lo liberaron de entre los escombros y lo llevaron al hospital con heridas de metralla y una conmoción cerebral. No hubo víctimas mortales.\n\nLa huelga dañó el equipamiento principal y auxiliar, los edificios de talleres y la infraestructura ferroviaria. Los trabajadores de la acería están limpiando los escombros y evaluando los daños.\n\nEste fue el cuarto ataque contra Zaporizhstal desde agosto. Según las estimaciones de Metinvest, Rusia ha lanzado durante este período un total de 17 misiles balísticos contra la acería.\n\nSuscríbete en Patreon para respaldar nuestro periodismo a largo plazo."}, {"id": "2f39c32949ee", "title_original": "ВС России уничтожили группы ВСУ, пытавшиеся прорваться к котлу", "text_original": "МОСКВА, 17 сен - РИА Новости. Вооруженные силы России в ходе расширения внешней зоны контроля в Харьковской области уничтожили группы ВСУ, пытавшиеся прорваться на усиление, сообщило в четверг Минобороны РФ.\n\n\"В ходе расширения внешней зоны контроля уничтожены группы противника, предпринявшие попытку прорваться на усиление в районах населенных пунктов Приколотное и Новоалександровка Харьковской области\", - говорится в сообщении.", "link": "https://ria.ru/20260917/svo-2118215843.html", "source_id": "ria_novosti", "source_name": "RIA Novosti (РИА)", "perspective": "russia_official", "language": "ru", "bias_note": "Agencia estatal rusa del conglomerado Rossiya Segodnya. Postura y partes de guerra oficiales del Kremlin.", "published": "2026-09-17T08:43:14+00:00", "category": "frente", "relevance_score": 27, "date_added": "2026-09-17", "title_es": "Las Fuerzas Armadas de Rusia destruyeron grupos de las Fuerzas Armadas de Ucrania que intentaban penetrar hasta la caldera.", "text_es": "MOSCÚ, 17 de septiembre - RIA Novosti. Las Fuerzas Armadas rusas, durante la expansión de la zona de control externo en la región de Jarkov, destruyeron grupos de las Fuerzas Armadas de Ucrania que intentaban abrirse paso para obtener refuerzos, informó el jueves el Ministerio de Defensa ruso.\n\n\"Durante la expansión de la zona de control exterior, los grupos enemigos que intentaron abrirse paso en busca de refuerzos en las zonas de los asentamientos de Prikolotnoye y Novoaleksandrovka, en la región de Jarkov, fueron destruidos\", dice el mensaje."}, {"id": "8340b61ace9b", "title_original": "Российская армия взяла Розовку и Малую Волчью // Минобороны: ВС РФ взяли запорожскую Розовку и харьковскую Малую Волчью", "text_original": "Российские подразделения установили контроль над населенным пунктом Малая Волчья в Харьковской области, а также над Розовкой в Запорожской области. Об этом сообщили в Минобороны РФ.\n\nСогласно сводке, первый населенный пункт контролируют войска группировки «Север», второй — Южной группировки.\n\n15 сентября ведомство отчитывалось о взятии харьковской Ольховатки.", "link": "https://www.kommersant.ru/doc/8956874", "source_id": "kommersant", "source_name": "Kommersant (Коммерсантъ)", "perspective": "russia_official", "language": "ru", "bias_note": "Diario de referencia ruso sobre política exterior, sanciones, industria militar y economía de guerra.", "published": "2026-09-17T08:36:13+00:00", "category": "frente", "relevance_score": 27, "date_added": "2026-09-17", "title_es": "El ejército ruso tomó Rozovka y Malaya Volchya // Ministerio de Defensa: Las Fuerzas Armadas rusas tomaron Zaporozhye Rozovka y Kharkov Malaya Volchya", "text_es": "Las unidades rusas establecieron el control sobre la aldea de Malaya Volchya en la región de Kharkov, así como sobre Rozovka en la región de Zaporozhye. Así lo informó el Ministerio de Defensa ruso.\n\nSegún el informe, el primer asentamiento está controlado por tropas del grupo Norte, el segundo por el grupo Sur.\n\nEl 15 de septiembre, el departamento informó sobre la captura de Jarkov Olkhovatka."}, {"id": "adb9460b78ab", "title_original": "ВС России продолжают сжимать кольцо окружения в Харьковской области", "text_original": "МОСКВА, 17 сен – РИА Новости. Подразделения российской группировки войск \"Север\" в Харьковской области продолжают сжимать кольцо окружения и расширять внешнюю зону контроля, сообщили в Минобороны РФ.\n\n\"Подразделения группировки войск \"Север\" в Харьковской области продолжают сжимать кольцо окружения и расширять внешнюю зону контроля\", - говорится в сводке российского ведомства.", "link": "https://ria.ru/20260917/vs-2118213541.html", "source_id": "ria_novosti", "source_name": "RIA Novosti (РИА)", "perspective": "russia_official", "language": "ru", "bias_note": "Agencia estatal rusa del conglomerado Rossiya Segodnya. Postura y partes de guerra oficiales del Kremlin.", "published": "2026-09-17T08:34:58+00:00", "category": "frente", "relevance_score": 27, "date_added": "2026-09-17", "title_es": "Las Fuerzas Armadas rusas continúan reforzando el cerco en la región de Jarkov", "text_es": "MOSCÚ, 17 de septiembre – RIA Novosti. Unidades del grupo de tropas ruso \"Norte\" en la región de Jarkov continúan reforzando el cerco y ampliando la zona de control exterior, informó el Ministerio de Defensa ruso.\n\n\"Las unidades del grupo de tropas del Norte en la región de Jarkov continúan reforzando el cerco y ampliando la zona de control exterior\", dijo el departamento ruso en un informe."}, {"id": "0a03533707a5", "title_original": "В Минобороны рассказали о потерях ВСУ в кольце окружения под Харьковом", "text_original": "МОСКВА, 17 сен – РИА Новости. Украинские войска за сутки потеряли в кольце окружения в Харьковской области до 40 военнослужащих, сообщили в Минобороны РФ.\n\n\"За сутки потери украинских вооруженных формирований в кольце окружения составили до 40 военнослужащих, боевая бронированная машина и самоходная артиллерийская установка\", - говорится в сводке российского ведомства.", "link": "https://ria.ru/20260917/vsu-2118213367.html", "source_id": "ria_novosti", "source_name": "RIA Novosti (РИА)", "perspective": "russia_official", "language": "ru", "bias_note": "Agencia estatal rusa del conglomerado Rossiya Segodnya. Postura y partes de guerra oficiales del Kremlin.", "published": "2026-09-17T08:33:26+00:00", "category": "frente", "relevance_score": 27, "date_added": "2026-09-17", "title_es": "El Ministerio de Defensa habló sobre las pérdidas de las Fuerzas Armadas de Ucrania en el cerco cerca de Jarkov", "text_es": "MOSCÚ, 17 de septiembre – RIA Novosti. Durante el día, las tropas ucranianas perdieron hasta 40 militares en el cerco en la región de Jarkov, informó el Ministerio de Defensa ruso.\n\n\"Durante el día, las formaciones armadas ucranianas en el círculo de cerco perdieron hasta 40 militares, un vehículo blindado de combate y una unidad de artillería autopropulsada\", dijo el departamento ruso en un resumen."}, {"id": "495c8802c660", "title_original": "Минобороны рассказало о потерях ВСУ в зоне действий \"Центра\" за сутки", "text_original": "МОСКВА, 17 сен - РИА Новости. Российские подразделения группировки \"Центр\", улучшив позиции по переднему краю, уничтожили за сутки более 400 военнослужащих ВСУ, боевую бронированную машину и 12 автомобилей, сообщило в четверг Минобороны РФ.\n\n\"Подразделения группировки войск \"Центр\" улучшили тактическое положение. Нанесено поражение живой силе и технике двух механизированных бригад, штурмового полка ВСУ, бригады морской пехоты и трех бригад нацгвардии в районах населенных пунктов Лидино, Андреевка, Белозерское, Доброполье, Нововодяное, Гулево, Новогригоровка и Сергеевка Донецкой Народной Республики. Потери украинских вооруженных формирований составили свыше 400 военнослужащих, боевая бронированная машина и 12 автомобилей\", - говорится в сообщении российского военного ведомства.", "link": "https://ria.ru/20260917/tsentr-2118212640.html", "source_id": "ria_novosti", "source_name": "RIA Novosti (РИА)", "perspective": "russia_official", "language": "ru", "bias_note": "Agencia estatal rusa del conglomerado Rossiya Segodnya. Postura y partes de guerra oficiales del Kremlin.", "published": "2026-09-17T08:31:30+00:00", "category": "frente", "relevance_score": 27, "date_added": "2026-09-17", "title_es": "El Ministerio de Defensa habló sobre las pérdidas de las Fuerzas Armadas de Ucrania en la zona de operaciones \"Centro\" durante el día", "text_es": "MOSCÚ, 17 de septiembre - RIA Novosti. Las unidades rusas del grupo Centro, habiendo mejorado sus posiciones a lo largo de la línea del frente, destruyeron en un día a más de 400 efectivos de las Fuerzas Armadas de Ucrania, un vehículo blindado de combate y 12 vehículos, informó el jueves el Ministerio de Defensa ruso.\n\n\"Las unidades del grupo de tropas del Centro mejoraron la situación táctica. Los efectivos y equipos de dos brigadas mecanizadas, un regimiento de asalto de las Fuerzas Armadas de Ucrania, una brigada de infantería de marina y tres brigadas de la Guardia Nacional fueron derrotados en las zonas de los asentamientos de Lidino, Andreevka, Belozerskoye, Dobropolye, Novovodyanoye, Gulevo, Novogrygorovka y Sergeevka de la República Popular de Donetsk. Las pérdidas de Las formaciones armadas ucranianas contaban con más de 400 militares, un vehículo blindado de combate y 12 vehículos”, dijo el departamento militar ruso en un comunicado."}, {"id": "79a81ec4073a", "title_original": "ВСУ за сутки потеряли до 220 военных в зоне действий \"Севера\"", "text_original": "МОСКВА, 17 сен - РИА Новости. ВСУ за сутки потеряли до 220 боевиков в зоне действий российской группировки войск \"Север\", сообщило в четверг министерство обороны РФ.\n\n\"Всего в зоне ответственности группировки войск \"Север\" противник потерял до 220 военнослужащих, две боевые бронированные машины, пять автомобилей, артиллерийское орудие и станцию радиоэлектронной борьбы\", - говорится в сводке военного ведомства.\n\nОтмечается, что Харьковской области нанесено огневое поражение живой силе и технике тяжелой механизированной, мотопехотной, механизированной бригад и штурмового полка ВСУ в районах населенных пунктов Золочев, Дементиевка, Революционное, Грачевка, Братеница и Липцы.\n\nВ Сумской области поражены скопления живой силы и техники двух механизированных бригад ВСУ и двух бригад теробороны в районах населенных пунктов Груновка, Кучеровка, Бояро-Лежачи и Хотень.", "link": "https://ria.ru/20260917/svo-2118212272.html", "source_id": "ria_novosti", "source_name": "RIA Novosti (РИА)", "perspective": "russia_official", "language": "ru", "bias_note": "Agencia estatal rusa del conglomerado Rossiya Segodnya. Postura y partes de guerra oficiales del Kremlin.", "published": "2026-09-17T08:30:48+00:00", "category": "frente", "relevance_score": 27, "date_added": "2026-09-17", "title_es": "Las Fuerzas Armadas de Ucrania perdieron hasta 220 militares por día en la zona de operaciones “Norte”", "text_es": "MOSCÚ, 17 de septiembre - RIA Novosti. Las Fuerzas Armadas de Ucrania perdieron hasta 220 militantes por día en la zona de operaciones del grupo de tropas ruso \"Norte\", informó el jueves el Ministerio de Defensa ruso.\n\n\"En total, en la zona de responsabilidad del grupo de fuerzas del Norte, el enemigo perdió hasta 220 militares, dos vehículos blindados de combate, cinco vehículos, una pieza de artillería y una estación de guerra electrónica\", dice el informe del departamento militar.\n\nCabe señalar que en la región de Jarkov los efectivos y equipos de la infantería pesada mecanizada y motorizada, las brigadas mecanizadas y el regimiento de asalto de las Fuerzas Armadas de Ucrania sufrieron daños por incendio en las zonas de los asentamientos de Zolochev, Dementievka, Revolutionary, Grachevka, Bratenitsa y Liptsy.\n\nEn la región de Sumy fueron atacadas las acumulaciones de mano de obra y equipamiento de dos brigadas mecanizadas de las Fuerzas Armadas de Ucrania y dos brigadas de defensa militar en las zonas de los asentamientos de Grunovka, Kucherovka, Boyaro-Lezhachi y Khoten."}, {"id": "0957d3366b06", "title_original": "Russia attacks vessel bound for Ukrainian port: captain killed", "text_original": "The captain has been killed and three crew members have been injured in a Russian drone attack on a civilian vessel flying the Tanzanian flag as it headed for a Ukrainian port.\n\nSource: Ministry for Development of Communities and Territories of Ukraine\n\nDetails: The strike occurred on 17 September. Information is currently being gathered on the condition of the vessel.\n\nThe ministry pointed out that Russia is relentlessly attacking Ukrainian ports, port infrastructure facilities and civilian merchant vessels, posing a threat to international shipping in the Black Sea.\n\nBackground: In July, Russian missiles hit the cargo vessel Golden Leo near the port of Odesa. Nine crew members and a Ukrainian sea pilot were killed at the time, with eight sailors rescued.\n\nYour support on Patreon helps us keep the news free and accessible.", "link": "https://www.pravda.com.ua/eng/news/2026/09/17/8053855/", "source_id": "ukrainska_pravda_en", "source_name": "Ukrainska Pravda (EN)", "perspective": "ukraine", "language": "en", "bias_note": "Uno de los periódicos más leídos e históricos de Ucrania (versión internacional en inglés).", "published": "2026-09-17T08:29:00+00:00", "category": "drones", "relevance_score": 25, "date_added": "2026-09-17", "title_es": "Rusia ataca a un barco con destino a puerto ucraniano: su capitán muere", "text_es": "El capitán murió y tres miembros de la tripulación resultaron heridos en un ataque con drones rusos contra un barco civil que enarbolaba bandera de Tanzania cuando se dirigía a un puerto ucraniano.\n\nFuente: Ministerio de Desarrollo de Comunidades y Territorios de Ucrania\n\nDetalles: La huelga se produjo el 17 de septiembre. Actualmente se está recopilando información sobre el estado del barco.\n\nEl ministerio señaló que Rusia está atacando implacablemente los puertos ucranianos, las instalaciones de infraestructura portuaria y los buques mercantes civiles, lo que representa una amenaza para el transporte marítimo internacional en el Mar Negro.\n\nContexto: En julio, misiles rusos alcanzaron el carguero Golden Leo cerca del puerto de Odesa. Nueve tripulantes y un piloto ucraniano murieron en ese momento y ocho marineros fueron rescatados.\n\nTu apoyo en Patreon nos ayuda a mantener las noticias gratuitas y accesibles."}, {"id": "1b48b9e112c1", "title_original": "Военный советник Трампа призвал готовиться к боевым действиям на орбите Луны", "text_original": "Американским военным нужно готовиться к боевым действиям не только на околоземной орбите, но и вокруг Луны. Об этом заявил председатель Объединенного комитета начальников штабов США генерал Дэн Кейн, выступая на конференции Air, Space and Cyber в Нэшнл-Харборе, штат Мэрилен
