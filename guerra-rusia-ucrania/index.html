\nLas unidades del grupo Norte continúan reforzando el cerco de las formaciones enemigas en la región de Jarkov y ampliando la zona de control exterior.\n\n\"Las tripulaciones de tanques del grupo de fuerzas del Norte disparan las 24 horas del día contra posiciones, equipos militares y concentraciones de personal de las Fuerzas Armadas de Ucrania. La tarea principal de las tripulaciones de tanques es controlar las rutas de suministro de los militantes de las Fuerzas Armadas de Ucrania y apoyar el avance de las unidades de asalto y de fusileros motorizados\", dice el mensaje.\n\nCabe señalar que el incendio se está corrigiendo con la ayuda de drones, que también registran impactos. Los tanques operan tanto con fuego directo como desde posiciones cerradas, después de lo cual cambian de ubicación para evitar un ataque de represalia.\n\n“En las imágenes, la tripulación del tanque T-80BVM del 11.º Regimiento de Tanques del 11.º Cuerpo de Ejército del Grupo de tropas del Norte, durante misiones de combate en el área del Distrito Militar del Norte en dirección a Járkov, desde una posición de tiro cerrada destruyó un refugio camuflado, un puesto de control de vehículos aéreos no tripulados y personal de una unidad de las Fuerzas Armadas de Ucrania”, concluyó el departamento.\n\nEl presidente ruso, Vladimir Putin, anunció el 1 de septiembre que se había completado el cerco de un grupo enemigo de hasta 2.000 personas en la parte noreste de la región de Jarkov. Como afirmó Putin, la liquidación del caldero permitirá alejar la línea de contacto de combate de las zonas fronterizas de la región de Belgorod al menos 20 kilómetros. El 7 de septiembre, el Ministerio de Defensa ruso informó que alrededor de 1,7 mil militantes de las Fuerzas Armadas de Ucrania estaban rodeados."}, {"id": "b46aadf53d81", "title_original": "Axios: Трамп проведет переговоры по Ирану с лидерами стран Персидского залива", "text_original": "Президент США Дональд Трамп проведет встречу с лидерами стран Персидского залива во время Генеральной Ассамблеи ООН в Нью-Йорке 22 сентября. Стороны намерены обсудить дальнейшие шаги в войне с Ираном. Об этом сообщает Axios со ссылкой на источники.\n\nПо информации издания, американский президент встретится с лидерами или главами МИД Саудовской Аравии, ОАЭ, Катара, Бахрейна, Кувейта и Омана. Как сообщил другой собеседник Axios, встреча может быть расширена за счет участия других арабских и мусульманских лидеров.\n\nВстреча будет посвящена идеям США по послевоенной стратегии. Окончательный план, как ожидается, будет утвержден после промежуточных выборов в американский Конгресс.\n\nСегодня во время выступления на митинге в Северной Каролине Дональд Трамп заявил, что США и Иран приближаются к окончанию войны. По его словам, Тегеран напрямую сообщил Вашингтону о том, что хочет заключить сделку.", "link": "https://www.kommersant.ru/doc/8956625", "source_id": "kommersant", "source_name": "Kommersant (Коммерсантъ)", "perspective": "russia_official", "language": "ru", "bias_note": "Diario de referencia ruso sobre política exterior, sanciones, industria militar y economía de guerra.", "published": "2026-09-17T00:57:48+00:00", "category": "diplomacia", "relevance_score": 15, "date_added": "2026-09-17", "title_es": "Axios: Trump mantendrá conversaciones sobre Irán con los líderes del Golfo", "text_es": "El presidente de los Estados Unidos, Donald Trump, se reunirá con los líderes del Golfo durante la Asamblea General de la ONU el 22 de septiembre en Nueva York. Las partes tienen la intención de discutir nuevos pasos en la guerra con Irán. Así lo informa Axios citando fuentes.\n\nSegún la publicación, el presidente estadounidense se reunirá con los líderes o ministros de Asuntos Exteriores de Arabia Saudita, Emiratos Árabes Unidos, Qatar, Bahréin, Kuwait y Omán. La reunión podría ampliarse para incluir a otros líderes árabes y musulmanes, dijo otra persona a Axios.\n\nLa reunión se centrará en las ideas estadounidenses para la estrategia de posguerra. Se espera que el plan final sea aprobado después de las elecciones intermedias al Congreso de Estados Unidos.\n\nHoy, durante un discurso en un mitin en Carolina del Norte, Donald Trump dijo que Estados Unidos e Irán se acercan al final de la guerra. Según él, Teherán informó directamente a Washington que quiere llegar a un acuerdo."}, {"id": "ad417d9d7815", "title_original": "Drone Downed in Lithuania Was Russian and Likely Aimed at Ukraine, President Nausėda Says", "text_original": "A drone that was shot down by a NATO fighter jet in the skies above Lithuania for the first time was likely directed at Ukraine and veered off course, Lithuanian President Gitanas Nausėda said Wednesday.\n\n“Most likely, it was a Russian drone intended for Ukraine that was diverted from its course by Ukrainian electronic warfare measures and entered our territory, where it was shot down,” Nausėda told reporters after a state defense council meeting.\n\nNausėda identified the drone as a Gerbera, a low-cost plywood long-range aerial drone used by Russia. Gerberas are often employed as decoys to overwhelm air defenses, but they can also carry explosives.\n\nAn Italian fighter jet that is part of NATO’s Baltic air policing mission intercepted the unmanned aircraft over central Lithuania early Tuesday.\n\nRussia has not commented on the incident.\n\nSuspected Russian drones have previously been shot down over Poland, Romania, Latvia and Estonia, all of which are NATO and EU members.", "link": "https://www.themoscowtimes.com/2026/09/16/drone-downed-in-lithuania-was-russian-and-likely-aimed-at-ukraine-president-nausda-says-a93725", "source_id": "the_moscow_times", "source_name": "The Moscow Times", "perspective": "russia_independent", "language": "en", "bias_note": "Diario independiente ruso en el exilio crítico con Putin y con cobertura de ataques en territorio ruso.", "published": "2026-09-16T14:31:29+00:00", "category": "drones", "relevance_score": 19, "date_added": "2026-09-17", "title_es": "El dron derribado en Lituania era ruso y probablemente apuntaba a Ucrania, dice el presidente Nausėda", "text_es": "Un avión no tripulado que fue derribado por primera vez por un avión de combate de la OTAN en los cielos de Lituania probablemente estaba dirigido a Ucrania y se desvió de su rumbo, dijo el miércoles el presidente lituano, Gitanas Nausėda.\n\n\"Lo más probable es que se tratara de un dron ruso destinado a Ucrania que fue desviado de su rumbo por las medidas de guerra electrónica ucranianas y entró en nuestro territorio, donde fue derribado\", dijo Nausėda a los periodistas después de una reunión del consejo de defensa estatal.\n\nNausėda identificó el dron como un Gerbera, un dron aéreo de largo alcance de madera contrachapada de bajo costo utilizado por Rusia. Las gerberas se emplean a menudo como señuelos para abrumar las defensas aéreas, pero también pueden transportar explosivos.\n\nUn avión de combate italiano que forma parte de la misión de vigilancia aérea del Báltico de la OTAN interceptó el avión no tripulado sobre el centro de Lituania el martes por la mañana.\n\nRusia no ha comentado sobre el incidente.\n\nPresuntos drones rusos han sido derribados anteriormente sobre Polonia, Rumania, Letonia y Estonia, todos ellos miembros de la OTAN y la UE."}, {"id": "32b697f93f06", "title_original": "Ukraine's postal workers deliver lifeline under Russian fire", "text_original": "Every morning Igor Smelyansky looks at a vast map of Ukraine on his office wall and decides where he should put his people in harm's way.\n\nHis aides provide him with live intelligence about Russian attacks and he deploys his teams, balancing their potential operational success against risk to life or limb.\n\nBut Smelyansky is no military commander. He is the head of Ukraine's state postal service, Ukrposhta.\n\nAnd every day he must decide how far to send his postmen and women into the deadly \"kill zone\" along the front lines where the threat of drone attack is ever present.\n\n\"If it's too dangerous to go today, we won't go,\" Smelyansky told us. \"We'll go tomorrow, or we'll go somewhere else. The key is to be as agile as you can.\"\n\nUkrposhta does more than just collect letters and parcels. It pays out pensions in hard cash, it takes payment for utility bills. And it delivers vital food and medicine to people on the margins of society.", "link": "https://www.bbc.co.uk/news/articles/c33kmred368o?at_medium=RSS&at_campaign=rss", "source_id": "bbc_europe", "source_name": "BBC News (Europa)", "perspective": "international", "language": "en", "bias_note": "Servicio público británico con amplia red de corresponsales de guerra e investigación OSINT.", "published": "2026-09-15T05:01:46+00:00", "category": "drones", "relevance_score": 13, "date_added": "2026-09-17", "title_es": "Los trabajadores postales de Ucrania entregan un salvavidas bajo el fuego ruso", "text_es": "Todas las mañanas, Igor Smelyansky mira un enorme mapa de Ucrania colgado en la pared de su oficina y decide dónde debería poner a su pueblo en peligro.\n\nSus ayudantes le proporcionan inteligencia en vivo sobre los ataques rusos y él despliega sus equipos, equilibrando su potencial éxito operativo con el riesgo para la vida o la integridad física.\n\nPero Smelyansky no es un comandante militar. Es el jefe del servicio postal estatal de Ucrania, Ukrposhta.\n\nY cada día debe decidir hasta qué punto enviar a sus carteros y mujeres a la mortífera \"zona de exterminio\" a lo largo del frente, donde la amenaza de un ataque con drones está siempre presente.\n\n\"Si es demasiado peligroso ir hoy, no iremos\", nos dijo Smelyansky. \"Iremos mañana o iremos a otro lugar. La clave es ser lo más ágil posible\".\n\nUkrposhta hace más que simplemente recoger cartas y paquetes. Paga las pensiones en efectivo y cobra las facturas de servicios públicos. Y entrega alimentos y medicinas vitales a personas marginadas de la sociedad."}, {"id": "bb4c4b69c066", "title_original": "Watch: Why a Russian strike on train near Ukraine-Poland border could mark an escalation", "text_original": "A Russian drone struck a train near the Ukraine-Poland border shortly after the former UK Prime Minister Boris Johnson and top European security officials had passed through.\n\nNo casualties were reported after the strike at Yahodyn, which hit the train's engine. All the passengers had been evacuated, Ukrainian authorities said.\n\nJohnson and other European national security advisers, including the UK's Jonathan Powell, had passed along the same line on a different train on their way back from a conference in Kyiv.\n\nBBC's James Landale explains why the incident could signal an escalation in Russia's war against Ukraine.", "link": "https://www.bbc.co.uk/news/videos/cx2z5gjj838o?at_medium=RSS&at_campaign=rss", "source_id": "bbc_europe", "source_name": "BBC News (Europa)", "perspective": "international", "language": "en", "bias_note": "Servicio público británico con amplia red de corresponsales de guerra e investigación OSINT.", "published": "2026-09-14T01:12:20+00:00", "category": "drones", "relevance_score": 13, "date_added": "2026-09-17", "title_es": "Ver: Por qué un ataque ruso a un tren cerca de la frontera entre Ucrania y Polonia podría marcar una escalada", "text_es": "Un dron ruso chocó contra un tren cerca de la frontera entre Ucrania y Polonia poco después de que el ex primer ministro del Reino Unido, Boris Johnson, y altos funcionarios de seguridad europeos hubieran pasado por allí.\n\nNo se registraron víctimas tras el ataque en Yahodyn, que alcanzó el motor del tren. Todos los pasajeros fueron evacuados, dijeron las autoridades ucranianas.\n\nJohnson y otros asesores de seguridad nacional europeos, incluido el británico Jonathan Powell, habían pasado por la misma línea en un tren diferente cuando regresaban de una conferencia en Kiev.\n\nJames Landale de la BBC explica por qué el incidente podría indicar una escalada en la guerra de Rusia contra Ucrania."}, {"id": "f18251f17c6b", "title_original": "ПВО уничтожила два БПЛА, летевших на Москву", "text_original": "МОСКВА, 17 сен - РИА Новости. Силами ПВО Минобороны уничтожены два беспилотника, летевших на Москву, сообщил мэр Сергей Собянин.\n\n\"Силами ПВО Минобороны уничтожены два беспилотника, летевших на Москву. Специалисты экстренных служб работают на месте падения обломков\", - написал он в канале на платформе \"Макс\".", "link": "https://ria.ru/20260917/moskva-2118151784.html", "source_id": "ria_novosti", "source_name": "RIA Novosti (РИА)", "perspective": "russia_official", "language": "ru", "bias_note": "Agencia estatal rusa del conglomerado Rossiya Segodnya. Postura y partes de guerra oficiales del Kremlin.", "published": "2026-09-16T22:19:07+00:00", "category": "frente", "relevance_score": 23, "date_added": "2026-09-16", "title_es": "ПВО уничтожила два БПЛА, летевших на Москву", "text_es": "MOSCÚ, 17 de septiembre - RIA Novosti. Las fuerzas de defensa aérea del Ministerio de Defensa destruyeron dos drones que volaban hacia Moscú, según informó el alcalde Serguei Sobyanin.\n\n\"Las fuerzas de defensa aérea del Ministerio de Defensa destruyeron dos drones que volaban hacia Moscú. Los especialistas de los servicios de emergencia están trabajando en el lugar donde cayeron los escombros\", escribió en un canal de la plataforma Max."}, {"id": "ec60e0428849", "title_original": "Дипломаты рассказали о мерах безопасности в Нью-Йорке на выборах в ГД", "text_original": "НЬЮ-ЙОРК, 17 сен - РИА Новости. Генеральное консульство России в Нью-Йорке тесно сотрудничает с городской полицией и Службой дипломатической безопасности США по вопросам безопасности и обеспечения порядка в день выборов в Госдуму, сообщил РИА Новости генеральный консул Алексей Марков.\n\nГолосование в Нью-Йорке пройдет в воскресенье, 20 сентября, с 8.00 до 20.00. Находящиеся в США россияне также смогут проголосовать в посольстве России в Вашингтоне и генконсульстве в Хьюстоне.\n\n\"Мы плотно сотрудничаем с полицией Нью-Йорка и дипломатической секретной службой по вопросу обеспечения правопорядка 20 сентября у здания генконсульства\", — сказал Марков.\n\nОн выразил надежду, что американская сторона окажет в этом вопросе максимальное содействие, а полиция при необходимости оперативно пресечет возможные угрозы и беспорядки.\n\nКак отметил Марков, российские дипломаты также планируют встретиться с представителями американских правоохранительных органов, чтобы обменяться информацией и подробно обсудить вопросы безопасности и охраны периметра генконсульства в день голосования.\n\nПрезидент России Владимир Путин назначил выборы депутатов Государственной Думы девятого созыва на 20 сентября 2026 года. Голосование пройдет в три дня - с 18 по 20 сентября. Путин называл предстоящие выборы в Госдуму важнейшим внутриполитическим событием страны.", "link": "https://ria.ru/20260917/vybory-2118151270.html", "source_id": "ria_novosti", "source_name": "RIA Novosti (РИА)", "perspective": "russia_official", "language": "ru", "bias_note": "Agencia estatal rusa del conglomerado Rossiya Segodnya. Postura y partes de guerra oficiales del Kremlin.", "published": "2026-09-16T22:09:17+00:00", "category": "frente", "relevance_score": 21, "date_added": "2026-09-16", "title_es": "Los diplomáticos hablaron sobre las medidas de seguridad en Nueva York durante las elecciones a la Duma Estatal", "text_es": "NUEVA YORK, 17 de septiembre - RIA Novosti. El consulado general de Rusia en Nueva York colabora estrechamente con la policía de la ciudad y el servicio de seguridad diplomática de Estados Unidos en cuestiones de seguridad y orden el día de las elecciones a la Duma estatal, dijo a RIA Novosti el cónsul general Alexéi Markov.\n\nLa votación en Nueva York se llevará a cabo el domingo 20 de septiembre de 8:00 a 20:00 horas. Los rusos en Estados Unidos también podrán votar en la Embajada de Rusia en Washington y en el Consulado General en Houston.\n\n\"Estamos cooperando estrechamente con la policía de Nueva York y el servicio secreto diplomático en la cuestión de garantizar la ley y el orden el 20 de septiembre en el edificio del Consulado General\", dijo Markov.\n\nExpresó su esperanza de que la parte estadounidense brinde la máxima asistencia en este asunto y que la policía, si es necesario, ponga fin rápidamente a posibles amenazas y disturbios.\n\nComo señaló Markov, los diplomáticos rusos también planean reunirse con representantes de las fuerzas del orden estadounidenses para intercambiar información y discutir en detalle la seguridad y protección del perímetro del Consulado General el día de la votación.\n\nEl presidente ruso, Vladimir Putin, ha programado las elecciones de los diputados de la Duma Estatal de la novena convocatoria para el 20 de septiembre de 2026. La votación se llevará a cabo durante tres días, del 18 al 20 de septiembre. Putin calificó las próximas elecciones a la Duma Estatal como el evento político interno más importante del país."}, {"id": "9d01febf8b9c", "title_original": "Минобороны получило в пользование участок реки Ока", "text_original": "МОСКВА, 17 сен - РИА Новости. Минобороны России получило в обособленное пользование участок реки Ока в 38 тысяч квадратных метров в целях обеспечения обороны и безопасности страны, следует из документов, с которыми ознакомилось РИА Новости.\n\nСогласно документам, часть акватории Оки площадью 38 тысяч квадратных метров предоставлена Минобороны РФ сроком на 20 лет в обособленное водопользование. Целью изменений является обеспечение обороны страны и безопасности государства.\n\nОтмечается, что в двадцатилетний период все сооружения и объекты, которые находятся на указанном участке, должны поддерживаться в исправном состоянии.", "link": "https://ria.ru/20260917/minoborony-2118151121.html", "source_id": "ria_novosti", "source_name": "RIA Novosti (РИА)", "perspective": "russia_official", "language": "ru", "bias_note": "Agencia estatal rusa del conglomerado Rossiya Segodnya. Postura y partes de guerra oficiales del Kremlin.", "published": "2026-09-16T22:02:33+00:00", "category": "frente", "relevance_score": 15, "date_added": "2026-09-16", "title_es": "El Ministerio de Defensa recibió para su uso un tramo del río Oka", "text_es": "MOSCÚ, 17 de septiembre - RIA Novosti. El Ministerio de Defensa de Rusia recibió para uso separado un tramo del río Oka de 38 mil metros cuadrados con el fin de garantizar la defensa y la seguridad del país, se desprende de los documentos examinados por RIA Novosti.\n\nSegún los documentos, una parte del área de agua de Oka con una superficie de 38 mil metros cuadrados fue cedida por el Ministerio de Defensa de la Federación de Rusia por un período de 20 años para el uso separado del agua. El objetivo de los cambios es garantizar la defensa y la seguridad del Estado del país.\n\nCabe señalar que durante un período de veinte años, todas las estructuras y objetos ubicados en el sitio especificado deben mantenerse en buenas condiciones."}, {"id": "dea291923d3e", "title_original": "В Одессе прогремел новый взрыв", "text_original": "МОСКВА, 17 сен - РИА Новости. Взрыв снова прогремел в Одессе на фоне воздушной тревоги в Одесской области, сообщает украинский телеканал \"Общественное\".\n\nРанее телеканал уже сообщал о взрыве в городе.\n\n\"В Одессе прозвучал взрыв\", - говорится в Telegram-канале \"Общественного\".\n\nПо данным онлайн-карты украинского министерства цифровой трансформации, в части Одесской области звучит сигнал воздушной тревоги.", "link": "https://ria.ru/20260917/odessa-2118150792.html", "source_id": "ria_novosti", "source_name": "RIA Novosti (РИА)", "perspective": "russia_official", "language": "ru", "bias_note": "Agencia estatal rusa del conglomerado Rossiya Segodnya. Postura y partes de guerra oficiales del Kremlin.", "published": "2026-09-16T21:52:43+00:00", "category": "frente", "relevance_score": 17, "date_added": "2026-09-16", "title_es": "Se produjo una nueva explosión en Odessa.", "text_es": "MOSCÚ, 17 de septiembre - RIA Novosti. En Odessa se ha vuelto a producir una explosión en medio de una advertencia de ataque aéreo en la región de Odessa, informa el canal de televisión ucraniano \"Public\".\n\nAnteriormente, el canal de televisión ya informó sobre una explosión en la ciudad.\n\n“Se escuchó una explosión en Odesa”, informa el canal Telegram del Público.\n\nSegún el mapa en línea del Ministerio de Transformación Digital de Ucrania, suena una alarma de ataque aéreo en una parte de la región de Odessa."}, {"id": "6419f4f2d6d2", "title_original": "Рютте назвал «дозой адреналина» требования Трампа к НАТО", "text_original": "Требование президента США Дональда Трампа к союзникам по НАТО увеличить военные расходы стало необходимой «дозой адреналина», заявил генеральный секретарь блока Марк Рютте. По его словам, позиция Вашингтона придала европейским странам «новую решимость» повысить боеготовность альянса и выделить ресурсы, необходимые для укрепления обороноспособности.\n\n«Следует отдать должное президенту Трампу. Я знаю, что он сильно давил в вопросе оборонных расходов, но в конечном счете он прав. Нам была нужна эта доза адреналина»,— сказал господин Рютте на ежегодной лекции на мероприятии британского фонда Ditchley Foundation (цитата по Associated Press).\n\nСреди ключевых сфер для наращивания инвестиций господин Рютте выделил системы ПВО и ПРО, дальнобойное высокоточное оружие, беспилотные комплексы и разведку. Он также напомнил, что только в рамках саммита НАТО в июле страны-участницы анонсировали новые контракты на закупку вооружений на общую сумму более $50 млрд.", "link": "https://www.kommersant.ru/doc/8956593", "source_id": "kommersant", "source_name": "Kommersant (Коммерсантъ)", "perspective": "russia_official", "language": "ru", "bias_note": "Diario de referencia ruso sobre política exterior, sanciones, industria militar y economía de guerra.", "published": "2026-09-16T20:33:38+00:00", "category": "frente", "relevance_score": 23, "date_added": "2026-09-16", "title_es": "Rutte calificó las exigencias de Trump a la OTAN como una \"dosis de adrenalina\"", "text_es": "La exigencia del presidente estadounidense, Donald Trump, a los aliados de la OTAN de aumentar el gasto militar se ha convertido en una \"dosis de adrenalina\" necesaria, afirmó el secretario general del bloque, Mark Rutte. Según él, la posición de Washington ha dado a los países europeos \"una nueva determinación\" para aumentar la preparación combativa de la alianza y asignar los recursos necesarios para fortalecer sus capacidades de defensa.\n\n\"Hay que darle crédito al presidente Trump. Sé que ha estado presionando mucho en materia de gasto en defensa, pero en última instancia tiene razón. Necesitábamos esta dosis de adrenalina\", dijo Rutte en la conferencia anual en el evento de la Fundación Británica Ditchley (citado por Associated Press).\n\nEntre las áreas clave para aumentar la inversión, Rutte destacó los sistemas de defensa aérea y de defensa antimisiles, las armas de precisión de largo alcance, los sistemas no tripulados y el reconocimiento. Recordó también que sólo en el marco de la cumbre de la OTAN en julio los países participantes anunciaron nuevos contratos para la compra de armas por un total de más de 50 mil millones de dólares."}, {"id": "b00aec5c50c1", "title_original": "Рютте анонсировал «самую масштабную трансформацию» НАТО за десятилетия", "text_original": "Переход Североатлантического альянса к концепции «НАТО 3.0» станет самой масштабной трансформацией блока за последнее поколение, заявил генеральный секретарь Марк Рютте. Он призвал к увеличению инвестиций стран НАТО в дальнобойные высокоточные вооружения и системы противовоздушной обороны.\n\n«Теперь мы должны направить наш новый импульс в устойчивую трансформацию, которая станет движущей силой перемен»,— сказал Марк Рютте на мероприятии британского фонда Ditchley Foundation (трансляцию вел Reuters). Он подчеркнул, что на июльском саммите НАТО в Анкаре блок объявил о новых закупках вооружений на сумму более $50 млрд.\n\nУчастники НАТО планируют увеличить расходы на оборону до 5% ВВП к 2035 году. По словам Марка Рютте, сейчас европейские страны блока и Канада уже тратят на оборону около 4% ВВП.\n\nО планах блока по укреплению обороны — в материале «Ъ» «НАТО готовится к худшему».", "link": "https://www.kommersant.ru/doc/8956580", "source_id": "kommersant", "source_name": "Kommersant (Коммерсантъ)", "perspective": "russia_official", "language": "ru", "bias_note": "Diario de referencia ruso sobre política exterior, sanciones, industria militar y economía de guerra.", "published": "2026-09-16T19:07:59+00:00", "category": "frente", "relevance_score": 15, "date_added": "2026-09-16", "title_es": "Rutte anuncia la \"mayor transformación\" de la OTAN en décadas", "text_es": "La transición de la Alianza del Atlántico Norte al concepto de “OTAN 3.0” será la mayor transformación del bloque en la última generación, afirmó el secretario general Mark Rutte. Pidió una mayor inversión por parte de los países de la OTAN en armas de precisión de largo alcance y sistemas de defensa aérea.\n\n\"Ahora debemos canalizar nuestro nuevo impulso hacia una transformación sostenible que impulse el cambio\", dijo Mark Rutte en un evento de la Fundación Ditchley del Reino Unido (transmitido por Reuters). Destacó que en la cumbre de la OTAN en julio en Ankara, el bloque anunció nuevas compras de armas por valor de más de 50 mil millones de dólares.\n\nLos miembros de la OTAN planean aumentar el gasto en defensa al 5% del PIB para 2035. Según Mark Rutte, los países del bloque europeo y Canadá ya gastan alrededor del 4% del PIB en defensa.\n\nSobre los planes del bloque para fortalecer su defensa, véase el artículo de Kommersant “La OTAN se está preparando para lo peor”."}, {"id": "8aebc0cc8d66", "title_original": "Энергетики готовы защищать электростанции от БПЛА за счет оптовых потребителей", "text_original": "Среди актуальных вопросов энергетики — повышение безопасности и восстановление электростанций, для чего стоит зафиксировать необходимые средства и учесть затраты в надбавке на мощность. Это следует из презентации главы «Совета производителей энергии» Александры Паниной, представленной на конференции ассоциации. Новая мера, как поясняют источники “Ъ”, необходима для возмещения энергокомпаниям затрат на защиту электростанций от атак БПЛА. Знакомый с ходом обсуждения источник “Ъ” полагает, что ввод надбавки маловероятен и, вероятно, речь будет идти о подтверждении затрат на основе типовых решений. Кроме того, регуляторы обсуждают предоставление компенсаций для ремонта электростанциям, которые уже пострадали от ударов.\n\nВ «Совете рынка» сообщили “Ъ”, что понимают важность поднятого вопроса. Возможность и объем такой компенсации затрат, а также конкретные механизмы ее реализации сейчас обсуждаются рыночным сообществом. До завершения этой работы давать какие-либо оценки преждевременно, считают там. В Минэнерго не ответили на запрос “Ъ”.\n\nПодробнее об этом читайте в материале «Генераторы закрываются от БПЛА».", "link": "https://www.kommersant.ru/doc/8956556", "source_id": "kommersant", "source_name": "Kommersant (Коммерсантъ)", "perspective": "russia_official", "language": "ru", "bias_note": "Diario de referencia ruso sobre política exterior, sanciones, industria militar y economía de guerra.", "published": "2026-09-16T18:16:32+00:00", "category": "frente", "relevance_score": 13, "date_added": "2026-09-16", "title_es": "Los trabajadores de la energía están dispuestos a proteger las centrales eléctricas de los vehículos aéreos no tripulados a expensas de los consumidores mayoristas", "text_es": "Entre los problemas energéticos actuales se encuentra la mejora de la seguridad y la restauración de las centrales eléctricas, para lo cual conviene fijar los fondos necesarios y tener en cuenta los costes en la asignación de capacidad. Así se desprende de la presentación de la presidenta del Consejo de Productores de Energía, Alexandra Panina, en la conferencia de la asociación. La nueva medida, como explican fuentes de Kommersant, es necesaria para reembolsar a las empresas energéticas los costes de proteger las centrales eléctricas de los ataques de los vehículos aéreos no tripulados. Una fuente de Kommersant familiarizada con el debate cree que la introducción de un recargo es poco probable y, probablemente, se tratará de confirmar los costes basándose en soluciones estándar. Además, los reguladores están discutiendo la disposición.\n\nEl Consejo del Mercado dijo a Kommersant que comprenden la importancia de la cuestión planteada. La comunidad del mercado está actualmente discutiendo la posibilidad y el alcance de dicha compensación de costos, así como los mecanismos específicos para su implementación. Hasta que este trabajo esté terminado, es prematuro hacer valoraciones, opinan. El Ministerio de Energía no respondió a la solicitud de Kommersant.\n\nLea más sobre esto en el material \"Los generadores están protegidos contra los vehículos aéreos no tripulados\"."}, {"id": "62779fcc21dc", "title_original": "Похитители дорогих лекарств получили сроки от 8 до 17 с половиной лет", "text_original": "В Нагатинском суде столицы 16 сентября был оглашен приговор 15 фигурантам уголовного дела о преступном сообществе. Несмотря на то что в прениях гособвинением были запрошены весьма суровые сроки (от 9 лет до 17 лет и 6 месяцев), подсудимые, находившиеся под подпиской о невыезде либо под запретом определенных действий, были настроены в основном оптимистично. Не исключено, потому, что ущерб по делу, который в начале расследования оценивался в 200 млн руб., к началу процесса сократился до 6 млн руб.— суммы, которая была задокументирована при контрольных закупках оперативниками лекарств.\n\nПо материалам дела, организованное преступное сообщество (ОПС) действовало в Москве, Санкт-Петербурге, Крыму и Краснодарском крае с 2015 по 2022 год, а преступная схема была незамысловата. Входившие в преступное сообщество медицинские работники похищали в медучреждениях наиболее дорогостоящие препараты, а бизнесмены продавали их через свои фирмы, имевшие в том числе аптечные пункты.\n\nПо данным правоохранителей, лекарства были похищены в том числе в инфекционной клинической больнице №2, клинике имени братьев Бахрушиных, поликлиниках №8 и №214 столицы, Национальном медицинском исследовательском центре имени В. А. Алмазова в Санкт-Петербурге и других учреждениях. Больше всего махинаторов интересовали препараты для лечения онко- и других тяжелых заболеваний: противоопухолевые «Иматиниб», «Тасигна» и «Иресса»; «Арепливир» и «Коронавир» для лечения COVID-19; противовирусные «Калетра», «Пегасис», «Завицефта» и «Эвиплера». Стоимость одной упаковки некоторых из этих препаратов в то время достигала более 300 тыс. руб., а самых дешевых — несколько десятков тысяч.\n\nПодробнее о деле читайте в материале «Сроки выписали без рецепта».", "link": "https://www.kommersant.ru/doc/8956508", "source_id": "kommersant", "source_name": "Kommersant (Коммерсантъ)", "perspective": "russia_official", "language": "ru", "bias_note": "Diario de referencia ruso sobre política exterior, sanciones, industria militar y economía de guerra.", "published": "2026-09-16T17:08:16+00:00", "category": "frente", "relevance_score": 17, "date_added": "2026-09-16", "title_es": "Los ladrones de costosos medicamentos recibieron penas de entre 8 y 17 años y medio", "text_es": "El 16 de septiembre, en el tribunal Nagatinsky de la capital, se anunció la sentencia para 15 acusados ​​en la causa penal sobre comunidad criminal. A pesar de que en el debate la fiscalía pidió penas muy duras (de 9 años a 17 años y 6 meses), los acusados, que estaban bajo promesa de no abandonar el lugar o bajo prohibición de realizar determinadas acciones, se mostraron en general optimistas. Esto es posible porque los daños en el caso, que al comienzo de la investigación se estimaban en 200 millones de rublos, al comienzo del proceso se redujeron a 6 millones de rublos, cantidad que se documentó durante las compras de prueba de medicamentos por parte de los agentes.\n\nSegún los materiales del caso, una comunidad criminal organizada (OCC) operó en Moscú, San Petersburgo, Crimea y el territorio de Krasnodar de 2015 a 2022, y el plan criminal era simple. Los trabajadores médicos que formaban parte de la comunidad criminal robaban los medicamentos más caros de las instituciones médicas y los empresarios los vendían a través de sus empresas, que también tenían farmacias.\n\nSegún las autoridades, los medicamentos fueron robados, incluso en el Hospital Clínico de Enfermedades Infecciosas No. 2, la Clínica Hermanos Bakhrushin, las clínicas No. 8 y No. 214 de la capital, el Centro Nacional de Investigaciones Médicas V. A. Almazov en San Petersburgo y otras instituciones. Los conspiradores estaban más interesados ​​en medicamentos para el tratamiento del cáncer y otras enfermedades graves: los medicamentos antitumorales Imatinib, Tasigna e Iressa; \"Areplivir\" y \"Coronavir\" para el tratamiento de la COVID-19; antivirales \"Kaletra\", \"Pegasys\", \"Zavicefta\" y \"Eviplera\". El costo de un paquete de algunos de estos medicamentos en ese momento alcanzaba más de 300 mil rublos, y el más barato\n\nLea más sobre el caso en el material “Tiempos prescritos sin receta”."}, {"id": "10bca2d24aa1", "title_original": "Lithuanian president believes Russia deliberately allows drones to enter Baltic states", "text_original": "Lithuanian President Gitanas Nausėda believes drones entering his country or other Baltic states may be deliberately allowed to stray off course.\n\nSource: European Pravda citing LRT, Lithuania's national public service broadcaster\n\nDetails: Nausėda said drone incidents in Europe are another attempt by the Kremlin to punish countries that support Ukraine.\n\nQuote: \"Russia's behaviour is becoming increasingly aggressive. It is pointing more and more clearly to a certain trend. Unwilling to enter into direct confrontation with NATO, Russia is trying to target those countries that are among the strongest supporters of Ukraine.\"\n\nMore details: Nausėda said Russia could stage incidents in Europe in various ways, often covertly.\n\nQuote: \"Such incidents – like the drone recently shot down or other drone cases – are not necessarily a direct Russian attack on NATO. At this stage, the Russians are probably not ready for that and do not want it. But it could be deliberate – allowing a drone to stray off course and enter the territory not necessarily of Lithuania but of any Baltic state or Poland, in order to keep the public on edge. This is undoubtedly in Russia's interests.\"", "link": "https://www.pravda.com.ua/eng/news/2026/09/16/8053785/", "source_id": "ukrainska_pravda_en", "source_name": "Ukrainska Pravda (EN)", "perspective": "ukraine", "language": "en", "bias_note": "Uno de los periódicos más leídos e históricos de Ucrania (versión internacional en inglés).", "published": "2026-09-16T17:02:00+00:00", "category": "frente", "relevance_score": 19, "date_added": "2026-09-16", "title_es": "El presidente lituano cree que Rusia permite deliberadamente que los drones entren en los países bálticos", "text_es": "El presidente lituano, Gitanas Nausėda, cree que se puede permitir deliberadamente que los drones que ingresan a su país o a otros estados bálticos se desvíen de su rumbo.\n\nFuente: Pravda europea citando a LRT, la emisora ​​pública nacional de Lituania\n\nDetalles: Nausėda dijo que los incidentes con aviones no tripulados en Europa son otro intento del Kremlin de castigar a los países que apoyan a Ucrania.\n\nCita: \"El comportamiento de Rusia se está volviendo cada vez más agresivo. Señala cada vez más claramente una cierta tendencia. Rusia, que no está dispuesta a entrar en una confrontación directa con la OTAN, está tratando de atacar a aquellos países que se encuentran entre los más fuertes partidarios de Ucrania\".\n\nMás detalles: Nausėda dijo que Rusia podría organizar incidentes en Europa de varias maneras, a menudo de forma encubierta.\n\nCita: \"Este tipo de incidentes – como el reciente derribo del dron u otros casos de drones – no son necesariamente un ataque ruso directo a la OTAN. En esta etapa, los rusos probablemente no estén preparados para eso y no lo quieran. Pero podría ser deliberado: permitir que un dron se desvíe de su rumbo y entre en el territorio no necesariamente de Lituania sino de cualquier estado báltico o Polonia, para mantener al público en vilo. Esto sin duda redunda en interés de Rusia\"."}, {"id": "8f8a0edab338", "title_original": "Russian aggression kills one, injures nine in Kherson region – prosecutor's office", "text_original": "One man was killed and nine others were wounded in Kherson region as a result of enemy shelling as of 17:30 on Wednesday, the regional prosecutor's office said.\n\n\"According to the investigation, on September 16, 2026, the Russian Federation's army once again attacked settlements in Kherson region with artillery and various types of drones. As of 17:30, it was reported that one person had been killed and nine others wounded as a result of the Russian aggression,\" the statement reads.\n\nAccording to the office, at around 06:00, the occupiers dropped explosives from a UAV in Kherson – a 68-year-old man who was on the street sustained fatal injuries. Two people each were injured by enemy drones in Komyshany and Zelenivka, and another five in Kherson. Private homes, apartment buildings, administrative buildings, a hospital, a store, garages, and vehicles were damaged.", "link": "https://en.interfax.com.ua/news/general/1205553.html", "source_id": "interfax_ukraine", "source_name": "Interfax-Ucrania", "perspective": "ukraine", "language": "en", "bias_note": "Agencia de noticias ucraniana de referencia para despachos militares y declaraciones gubernamentales.", "published": "2026-09-16T16:50:59+00:00", "category": "drones", "relevance_score": 25, "date_added": "2026-09-16", "title_es": "La agresión rusa mata a una persona y hiere a nueve en la región de Kherson: Fiscalía", "text_es": "Un hombre murió y otros nueve resultaron heridos en la región de Jersón como resultado del bombardeo enemigo a las 17:30 del miércoles, informó la fiscalía regional.\n\n\"Según la investigación, el 16 de septiembre de 2026, el ejército de la Federación Rusa atacó una vez más asentamientos en la región de Jersón con artillería y diversos tipos de drones. A las 17:30 se informó que una persona había muerto y otras nueve habían resultado heridas como resultado de la agresión rusa\", se lee en el comunicado.\n\nSegún la oficina, alrededor de las 6:00 horas los ocupantes arrojaron explosivos desde un vehículo aéreo no tripulado en Jersón; un hombre de 68 años que se encontraba en la calle resultó herido mortal. Dos personas resultaron heridas cada una por drones enemigos en Komyshany y Zelenivka, y otras cinco en Kherson. Casas privadas, edificios de apartamentos, edificios administrativos, un hospital, una tienda, garajes y vehículos resultaron dañados."}, {"id": "5b957539a4f7", "title_original": "Third Army Corps: 36,000 strike missions carried out during first phase of Vivaldi operation", "text_original": "During the first phase of operation \"Vivaldi,\" units of the Third Army Corps carried out 36,000 strike missions, including against field fuel depots in Luhansk region, forcing the enemy to disperse its depots into forests and onto Russian territory, which, in turn, slowed down supplies to the front lines, the press service of the Third Army Corps said.\n\n\"Systematic strikes on field fuel depots in the Luhansk region were a key factor in the success of operation \"Vivaldi.\" According to Brigadier General Andriy Biletsky, the enemy was forced to reroute the supply of fuel and lubricants to Voronezh region, beyond Ukraine's state border,\" the press service's statement reads, which was received by Interfax-Ukraine agency on Wednesday.\n\nIt is noted that thanks to the successful actions of unmanned aerial vehicle units and precision strikes, the enemy was forced to shut down the pipeline through which it had been supplying fuel from Russia to the occupied Luhansk region, after which, with the pipeline out of commission, fuel tankers were forced to travel to Voronezh region. The distance required to evacuate this division's equipment increased by approximately 250 kilometers. The corps achieved this result through regular strikes on enemy field fuel and ammunition depots, communications nodes, command posts, and vehicles carrying fuel and provisions.\n\nIt is reported that during Vivaldi operation, the Third Army Corps destroyed enemy logistics in two stages: In the first stage, strike drones isolated a strip up to 50 kilometers from the front line; in the second stage, the zone was expanded to 120 kilometers from the front line. At the same time, the corps' UAVs struck priority targets in key logistical settlements in the occupied territories.\n\nDuring the first phase of the operation, the Third Corps' drone units carried out 36,000 strike missions.\n\nThe corps notes that the reduction in fuel supplies directly to frontline units limits the use of enemy UAVs and electronic warfare systems, which, in turn, increases the effectiveness of high-precision weapons and UAVs within the corps' area of responsibility.", "link": "https://en.interfax.com.ua/news/general/1205549.html", "source_id": "interfax_ukraine", "source_name": "Interfax-Ucrania", "perspective": "ukraine", "language": "en", "bias_note": "Agencia de noticias ucraniana de referencia para despachos militares y declaraciones gubernamentales.", "published": "2026-09-16T16:42:12+00:00", "category": "frente", "relevance_score": 35, "date_added": "2026-09-16", "title_es": "Tercer Cuerpo de Ejército: 36.000 misiones de ataque realizadas durante la primera fase de la operación Vivaldi", "text_es": "Durante la primera fase de la operación \"Vivaldi\", las unidades del Tercer Cuerpo de Ejército llevaron a cabo 36.000 misiones de ataque, incluso contra depósitos de combustible en la región de Lugansk, lo que obligó al enemigo a dispersar sus depósitos en los bosques y en territorio ruso, lo que, a su vez, ralentizó el suministro a las líneas del frente, informó el servicio de prensa del Tercer Cuerpo de Ejército.\n\n\"Los ataques sistemáticos a los depósitos de combustible en la región de Lugansk fueron un factor clave para el éxito de la operación \"Vivaldi\". Según el general de brigada Andriy Biletsky, el enemigo se vio obligado a desviar el suministro de combustible y lubricantes a la región de Vorónezh, más allá de la frontera estatal de Ucrania\", se lee en un comunicado del servicio de prensa recibido el miércoles por la agencia Interfax-Ucrania.\n\nSe observa que gracias a las acciones exitosas de las unidades de vehículos aéreos no tripulados y a los ataques de precisión, el enemigo se vio obligado a cerrar el oleoducto a través del cual suministraba combustible desde Rusia a la región ocupada de Lugansk, después de lo cual, con el oleoducto fuera de servicio, los camiones cisterna se vieron obligados a viajar a la región de Vorónezh. La distancia necesaria para evacuar el equipamiento de esta división aumentó en aproximadamente 250 kilómetros. El cuerpo logró este resultado mediante ataques regulares a los depósitos de combustible y municiones del enemigo, nodos de comunicaciones, puestos de mando y vehículos que transportaban combustible y provisiones.\n\nSe informa que durante la operación Vivaldi, el Tercer Cuerpo de Ejército destruyó la logística enemiga en dos etapas: en la primera etapa, los drones de ataque aislaron una franja de hasta 50 kilómetros de la línea del frente; En la segunda etapa, la zona se amplió a 120 kilómetros desde la línea del frente. Al mismo tiempo, los vehículos aéreos no tripulados del cuerpo atacaron objetivos prioritarios en asentamientos logísticos clave en los territorios ocupados.\n\nDurante la primera fase de la operación, las unidades de drones del Tercer Cuerpo llevaron a cabo 36.000 misiones de ataque.\n\nEl cuerpo señala que la reducción del suministro de combustible directamente a las unidades de primera línea limita el uso de vehículos aéreos no tripulados y sistemas de guerra electrónica enemigos, lo que, a su vez, aumenta la eficacia de las armas de alta precisión y vehículos aéreos no tripulados dentro del área de responsabilidad del cuerpo."}, {"id": "bd80570ffa8e", "title_original": "Найденный у берегов Польши российский БПЛА был оснащен взрывчаткой", "text_original": "Российский беспилотник, обнаруженный у берегов Польши и извлеченный из Балтийского моря, содержал осколочно-фугасную боевую часть со взрывателем. Об этом в среду, 16 сентября, сообщил представитель прокуратуры в Познани, ведущей расследование. Военным саперам удалось отделить боевую часть БПЛА и обезвредить ее прямо на пляже.\n\nПо данным польской прокуратуры, речь идет о беспилотнике типа \"Гербера-2\", который производится в России. Его нашли 14 сентября рядом с курортным поселком Русиново в Западно-Поморском воеводстве. Ведется расследование по подозрению в создании угрозы \"жизни и здоровью большого числа людей, а также имуществу, представляющему большую ценность\", заявили в прокуратуре.\n\nМинистр обороны Польши Владислав Косиняк-Камыш отметил, что обнаруженный у польского побережья дрон, вероятно, ранее пролетел над Литвой. После попыток его нейтрализовать он пересек границу с Калининградской областью, а затем, предположительно, выполнял задачи над Балтийским морем.\n\nПольские власти проверяют возможную связь этой находки с инцидентом в соседней Литве. В ночь на 15 сентября российский ударный беспилотник вторгся в воздушное пространство Литвы и был сбит. По данным литовского Минобороны, он также был оснащен взрывчаткой. Президент Литвы Гитанас Науседа заявил 16 сентября после заседания Государственного совета обороны, что этот БПЛА также оказался российским дроном типа \"Гербера\", который должен был атаковать Украину, но отклонился от курса под воздействием украинских средств РЭБ.\n\nПо словам главы польского Минобороны, Варшава и Вильнюс совместно выясняют обстоятельства обоих инцидентов. 13 сентября РФ также нанесла удары возле границы Украины с Польшей, в том числе по локомотиву пассажирского поезда Киев-Варшава.\n\nЗа последние недели была зафиксирована масштабная волна диверсий сразу в нескольких европейских странах. Так, 4 августа в аэропорту Лейпцига произошла попытка атаки на украинский грузовой самолет Ан-124, против которого были задействованы сразу несколько дронов, однако ни один БПЛА в итоге не взорвался.", "link": "https://www.dw.com/ru/найденный-у-берегов-польши-российский-бпла-был-оснащен-взрывчаткой/a-79295296?maca=rus-rss-ru-all-1126-xml-mrss", "source_id": "dw_russian", "source_name": "Deutsche Welle (DW Ruso)", "perspective": "international", "language": "ru", "bias_note": "Radiodifusora pública internacional de Alemania con análisis exhaustivo del conflicto para la audiencia rusoparlante.", "published": "2026-09-16T15:55:00+00:00", "category": "frente", "relevance_score": 23, "date_added": "2026-09-16", "title_es": "El UAV ruso encontrado frente a las costas de Polonia estaba equipado con explosivos", "text_es": "Un dron ruso descubierto frente a la costa de Polonia y recuperado del Mar Báltico contenía una ojiva de fragmentación altamente explosiva con una mecha. Así lo anunció el miércoles 16 de septiembre el representante de la fiscalía de Poznan, que dirige la investigación. Los zapadores militares lograron separar la ojiva del UAV y neutralizarla en la misma playa.\n\nSegún la fiscalía polaca, estamos hablando de un dron del tipo Gerbera-2, producido en Rusia. Fue encontrado el 14 de septiembre cerca de la localidad turística de Rusinovo, en el Voivodato de Pomerania Occidental. Se está llevando a cabo una investigación bajo sospecha de crear una amenaza a \"la vida y la salud de un gran número de personas, así como a bienes de gran valor\", dijo la fiscalía.\n\nEl ministro de Defensa polaco, Wladyslaw Kosiniak-Kamysh, señaló que el dron descubierto frente a la costa polaca probablemente había sobrevolado Lituania anteriormente. Después de intentar neutralizarlo, cruzó la frontera hacia la región de Kaliningrado y luego supuestamente llevó a cabo misiones sobre el Mar Báltico.\n\nLas autoridades polacas están comprobando la posible conexión de este hallazgo con un incidente ocurrido en la vecina Lituania. La noche del 15 de septiembre, un dron de ataque ruso invadió el espacio aéreo lituano y fue derribado. Según el Ministerio de Defensa lituano, también estaba equipado con explosivos. El presidente lituano, Gitanas Nausėda, dijo el 16 de septiembre después de una reunión del Consejo de Defensa del Estado que este UAV también resultó ser un dron ruso tipo Gerbera, que se suponía que atacaría a Ucrania, pero se desvió de su rumbo bajo la influencia de los sistemas de guerra electrónica ucranianos.\n\nSegún el jefe del Ministerio de Defensa polaco, Varsovia y Vilna están aclarando conjuntamente las circunstancias de ambos incidentes. El 13 de septiembre, la Federación de Rusia también llevó a cabo ataques cerca de la frontera de Ucrania con Polonia, incluida la locomotora del tren de pasajeros Kiev-Varsovia.\n\nEn las últimas semanas se ha registrado una ola de sabotaje a gran escala en varios países europeos. Así, el 4 de agosto, en el aeropuerto de Leipzig, se produjo un intento de ataque a un avión de carga ucraniano An-124, contra el que se utilizaron varios drones a la vez, pero ni un solo UAV explotó."}, {"id": "0301d2fdd285", "title_original": "Ukraine's human rights commissioner: As Russia stalls on evacuation from occupied Oleshky, people are walking through mined fields to try to escape", "text_original": "Ukrainian Parliamentary Human Rights Commissioner Dmytro Lubinets has said that after a considerable time, Russia has failed to confirm that it is prepared to organise a humanitarian mission to evacuate civilians from Oleshky, a settlement in the grey zone on the left bank of the Dnipro River near Kherson.\n\nQuote from Lubinets: \"Following the negotiations, the Russian side has failed to confirm for a long time now that it is prepared to carry out a humanitarian mission to evacuate people.\n\nBut our Office continues to collect and verify information, and to work together with the International Committee of the Red Cross, international organisations and the relevant Ukrainian state agencies.\n\nWe also continue to insist that the Russian side urgently evacuate the people who are effectively trapped in the grey zone. These are civilians who face the daily threat of attacks and drone strikes and have been left without food, drinking water, medicines and other essentials.\"\n\nDetails: Lubinets said agreements were reached earlier with the Russian side and clear procedures have been established. A list of the people to be evacuated has also been agreed on.\n\nQuote: \"We have done the necessary work with the security and defence forces to ensure a ceasefire during the humanitarian mission.\"", "link": "https://www.pravda.com.ua/eng/news/2026/09/16/8053772/", "source_id": "ukrainska_pravda_en", "source_name": "Ukrainska Pravda (EN)", "perspective": "ukraine", "language": "en", "bias_note": "Uno de los periódicos más leídos e históricos de Ucrania (versión internacional en inglés).", "published": "2026-09-16T15:51:00+00:00", "category": "drones", "relevance_score": 31, "date_added": "2026-09-16", "title_es": "Comisionado de derechos humanos de Ucrania: Mientras Rusia retrasa la evacuación de la ocupada Oleshky, la gente camina por campos minados para intentar escapar", "text_es": "El Comisionado de Derechos Humanos del Parlamento ucraniano, Dmytro Lubinets, ha dicho que después de un tiempo considerable, Rusia no ha podido confirmar que está preparada para organizar una misión humanitaria para evacuar a los civiles de Oleshky, un asentamiento en la zona gris de la margen izquierda del río Dniéper, cerca de Kherson.\n\nCita de Lubinets: \"Después de las negociaciones, la parte rusa no ha podido confirmar desde hace mucho tiempo que está dispuesta a llevar a cabo una misión humanitaria para evacuar a las personas.\n\nPero nuestra Oficina sigue recopilando y verificando información y trabajando junto con el Comité Internacional de la Cruz Roja, organizaciones internacionales y los organismos estatales ucranianos pertinentes.\n\nTambién seguimos insistiendo en que la parte rusa evacue urgentemente a las personas que están efectivamente atrapadas en la zona gris. Se trata de civiles que se enfrentan a la amenaza diaria de ataques y ataques con drones y se han quedado sin alimentos, agua potable, medicinas y otros artículos de primera necesidad\".\n\nDetalles: Lubinets dijo que se alcanzaron acuerdos anteriormente con la parte rusa y se han establecido procedimientos claros. También se ha acordado una lista de las personas que serán evacuadas.\n\nCita: \"Hemos realizado el trabajo necesario con las fuerzas de seguridad y defensa para garantizar un alto el fuego durante la misión humanitaria\"."}, {"id": "15c00ef75dc2", "title_original": "Путин: избирательная кампания в Госдуму проходит в условиях СВО", "text_original": "Президент России Владимир Путин обратился к гражданам по случаю выборов в Госдуму. Он напомнил, что «столь масштабная» избирательная кампания проводится в условиях специальной военной операции.\n\n«Считаю важным обратиться к вам сейчас, когда в нашей большой стране проходит значимая, во многом определяющая избирательная кампания», — отметил глава государства. Он напомнил, что жители ДНР, ЛНР, Запорожской и Харьковской областей впервые поучаствуют в российских парламентских выборах.\n\nПрезидент заявил, что выборы состоятся «в строгом соответствии с законом и в установленные сроки». По его словам, победу одержат «самые достойные». «Те, кто не подведет, кто делом доказал преданность Родине», — отметил Владимир Путин. Он попросил обязательно прийти и «реализовать свое конституционное право».\n\nС 18 по 20 сентября пройдут выборы в Госдуму. По общефедеральному и одномандатным округам зарегистрированы 4,4 тыс. кандидатов. В единый день голосования назначено более 2 тыс. избирательных кампаний разных уровней.", "link": "https://www.kommersant.ru/doc/8956427", "source_id": "kommersant", "source_name": "Kommersant (Коммерсантъ)", "perspective": "russia_official", "language": "ru", "bias_note": "Diario de referencia ruso sobre política exterior, sanciones, industria militar y economía de guerra.", "published": "2026-09-16T15:36:30+00:00", "category": "frente", "relevance_score": 23, "date_added": "2026-09-16", "title_es": "Putin: la campaña electoral a la Duma Estatal se desarrolla en las condiciones del Distrito Militar del Norte", "text_es": "El presidente ruso, Vladimir Putin, se dirigió a los ciudadanos con motivo de las elecciones a la Duma Estatal. Recordó que una campaña electoral “de tan gran escala” se lleva a cabo en el marco de una operación militar especial.\n\n“Considero importante contactar con usted ahora que en nuestro gran país se está desarrollando una campaña electoral importante y decisiva”, señaló el Jefe de Estado. Recordó que por primera vez los habitantes de las regiones de la RPD, la RPL, Zaporozhye y Jarkov participarán en las elecciones parlamentarias rusas.\n\nEl presidente dijo que las elecciones se celebrarían \"en estricto cumplimiento de la ley y en el plazo previsto\". Según él, ganarán “los más dignos”. \"Aquellos que no os defraudarán, que han demostrado con hechos su devoción a la Patria\", señaló Vladimir Putin. Pidió asegurarse de venir y “ejercer su derecho constitucional”.\n\nLas elecciones a la Duma estatal se celebrarán del 18 al 20 de septiembre. En las circunscripciones federales y de mandato único están inscritos 4,4 mil candidatos. En un solo día de votación están previstas más de 2.000 campañas electorales de distintos niveles."}, {"id": "162c3b4cdf8d", "title_original": "Палата представителей Конгресса США проголосовала за прекращение иранской войны", "text_original": "Палата представителей Конгресса США по инициативе демократов в третий раз приняла резолюцию с требованием о прекращении военных действий против Ирана. Она была принята 220 голосами против 204, причем за высказались семь республиканцев. Законодательная инициатива последовала после того, как был опубликован отчет Бюджетного управления Конгресса США, согласно которому военные действия против Ирана обошлись американским налогоплательщикам в $38 млрд. Резолюция не имеет обязательной силы и не остановит военные действия, однако может оказать существенное влияние на партийную борьбу в преддверии промежуточных выборов в Конгресс.\n\nПринятая 15 сентября резолюция — не столько юридический запрет на проведение военной операции против Ирана, сколько элемент политической борьбы в преддверии ноябрьских выборов в Конгресс. Поводом для нового законодательного акта стал подробный отчет Бюджетного управления Конгресса, в котором говорится, что с 28 февраля по 1 августа этого года на иранскую войну было потрачено $38,1 млрд из бюджета, то есть из денег американских налогоплательщиков, которые и так возмущаются из-за возросших цен на бензин.\n\nКак заявил член Комитета по иностранным делам палаты представителей демократ Грегори Микс во время дебатов по резолюции, «президент не монарх, и, если втягивает страну в затяжную кампанию и требует миллиардных ассигнований, он обязан прийти в Конгресс и доказать избирателям, почему их налоги должны сгорать на Ближнем Востоке».\n\nПосле публикации отчета Бюджетного управления тема становится еще более острой. В документе проводится оценка стоимости военной операции США «Эпическая ярость» в Иране. В нем говорится, что основными статьями расходов на иранскую кампанию стали восполнение арсенала боеприпасов и эксплуатационные затраты. Особо отмечается, что конфликт вызвал критическое истощение американских систем ПВО.\n\nПодробнее — в материале «Ъ» «Иранской кампании выставили счет».", "link": "https://www.kommersant.ru/doc/8956405", "source_id": "kommersant", "source_name": "Kommersant (Коммерсантъ)", "perspective": "russia_official", "language": "ru", "bias_note": "Diario de referencia ruso sobre política exterior, sanciones, industria militar y economía de guerra.", "published": "2026-09-16T15:23:50+00:00", "category": "drones", "relevance_score": 13, "date_added": "2026-09-16", "title_es": "La Cámara de Representantes de Estados Unidos votó a favor de poner fin a la guerra iraní", "text_es": "La Cámara de Representantes de Estados Unidos, por iniciativa de los demócratas, adoptó por tercera vez una resolución exigiendo el fin de las acciones militares contra Irán. Fue aprobada por 220 votos contra 204, con siete republicanos a favor. La legislación se produce después de que un informe de la Oficina de Presupuesto del Congreso descubriera que la acción militar contra Irán ha costado a los contribuyentes estadounidenses 38 mil millones de dólares. La resolución no es vinculante y no detendrá la acción militar, pero podría tener un impacto significativo en las batallas partidistas antes de las elecciones legislativas de mitad de período.\n\nLa resolución adoptada el 15 de septiembre no es tanto una prohibición legal de las operaciones militares contra Irán, sino más bien un elemento de la lucha política antes de las elecciones al Congreso de noviembre. El motivo de la nueva legislación fue un informe detallado de la Oficina de Presupuesto del Congreso, que afirma que del 28 de febrero al 1 de agosto de este año se gastaron 38,1 mil millones de dólares en la guerra contra Irán del presupuesto, es decir, del dinero de los contribuyentes estadounidenses, que ya están indignados por el aumento de los precios de la gasolina.\n\nComo dijo el demócrata Gregory Meeks, miembro del Comité de Asuntos Exteriores de la Cámara de Representantes, durante el debate sobre la resolución, “el presidente no es un monarca, y si arrastra al país a una campaña prolongada y exige miles de millones en asignaciones, tiene la obligación de venir al Congreso y demostrar a los votantes por qué se deben quemar sus impuestos en Medio Oriente”.\n\nCon la publicación del informe de la Oficina de Presupuesto, la cuestión se vuelve aún más apremiante. El documento estima el coste de la operación militar estadounidense Epic Fury en Irán. Dijo que los principales costos de la campaña iraní fueron la reposición del arsenal de municiones y los costos operativos. Cabe señalar especialmente que el conflicto provocó un agotamiento crítico de los sistemas de defensa aérea estadounidenses.\n\nPara más detalles, consulte el artículo de Kommersant “La campaña iraní fue facturada”."}, {"id": "fec924404f48", "title_original": "Жданова назвала \"дроновую истерию\" в ФРГ большой ошибкой", "text_original": "ВЕНА, 16 сен - РИА Новости. Действия зачинщиков \"дроновой истерии\" в ФРГ являются большой политической ошибкой и сознательным выбором в пользу эскалации военно-политической обстановки в Европе, заявила глава делегации РФ в Вене Юлия Жданова.\n\n\"Действия зачинщиков \"дроновой истерии\" - не что иное, как большая политическая ошибка и сознательный выбор в пользу эскалации военно-политической обстановки в Европе\", - сказала Жданова на 1145-м пленарном заседании Форума ОБСЕ по сотрудничеству в области безопасности.\n\nЗаседание закрыто для прессы. Текст выступления российской делегации есть в распоряжении РИА Новости.\n\nПолиция Лейпцига сообщила 5 августа, что сотрудник аэропорта города обнаружил БПЛА со взрывчаткой в зоне безопасности грузовых авиаперевозок. Германия возложила ответственность на Россию, не приведя этому конкретных доказательств. Москва назвала инцидент наспех состряпанной провокацией.\n\nПрезидент России Владимир Путин заявил об отсутствии у Германии доказательств угроз со стороны РФ и связал обвинения в адрес Москвы в инциденте с дроном в Лейпциге с тяжелым внутриполитическим положением в ФРГ.", "link": "https://ria.ru/20260916/frg-2118105701.html", "source_id": "ria_novosti", "source_name": "RIA Novosti (РИА)", "perspective": "russia_official", "language": "ru", "bias_note": "Agencia estatal rusa del conglomerado Rossiya Segodnya. Postura y partes de guerra oficiales del Kremlin.", "published": "2026-09-16T15:15:38+00:00", "category": "drones", "relevance_score": 19, "date_added": "2026-09-16", "title_es": "Zhdanova calificó la \"histeria de los drones\" en Alemania como un gran error", "text_es": "VIENA, 16 de septiembre - RIA Novosti. Las acciones de los instigadores de la \"histeria de los drones\" en Alemania son un gran error político y una elección consciente a favor de la escalada de la situación político-militar en Europa, afirmó la jefa de la delegación rusa en Viena, Yulia Zhdanova.\n\n\"Las acciones de los instigadores de la 'histeria de los drones' no son más que un gran error político y una elección consciente a favor de una escalada de la situación político-militar en Europa\", dijo Zhdanova en la 1145ª sesión plenaria del Foro de Cooperación en Seguridad de la OSCE.\n\nLa reunión está cerrada a la prensa. El texto del discurso de la delegación rusa está a disposición de RIA Novosti.\n\nLa policía de Leipzig informó el 5 de agosto que un empleado del aeropuerto de la ciudad descubrió un vehículo aéreo no tripulado con explosivos en la zona de seguridad de carga aérea. Alemania culpó a Rusia sin aportar pruebas concretas. Moscú calificó el incidente como una provocación inventada apresuradamente.\n\nEl presidente ruso, Vladimir Putin, afirmó que Alemania no tiene pruebas de amenazas por parte de la Federación Rusa y vinculó las acusaciones contra Moscú en el incidente del dron en Leipzig con la difícil situación política interna en Alemania."}, {"id": "a5dc3101356a", "title_original": "Lubinets: Russia blocks evacuation from Oleshky, trapping over 6,000 civilians", "text_original": "The Russian side has effectively blocked the continuation of humanitarian evacuation work for civilians from the city of Oleshky in the temporarily occupied part of the Kherson region, which currently remains in a gray zone with a constant risk of shelling, without food, drinking water, and medicine, Verkhovna Rada Commissioner for Human Rights (Ombudsman) Dmytro Lubinets has reported.\n\n\"After long-standing negotiations, the Russian side is still not confirming its readiness to carry out a humanitarian mission to evacuate people... We continue to insist to the Russian side on the urgent evacuation of people who actually remain in the gray zone. These are civilians who are daily under the threat of shelling and drone attacks, remaining without food, drinking water, medicine, and other necessary assistance,\" he wrote on Telegram on Wednesday.\n\n\"These people must be saved. The city has turned into a deadly trap,\" the Ombudsman emphasized.\n\nAccording to Lubinets, the Ombudsman's Office continues to collect and verify information, as well as maintain communication with the International Committee of the Red Cross (ICRC), international organizations, and relevant state bodies of Ukraine.\n\nHe stated that the Ukrainian side has fully prepared the humanitarian mission: it secured the support of the ICRC, which confirmed its readiness to participate in the evacuation in accordance with its mandate; agreed on a ceasefire regime; and the Security and Defense Forces of Ukraine carried out the necessary work for the safe passage of the mission. In addition, the UN and the ICRC Headquarters in Geneva were officially notified of the critical situation several months ago.\n\nAccording to preliminary estimates, more than 6,000 people, including about 200 children, currently remain in Oleshky and the surrounding area. There have been 176 official appeals regarding the humanitarian situation, and 358 people who need immediate evacuation have already been verified.", "link": "https://en.interfax.com.ua/news/general/1205493.html", "source_id": "interfax_ukraine", "source_name": "Interfax-Ucrania", "perspective": "ukraine", "language": "en", "bias_note": "Agencia de noticias ucraniana de referencia para despachos militares y declaraciones gubernamentales.", "published": "2026-09-16T15:15:22+00:00", "category": "drones", "relevance_score": 31, "date_added": "2026-09-16", "title_es": "Lubinets: Rusia bloquea la evacuación de Oleshky, atrapando a más de 6.000 civiles", "text_es": "La parte rusa ha bloqueado efectivamente la continuación de los trabajos de evacuación humanitaria de civiles de la ciudad de Oleshky en la parte temporalmente ocupada de la región de Kherson, que actualmente permanece en una zona gris con un riesgo constante de bombardeos, sin alimentos, agua potable y medicinas, informó el Comisionado de Derechos Humanos (Defensor del Pueblo) de la Verjovna Rada, Dmytro Lubinets.\n\n\"Después de largas negociaciones, la parte rusa todavía no confirma su disposición a llevar a cabo una misión humanitaria para evacuar a las personas... Seguimos insistiendo a la parte rusa en la evacuación urgente de las personas que en realidad permanecen en la zona gris. Se trata de civiles que están diariamente bajo la amenaza de bombardeos y ataques con drones, que se quedan sin alimentos, agua potable, medicinas y otra asistencia necesaria\", escribió en Telegram el miércoles.\n\n\"Hay que salvar a estas personas. La ciudad se ha convertido en una trampa mortal\", subrayó el Defensor del Pueblo.\n\nSegún Lubinets, la Oficina del Defensor del Pueblo continúa recopilando y verificando información, además de mantener comunicación con el Comité Internacional de la Cruz Roja (CICR), organizaciones internacionales y órganos estatales pertinentes de Ucrania.\n\nDeclaró que la parte ucraniana preparó plenamente la misión humanitaria: obtuvo el apoyo del CICR, que confirmó su disposición a participar en la evacuación de conformidad con su mandato; acordaron un régimen de alto el fuego; y las Fuerzas de Seguridad y Defensa de Ucrania llevaron a cabo los trabajos necesarios para el paso seguro de la misión. Además, la situación crítica fue notificada oficialmente a las Naciones Unidas y a la sede del CICR en Ginebra hace varios meses.\n\nSegún estimaciones preliminares, más de 6.000 personas, entre ellas unos 200 niños, permanecen actualmente en Oleshky y sus alrededores. Ha habido 176 llamamientos oficiales sobre la situación humanitaria y ya se han verificado 358 personas que necesitan una evacuación inmediata."}, {"id": "ce81151547e0", "title_original": "ВС России поразили контейнеровоз в Черноморске", "text_original": "МОСКВА, 16 сен - РИА Новости. Вооруженные силы РФ поразили в порту \"Черноморск\" контейнеровоз с грузами для обеспечения ВСУ, сообщило в среду Минобороны России.\n\nВ течение дня Вооруженные силы Российской Федерации продолжили нанесение ударов беспилотными летательными аппаратами по портам Украины и морским судам, используемым в интересах ВСУ.\n\n\"В результате ударов в порту \"Черноморск\" поражен \"контейнеровоз\", доставивший грузы, предназначенные для обеспечения ВСУ\", - говорится в сообщении.", "link": "https://ria.ru/20260916/rossiya-2118105378.html", "source_id": "ria_novosti", "source_name": "RIA Novosti (РИА)", "perspective": "russia_official", "language": "ru", "bias_note": "Agencia estatal rusa del conglomerado Rossiya Segodnya. Postura y partes de guerra oficiales del Kremlin.", "published": "2026-09-16T15:12:31+00:00", "category": "frente", "relevance_score": 15, "date_added": "2026-09-16", "title_es": "Las fuerzas armadas rusas atacaron un buque portacontenedores en Chernomorsk", "text_es": "MOSCÚ, 16 de septiembre - RIA Novosti. Las Fuerzas Armadas rusas atacaron un buque portacontenedores con carga para abastecer a las Fuerzas Armadas de Ucrania en el puerto de Chernomorsk, informó este miércoles el Ministerio de Defensa ruso.\n\nDurante el día las Fuerzas Armadas de la Federación de Rusia continuaron realizando ataques con vehículos aéreos no tripulados contra puertos y buques marítimos ucranianos utilizados en interés de las Fuerzas Armadas de Ucrania.\n\n\"Como resultado de los ataques en el puerto de Chernomorsk, un buque portacontenedores que transportaba carga destinada a abastecer a las Fuerzas Armadas de Ucrania fue alcanzado\", dice el informe."}, {"id": "414eab98b118", "title_original": "Генсек ООН высказался о свободе судоходства на Ближнем Востоке", "text_original": "ООН, 16 сен - РИА Новости. Генеральный секретарь ООН Антониу Гутерреш в среду потребовал обеспечить свободу судоходства в Ормузском и Баб-эль-Мандебском проливах.\n\n\"Права и свободы судоходства в Ормузском и Баб-эль-Мандебском проливах и вокруг них должны быть полностью восстановлены и соблюдаться всеми в соответствии с международным правом. Единственный путь вперед - это деэскалация, дипломатия и диалог. Я буду продолжать настаивать на этом в своих продолжающихся контактах с лидерами\", - сказал Гутерреш в ходе пресс-конференции в ООН.", "link": "https://ria.ru/20260916/oon-2118105241.html", "source_id": "ria_novosti", "source_name": "RIA Novosti (РИА)", "perspective": "russia_official", "language": "ru", "bias_note": "Agencia estatal rusa del conglomerado Rossiya Segodnya. Postura y partes de guerra oficiales del Kremlin.", "published": "2026-09-16T15:12:29+00:00", "category": "frente", "relevance_score": 15, "date_added": "2026-09-16", "title_es": "El Secretario General de la ONU se pronuncia sobre la libertad de navegación en Medio Oriente", "text_es": "ONU, 16 de septiembre - RIA Novosti. El secretario general de la ONU, Antonio Guterres, exigió el miércoles libertad de navegación en los estrechos de Ormuz y Bab el-Mandeb.\n\n\"Los derechos y libertades de navegación en los estrechos de Ormuz y Bab el-Mandeb y sus alrededores deben ser plenamente restaurados y respetados por todos de conformidad con el derecho internacional. La única manera de avanzar es la reducción de las tensiones, la diplomacia y el diálogo. Seguiré insistiendo en este punto en mis contactos actuales con los líderes\", dijo Guterres durante una conferencia de prensa en la ONU."}, {"id": "8e2dc410875b", "title_original": "Выбор россиян покажет сплоченность народа, заявил Путин", "text_original": "МОСКВА, 16 сен - РИА Новости. Выбор россиян покажет, что за бойцами миллионы людей, что россияне - сплоченный народ с общими ценностями, исторической памятью, любовью к Родине, который не удастся расколоть и запугать, заявил президент России Владимир Путин.\n\nПутин обратился к гражданам России перед выборами в Госдуму.\n\n\"Ваш выбор и воля вновь покажут, что за нашими бойцами миллионы людей, что мы сплоченный народ, объединенный общими ценностями, исторической памятью, любовью к Родине, что никому не удастся расколоть и запугать нас, подорвать нашу государственность и общественно-политическую систему\", - сказал Путин.\n\nВыборы депутатов Государственной думы девятого созыва состоятся в сентябре. Голосование пройдет с 18 по 20 сентября. Путин называл предстоящие выборы в Госдуму важнейшим внутриполитическим событием страны.\n\nВсего в ЕДГ-2026 пройдет более 2,2 тысячи кампаний разного уровня, предполагается заместить 20,7 тысячи депутатских мандатов и выборных должностей.", "link": "https://ria.ru/20260916/putin-2118104040.html", "source_id": "ria_novosti", "source_name": "RIA Novosti (РИА)", "perspective": "russia_official", "language": "ru", "bias_note": "Agencia estatal rusa del conglomerado Rossiya Segodnya. Postura y partes de guerra oficiales del Kremlin.", "published": "2026-09-16T15:08:47+00:00", "category": "frente", "relevance_score": 11, "date_added": "2026-09-16", "title_es": "La elección de los rusos demostrará la unidad del pueblo, afirmó Putin.", "text_es": "MOSCÚ, 16 de septiembre - RIA Novosti. La elección de los rusos demostrará que hay millones de personas detrás de los combatientes, que los rusos son un pueblo unido con valores comunes, memoria histórica y amor por la Patria, que no puede ser dividido ni intimidado, dijo el presidente ruso Vladimir Putin.\n\nPutin se dirigió a los ciudadanos rusos antes de las elecciones a la Duma Estatal.\n\n\"Su elección y su voluntad demostrarán una vez más que hay millones de personas detrás de nuestros combatientes, que somos un pueblo unido, unidos por valores comunes, memoria histórica, amor a la Patria, que nadie podrá dividirnos e intimidarnos, socavar nuestra condición de Estado y nuestro sistema sociopolítico\", dijo Putin.\n\nEn septiembre se celebrarán las elecciones de los diputados a la Duma estatal de la novena convocatoria. La votación tendrá lugar del 18 al 20 de septiembre. Putin calificó las próximas elecciones a la Duma Estatal como el evento político interno más importante del país.\n\nEn total, en el EDC 2026 se llevarán a cabo más de 2,2 mil campañas de varios niveles; Se espera que cubra 20,7 mil mandatos adjuntos y cargos electos."}, {"id": "4ca50cff8500", "title_original": "Путин призвал россиян проголосовать на выборах", "text_original": "Президент России Владимир Путин в обращении к гражданам призвал проголосовать на выборах в Госдуму и региональные органы власти. Выборы станут достойным ответом тем, кто мечтает об ослаблении страны, заявил глава государства.\n\n«Прошу вас обязательно реализовать свое конституционное право, принять обдуманное, ответственное решение, чтобы результаты выборов подтвердили зрелость и стойкость российского общества», — сказал Владимир Путин.\n\n«Ваш выбор и воля вновь покажут, что за нашими бойцами миллионы людей, что мы сплоченный народ, объединенный общими ценностями, исторической памятью, любовью к Родине. Что никому не удастся расколоть и запугать нас, подорвать нашу государственность и общественно-политическую систему», — заявил президент.\n\nС 18 по 20 сентября пройдут выборы в Госдуму. По общефедеральному и одномандатным округам зарегистрированы 4,4 тыс. кандидатов. В единый день голосования назначено более 2 тыс. избирательных кампаний разных уровней.", "link": "https://www.kommersant.ru/doc/8956404", "source_id": "kommersant", "source_name": "Kommersant (Коммерсантъ)", "perspective": "russia_official", "language": "ru", "bias_note": "Diario de referencia ruso sobre política exterior, sanciones, industria militar y economía de guerra.", "published": "2026-09-16T15:07:26+00:00", "category": "frente", "relevance_score": 11, "date_added": "2026-09-16", "title_es": "Putin llamó a los rusos a votar en las elecciones", "text_es": "El presidente ruso, Vladimir Putin, en un discurso dirigido a los ciudadanos, los llamó a votar en las elecciones a la Duma estatal y a las autoridades regionales. Las elecciones serán una respuesta digna para quienes sueñan con debilitar al país, afirmó el Jefe de Estado.\n\n\"Les pido que se aseguren de ejercer su derecho constitucional, de tomar una decisión reflexiva y responsable, de modo que los resultados de las elecciones confirmen la madurez y la resiliencia de la sociedad rusa\", dijo Vladimir Putin.\n\n\"Su elección y voluntad demostrarán una vez más que hay millones de personas detrás de nuestros combatientes, que somos un pueblo unido, unidos por valores comunes, memoria histórica y amor a la Patria. Que nadie podrá dividirnos e intimidarnos, socavar nuestra condición de Estado y nuestro sistema sociopolítico\", dijo el presidente.\n\nLas elecciones a la Duma estatal se celebrarán del 18 al 20 de septiembre. En las circunscripciones federales y de mandato único están inscritos 4,4 mil candidatos. En un solo día de votación están previstas más de 2.000 campañas electorales de distintos niveles."}, {"id": "bf53e6aaa18a", "title_original": "Война . 1666-й день. ВСУ объявили, что проводят контрнаступление в Донецкой области. Это операция под названием «Вивальди»", "text_original": "«Медуза» с 24 февраля 2022 года в прямом эфире рассказывает о российско-украинской войне. Мы ежедневно публикуем ваши письма, потому что уверены: о войне нужно продолжать говорить. Поделитесь с нами мыслями о войне. Какие чувства вы испытываете? Как война влияет на вашу жизнь и ваше отношение к миру? Если у вас есть история, связанная с войной, — расскажите ее. Форма для обратной связи — в конце этой статьи. Обзор предыдущего дня можно прочитать тут.\n\nКомандование Третьего армейского корпуса Сухопутных войск Украины объявило, что украинские военные проводят контрнаступательную операцию в северной части Донецкой области. Об этом в специальном видеообращении рассказал командующий корпуса бригадный генерал Андрей Билецкий. Ранее о наступлении ВСУ в районе города Лиман сообщали в том числе Z-блогеры (1, 2, 3).\n\nВСУ назвали операцию «Вивальди». В рамках этого наступления, заявил Билецкий, Третий корпус «зачистил от инфильтрации» несколько населенных пунктов на Лиманском направлении — Новоселовку, Александровку, Яровую, окрестности Корoвьего Яра, а также освободил Среднее. Всего ВСУ зачистили 75 квадратных километров и еще 10 освободили от российских войск, а также, как утверждается, «нанесли сокрушительный удар по боеспособности 20-й и 25-й армий РФ». Независимых подтверждений этой информации нет.\n\nБилецкий утверждает, что на этом этапе операции войска РФ потеряли около полутора тысячи солдат (он не уточнил, идет ли речь о безвозвратных потерях), более 12 тысяч беспилотников, сотни единиц бронетехники, артиллерийских систем и автомобильной техники. Также, по его словам, украинские беспилотники перерезали логистические маршруты противника.\n\n«В открытых источниках сейчас много информации о том, что конечная цель наших наступательных действий — выйти к берегам реки Черный Жеребец. Но наша операция называется „Вивальди“. А у Вивальди, как известно, четыре сезона. И это — лишь первый из них», — заявил командующий Третьим корпусом.\n\nБилецкий призвал продолжать соблюдать «режим информационной тишины» и обещал отчеты об операции в официальных источниках. Сама операция ВСУ в
