nte amenaza de una agresión rusa en Europa, señala el canal de televisión. La medida podría cambiar radicalmente las relaciones de Estados Unidos con aliados clave y obligar a los países europeos a forjar nuevas asociaciones en un momento de inestabilidad debido a las guerras en Ucrania y Medio Oriente, indica el material.", "date_added": "2026-09-18"}, {"id": "7e5358b996df", "title_original": "Zelensky appoints new chief prosecutor after predecessor's corruption scandal", "text_original": "Ukrainian President Volodymyr Zelensky has appointed a new acting prosecutor general, after the predecessor resigned over an anti-corruption investigation.\n\nAnton Kovalskyi, 42, was appointed on Thursday to replace Ruslan Kravchenko, who stood down last week following searches of his offices by Ukrainian anti-corruption officials related to illegal call centres in the country.\n\nOfficials said they identified a money-laundering scheme led by an official in Kravchenko's office, a claim he rejected.\n\nThe investigation into Kravchenko's office is the latest corruption scandal impacting Kyiv during the war against Russia. Accusations have been levelled at several members of Zelensky's inner circle.\n\nAccording to Ukraine's National Anti-Corruption Bureau (Nabu) and Specialised Anti-Corruption Prosecutor's Office (Sap), the network in Kravchenko's office received money to protect call centres that carried out phone scams and \"laundered millions in assets\".\n\nThe money was then used to buy property, jewellery, and other valuables, according to Nabu.", "link": "https://www.bbc.co.uk/news/articles/c539mwvl10g4o?at_medium=RSS&at_campaign=rss", "source_id": "bbc_europe", "source_name": "BBC News (Europa)", "perspective": "international", "language": "en", "bias_note": "Servicio público británico con amplia red de corresponsales de guerra e investigación OSINT.", "published": "2026-09-17T14:52:24+00:00", "category": "frente", "relevance_score": 21, "title_es": "Zelensky nombra nuevo fiscal jefe tras el escándalo de corrupción de su predecesor", "text_es": "El presidente ucraniano, Volodymyr Zelensky, nombró un nuevo fiscal general interino, luego de que su predecesor renunciara por una investigación anticorrupción.\n\nAnton Kovalskyi, de 42 años, fue designado el jueves para reemplazar a Ruslan Kravchenko, quien renunció la semana pasada luego de registros en sus oficinas por parte de funcionarios anticorrupción ucranianos relacionados con centros de llamadas ilegales en el país.\n\nLos funcionarios dijeron que identificaron un plan de lavado de dinero dirigido por un funcionario de la oficina de Kravchenko, afirmación que él rechazó.\n\nLa investigación sobre la oficina de Kravchenko es el último escándalo de corrupción que afecta a Kiev durante la guerra contra Rusia. Se han formulado acusaciones contra varios miembros del círculo íntimo de Zelensky.\n\nSegún la Oficina Nacional Anticorrupción (Nabu) y la Fiscalía Especializada Anticorrupción (SAP) de Ucrania, la red de la oficina de Kravchenko recibió dinero para proteger los centros de llamadas que llevaban a cabo estafas telefónicas y \"lavaban activos millonarios\".\n\nLuego, el dinero se utilizó para comprar propiedades, joyas y otros objetos de valor, según Nabu.", "date_added": "2026-09-17"}, {"id": "f5581e46b3a5", "title_original": "Two-Time Olympic Biathlon Champion and State Duma Lawmaker Sergei Tchepikov Dies at 59", "text_original": "Two-time Olympic biathlon champion and State Duma lawmaker Sergei Tchepikov has died at age 59, the Russian Biathlon Union said Thursday.\n\nDuring his international career spanning two decades and six Winter Olympic Games, Tchepikov won a gold medal in the biathlon relay in 1988 and another in the sprint in 1994.\n\nTchepikov was also a two-time World Champion, taking gold in the team event in 1989 and the mixed relay in 2006, with a less successful career in cross-country skiing in between.\n\nIn 2006, he joined the ruling United Russia party, which is backed by President Vladimir Putin, and was elected to the Sverdlovsk region’s legislative assembly in 2011. He has served in the Duma since 2016.\n\nThe United States, the EU and other Western countries sanctioned Tchepikov in 2022 for voting in support of the full-scale invasion of Ukraine.\n\nWe are facing unprecedented challenges. Russia's Prosecutor General's Office has designated The Moscow Times as an \"undesirable\" organization, criminalizing our work and putting our staff at risk of prosecution. This follows our earlier unjust labeling as a \"foreign agent.\"", "link": "https://www.themoscowtimes.com/2026/09/17/two-time-olympic-biathlon-champion-and-state-duma-lawmaker-sergei-chepikov-dies-at-59-a93739", "source_id": "the_moscow_times", "source_name": "The Moscow Times", "perspective": "russia_independent", "language": "en", "bias_note": "Diario independiente ruso en el exilio crítico con Putin y con cobertura de ataques en territorio ruso.", "published": "2026-09-17T13:54:36+00:00", "category": "economia", "relevance_score": 21, "title_es": "Muere Sergei Tchepikov, bicampeón olímpico de biatlón y legislador de la Duma estatal, a los 59 años", "text_es": "El dos veces campeón olímpico de biatlón y legislador de la Duma estatal Sergei Tchepikov murió a los 59 años, informó el jueves la Unión Rusa de Biatlón.\n\nDurante su carrera internacional que abarca dos décadas y seis Juegos Olímpicos de Invierno, Tchepikov ganó una medalla de oro en el relevo de biatlón en 1988 y otra en el sprint en 1994.\n\nTchepikov también fue dos veces campeón del mundo, consiguiendo el oro en la prueba por equipos en 1989 y en el relevo mixto en 2006, con una carrera menos exitosa en el esquí de fondo en el medio.\n\nEn 2006, se unió al partido gobernante Rusia Unida, respaldado por el presidente Vladimir Putin, y fue elegido miembro de la asamblea legislativa de la región de Sverdlovsk en 2011. Ha servido en la Duma desde 2016.\n\nEstados Unidos, la UE y otros países occidentales sancionaron a Tchepikov en 2022 por votar a favor de la invasión a gran escala de Ucrania.\n\nNos enfrentamos a desafíos sin precedentes. La Fiscalía General de Rusia ha designado a The Moscow Times como una organización \"indeseable\", criminalizando nuestro trabajo y poniendo a nuestro personal en riesgo de ser procesado. Esto sigue a nuestra anterior etiqueta injusta como \"agente extranjero\".", "date_added": "2026-09-17"}, {"id": "efe41ba5f354", "title_original": "Swedish PM Kristersson resigns after election loss", "text_original": "Sweden's Prime Minister Ulf Kristersson has resigned after his ruling right-wing bloc was narrowly defeated by the centre-left opposition in the country's general election.\n\nHe made the announcement in a post on X on Thursday afternoon, after preliminary votes from Sunday's election showed about 50,000 votes separated the two blocs in the country of about 10 million people.\n\nOpposition parties led by Magdalena Andersson of the Social Democrats look set  to win 176 seats in the 349-seat Riksdag, Sweden's parliament.\n\nKristersson, a conservative, had been supported in government by the anti-immigration hard-right Sweden Democrats (SD), and had promised them cabinet jobs if he won the election.\n\nHis right-wing bloc looks set to win 173 seats in the Riksdag, according to data from  the Swedish Election Authority.\n\nThe results will be subject to formal certification in the coming days and are expected to finalised this weekend.", "link": "https://www.bbc.co.uk/news/articles/cxr50l3d762po?at_medium=RSS&at_campaign=rss", "source_id": "bbc_europe", "source_name": "BBC News (Europa)", "perspective": "international", "language": "en", "bias_note": "Servicio público británico con amplia red de corresponsales de guerra e investigación OSINT.", "published": "2026-09-17T12:41:05+00:00", "category": "frente", "relevance_score": 15, "title_es": "El primer ministro sueco Kristersson dimite tras perder las elecciones", "text_es": "El Primer Ministro de Suecia, Ulf Kristersson, dimitió después de que su bloque gobernante de derecha fuera derrotado por estrecho margen por la oposición de centro izquierda en las elecciones generales del país.\n\nHizo el anuncio en una publicación en X el jueves por la tarde, después de que las votaciones preliminares de las elecciones del domingo mostraran que unos 50.000 votos separaban a los dos bloques en el país de unos 10 millones de habitantes.\n\nLos partidos de oposición liderados por Magdalena Andersson, de los socialdemócratas, parecen encaminados a ganar 176 escaños en el Riksdag, el parlamento sueco, de 349 escaños.\n\nKristersson, un conservador, había sido apoyado en el gobierno por los Demócratas Suecos (SD), de extrema derecha y antiinmigración, y les había prometido puestos en el gabinete si ganaba las elecciones.\n\nSu bloque de derecha probablemente obtendrá 173 escaños en el Riksdag, según datos de la autoridad electoral sueca.\n\nLos resultados estarán sujetos a certificación formal en los próximos días y se espera que estén finalizados este fin de semana.", "date_added": "2026-09-17"}, {"id": "ad417d9d7815", "title_original": "Drone Downed in Lithuania Was Russian and Likely Aimed at Ukraine, President Nausėda Says", "text_original": "A drone that was shot down by a NATO fighter jet in the skies above Lithuania for the first time was likely directed at Ukraine and veered off course, Lithuanian President Gitanas Nausėda said Wednesday.\n\n“Most likely, it was a Russian drone intended for Ukraine that was diverted from its course by Ukrainian electronic warfare measures and entered our territory, where it was shot down,” Nausėda told reporters after a state defense council meeting.\n\nNausėda identified the drone as a Gerbera, a low-cost plywood long-range aerial drone used by Russia. Gerberas are often employed as decoys to overwhelm air defenses, but they can also carry explosives.\n\nAn Italian fighter jet that is part of NATO’s Baltic air policing mission intercepted the unmanned aircraft over central Lithuania early Tuesday.\n\nRussia has not commented on the incident.\n\nSuspected Russian drones have previously been shot down over Poland, Romania, Latvia and Estonia, all of which are NATO and EU members.", "link": "https://www.themoscowtimes.com/2026/09/16/drone-downed-in-lithuania-was-russian-and-likely-aimed-at-ukraine-president-nausda-says-a93725", "source_id": "the_moscow_times", "source_name": "The Moscow Times", "perspective": "russia_independent", "language": "en", "bias_note": "Diario independiente ruso en el exilio crítico con Putin y con cobertura de ataques en territorio ruso.", "published": "2026-09-16T14:31:29+00:00", "category": "drones", "relevance_score": 19, "title_es": "El dron derribado en Lituania era ruso y probablemente apuntaba a Ucrania, dice el presidente Nausėda", "text_es": "Un avión no tripulado que fue derribado por primera vez por un avión de combate de la OTAN en los cielos de Lituania probablemente estaba dirigido a Ucrania y se desvió de su rumbo, dijo el miércoles el presidente lituano, Gitanas Nausėda.\n\n\"Lo más probable es que se tratara de un dron ruso destinado a Ucrania que fue desviado de su rumbo por las medidas de guerra electrónica ucranianas y entró en nuestro territorio, donde fue derribado\", dijo Nausėda a los periodistas después de una reunión del consejo de defensa estatal.\n\nNausėda identificó el dron como un Gerbera, un dron aéreo de largo alcance de madera contrachapada de bajo costo utilizado por Rusia. Las gerberas se emplean a menudo como señuelos para abrumar las defensas aéreas, pero también pueden transportar explosivos.\n\nUn avión de combate italiano que forma parte de la misión de vigilancia aérea del Báltico de la OTAN interceptó el avión no tripulado sobre el centro de Lituania el martes por la mañana.\n\nRusia no ha comentado sobre el incidente.\n\nPresuntos drones rusos han sido derribados anteriormente sobre Polonia, Rumania, Letonia y Estonia, todos ellos miembros de la OTAN y la UE.", "date_added": "2026-09-17"}, {"id": "9451b2b2e91c", "title_original": "Russian General Who Oversaw Capture of Ukraine’s Kostiantynivka Dies", "text_original": "A military commander who President Vladimir Putin recently awarded Russia’s highest state honor for the capture of the eastern Ukrainian city of Kostiantynivka has died, Russian and Ukrainian military officials said Wednesday.\n\n“He left us as a hero who carried out his sacred duty,” Alaudinov said without specifying when Grunis died or the circumstances of his death.\n\nUkraine’s Unmanned Systems Forces commander, Robert “Madyar” Brovdi, later claimed that Grunis was “eliminated” in a nighttime raid in the eastern Donetsk region on Sept. 12.\n\nThe Moscow Times could not independently verify the claim.\n\nGrunis commanded the Russian Armed Forces’ 4th Separate Guards Motor Rifle Brigade, which has played a key role in Russia’s offensive in the Donetsk region.\n\nIn July, Grunis personally briefed Putin on the capture of Kostiantynivka, one of four heavily fortified cities that make up Ukraine's so-called “fortress belt” in Donetsk. Earlier, Grunis boasted that his troops had “sliced up the city like a pie” by outflanking Ukrainian defense lines along local reservoirs.", "link": "https://www.themoscowtimes.com/2026/09/16/russian-general-who-oversaw-capture-of-ukraines-kostiantynivka-dies-a93722", "source_id": "the_moscow_times", "source_name": "The Moscow Times", "perspective": "russia_independent", "language": "en", "bias_note": "Diario independiente ruso en el exilio crítico con Putin y con cobertura de ataques en territorio ruso.", "published": "2026-09-16T10:36:00+00:00", "category": "frente", "relevance_score": 33, "title_es": "Muere el general ruso que supervisó la captura de Kostiantynivka en Ucrania", "text_es": "Un comandante militar a quien el presidente Vladimir Putin recientemente otorgó el más alto honor estatal de Rusia por la captura de la ciudad de Kostiantynivka, en el este de Ucrania, murió, dijeron el miércoles funcionarios militares rusos y ucranianos.\n\n\"Nos dejó como un héroe que cumplió con su deber sagrado\", dijo Alaudinov sin especificar cuándo murió Grunis ni las circunstancias de su muerte.\n\nEl comandante de las Fuerzas de Sistemas No Tripulados de Ucrania, Robert “Madyar” Brovdi, afirmó más tarde que Grunis fue “eliminado” en una incursión nocturna en la región oriental de Donetsk el 12 de septiembre.\n\nEl Moscow Times no pudo verificar de forma independiente la afirmación.\n\nGrunis comandó la 4.ª Brigada de Fusileros Motorizados de la Guardia Separada de las Fuerzas Armadas de Rusia, que ha desempeñado un papel clave en la ofensiva rusa en la región de Donetsk.\n\nEn julio, Grunis informó personalmente a Putin sobre la captura de Kostiantynivka, una de las cuatro ciudades fuertemente fortificadas que conforman el llamado “cinturón de fortalezas” de Ucrania en Donetsk. Anteriormente, Grunis se jactó de que sus tropas habían “cortado la ciudad como un pastel” al flanquear las líneas de defensa ucranianas a lo largo de embalses locales.", "date_added": "2026-09-16"}, {"id": "32b697f93f06", "title_original": "Ukraine's postal workers deliver lifeline under Russian fire", "text_original": "Every morning Igor Smelyansky looks at a vast map of Ukraine on his office wall and decides where he should put his people in harm's way.\n\nHis aides provide him with live intelligence about Russian attacks and he deploys his teams, balancing their potential operational success against risk to life or limb.\n\nBut Smelyansky is no military commander. He is the head of Ukraine's state postal service, Ukrposhta.\n\nAnd every day he must decide how far to send his postmen and women into the deadly \"kill zone\" along the front lines where the threat of drone attack is ever present.\n\n\"If it's too dangerous to go today, we won't go,\" Smelyansky told us. \"We'll go tomorrow, or we'll go somewhere else. The key is to be as agile as you can.\"\n\nUkrposhta does more than just collect letters and parcels. It pays out pensions in hard cash, it takes payment for utility bills. And it delivers vital food and medicine to people on the margins of society.", "link": "https://www.bbc.co.uk/news/articles/c33kmred368o?at_medium=RSS&at_campaign=rss", "source_id": "bbc_europe", "source_name": "BBC News (Europa)", "perspective": "international", "language": "en", "bias_note": "Servicio público británico con amplia red de corresponsales de guerra e investigación OSINT.", "published": "2026-09-15T05:01:46+00:00", "category": "drones", "relevance_score": 13, "title_es": "Los trabajadores postales de Ucrania entregan un salvavidas bajo el fuego ruso", "text_es": "Todas las mañanas, Igor Smelyansky mira un enorme mapa de Ucrania colgado en la pared de su oficina y decide dónde debería poner a su pueblo en peligro.\n\nSus ayudantes le proporcionan inteligencia en vivo sobre los ataques rusos y él despliega sus equipos, equilibrando su potencial éxito operativo con el riesgo para la vida o la integridad física.\n\nPero Smelyansky no es un comandante militar. Es el jefe del servicio postal estatal de Ucrania, Ukrposhta.\n\nY cada día debe decidir hasta qué punto enviar a sus carteros y mujeres a la mortífera \"zona de exterminio\" a lo largo del frente, donde la amenaza de un ataque con drones está siempre presente.\n\n\"Si es demasiado peligroso ir hoy, no iremos\", nos dijo Smelyansky. \"Iremos mañana o iremos a otro lugar. La clave es ser lo más ágil posible\".\n\nUkrposhta hace más que simplemente recoger cartas y paquetes. Paga las pensiones en efectivo y cobra las facturas de servicios públicos. Y entrega alimentos y medicinas vitales a personas marginadas de la sociedad.", "date_added": "2026-09-17"}, {"id": "bb4c4b69c066", "title_original": "Watch: Why a Russian strike on train near Ukraine-Poland border could mark an escalation", "text_original": "A Russian drone struck a train near the Ukraine-Poland border shortly after the former UK Prime Minister Boris Johnson and top European security officials had passed through.\n\nNo casualties were reported after the strike at Yahodyn, which hit the train's engine. All the passengers had been evacuated, Ukrainian authorities said.\n\nJohnson and other European national security advisers, including the UK's Jonathan Powell, had passed along the same line on a different train on their way back from a conference in Kyiv.\n\nBBC's James Landale explains why the incident could signal an escalation in Russia's war against Ukraine.", "link": "https://www.bbc.co.uk/news/videos/cx2z5gjj838o?at_medium=RSS&at_campaign=rss", "source_id": "bbc_europe", "source_name": "BBC News (Europa)", "perspective": "international", "language": "en", "bias_note": "Servicio público británico con amplia red de corresponsales de guerra e investigación OSINT.", "published": "2026-09-14T01:12:20+00:00", "category": "drones", "relevance_score": 13, "title_es": "Ver: Por qué un ataque ruso a un tren cerca de la frontera entre Ucrania y Polonia podría marcar una escalada", "text_es": "Un dron ruso chocó contra un tren cerca de la frontera entre Ucrania y Polonia poco después de que el ex primer ministro del Reino Unido, Boris Johnson, y altos funcionarios de seguridad europeos hubieran pasado por allí.\n\nNo se registraron víctimas tras el ataque en Yahodyn, que alcanzó el motor del tren. Todos los pasajeros fueron evacuados, dijeron las autoridades ucranianas.\n\nJohnson y otros asesores de seguridad nacional europeos, incluido el británico Jonathan Powell, habían pasado por la misma línea en un tren diferente cuando regresaban de una conferencia en Kiev.\n\nJames Landale de la BBC explica por qué el incidente podría indicar una escalada en la guerra de Rusia contra Ucrania.", "date_added": "2026-09-17"}, {"id": "7292bb28b3be", "title_original": "Why a fresh wave of North Korean soldiers may fight in Russia's war in Ukraine", "text_original": "An enemy that swarmed the battlefield in large groups while under fire, seemingly oblivious to the dangers of drones and fire from automatic weapons. An elite corps of ghost soldiers who chose suicide over surrender. They fought and died in their thousands, then apparently vanished from the battlefield.\n\nNorth Korea's soldiers were sent to fight by Pyongyang alongside Russian forces as they sought to repel a Ukrainian offensive on Moscow's territory at the end of 2024. They paid a heavy price, as many as 3,000 killed in action from the 13,000 deployed.\n\nUltimately, they would adapt their tactics, and with Russia would drive Ukrainian forces from its Kursk region. In combat terms, little has been heard of them since, but according to Ukraine's president, Volodymyr Zelensky, North Korean forces, and their weaponry, are soon to make a dramatic return to Russia's war in Ukraine.\n\nLast month, Zelensky warned that up to 50,000 North Koreans will be deployed in Russia, revising an earlier estimate of 30,000 troops. He called on South Korea to provide support for his country's air defence.\n\nBut why, after such heavy losses, would North Korea send more men to fight for Russia, and what happened to its soldiers sent in the first place?\n\n\"They're still there\", said Dr Yang Uk, research fellow at the Asan Institute for Policy Studies, Center for Foreign Policy and National Security in Seoul. \"They are defending Russian territory for another counterattack from Ukraine. And we believe that some of the engineer corps or workers might be in [the Russian-occupied] Donbas area but that's not the combat troops.\"", "link": "https://www.bbc.co.uk/news/articles/cgl7zrnxxy6o?at_medium=RSS&at_campaign=rss", "source_id": "bbc_europe", "source_name": "BBC News (Europa)", "perspective": "international", "language": "en", "bias_note": "Servicio público británico con amplia red de corresponsales de guerra e investigación OSINT.", "published": "2026-09-13T23:16:33+00:00", "category": "frente", "relevance_score": 41, "title_es": "Why a fresh wave of North Korean soldiers may fight in Russia's war in Ukraine", "text_es": "An enemy that swarmed the battlefield in large groups while under fire, seemingly oblivious to the dangers of drones and fire from automatic weapons. An elite corps of ghost soldiers who chose suicide over surrender. They fought and died in their thousands, then apparently vanished from the battlefield.\n\nNorth Korea's soldiers were sent to fight by Pyongyang alongside Russian forces as they sought to repel a Ukrainian offensive on Moscow's territory at the end of 2024. They paid a heavy price, as many as 3,000 killed in action from the 13,000 deployed.\n\nUltimately, they would adapt their tactics, and with Russia would drive Ukrainian forces from its Kursk region. In combat terms, little has been heard of them since, but according to Ukraine's president, Volodymyr Zelensky, North Korean forces, and their weaponry, are soon to make a dramatic return to Russia's war in Ukraine.\n\nLast month, Zelensky warned that up to 50,000 North Koreans will be deployed in Russia, revising an earlier estimate of 30,000 troops. He called on South Korea to provide support for his country's air defence.\n\nBut why, after such heavy losses, would North Korea send more men to fight for Russia, and what happened to its soldiers sent in the first place?\n\n\"They're still there\", said Dr Yang Uk, research fellow at the Asan Institute for Policy Studies, Center for Foreign Policy and National Security in Seoul. \"They are defending Russian territory for another counterattack from Ukraine. And we believe that some of the engineer corps or workers might be in [the Russian-occupied] Donbas area but that's not the combat troops.\"", "date_added": "2026-09-16"}]</script>
  <script id="historic-data" type="application/json">[{"id": "ee332923b21b", "title_original": "НАТО провело учения для отработки захвата гражданских судов, заявил Путин", "text_original": "МОСКВА, 18 сен - РИА Новости. НАТО провело в Балтийском море учения, одной из целей которых была отработка захвата гражданских судов, заявил президент России Владимир Путин.\n\n\"Тем не менее мы обратили внимание и на то, что вот сейчас только что прошли учения очередные в Балтийском море. Цель в том числе - отработка захвата гражданских судов. Ну, это нормально?\" - сказал глава государства на заседании Военно-промышленной комиссии.", "link": "https://ria.ru/20260918/putin-2118642147.html", "source_id": "ria_novosti", "source_name": "RIA Novosti (РИА)", "perspective": "russia_official", "language": "ru", "bias_note": "Agencia estatal rusa del conglomerado Rossiya Segodnya. Postura y partes de guerra oficiales del Kremlin.", "published": "2026-09-18T18:45:36+00:00", "category": "frente", "relevance_score": 11, "date_added": "2026-09-18", "title_es": "La OTAN realizó ejercicios para practicar la incautación de buques civiles, dijo Putin.", "text_es": "MOSCÚ, 18 de septiembre - RIA Novosti. La OTAN realizó ejercicios en el Mar Báltico, uno de cuyos objetivos era practicar la incautación de buques civiles, dijo el presidente ruso Vladimir Putin.\n\n\"Sin embargo, también llamamos la atención sobre el hecho de que acaba de realizarse otro ejercicio en el Mar Báltico. El objetivo, entre otras cosas, es practicar la incautación de buques civiles. Bueno, ¿es esto normal?\" - afirmó el Jefe de Estado en una reunión de la Comisión Militar-Industrial."}, {"id": "fadb418278a9", "title_original": "Путин призвал Запад жить дружно", "text_original": "МОСКВА, 18 сен - РИА Новости. Президент России Владимир Путин призвал страны Запада жить дружно, отметив, что в противном случае Москве придется отвечать.\n\n\"Так и хочется им сказать: \"Давайте лучше жить дружно, иначе ведь нам тоже придется отвечать\". Это должно быть для всех очевидным общим местом, понятным. По-другому не будет\", - сказал российский лидер в ходе заседания военно-промышленной комиссии.\n\nПутин отметил, что Россия готова к восстановлению отношений с европейскими соседями и дальнейшему сотрудничеству.", "link": "https://ria.ru/20260918/putin--2118641708.html", "source_id": "ria_novosti", "source_name": "RIA Novosti (РИА)", "perspective": "russia_official", "language": "ru", "bias_note": "Agencia estatal rusa del conglomerado Rossiya Segodnya. Postura y partes de guerra oficiales del Kremlin.", "published": "2026-09-18T18:44:08+00:00", "category": "frente", "relevance_score": 11, "date_added": "2026-09-18", "title_es": "Putin llamó a Occidente a vivir juntos", "text_es": "MOSCÚ, 18 de septiembre - RIA Novosti. El presidente ruso, Vladimir Putin, llamó a los países occidentales a vivir juntos y señaló que, de lo contrario, Moscú tendrá que responder.\n\n“Sólo quiero decirles: “Será mejor que vivamos juntos, sino también tendremos que responder”. Este debería ser un lugar común obvio para todos, comprensible. No será de otra manera”, afirmó el líder ruso durante una reunión de la comisión militar-industrial.\n\nPutin señaló que Rusia está dispuesta a restablecer las relaciones con sus vecinos europeos y a ampliar la cooperación."}, {"id": "dd447d9290aa", "title_original": "\"Кучка казнокрадов\" узурпировала власть в Киеве, заявил Путин", "text_original": "МОСКВА, 18 сен - РИА Новости. Власть в Киеве узурпирована \"кучкой казнокрадов\", которым нужна война, чтобы оставаться у власти, заявил президент России Владимир Путин.\n\nОн отметил, что режим на Украине не может защищать демократию, потому что выродился в диктатуру.\n\n\"Выборы, как известно, на Украине не проводятся. Власть узурпирована \"кучкой казнокрадов\", коррупционеров, которым нужна война для того, чтобы оставаться у власти без выборов и создавать дальше условия для ограбления своего собственного народа, для того, чтобы набивать карманы деньгами спонсоров, в том числе - и из Европы\", - сказал глава государства на заседании Военно-промышленной комиссии.", "link": "https://ria.ru/20260918/putin-2118641161.html", "source_id": "ria_novosti", "source_name": "RIA Novosti (РИА)", "perspective": "russia_official", "language": "ru", "bias_note": "Agencia estatal rusa del conglomerado Rossiya Segodnya. Postura y partes de guerra oficiales del Kremlin.", "published": "2026-09-18T18:39:56+00:00", "category": "frente", "relevance_score": 11, "date_added": "2026-09-18", "title_es": "\"Un grupo de malversadores\" usurparon el poder en Kyiv, dijo Putin", "text_es": "MOSCÚ, 18 de septiembre - RIA Novosti. El poder en Kiev ha sido usurpado por un “grupo de malversadores” que necesitan la guerra para permanecer en el poder, dijo el presidente ruso Vladimir Putin.\n\nSeñaló que el régimen de Ucrania no puede defender la democracia porque ha degenerado en una dictadura.\n\n\"En Ucrania, como sabemos, no se celebran elecciones. El poder ha sido usurpado por un \"grupo de malversadores\", funcionarios corruptos que necesitan la guerra para permanecer en el poder sin elecciones y crear condiciones para robar a su propio pueblo, para llenarse los bolsillos con dinero de los patrocinadores, incluso de Europa\", dijo el Jefe de Estado en una reunión de la Comisión Militar-Industrial."}, {"id": "c5c01423afdc", "title_original": "Вместо того, чтобы услышать граждан, ЕС нагнетает ситуацию, заявил Путин", "text_original": "МОСКВА, 18 сен - РИА Новости. Вместо того, чтобы остановиться и услышать своих граждан, которые не хотят войны с Россией, лидеры Европы нагнетают ситуацию дальше, заявил президент РФ Владимир Путин.\n\nГлава государства отметил, что некоторые европейские лидеры открыто заявляют о том, что готовятся к войне с Россией. По мнению президента, таким образом они пытаются спасти свои падающие рейтинги, прикрывая свои ошибки в экономической и социальной политике.\n\n\"Вместо того, чтобы остановиться, услышать своих граждан, которые на выборах дают ясно понять, что они никакой войны с Россией не хотят, тем не менее, эти лидеры продолжают нагнетать ситуацию дальше\", - сказал Путин в ходе заседания военно-промышленной комиссии.", "link": "https://ria.ru/20260918/putin-2118641044.html", "source_id": "ria_novosti", "source_name": "RIA Novosti (РИА)", "perspective": "russia_official", "language": "ru", "bias_note": "Agencia estatal rusa del conglomerado Rossiya Segodnya. Postura y partes de guerra oficiales del Kremlin.", "published": "2026-09-18T18:39:30+00:00", "category": "frente", "relevance_score": 11, "date_added": "2026-09-18", "title_es": "En lugar de escuchar a los ciudadanos, la UE está agravando la situación, afirmó Putin.", "text_es": "MOSCÚ, 18 de septiembre - RIA Novosti. En lugar de detenerse y escuchar a sus ciudadanos que no quieren la guerra con Rusia, los líderes europeos están intensificando aún más la situación, dijo el presidente ruso Vladimir Putin.\n\nEl Jefe de Estado señaló que algunos líderes europeos declaran abiertamente que se están preparando para una guerra con Rusia. Según el presidente, de esta manera intentan salvar su caída en el rating, encubriendo sus errores en la política económica y social.\n\n\"En lugar de detenerse y escuchar a sus ciudadanos, que dejaron claro durante las elecciones que no quieren ninguna guerra con Rusia, estos líderes continúan agravando aún más la situación\", dijo Putin durante una reunión de la comisión militar-industrial."}, {"id": "5ba2c21951a1", "title_original": "Мощи Дмитрия Донского привезли из зоны СВО в «Новый Херсонес»", "text_original": "Ковчег с мощами святого князя Дмитрия Донского из зоны СВО привезли в Севастополь, в Свято-Владимирский мужской монастырь. Обитель входит в состав историко-археологического парка «Новый Херсонес». Об этом сообщила пресс-служба Минобороны России.\n\nМощи встретили в Свято-Владимирском соборе. Там состоялся молебен с акафистом, который возглавил епископ Ялтинский Нестор, викарий Симферопольской епархии. Приложиться к мощам святого пришли военнослужащие Вооруженных сил РФ, курсанты Черноморского высшего военно-морского ордена Красной Звезды училища имени П. С. Нахимова, взрослые и дети.\n\nМощи Дмитрия Донского обрели в июле во время реставрационных работ в Архангельском соборе в Москве. Их частицы поместили в несколько ковчегов, чтобы привезти для поклонения в храмы по всей России. В зону СВО ковчег с мощами доставили 8 сентября. Для поклонения верующих привезли частицу правой руки Дмитрия Донского — «той самой правой руки, которой он держал меч на Куликовом поле». До этого мощи уже привозили военнослужащим группировок «Юг», «Север» и «Запад».", "link": "https://www.kommersant.ru/doc/8970109", "source_id": "kommersant", "source_name": "Kommersant (Коммерсантъ)", "perspective": "russia_official", "language": "ru", "bias_note": "Diario de referencia ruso sobre política exterior, sanciones, industria militar y economía de guerra.", "published": "2026-09-18T18:37:53+00:00", "category": "frente", "relevance_score": 27, "date_added": "2026-09-18", "title_es": "Las reliquias de Dmitri Donskoi fueron trasladadas desde la zona del Distrito Militar del Norte a \"Nuevo Chersoneso\"", "text_es": "El arca con las reliquias del santo príncipe Dmitri Donskoi fue traída desde la zona del Distrito Militar del Norte a Sebastopol, al monasterio de San Vladimir. El monasterio forma parte del parque histórico y arqueológico “Nuevo Chersonesos”. Así lo informó el servicio de prensa del Ministerio de Defensa ruso.\n\nLas reliquias fueron recogidas en la catedral de San Vladimir. Allí se celebró un servicio de oración con un acatista, encabezado por el obispo Néstor de Yalta, vicario de la diócesis de Simferopol. Para venerar las reliquias del santo vinieron militares de las Fuerzas Armadas de la Federación Rusa, cadetes de la Orden Naval Superior del Mar Negro de la Escuela Estrella Roja que lleva el nombre de P. S. Nakhimov, adultos y niños.\n\nLas reliquias de Dmitry Donskoy fueron encontradas en julio durante los trabajos de restauración en la Catedral del Arcángel de Moscú. Sus partículas fueron colocadas en varias arcas para ser llevadas para el culto en iglesias de toda Rusia. El arca con las reliquias fue entregada a la zona del Distrito Militar del Norte el 8 de septiembre. Para el culto de los creyentes, trajeron un trozo de la mano derecha de Dmitry Donskoy, \"la misma mano derecha con la que sostenía la espada en el campo de Kulikovo\". Antes de esto, las reliquias ya habían sido entregadas a los militares de las facciones del Sur, del Norte y del Oeste."}, {"id": "56874c6d8227", "title_original": "Россия готова к восстановлению отношений с Европой, заявил Путин", "text_original": "МОСКВА, 18 сен - РИА Новости. Россия готова к сотрудничеству и восстановлению отношений с европейскими соседями, заявил президент РФ Владимир Путин.\n\n\"Мы готовы к сотрудничеству, к восстановлению отношений с европейскими соседями\", - сказал российский лидер в ходе заседания Военно-промышленной комиссии.", "link": "https://ria.ru/20260918/putin-2118640909.html", "source_id": "ria_novosti", "source_name": "RIA Novosti (РИА)", "perspective": "russia_official", "language": "ru", "bias_note": "Agencia estatal rusa del conglomerado Rossiya Segodnya. Postura y partes de guerra oficiales del Kremlin.", "published": "2026-09-18T18:37:29+00:00", "category": "frente", "relevance_score": 11, "date_added": "2026-09-18", "title_es": "Rusia está dispuesta a restablecer las relaciones con Europa, afirmó Putin", "text_es": "MOSCÚ, 18 de septiembre - RIA Novosti. Rusia está dispuesta a cooperar y restablecer las relaciones con sus vecinos europeos, afirmó el presidente ruso Vladimir Putin.\n\n\"Estamos dispuestos a cooperar y restablecer las relaciones con nuestros vecinos europeos\", afirmó el líder ruso durante una reunión de la Comisión Militar-Industrial."}, {"id": "f231d8af5215", "title_original": "Армия должна быть готова быстро ответить на внешние угрозы, заявил Путин", "text_original": "МОСКВА, 18 сен - РИА Новости. Армия России и силовые структуры должны быть готовы быстро и эффективно ответить на потенциальные внешние угрозы, сообщил президент России Владимир Путин.\n\nВ ходе выступления на заседании военно-промышленной комиссии он отметил, что в его ходе предстоит поговорить о проекте новой Госпрограммы вооружения и о Программе развития оборонно-промышленного комплекса.\n\n\"Они станут основой для разработки и серийного производства современных систем вооружения и техники для оснащения нашей армии и других силовых структур, чтобы они были готовы быстро и эффективно ответить на потенциальные внешние угрозы\", - сказал Путин на заседании.", "link": "https://ria.ru/20260918/putin-2118640821.html", "source_id": "ria_novosti", "source_name": "RIA Novosti (РИА)", "perspective": "russia_official", "language": "ru", "bias_note": "Agencia estatal rusa del conglomerado Rossiya Segodnya. Postura y partes de guerra oficiales del Kremlin.", "published": "2026-09-18T18:37:27+00:00", "category": "frente", "relevance_score": 11, "date_added": "2026-09-18", "title_es": "El ejército debe estar preparado para responder rápidamente a las amenazas externas, afirmó Putin.", "text_es": "MOSCÚ, 18 de septiembre - RIA Novosti. El ejército y las fuerzas de seguridad rusos deben estar preparados para responder rápida y eficazmente a posibles amenazas externas, afirmó el presidente ruso Vladimir Putin.\n\nDurante su intervención en la reunión de la comisión militar-industrial, señaló que durante la reunión se discutiría el borrador del nuevo Programa Estatal de Armamento y el Programa para el Desarrollo del Complejo Industrial-Defensa.\n\n\"Se convertirán en la base para el desarrollo y la producción en masa de sistemas y equipos de armas modernos para equipar a nuestro ejército y otras fuerzas de seguridad de modo que estén preparados para responder rápida y eficazmente a posibles amenazas externas\", dijo Putin en la reunión."}, {"id": "ad66419c68a4", "title_original": "Пентагон обнародовал новые файлы о НЛО и секретной военной программе", "text_original": "Пентагон рассекретил и опубликовал шестую партию документов, аудио и видеофайлов о неопознанных летающих объектах (НЛО). Всего в этих документах 71 файл: 55 текстовых, 15 видео и 1 аудио. Данные касаются событий с 1952 по 2025 год. Большинство обнародованных случаев встречи с НЛО остаются в статусе «неразгаданных».\n\nВ новый пакет вошли архивные файлы проекта ВВС США Project Blue Book, который с 1952 по 1969 год собирал и анализировал сообщения об НЛО и был самым масштабным из известных проектов правительства США этого направления в ХХ веке. Кроме того, Пентагон включил в пакет свежие видеозаписи перемещения НЛО, сделанные американскими военными и полицией в 2023–2025 годах на Ближнем Востоке и в Желтом море.\n\nОпрошенные CBS News эксперты отмечают, что наиболее важные документы в этой партии касаются секретной программы разведывательного управления Минобороны США по применению перспективных систем аэрокосмического оружия (Advanced Aerospace Weapon System Applications Program, AAWSAP). Программа была создана в 2007–2008 годах для изучения перспективных аэрокосмических угроз и прорывных технологий зарубежных противников, а также неопознанных воздушных явлений. Она существовала до 2012 года, и за годы работы специалисты успели изучить такие направления, как сверхсветовое перемещение, антигравитация, отрицательная энергия, вакуумная инженерия, высокочастотные гравитационно-волновые коммуникации, влияние электромагнитного излучения на биологические ткани человека, включая анализ физиологических эффектов при контактах с аномальными объектами, и т. п.\n\nОбнародование документов об НЛО было сделано по указанию президента США Дональда Трампа, который в середине апреля пообещал раскрыть «любопытные» данные на эту тему. Первый пакет из 158 файлов был опубликован 8 мая.", "link": "https://www.kommersant.ru/doc/8970093", "source_id": "kommersant", "source_name": "Kommersant (Коммерсантъ)", "perspective": "russia_official", "language": "ru", "bias_note": "Diario de referencia ruso sobre política exterior, sanciones, industria militar y economía de guerra.", "published": "2026-09-18T18:20:30+00:00", "category": "frente", "relevance_score": 15, "date_added": "2026-09-18", "title_es": "El Pentágono publicó nuevos archivos sobre ovnis y un programa militar secreto", "text_es": "El Pentágono ha desclasificado y publicado el sexto lote de documentos, archivos de audio y vídeo sobre objetos voladores no identificados (OVNI). En total, estos documentos contienen 71 archivos: 55 de texto, 15 de vídeo y 1 de audio. Los datos cubren eventos ocurridos entre 1952 y 2025. La mayoría de los casos publicados de encuentros con ovnis permanecen en el estado de \"sin resolver\".\n\nEl nuevo paquete incluye archivos de archivo del Proyecto Libro Azul de la Fuerza Aérea de EE. UU., que recopiló y analizó informes de ovnis de 1952 a 1969 y fue el proyecto OVNI más grande conocido del gobierno de EE. UU. en el siglo XX. Además, el Pentágono incluyó en el paquete nuevas grabaciones de vídeo de movimientos ovni realizados por el ejército y la policía estadounidenses en 2023-2025 en Oriente Medio y el Mar Amarillo.\n\nLos expertos entrevistados por CBS News señalan que los documentos más importantes de este lote se relacionan con el programa secreto de la Agencia de Inteligencia del Departamento de Defensa de EE. UU. para el uso de sistemas avanzados de armas aeroespaciales (Advanced Aerospace Weapon System Applications Program, AAWSAP). El programa fue creado en 2007-2008 para estudiar amenazas aeroespaciales avanzadas y tecnologías disruptivas de adversarios extranjeros, así como fenómenos aéreos no identificados. Existió hasta 2012 y, a lo largo de años de trabajo, los especialistas lograron estudiar áreas como los viajes superlumínicos, la antigravedad, la energía negativa, la ingeniería del vacío y las altas energías.\n\nLa publicación de los documentos OVNI se realizó bajo la dirección del presidente estadounidense, Donald Trump, quien a mediados de abril prometió revelar datos \"interesantes\" sobre este tema. El primer lote de 158 archivos se publicó el 8 de mayo."}, {"id": "77b1b61bfddb", "title_original": "Two killed in Russian drone attack on Kherson Oblast", "text_original": "Two men were killed in a Russian drone attack on the village of Tekstylne in Kherson Oblast on the evening of 18 September.\n\nSource: Oleksandr Prokudin, Head of Kherson Oblast Military Administration\n\nDetails: Prokudin said Russian troops attacked the settlement at around 18:00.\n\nQuote: \"Two men sustained fatal injuries in the strike by an enemy drone. The relevant services are currently establishing the identities of those killed.\n\nMy sincere condolences to their families and loved ones.\"\n\nBackground: On the afternoon of 18 September, Russian forces dropped explosives from a drone onto the grounds of a hospital in Kherson, damaging service vehicles.", "link": "https://www.pravda.com.ua/eng/news/2026/09/18/8054155/", "source_id": "ukrainska_pravda_en", "source_name": "Ukrainska Pravda (EN)", "perspective": "ukraine", "language": "en", "bias_note": "Uno de los periódicos más leídos e históricos de Ucrania (versión internacional en inglés).", "published": "2026-09-18T18:16:00+00:00", "category": "drones", "relevance_score": 25, "date_added": "2026-09-18", "title_es": "Dos muertos en un ataque con drones rusos en la provincia de Jersón", "text_es": "Dos hombres murieron en un ataque con aviones no tripulados rusos contra la aldea de Tekstylne, en el óblast de Jersón, la tarde del 18 de septiembre.\n\nFuente: Oleksandr Prokudin, jefe de la administración militar de la provincia de Jersón\n\nDetalles: Prokudin dijo que las tropas rusas atacaron el asentamiento alrededor de las 18:00.\n\nCita: \"Dos hombres resultaron heridos mortalmente durante el ataque de un dron enemigo. Los servicios competentes están investigando actualmente la identidad de los fallecidos.\n\nMi más sentido pésame a sus familiares y seres queridos\".\n\nAntecedentes: En la tarde del 18 de septiembre, las fuerzas rusas arrojaron explosivos desde un dron sobre los terrenos de un hospital en Kherson, dañando vehículos de servicio."}, {"id": "90c6bfe4512d", "title_original": "Russian strikes hit central Odesa twice, injuring 10, incl two rescuers", "text_original": "The number of casualties in Odesa following two enemy drone strikes on an administrative building has risen to 10, according to Head of the regional military administration Oleh Kiper.\n\n\"The enemy brazenly attacked the central part of Odesa twice in a row. The second strike occurred while emergency and rescue services were working to deal with the aftermath of the attack and provide assistance to people,\" he said on Telegram on Friday evening.\n\n\"Currently, there are reports of ten casualties. Three of them have been hospitalized, while the others received medical care on site,\" he said.\n\nAccording to the State Emergency Service, two rescue workers are among the injured. \"Ten people were injured in the Russian attack, including two rescue workers. The strike hit an 11-story administrative building. At the time of the attack, people were taking shelter, which saved their lives. Later, Russia launched a second strike while rescuers and other emergency services were working at the scene,\" the service said on its Telegram channel.\n\nAccording to the regional military administration, the shelling damaged the administrative building and vehicles. Cleanup efforts are ongoing at the scene. The fire, which spread across several floors of the building, has already been extinguished by rescue workers. More than 70 firefighters responded to the aftermath of this attack.", "link": "https://en.interfax.com.ua/news/general/1206742.html", "source_id": "interfax_ukraine", "source_name": "Interfax-Ucrania", "perspective": "ukraine", "language": "en", "bias_note": "Agencia de noticias ucraniana de referencia para despachos militares y declaraciones gubernamentales.", "published": "2026-09-18T17:41:54+00:00", "category": "drones", "relevance_score": 25, "date_added": "2026-09-18", "title_es": "Los ataques rusos alcanzaron dos veces el centro de Odesa, hiriendo a 10, incluidos dos rescatistas", "text_es": "El número de víctimas en Odesa tras dos ataques con drones enemigos contra un edificio administrativo ha aumentado a 10, según informó el jefe de la administración militar regional, Oleh Kiper.\n\n\"El enemigo atacó descaradamente la parte central de Odesa dos veces seguidas. El segundo ataque se produjo mientras los servicios de emergencia y rescate estaban trabajando para hacer frente a las secuelas del ataque y brindar asistencia a la gente\", dijo en Telegram el viernes por la noche.\n\n\"Actualmente hay informes de diez víctimas. Tres de ellos han sido hospitalizados, mientras que los demás recibieron atención médica en el lugar\", dijo.\n\nSegún el Servicio Estatal de Emergencias, entre los heridos se encuentran dos socorristas. \"Diez personas resultaron heridas en el ataque ruso, incluidos dos socorristas. El ataque alcanzó un edificio administrativo de 11 pisos. En el momento del ataque, las personas estaban refugiándose, lo que les salvó la vida. Más tarde, Rusia lanzó un segundo ataque mientras los socorristas y otros servicios de emergencia trabajaban en el lugar\", informó el servicio en su canal Telegram.\n\nSegún la administración militar regional, el bombardeo dañó el edificio administrativo y los vehículos. Se están realizando esfuerzos de limpieza en el lugar. El fuego, que se extendió por varias plantas del edificio, ya ha sido extinguido por los socorristas. Más de 70 bomberos respondieron a las secuelas de este ataque."}, {"id": "a2803988676a", "title_original": "Reuters: Руководство АдГ намерено обсудить с Кремлем возобновление поставок газа в ФРГ", "text_original": "Руководство ультраправой партии \"Альтернатива для Германии\" (АдГ) планирует обсудить с Кремлем возобновление поставок газа из России в Германию. Об этом в пятницу, 18 сентября, сообщило агентство Reuters со ссылкой на два осведомленных источника.\n\nПо этим данным, встреча запланирована на весну 2026 года. Ожидается, что со стороны АдГ в ней примут участие сопредседатели партии Алис Вайдель (Alice Weidel) и Тино Хрупалла (Tino Chrupalla), а с российской стороны - советник президента РФ Владимира Путина Кирилл Дмитриев. В \"Альтернативе для Германии\" пока не комментировали эту информацию.\n\nReuters отмечает, что АдГ не имеет полномочий возобновлять поставки газа из России. Энергетическая политика - прерогатива правительства ФРГ, и крайне маловероятно, что ультраправые могут в него войти, указывает агентство - несмотря на недавний успех на выборах в ландтаг Саксонии-Анхальт и общий рост их рейтинга в Германии. Reuters напоминает, что другие политические силы отказываются входить в коалицию с АдГ, которую Федеральное ведомство по охране конституции (BfV) в 2025 году причислило  к правоэкстремистским объединениям.\n\nВ интервью агентству Reuters, опубликованном 30 июня, Вайдель призвала прекратить бойкот российских нефти и газа. \"Дешевая энергия из России была секретом успеха марки \"Сделано в Германии\". Нам необходимо ее вернуть\", - сказала сопредседательница АдГ. Она дала понять, что рассматривает выборы на востоке ФРГ как ступеньки к канцлерству.\n\nПеред выборами в парламент Саксонии-Анхальт \"Альтернатива для Германии\" обещала избирателям, среди прочего, добиваться окончания санкций против РФ в сфере энергетики и \"нормализации германо-российских торговых отношений\", в том числе - возобновления закупок российского трубопроводного газа по \"Северному потоку\".", "link": "https://www.dw.com/ru/reuters-руководство-адг-намерено-обсудить-с-кремлем-возобновление-поставок-газа-в-фрг/a-79333404?maca=rus-rss-ru-all-1126-xml-mrss", "source_id": "dw_russian", "source_name": "Deutsche Welle (DW Ruso)", "perspective": "international", "language": "ru", "bias_note": "Radiodifusora pública internacional de Alemania con análisis exhaustivo del conflicto para la audiencia rusoparlante.", "published": "2026-09-18T16:57:00+00:00", "category": "economia", "relevance_score": 11, "date_added": "2026-09-18", "title_es": "Reuters: La dirección de AfD tiene la intención de discutir con el Kremlin la reanudación del suministro de gas a Alemania", "text_es": "La dirección del partido de extrema derecha Alternativa para Alemania (AfD) planea discutir con el Kremlin la reanudación del suministro de gas de Rusia a Alemania. Reuters informó esto el viernes 18 de septiembre, citando dos fuentes bien informadas.\n\nSegún estos datos, la reunión está prevista para la primavera de 2026. Se espera que por parte de AfD participen los copresidentes del partido, Alice Weidel y Tino Chrupalla, y por parte rusa, el asesor del presidente ruso, Vladimir Putin, Kirill Dmitriev. Alternativa para Alemania aún no se ha pronunciado sobre esta información.\n\nReuters señala que el AfD no tiene autoridad para reanudar el suministro de gas desde Rusia. La política energética es prerrogativa del gobierno alemán y es muy poco probable que la extrema derecha pueda entrar en ella, señala la agencia, a pesar del reciente éxito en las elecciones al Landtag de Sajonia-Anhalt y del aumento general de su calificación en Alemania. Reuters recuerda que otras fuerzas políticas se niegan a formar una coalición con el AfD, que la Oficina Federal para la Protección de la Constitución (BfV) clasificó en 2025 como asociación de extrema derecha.\n\nEn una entrevista con Reuters publicada el 30 de junio, Weidel pidió el fin del boicot al petróleo y al gas rusos. \"La energía barata procedente de Rusia fue el secreto del éxito de la marca Made in Germany. Tenemos que recuperarla\", afirmó la copresidenta de AfD. Dejó claro que considera las elecciones en el este de Alemania como un trampolín hacia la cancillería.\n\nAntes de las elecciones parlamentarias en Sajonia-Anhalt, Alternativa para Alemania prometió a los votantes, entre otras cosas, buscar el fin de las sanciones contra la Federación Rusa en el sector energético y la “normalización de las relaciones comerciales entre Alemania y Rusia”, incluida la reanudación de las compras de gasoducto ruso a través del Nord Stream."}, {"id": "651497e87399", "title_original": "Russia attacks central Odesa twice, repeat strike hits during rescue operation: 10 injured – photos", "text_original": "Russian forces attacked central Odesa twice on 18 September, and the repeat strike came as first responders were working at the scene. Ten people have been injured in the attacks.\n\nSource: Serhii Lysak, Head of Odesa City Military Administration; Oleh Kiper, Head of Odesa Oblast Military Administration; Suspilne, Ukraine's national public broadcaster\n\nUpdate: Kiper said Russian forces attacked the central part of the city twice in quick succession. The repeat strike occurred while first responders were dealing with the aftermath of the first attack and helping people.\n\nAs of the evening, 10 people are known to have been injured. Three of them were hospitalised, while the others received medical treatment at the scene.\n\nThe attacks damaged an office building and vehicles.\n\nDetails: Lysak had earlier reported that a Russian drone struck an office building in a busy area in central Odesa. A fire broke out on several floors of the building following the strike.", "link": "https://www.pravda.com.ua/eng/news/2026/09/18/8054100/", "source_id": "ukrainska_pravda_en", "source_name": "Ukrainska Pravda (EN)", "perspective": "ukraine", "language": "en", "bias_note": "Uno de los periódicos más leídos e históricos de Ucrania (versión internacional en inglés).", "published": "2026-09-18T16:41:00+00:00", "category": "drones", "relevance_score": 25, "date_added": "2026-09-18", "title_es": "Rusia ataca dos veces el centro de Odesa y repite el ataque durante la operación de rescate: 10 heridos – fotos", "text_es": "Las fuerzas rusas atacaron el centro de Odesa dos veces el 18 de septiembre, y el nuevo ataque se produjo cuando los socorristas estaban trabajando en el lugar. Diez personas han resultado heridas en los ataques.\n\nFuente: Serhii Lysak, Jefe de la Administración Militar de la ciudad de Odesa; Oleh Kiper, Jefe de la Administración Militar del Óblast de Odesa; Suspilne, la emisora ​​pública nacional de Ucrania\n\nActualización: Kiper dijo que las fuerzas rusas atacaron la parte central de la ciudad dos veces en rápida sucesión. El nuevo ataque se produjo mientras los socorristas se ocupaban de las secuelas del primer ataque y ayudaban a la gente.\n\nHasta la tarde se sabía que 10 personas habían resultado heridas. Tres de ellos fueron hospitalizados, mientras que los demás recibieron atención médica en el lugar.\n\nLos ataques dañaron un edificio de oficinas y vehículos.\n\nDetalles: Lysak había informado anteriormente que un dron ruso atacó un edificio de oficinas en una zona concurrida en el centro de Odesa. Tras el ataque se produjo un incendio en varias plantas del edificio."}, {"id": "efa79926f1cc", "title_original": "Russian drone drops explosives on Kherson hospital grounds, damaging service vehicle", "text_original": "Russian occupiers dropped explosives from a drone onto the grounds of a hospital in Kherson, damaging several vehicles used by hospital staff, according to Head of Kherson City Military Administration Yaroslav Shanko.\n\n\"The enemy continues to cynically target civilian infrastructure in Kherson,\" Shanko said on Telegram on Friday.\n\nAccording to him, after 14:00, Russian occupiers dropped explosives from a drone onto the grounds of one of the city's hospitals in Korabelny district.\n\n\"Several vehicles used for official duties were damaged as a result of this attack. No reports of injuries have been received,\" the head of the city administration said.", "link": "https://en.interfax.com.ua/news/general/1206717.html", "source_id": "interfax_ukraine", "source_name": "Interfax-Ucrania", "perspective": "ukraine", "language": "en", "bias_note": "Agencia de noticias ucraniana de referencia para despachos militares y declaraciones gubernamentales.", "published": "2026-09-18T16:23:28+00:00", "category": "drones", "relevance_score": 25, "date_added": "2026-09-18", "title_es": "Un dron ruso lanza explosivos en los terrenos del hospital de Kherson y daña un vehículo de servicio", "text_es": "Los ocupantes rusos arrojaron explosivos desde un dron en los terrenos de un hospital en Kherson, dañando varios vehículos utilizados por el personal del hospital, según el jefe de la administración militar de la ciudad de Kherson, Yaroslav Shanko.\n\n\"El enemigo continúa atacando cínicamente la infraestructura civil en Kherson\", dijo Shanko en Telegram el viernes.\n\nSegún sus palabras, después de las 14:00 horas los ocupantes rusos arrojaron explosivos desde un dron en el terreno de uno de los hospitales de la ciudad en el distrito de Korabelny.\n\n\"Como resultado de este ataque, varios vehículos utilizados para tareas oficiales resultaron dañados. No se han recibido informes de heridos\", dijo el jefe de la administración de la ciudad."}, {"id": "717cee27096d", "title_original": "ВС России поразили сухогруз с грузами для ВСУ, шедший в Одессу", "text_original": "МОСКВА, 18 сен - РИА Новости. Российские вооруженные силы в ходе ударов днем в пятницу поразили сухогруз, который перевозил в порт Одесса грузы, предназначенные для обеспечения ВСУ, сообщили в Минобороны РФ.\n\nВС РФ в течение пятницы продолжили нанесение ударов беспилотниками по портам Украины и морским судам, используемым в интересах ВСУ.\n\n\"На переходе морем нанесено поражение морскому судну типа \"сухогруз\", перевозившему в порт \"Одесса\" грузы, предназначенные для обеспечения ВСУ\", - говорится в сообщении.", "link": "https://ria.ru/20260918/sukhogruz-2118605324.html", "source_id": "ria_novosti", "source_name": "RIA Novosti (РИА)", "perspective": "russia_official", "language": "ru", "bias_note": "Agencia estatal rusa del conglomerado Rossiya Segodnya. Postura y partes de guerra oficiales del Kremlin.", "published": "2026-09-18T15:40:04+00:00", "category": "frente", "relevance_score": 27, "date_added": "2026-09-18", "title_es": "Las Fuerzas Armadas rusas atacaron un carguero con cargamento para las Fuerzas Armadas de Ucrania que se dirigía a Odessa", "text_es": "MOSCÚ, 18 de septiembre - RIA Novosti. Durante los ataques del viernes por la tarde, las fuerzas armadas rusas atacaron un buque de carga que transportaba carga destinada a abastecer a las Fuerzas Armadas de Ucrania al puerto de Odessa, informó el Ministerio de Defensa ruso.\n\nEl viernes, las Fuerzas Armadas de Rusia continuaron realizando ataques con aviones no tripulados contra puertos y buques marítimos ucranianos utilizados en interés de las Fuerzas Armadas de Ucrania.\n\n\"Durante el viaje por mar, resultó dañado un buque de carga seca que transportaba carga destinada a apoyar a las Fuerzas Armadas de Ucrania al puerto de Odessa\", dice el mensaje."}, {"id": "42afed2c4aaa", "title_original": "ВС России поразили танкер с ГСМ для украинской армии в порту Одесса", "text_original": "МОСКВА, 18 сен - РИА Новости. Армия России поразила в порту \"Одесса\" танкер, доставивший горюче-смазочные материалы для ВСУ, сообщило в пятницу министерство обороны РФ.\n\nВ течение дня ВС РФ продолжили наносить удары по портам Украины и морским судам, используемым в интересах ВСУ.\n\n\"В результате ударов поражены... в порту \"Одесса\" - морское судно типа \"танкер\", доставившее горюче-смазочные материалы для украинской армии\", - говорится в сообщении.", "link": "https://ria.ru/20260918/svo-2118605220.html", "source_id": "ria_novosti", "source_name": "RIA Novosti (РИА)", "perspective": "russia_official", "language": "ru", "bias_note": "Agencia estatal rusa del conglomerado Rossiya Segodnya. Postura y partes de guerra oficiales del Kremlin.", "published": "2026-09-18T15:39:49+00:00", "category": "frente", "relevance_score": 17, "date_added": "2026-09-18", "title_es": "Las Fuerzas Armadas rusas atacaron un camión cisterna con combustible y lubricantes para el ejército ucraniano en el puerto de Odesa", "text_es": "MOSCÚ, 18 de septiembre - RIA Novosti. El ejército ruso atacó en el puerto de Odessa un petrolero que transportaba combustible y lubricantes para las Fuerzas Armadas de Ucrania, informó este viernes el Ministerio de Defensa ruso.\n\nDurante el día, las Fuerzas Armadas de Rusia continuaron atacando puertos y buques marítimos ucranianos utilizados en interés de las Fuerzas Armadas de Ucrania.\n\n\"Como resultado de los ataques, un buque cisterna que entregaba combustible y lubricantes para el ejército ucraniano fue alcanzado... en el puerto de Odessa\", dice el comunicado."}, {"id": "cef50bfa3837", "title_original": "Аскольд Запашный проголосовал на выборах в Госдуму из-за рубежа", "text_original": "МОСКВА, 18 сен – РИА Новости. Народный артист России Аскольд Запашный проголосовал на выборах депутатов Государственной думы России в дистанционном формате из-за рубежа, сообщил РИА Новости его брат, народный артист РФ Эдгард Запашный.\n\n\"Мы с Аскольдом сегодня голосуем по-разному: мой брат сейчас находится в вынужденной командировке за границей, и он проголосовал онлайн, я же своим примером показываю, что можно и прийти на участок выразить гражданскую позицию\", - сказал Запашный, отвечая на вопрос РИА Новости о выборе формата голосования.\n\nСам Эдгард Запашный в пятницу посетил избирательный участок №2496 в Москве и проголосовал с помощью терминала электронного голосования. Он отметил высокий уровень новых технологий, с помощью которых можно выполнить гражданский долг за считанные минуты.\n\n\"У меня есть опыт голосования в разных форматах, и в разные годы я это делаю по-разному, сейчас просто решил воспользоваться новыми технологиями, приятно поработать на новой умной машине, удобно даже изучить кандидатов, если не ознакомился с ними и их предвыборными кампаниями заранее, и теперь весь процесс занимает считанные минуты\", - заключил он.\n\nГолосование на выборах депутатов Государственной думы девятого созыва проходит в три дня - с 18 по 20 сентября. Президент России Владимир Путин называл эти выборы в Госдуму важнейшим внутриполитическим событием страны.", "link": "https://ria.ru/20260918/zapashnyy-2118604392.html", "source_id": "ria_novosti", "source_name": "RIA Novosti (РИА)", "perspective": "russia_official", "language": "ru", "bias_note": "Agencia estatal rusa del conglomerado Rossiya Segodnya. Postura y partes de guerra oficiales del Kremlin.", "published": "2026-09-18T15:36:43+00:00", "category": "frente", "relevance_score": 11, "date_added": "2026-09-18", "title_es": "Askold Zapashny votó en las elecciones a la Duma Estatal desde el extranjero", "text_es": "MOSCÚ, 18 de septiembre – RIA Novosti. El Artista del Pueblo de Rusia Askold Zapashny votó en las elecciones de los diputados de la Duma Estatal de Rusia de forma remota desde el extranjero, dijo a RIA Novosti su hermano, el Artista del Pueblo de la Federación de Rusia Edgard Zapashny.\n\n\"Askold y yo votamos hoy de manera diferente: mi hermano se encuentra ahora en un viaje de negocios forzoso al extranjero y votó en línea, pero con mi ejemplo muestro que se puede venir a los colegios electorales para expresar su posición cívica\", dijo Zapashny, respondiendo a la pregunta de RIA Novosti sobre la elección del formato de votación.\n\nEl propio Edgard Zapashny visitó el viernes el colegio electoral núm. 2496 en Moscú y votó mediante un terminal de votación electrónico. Señaló el alto nivel de las nuevas tecnologías, con las que se puede cumplir el deber cívico en cuestión de minutos.\n\n\"Tengo experiencia votando en diferentes formatos, y en diferentes años lo hago de diferentes maneras, ahora simplemente decidí aprovechar las nuevas tecnologías, es agradable trabajar en una nueva máquina inteligente, incluso es conveniente estudiar a los candidatos si no me he familiarizado de antemano con ellos y sus campañas electorales, y ahora todo el proceso toma unos minutos\", concluyó.\n\nLa votación en las elecciones de diputados a la Duma Estatal de la novena convocatoria se lleva a cabo durante tres días, del 18 al 20 de septiembre. El presidente ruso Vladimir Putin calificó estas elecciones a la Duma Estatal como el evento político interno más importante del país."}, {"id": "d11c633c5ec6", "title_original": "На Западе заговорили об отчаянии после ударов ВС России по Одессе", "text_original": "МОСКВА, 18 сен — РИА Новости. Украина и ее западные союзники оказались в безнадежной ситуации из-за ударов ВС России по военным целям в черноморских портах, заявил британский аналитик Александр Меркурис.\n\n\"Поразительно, что до сих пор предпринимаются попытки провезти оружие на судах, следующих в украинские порты на Черном море. Это свидетельствует о том, насколько велико сегодня отчаяние на Западе и на Украине из-за общей ситуации в стране: корабли по-прежнему пытаются пройти через шквал российских ракетных и беспилотных ударов\", — рассказал он в эфире YouTube-канала.\n\nПо его мнению, Киев и его западные партнеры оказались в тупике, поскольку не могут отказаться от попыток доставлять оружие через одесские порты: такой шаг, как утверждает аналитик, \"положит конец украинской армии\". При этом военные грузы неизбежно подвергаются российским атакам, из-за чего перевозить значительные объемы поставок практически невозможно.\n\nВ пятницу в Минобороны сообщили, что российские военные нанесли удары по четырем судам типа \"сухогруз\" в портах Черноморск, Одесса и в акватории Черного моря.\n\nВ ответ на агрессию противника армия бьет по центрам принятия решений, заводам и складам, которые ВСУ используют совместно с натовскими специалистами. Бойцы применяют ударные БПЛА и высокоточное оружие дальнего действия, способное уничтожить любую цель на всей украинской территории.\n\nКак отмечал посол по особым поручениям МИД Родион Мирошник, ВСУ используют морской путь как круглосуточный канал доставки вооружений. За три года через одесские порты прошло около восьми тысяч судов с военными грузами, что объясняет удары ВС России по этим целям.", "link": "https://ria.ru/20260918/udary-2118602787.html", "source_id": "ria_novosti", "source_name": "RIA Novosti (РИА)", "perspective": "russia_official", "language": "ru", "bias_note": "Agencia estatal rusa del conglomerado Rossiya Segodnya. Postura y partes de guerra oficiales del Kremlin.", "published": "2026-09-18T15:27:45+00:00", "category": "frente", "relevance_score": 35, "date_added": "2026-09-18", "title_es": "En Occidente se empezó a hablar de desesperación tras los ataques militares rusos a Odessa.", "text_es": "MOSCÚ, 18 de septiembre – RIA Novosti. Ucrania y sus aliados occidentales se encuentran en una situación desesperada debido a los ataques militares rusos contra objetivos militares en puertos del Mar Negro, dijo el analista británico Alexander Merkouris.\n\n\"Es sorprendente que todavía se hagan intentos de contrabandear armas en barcos que se dirigen a puertos ucranianos en el Mar Negro. Esto indica cuán grande es hoy la desesperación en Occidente y en Ucrania debido a la situación general en el país: los barcos todavía están tratando de atravesar el aluvión de ataques rusos con misiles y drones\", dijo en el canal de YouTube.\n\nEn su opinión, Kiev y sus socios occidentales se encuentran en un punto muerto porque no pueden abandonar los intentos de entregar armas a través de los puertos de Odessa: tal paso, afirma el analista, \"pondrá fin al ejército ucraniano\". Al mismo tiempo, el cargamento militar está inevitablemente sujeto a ataques rusos, lo que hace casi imposible transportar volúmenes significativos de suministros.\n\nEl viernes, el Ministerio de Defensa informó que el ejército ruso atacó cuatro buques de carga seca en los puertos de Chernomorsk, Odessa y en el Mar Negro.\n\nEn respuesta a la agresión enemiga, el ejército ataca los centros de toma de decisiones, fábricas y almacenes que las Fuerzas Armadas de Ucrania utilizan junto con los especialistas de la OTAN. Los cazas utilizan vehículos aéreos no tripulados de ataque y armas de precisión de largo alcance capaces de destruir cualquier objetivo en todo el territorio ucraniano.\n\nComo señaló el embajador especial del Ministerio de Asuntos Exteriores, Rodion Miroshnik, las Fuerzas Armadas de Ucrania utilizan la ruta marítima como canal de 24 horas para el suministro de armas. Durante tres años, unos ocho mil barcos con cargamento militar pasaron por los puertos de Odesa, lo que explica los ataques de las Fuerzas Armadas rusas contra estos objetivos."}, {"id": "294683b0ef34", "title_original": "Путина обрадовало, что москвичи удивляются качеству ФАП в деревне Финеево", "text_original": "МОСКВА, 18 сен - РИА Новости. Президента РФ Владимира Путина обрадовало, что даже москвичи удивляются качеству фельдшерско-акушерского пункта (ФАП) в деревне Финеево Владимирской области.\n\nГлава государства в пятницу в формате видеоконференции принимает участие в открытии объектов социальной газификации в различных регионах России. Так, во Владимирской области в деревне Финеево к сетевому газу подключили местный фельдшерско-акушерский пункт.\n\n\"Это значимо не только для нашей деревни, но и для жителей соседних деревень Старого, Илейкина, Никифорова, Ильинская, которые также находятся на нашем обслуживании. Это почти 200 человек. С сетевым газом нам зима не страшна\",- рассказала президенту заведующая Финеевским фельдшерско-акушерским пунктом Валентина Смирнова.\n\nПо ее словам, в пункте теперь комфортные условия, не хуже, чем в городе.\n\nПутин в свою очередь поинтересовался, в каком состоянии находится сам фельдшерский пункт. Заведующая ответила, что в хорошем, капитальный ремонт проводили 12 лет назад. На вопрос президента, не пора ли организовать новый капремонт, заведующая ответила, что пунктом восхищаются даже москвичи.\n\n\"Нет, он хорошо выглядит. Лучше, чем в городе. Все, даже москвичи, удивляются как у нас чисто и красиво\",- сказала Смирнова.", "link": "https://ria.ru/20260918/moskvichi-2118602396.html", "source_id": "ria_novosti", "source_name": "RIA Novosti (РИА)", "perspective": "russia_official", "language": "ru", "bias_note": "Agencia estatal rusa del conglomerado Rossiya Segodnya. Postura y partes de guerra oficiales del Kremlin.", "published": "2026-09-18T15:26:02+00:00", "category": "diplomacia", "relevance_score": 11, "date_added": "2026-09-18", "title_es": "Putin se mostró satisfecho de que los moscovitas estuvieran sorprendidos por la calidad del FAP en el pueblo de Fineevo.", "text_es": "MOSCÚ, 18 de septiembre - RIA Novosti. El presidente ruso, Vladimir Putin, se mostró satisfecho de que incluso los moscovitas se sorprendieran por la calidad del puesto de primeros auxilios (FAP) en el pueblo de Fineevo, en la región de Vladimir.\n\nEl Jefe de Estado participa el viernes por videoconferencia en la inauguración de instalaciones de gasificación social en varias regiones de Rusia. Así, en la región de Vladimir, en el pueblo de Fineevo, se conectó a la red de gas una estación local de paramédicos y obstetricia.\n\n\"Esto es importante no sólo para nuestra aldea, sino también para los residentes de las aldeas vecinas de Staroye, Ileikin, Nikiforova, Ilyinskaya, que también están a nuestro servicio. Son casi 200 personas. Con el gas de red no tememos al invierno\", dijo al presidente Valentina Smirnova, jefa del centro médico y obstétrico de Fineevsky.\n\nSegún ella, el punto ahora cuenta con condiciones cómodas, no peores que en la ciudad.\n\nPutin, a su vez, preguntó sobre el estado de la propia estación de paramédicos. El gerente respondió que estaba en buenas condiciones, que se realizaron reparaciones importantes hace 12 años. Cuando el presidente preguntó si ya era hora de organizar una nueva reforma, el gerente respondió que incluso los moscovitas admiraban el artículo.\n\n\"No, tiene buena pinta. Mejor que en la ciudad. Todo el mundo, incluso los moscovitas, se sorprende de lo limpio y bonito que es aquí\", dijo Smirnova."}, {"id": "b7ff06245028", "title_original": "Зеленский выступил с тяжелым признанием об Украине", "text_original": "МОСКВА, 18 сен — РИА Новости. Владимир Зеленский во время беседы с председателем Еврокомиссии Урсулой фон дер Ляйен назвал дефицит украинского бюджета \"космическим\", сообщает \"Страна.ua\".\n\nПо словам Зеленского, несмотря на масштаб проблемы, Киев надеется найти какое-то решение.\n\nАгентство Reuters сообщало 12 сентября со ссылкой на главу комитета Верховной рады по вопросам бюджета Роксолану Пидласу, что Украина больше не может полностью обеспечивать свои оборонные нужды за счет внутренних ресурсов.\n\nЗеленский на встрече с украинскими журналистами признал дефицит в украинском бюджете на ВСУ в размере 27 миллиардов долларов. Он потребовал у Европы уже сейчас дать часть денег из кредита ЕС, предусмотренного для Киева на следующий год, чтобы покрыть дефицит финансирования оборонных расходов.\n\nWashington Post со ссылкой на двух дипломатов сообщал, что европейские политики ожидали \"некоторого расхождения с бюджетными прогнозами\", но не предполагали \"такого огромного\" дефицита так быстро. Как отмечалось в публикации, в Европе возникают серьезные вопросы касательно того, как именно была рассчитана сумма в 27 миллиардов долларов.\n\nУкраина последние несколько лет формирует бюджет с рекордным дефицитом, рассчитывая покрывать его за счет западной помощи. Бюджет страны на этот год был принят с дефицитом в 1,9 триллиона гривен (45 миллиардов долларов).", "link": "https://ria.ru/20260918/zelenskiy-2118602216.html", "source_id": "ria_novosti", "source_name": "RIA Novosti (РИА)", "perspective": "russia_official", "language": "ru", "bias_note": "Agencia estatal rusa del conglomerado Rossiya Segodnya. Postura y partes de guerra oficiales del Kremlin.", "published": "2026-09-18T15:25:39+00:00", "category": "frente", "relevance_score": 11, "date_added": "2026-09-18", "title_es": "Zelensky hizo una difícil confesión sobre Ucrania", "text_es": "MOSCÚ, 18 de septiembre – RIA Novosti. Vladimir Zelensky, durante una conversación con la presidenta de la Comisión Europea, Ursula von der Leyen, calificó el déficit presupuestario ucraniano de \"cósmico\", informa Strana.ua.\n\nSegún Zelensky, a pesar de la magnitud del problema, Kiev espera encontrar algún tipo de solución.\n\nReuters informó el 12 de septiembre, citando a Roksolana Pidlasa, jefa del Comité de Presupuesto de la Verjovna Rada, que Ucrania ya no puede satisfacer plenamente sus necesidades de defensa con recursos internos.\n\nZelensky, en una reunión con periodistas ucranianos, admitió el déficit en el presupuesto ucraniano para las Fuerzas Armadas de Ucrania por un monto de 27 mil millones de dólares. Exigió que Europa entregue ahora parte del dinero del préstamo de la UE otorgado a Kiev para el próximo año para cubrir el déficit en la financiación del gasto de defensa.\n\nEl Washington Post, citando a dos diplomáticos, informó que los responsables políticos europeos esperaban \"alguna divergencia con respecto a las previsiones presupuestarias\", pero no anticiparon un déficit \"tan enorme\" tan rápidamente. Como se señala en la publicación, en Europa surgen serias dudas sobre cómo se calculó exactamente la cantidad de 27 mil millones de dólares.\n\nEn los últimos años, Ucrania ha estado elaborando un presupuesto con un déficit récord, con la esperanza de cubrirlo con ayuda occidental. El presupuesto del país para este año fue aprobado con un déficit de 1,9 billones de jrivnia (45 mil millones de dólares)."}, {"id": "6741bf6e7484", "title_original": "В Кремле опровергли сообщения о планах по мобилизации", "text_original": "МОСКВА, 18 сен - РИА Новости. Планов по призыву 300 тысяч человек в российскую армию до конца 2026 года нет, заявил пресс-секретарь президента РФ Дмитрий Песков.\n\nРанее агентство Блумберг писало о якобы планах \"скрытой мобилизации\" в России после парламентских выборов, в рамках которой планируется призвать 300 тысяч человек до конца 2026 года.\n\n\"Нет. Таких планов нет\", - сказал Песков RTVI, комментируя сообщение агентства.\n\nПрезидент России Владимир Путин ранее назвал вбросами информацию о якобы планируемой мобилизации в РФ, отметив, что это попытка противника повлиять на результаты голосования на выборах в Госдуму.", "link": "https://ria.ru/20260918/kreml-2118601623.html", "source_id": "ria_novosti", "source_name": "RIA Novosti (РИА)", "perspective": "russia_official", "language": "ru", "bias_note": "Agencia estatal rusa del conglomerado Rossiya Segodnya. Postura y partes de guerra oficiales del Kremlin.", "published": "2026-09-18T15:23:31+00:00", "category": "frente", "relevance_score": 11, "date_added": "2026-09-18", "title_es": "El Kremlin desmintió informes sobre planes de movilización", "text_es": "MOSCÚ, 18 de septiembre - RIA Novosti. No hay planes de reclutar a 300.000 personas en el ejército ruso para finales de 2026, afirmó el secretario de prensa presidencial ruso, Dmitry Peskov.\n\nAnteriormente Bloomberg escribió sobre supuestos planes de “movilización oculta” en Rusia después de las elecciones parlamentarias, en cuyo marco está previsto reclutar a 300 mil personas hasta finales de 2026.\n\n\"No. No existen tales planes\", dijo Peskov a RTVI, comentando el informe de la agencia.\n\nEl presidente ruso, Vladimir Putin, calificó anteriormente de falsa la información sobre la movilización supuestamente planificada en la Federación de Rusia, señalando que se trata de un intento del enemigo de influir en los resultados de las elecciones a la Duma Estatal."}, {"id": "f9d1ff280592", "title_original": "Five people injured in attack on downtown Odesa – administration", "text_original": "The number of casualties in Odesa following a strike by an enemy drone on an administrative building, which is currently engulfed in flames, has risen to five, according to Head of the regional military administration Oleh Kiper.\n\n\"We currently know of five people injured as a result of the strike on central Odesa. Most of the victims have shrapnel wounds. All are receiving the necessary medical care,\" he said on Telegram on Friday.\n\nAccording to him, the attack damaged the facade and windows of the administrative building. The resulting fire spread across several floors. Cleanup efforts are ongoing at the scene.\n\nEarlier reports had mentioned three casualties.", "link": "https://en.interfax.com.ua/news/general/1206686.html", "source_id": "interfax_ukraine", "source_name": "Interfax-Ucrania", "perspective": "ukraine", "language": "en", "bias_note": "Agencia de noticias ucraniana de referencia para despachos militares y declaraciones gubernamentales.", "published": "2026-09-18T15:14:56+00:00", "category": "drones", "relevance_score": 25, "date_added": "2026-09-18", "title_es": "Cinco personas resultaron heridas en un ataque en el centro de Odesa – administración", "text_es": "El número de víctimas en Odesa tras el ataque de un dron enemigo contra un edificio administrativo actualmente envuelto en llamas ha aumentado a cinco, según informó el jefe de la administración militar regional, Oleh Kiper.\n\n\"Actualmente sabemos de cinco personas heridas como resultado del ataque en el centro de Odesa. La mayoría de las víctimas tienen heridas de metralla. Todos reciben la atención médica necesaria\", dijo el viernes en Telegram.\n\nSegún él, el ataque dañó la fachada y las ventanas del edificio administrativo. El incendio resultante se extendió por varios pisos. Se están realizando esfuerzos de limpieza en el lugar.\n\nInformes anteriores habían mencionado tres víctimas."}, {"id": "b17bcf844ae6", "title_original": "Russian Far East Crude Tops $120 Per Barrel as Middle East Supply Shocks Drive Chinese Demand", "text
