 el próximo año\", señaló Sybiha.\n\nDestacó que Putin es consciente de lo delicado que es el tema de la migración en las campañas electorales europeas y, según él, ha observado con qué eficacia las redes vinculadas a Rusia explotaron la reciente crisis en Ceuta.\n\nSybiha también señaló que Moscú utilizará los métodos disponibles para aumentar la migración a Europa, siendo el bloqueo del Mar Negro sólo uno de ellos. Citó al régimen de Lukashenko en Bielorrusia como otro."}, {"id": "ff4d031804d4", "title_original": "Кто из кандидатов \"Яблока\" еще идет на выборы в Госдуму?", "text_original": "Федеральный список российской партии \"Яблоко\" снят с выборов в Госдуму РФ, но это решение не распространяется на одномандатников. По округам избираются 225 из 450 депутатов нижней палаты российского парламента. По данным источника \"Новой газеты Европа\", на 11 сентября партия сохранила 103 из 137 выдвинутых кандидатов. На ее сайте тогда значились 118 человек в 47 регионах: в это число входили и те, кто еще обжаловал снятие.\n\nОднако к дню голосования их число может измениться: представители партии сталкиваются с давлением, а как минимум три кандидата сообщили об угрозах убийством и требованиях снять кандидатуру. DW рассказывает, кто продолжает избирательную кампанию от \"Яблока\" и как политологи оценивают перспективы партии.\n\nВ Москве по Ховринскому округу №206 зарегистрирован Виктор Коган-Ясный, советник сооснователя \"Яблока\" Григория Явлинского. Он родился в Харькове, окончил химический факультет МГУ и с 1989 года занимается общественной деятельностью. В 1990-1991 годах был помощником председателя Комитета Верховного Совета РСФСР по правам человека, а до этого в качестве активиста сотрудничал с \"Мемориалом\" и \"Московской трибуной\".\n\nВ Санкт-Петербурге по Юго-Восточному округу №217 баллотируется юрист Виталий Исаков, представлявший интересы зампредседателя \"Яблока\" Льва Шлосберга в суде. По Северо-Западному округу №215 в том же городе выдвинута врач, анестезиолог-реаниматолог центра имени Алмазова Ольга Юркевич. Ее кампания столкнулась с ограничениями агитации: после прекращения трансляции ролика с программой партии она записала видео, в котором минуту молчит, закрыв рот рукой. Его также не пропускали в эфир. По данным интернет-издания \"Бумага\", агитационные ролики санкт-петербургских кандидатов партии направляли на проверку, в том числе на признаки \"дискредитации\" армии.\n\n10 августа Верховный суд РФ по иску партии \"Родина\" отменил регистрацию федерального списка \"Яблока\", в котором было 269 кандидатов. Суд усмотрел нарушения в финансировании кампании и использовании объектов интеллектуальной собственности в агитации. Партия оспаривала эти выводы, но 17 августа апелляционная инстанция оставила решение в силе. Перед заседанием, по словам председателя \"Яблока\" Николая Рыбакова, у суда задержали не менее 35 человек.\n\nЕще до решающей стадии кампании ряд политиков \"Яблока\" лишился возможности баллотироваться из-за дел о \"демонстрации экстремистской символики\". Во всех случаях суд усмотрел \"экстремизм\" в фотографиях или упоминаниях основателя Фонда борьбы с коррупцией Алексея Навального. Среди них - Эмилия Слабунова в Карелии, Александр Шишлов и Ольга Штанникова в Санкт-Петербурге, Артур Гайдук в Псковской области. Логотипы Facebook и Instagram (в России Meta признана экстремистской организацией) стали поводом для снятия с выборов кандидата от \"Яблока\" Антона Гендриксона в Калининградской области, ему также назначили десять суток административного ареста.", "link": "https://www.dw.com/ru/кто-из-кандидатов-яблока-еще-идет-на-выборы-в-госдуму/a-79290464?maca=rus-rss-ru-all-1126-xml-mrss", "source_id": "dw_russian", "source_name": "Deutsche Welle (DW Ruso)", "perspective": "international", "language": "ru", "bias_note": "Radiodifusora pública internacional de Alemania con análisis exhaustivo del conflicto para la audiencia rusoparlante.", "published": "2026-09-16T11:42:00+00:00", "category": "economia", "relevance_score": 17, "date_added": "2026-09-16", "title_es": "¿Qué candidato de Yabloko sigue presentándose a las elecciones a la Duma Estatal?", "text_es": "La lista federal del partido ruso Yabloko ha sido eliminada de las elecciones a la Duma Estatal de la Federación de Rusia, pero esta decisión no se aplica a los candidatos de mandato único. 225 de los 450 diputados de la cámara baja del parlamento ruso son elegidos por distritos. Según una fuente de Novaya Gazeta Europa, al 11 de septiembre el partido conservaba 103 de los 137 candidatos nominados. En ese momento, en su sitio web figuraban 118 personas en 47 regiones: esta cifra incluía a quienes todavía apelaron la retirada.\n\nSin embargo, sus cifras podrían cambiar el día de las elecciones, ya que los funcionarios del partido se enfrentarán a presiones y al menos tres candidatos denunciarán amenazas de muerte y se les exigirá que retiren su candidatura. DW cuenta quién continúa la campaña electoral de Yabloko y cómo evalúan los politólogos las perspectivas del partido.\n\nViktor Kogan-Yasny, asesor del cofundador de Yabloko, Grigory Yavlinsky, está registrado en Moscú, en el distrito 206 de Khovrinsky. Nació en Jarkov, se graduó en la Facultad de Química de la Universidad Estatal de Moscú y ha estado involucrado en actividades sociales desde 1989. En 1990-1991, fue asistente del presidente del Consejo Supremo del Comité de Derechos Humanos de la RSFSR, y antes que, como activista, colaboró con Memorial y el Tribuna de Moscú.\n\nEn San Petersburgo, el abogado Vitaly Isakov, que representó los intereses del vicepresidente de Yabloko, Lev Shlosberg, se presenta por el distrito 217 del sudeste. Olga Yurkevich, médica y anestesióloga-resucitadora del Centro Almazov, fue nominada para el distrito 215 del noroeste de la misma ciudad. Su campaña enfrentó restricciones a la hora de hacer campaña: después de que dejó de transmitirse el video del programa del partido, grabó un video en el que permaneció en silencio durante un minuto, tapándose la boca con la mano. Tampoco se le permitió salir al aire. Según la publicación en línea Bumaga, se enviaron vídeos de campaña de los candidatos del partido de San Petersburgo para su verificación, incluso en busca de signos de “desacreditación” del ejército.\n\nEl 10 de agosto, el Tribunal Supremo de la Federación de Rusia, a petición del partido Rodina, canceló el registro de la lista federal Yabloko, que incluía 269 candidatos. El tribunal encontró violaciones en la financiación de la campaña y el uso de propiedad intelectual en la campaña. El partido cuestionó estas conclusiones, pero el 17 de agosto el tribunal de apelaciones confirmó la decisión. Antes de la reunión, según el presidente de Yabloko, Nikolai Rybakov, al menos 35 personas estaban detenidas cerca del tribunal.\n\nIncluso antes de la etapa decisiva de la campaña, varios políticos de Yabloko perdieron la oportunidad de presentarse a las elecciones debido a casos de \"manifestación de símbolos extremistas\". En todos los casos, el tribunal vio “extremismo” en fotografías o referencias al fundador de la Fundación Anticorrupción, Alexei Navalny. Entre ellos se encuentran Emilia Slabunova en Karelia, Alexander Shishlov y Olga Shtannikova en San Petersburgo, Arthur Gaiduk en la región de Pskov. Los logotipos de Facebook e Instagram (Meta es reconocida como una organización extremista en Rusia) fueron el motivo de la destitución del candidato de Yabloko, Anton Gendrikson, de las elecciones en la región de Kaliningrado, y también fue condenado a diez días de arresto administrativo."}, {"id": "0c3d0e92d1ce", "title_original": "AFU General Staff reports hit on enemy Su-24", "text_original": "The General Staff of the Armed Forces of Ukraine (AFU) reported that on September 15 and the night of September 16, several key enemy targets were struck, specifically a Su-24 aircraft at the Saky airbase (in temporarily occupied Crimea) and launch sites for strike UAVs in the temporarily occupied Donetsk region.\n\n\"On September 15 and the night of September 16, units of the Ukrainian Defense Forces struck a number of important military targets belonging to the Russian aggressor. Specifically, a Su-24 aircraft was hit at the Saky airbase in temporarily occupied Crimea. The extent of the damage is being assessed,\" the General Staff said in a Telegram post on Wednesday.\n\nReports also indicate strikes near the city of Donetsk on sites used for the storage, preparation, and launch of strike UAVs, as well as strikes on occupier UAV command posts in Staromlynivka and Pokrovsk (Donetsk region) and Pokrovske (Zaporizhia region).\n\nAn enemy ammunition depot was hit in Dovzhansk, Luhansk region. Fuel and lubricant storage bases, belonging to the occupying forces, were struck in Rovenky (Luhansk region) and Berdyansk (Zaporizhia region). Grenader technical reconnaissance posts were hit in Suvorove and Rysove in temporarily occupied Crimea.", "link": "https://en.interfax.com.ua/news/general/1205291.html", "source_id": "interfax_ukraine", "source_name": "Interfax-Ucrania", "perspective": "ukraine", "language": "en", "bias_note": "Agencia de noticias ucraniana de referencia para despachos militares y declaraciones gubernamentales.", "published": "2026-09-16T11:34:35+00:00", "category": "frente", "relevance_score": 27, "date_added": "2026-09-16", "title_es": "El Estado Mayor de las Fuerzas Armadas de Ucrania informa de un ataque contra el Su-24 enemigo", "text_es": "El Estado Mayor de las Fuerzas Armadas de Ucrania (AFU) informó que el 15 de septiembre y la noche del 16 de septiembre, varios objetivos enemigos clave fueron atacados, específicamente un avión Su-24 en la base aérea de Saky (en Crimea ocupada temporalmente) y sitios de lanzamiento de vehículos aéreos no tripulados de ataque en la región de Donetsk temporalmente ocupada.\n\n\"El 15 de septiembre y la noche del 16 de septiembre, unidades de las Fuerzas de Defensa de Ucrania atacaron varios objetivos militares importantes pertenecientes al agresor ruso. En concreto, un avión Su-24 fue alcanzado en la base aérea de Saky en la Crimea ocupada temporalmente. Se está evaluando la magnitud de los daños\", dijo el Estado Mayor en una publicación en Telegram el miércoles.\n\nLos informes también indican ataques cerca de la ciudad de Donetsk en sitios utilizados para el almacenamiento, preparación y lanzamiento de vehículos aéreos no tripulados de ataque, así como ataques contra puestos de mando de vehículos aéreos no tripulados ocupantes en Staromlynivka y Pokrovsk (región de Donetsk) y Pokrovske (región de Zaporizhia).\n\nEn Dovzhansk, región de Lugansk, fue alcanzado un depósito de municiones enemigo. Las bases de almacenamiento de combustible y lubricantes pertenecientes a las fuerzas de ocupación fueron atacadas en Rovenky (región de Lugansk) y Berdyansk (región de Zaporizhia). Puestos de reconocimiento técnico con granadas fueron alcanzados en Suvorove y Rysove, en la Crimea temporalmente ocupada."}, {"id": "07a782e78f6f", "title_original": "USF confirm elimination of Russian general who reported to Putin on alleged capture of Kostiantynivka", "text_original": "Robert Brovdi (Madyar), Commander of the Unmanned Systems Forces (USF) of the Armed Forces of Ukraine, has confirmed the elimination of Major General Anton Grunis, commander of the 4th Separate Motorized Rifle Brigade of the Russian Armed Forces. In July, Grunis had reported to Vladimir Putin the alleged complete \"capture of Kostiantynivka\" in Donetsk region.\n\n\"As a man with a Hungarian surname, born in Ukraine and fighting alongside the 'Birds' [drone units] for the Motherland, I report verbally: General Grunis was eliminated on September 12, 2026, in his nighttime lair in the temporarily occupied territory of Donetsk region by the 'Birds' USF retribution squad—which delivered a 'special award' to him,\" Brovdi wrote on Telegram on Wednesday, sharing footage of the destruction of Grunis' command post.\n\nAccording to Brovdi, the operation was carried out by personnel from the 427th Separate USF Regiment Rarog.", "link": "https://en.interfax.com.ua/news/general/1205286.html", "source_id": "interfax_ukraine", "source_name": "Interfax-Ucrania", "perspective": "ukraine", "language": "en", "bias_note": "Agencia de noticias ucraniana de referencia para despachos militares y declaraciones gubernamentales.", "published": "2026-09-16T11:31:24+00:00", "category": "frente", "relevance_score": 41, "date_added": "2026-09-16", "title_es": "Las Fuerzas Armadas de Estados Unidos confirman la eliminación del general ruso que informó a Putin sobre la supuesta captura de Kostiantynivka", "text_es": "Robert Brovdi (Madyar), comandante de las Fuerzas de Sistemas No Tripulados (USF) de las Fuerzas Armadas de Ucrania, ha confirmado la eliminación del mayor general Anton Grunis, comandante de la 4ª Brigada Separada de Fusileros Motorizados de las Fuerzas Armadas de Rusia. En julio, Grunis había informado a Vladimir Putin de la supuesta \"captura total de Kostiantynivka\" en la región de Donetsk.\n\n\"Como hombre con apellido húngaro, nacido en Ucrania y que lucha junto a los 'Pájaros' [unidades de drones] por la Patria, informo verbalmente: el general Grunis fue eliminado el 12 de septiembre de 2026, en su guarida nocturna en el territorio temporalmente ocupado de la región de Donetsk por el escuadrón de represalia de las Fuerzas Armadas estadounidenses 'Pájaros', que le entregó un 'premio especial'\", escribió Brovdi en Telegram el miércoles, compartiendo imágenes de la destrucción del puesto de mando de Grunis.\n\nSegún Brovdi, la operación fue llevada a cabo por personal del 427º Regimiento Separado de las Fuerzas Armadas de EE.UU. Rarog."}, {"id": "9ac05ddcc749", "title_original": "Russia demands using of russified place names for occupied Ukrainian territories in IAEA system – GUR", "text_original": "Russian representatives at the IAEA have succeeded in having Crimea designated as Russian territory within the IAEA’s global integrated information system (PRIS) and are demanding further Russification of the names of occupied Ukrainian settlements, according to the Main Intelligence Agency (GUR) of the Ministry of Defence of Ukraine.\n\n\"For instance, IAEA Deputy Director General Mikhail Chudakov—a Russian national—secured the agency's support for displaying the temporarily occupied territory of the Autonomous Republic of Crimea as part of the Russian Federation in the updated IAEA global integrated information system (PRIS),\" the GUR stated in a Telegram post regarding the current situation at the Zaporizhia Nuclear Power Plant (ZNPP) on Wednesday.\n\nIt is also reported that Russian representatives within the organization are demanding the use of Russified names for Ukrainian settlements in the system, specifically: Chernobyl, Rovno, Khmelnitski, and Zaporozhye.\n\nFurthermore, the GUR reports a danger posed by the continuous drop in water levels in the ZNPP cooling pond. While the level stood at 12.86 meters in July 2026, it fell to 12.63 meters in early August and to 12.55 meters by the end of the month, with the decline continuing. A level of 15 meters is considered the minimum required to meet the plant's operational needs.\n\nIt is also noted that instances of external power supply outages at the plant have become more frequent. In August, the ZNPP lost external power three times. Additionally, the plant is experiencing internet connectivity issues. On August 13–14, 2026, the network was disconnected due to the actions of Russian occupying forces, hindering communication, data monitoring, and international oversight. The Kremlin has also stepped up the implementation of its strategy to integrate the Zaporizhia Nuclear Power Plant (ZNPP) into its \"legal framework\"—specifically, the aggressor state's Federal Service for Environmental, Technological and Nuclear Supervision (Rostekhnadzor) has dispatched a special team of inspectors to the plant.\n\n\"At the same time, Moscow is seeking, through its representatives at the IAEA, to russify the organization and leverage the agency's international status to justify the occupation of the ZNPP. One of the objectives of this hybrid campaign is to 'normalize' the information landscape and pave the way for the further legitimization of Russian control over the Ukrainian nuclear power plant,\" the message notes. As part of these efforts, Russia attempted to orchestrate and exploit for its own ends a visit by IAEA Director General Rafael Grossi to the occupied ZNPP ahead of the 70th session of the IAEA General Conference in Vienna (September 14–17), where the issue of nuclear safety in Ukraine is set to be addressed. Grossi visited the ZNPP on September 4.", "link": "https://en.interfax.com.ua/news/general/1205230.html", "source_id": "interfax_ukraine", "source_name": "Interfax-Ucrania", "perspective": "ukraine", "language": "en", "bias_note": "Agencia de noticias ucraniana de referencia para despachos militares y declaraciones gubernamentales.", "published": "2026-09-16T10:36:16+00:00", "category": "frente", "relevance_score": 27, "date_added": "2026-09-16", "title_es": "Rusia exige el uso de topónimos rusificados para los territorios ucranianos ocupados en el sistema de la OIEA – GUR", "text_es": "Los representantes rusos en la OIEA lograron que Crimea fuera designada territorio ruso dentro del sistema global integrado de información (PRIS) de la OIEA y exigen una mayor rusificación de los nombres de los asentamientos ucranianos ocupados, según la Agencia Principal de Inteligencia (GUR) del Ministerio de Defensa de Ucrania.\n\n\"Por ejemplo, el director general adjunto de la OIEA, Mikhail Chudakov, un ciudadano ruso, obtuvo el apoyo de la agencia para mostrar el territorio temporalmente ocupado de la República Autónoma de Crimea como parte de la Federación Rusa en el sistema de información global integrado (PRIS) actualizado de la OIEA\", afirmó el GUR en una publicación de Telegram sobre la situación actual en la central nuclear de Zaporizhia (ZNPP) el miércoles.\n\nTambién se informa que los representantes rusos dentro de la organización exigen el uso de nombres rusificados para los asentamientos ucranianos en el sistema, específicamente: Chernobyl, Rovno, Khmelnitski y Zaporozhye.\n\nAdemás, el GUR advierte del peligro que supone la continua caída del nivel del agua en el estanque de refrigeración de la ZNPP. Si bien el nivel se situó en 12,86 metros en julio de 2026, cayó a 12,63 metros a principios de agosto y a 12,55 metros a finales de mes, y la caída continúa. Un nivel de 15 metros se considera el mínimo requerido para cubrir las necesidades operativas de la planta.\n\nTambién se observa que se han vuelto más frecuentes los casos de cortes de suministro eléctrico externo en la planta. En agosto, el ZNPP se quedó sin suministro externo tres veces. Además, la planta está experimentando problemas de conectividad a Internet. Del 13 al 14 de agosto de 2026, la red se desconectó debido a las acciones de las fuerzas de ocupación rusas, lo que obstaculizó la comunicación, el monitoreo de datos y la supervisión internacional. El Kremlin también ha intensificado la implementación de su estrategia para integrar la Central Nuclear de Zaporizhia (ZNPP) en su \"marco legal\"; específicamente, el Servicio Federal de Supervisión Ambiental, Tecnológica y Nuclear del estado agresor.\n\n\"Al mismo tiempo, Moscú busca, a través de sus representantes en la OIEA, rusificar la organización y aprovechar el estatus internacional de la agencia para justificar la ocupación de la ZNPP. Uno de los objetivos de esta campaña híbrida es 'normalizar' el panorama informativo y allanar el camino para una mayor legitimación del control ruso sobre la central nuclear ucraniana\", señala el mensaje. Como parte de estos esfuerzos, Rusia intentó orquestar y explotar para sus propios fines una visita del Director General de la OIEA, Rafael Grossi, a la ZNPP ocupada antes de la 70ª sesión de la Conferencia General de la OIEA en Viena (del 14 al 17 de septiembre)."}, {"id": "9451b2b2e91c", "title_original": "Russian General Who Oversaw Capture of Ukraine’s Kostiantynivka Dies", "text_original": "A military commander who President Vladimir Putin recently awarded Russia’s highest state honor for the capture of the eastern Ukrainian city of Kostiantynivka has died, Russian and Ukrainian military officials said Wednesday.\n\n“He left us as a hero who carried out his sacred duty,” Alaudinov said without specifying when Grunis died or the circumstances of his death.\n\nUkraine’s Unmanned Systems Forces commander, Robert “Madyar” Brovdi, later claimed that Grunis was “eliminated” in a nighttime raid in the eastern Donetsk region on Sept. 12.\n\nThe Moscow Times could not independently verify the claim.\n\nGrunis commanded the Russian Armed Forces’ 4th Separate Guards Motor Rifle Brigade, which has played a key role in Russia’s offensive in the Donetsk region.\n\nIn July, Grunis personally briefed Putin on the capture of Kostiantynivka, one of four heavily fortified cities that make up Ukraine's so-called “fortress belt” in Donetsk. Earlier, Grunis boasted that his troops had “sliced up the city like a pie” by outflanking Ukrainian defense lines along local reservoirs.", "link": "https://www.themoscowtimes.com/2026/09/16/russian-general-who-oversaw-capture-of-ukraines-kostiantynivka-dies-a93722", "source_id": "the_moscow_times", "source_name": "The Moscow Times", "perspective": "russia_independent", "language": "en", "bias_note": "Diario independiente ruso en el exilio crítico con Putin y con cobertura de ataques en territorio ruso.", "published": "2026-09-16T10:36:00+00:00", "category": "frente", "relevance_score": 33, "date_added": "2026-09-16", "title_es": "Muere el general ruso que supervisó la captura de Kostiantynivka en Ucrania", "text_es": "Un comandante militar a quien el presidente Vladimir Putin recientemente otorgó el más alto honor estatal de Rusia por la captura de la ciudad de Kostiantynivka, en el este de Ucrania, murió, dijeron el miércoles funcionarios militares rusos y ucranianos.\n\n\"Nos dejó como un héroe que cumplió con su deber sagrado\", dijo Alaudinov sin especificar cuándo murió Grunis ni las circunstancias de su muerte.\n\nEl comandante de las Fuerzas de Sistemas No Tripulados de Ucrania, Robert “Madyar” Brovdi, afirmó más tarde que Grunis fue “eliminado” en una incursión nocturna en la región oriental de Donetsk el 12 de septiembre.\n\nEl Moscow Times no pudo verificar de forma independiente la afirmación.\n\nGrunis comandó la 4.ª Brigada de Fusileros Motorizados de la Guardia Separada de las Fuerzas Armadas de Rusia, que ha desempeñado un papel clave en la ofensiva rusa en la región de Donetsk.\n\nEn julio, Grunis informó personalmente a Putin sobre la captura de Kostiantynivka, una de las cuatro ciudades fuertemente fortificadas que conforman el llamado “cinturón de fortalezas” de Ucrania en Donetsk. Anteriormente, Grunis se jactó de que sus tropas habían “cortado la ciudad como un pastel” al flanquear las líneas de defensa ucranianas a lo largo de embalses locales."}, {"id": "d51379bea895", "title_original": "Russia strikes electric locomotive in Kovel – Zelenskyy", "text_original": "Russian forces struck an electric locomotive in Kovel, Volyn region, Ukrainian President Volodymyr Zelenskyy reported.\n\n“Russian attacks on logistics and critical infrastructure continue unabated – the locomotive of a regular passenger train was struck in the Mykolaiv region. A railway station and a diesel locomotive were damaged, but the Ukrzaliznytsia team handled the situation well – they warned people in time, and no one was hurt. Nearly 170 passengers were evacuated. An electric locomotive in Kovel was also struck,” Zelenskyy said on X Wednesday.\n\nAccording to him, Russian attacks also continued in other regions of Ukraine. Firefighting operations have been underway in Kyiv since the night, and Kherson, Donetsk, and Poltava regions came under fire.\n\nThe President also expressed condolences to the families of those killed in a Russian strike on a minibus in Nikopol.\n\nHe emphasized the need to protect human lives by forcing Russia to halt this \"asinine war.\"\n\n“And gifts to the aggressor in the form of eased sanctions will certainly do nothing to advance peace. And right now, in these very days, the United States Congress is considering an important Lindsey Graham bill that could send the right signals and help take the right steps toward genuine peace. Discussions are also underway in the EU on extending sanctions against Russia for its war,” Zelenskyy added.", "link": "https://en.interfax.com.ua/news/general/1205191.html", "source_id": "interfax_ukraine", "source_name": "Interfax-Ucrania", "perspective": "ukraine", "language": "en", "bias_note": "Agencia de noticias ucraniana de referencia para despachos militares y declaraciones gubernamentales.", "published": "2026-09-16T09:45:51+00:00", "category": "frente", "relevance_score": 33, "date_added": "2026-09-16", "title_es": "Rusia golpea una locomotora eléctrica en Kovel – Zelenskyy", "text_es": "Las fuerzas rusas atacaron una locomotora eléctrica en Kovel, región de Volyn, informó el presidente ucraniano Volodymyr Zelenskyy.\n\n\"Los ataques rusos contra la logística y la infraestructura crítica continúan sin cesar: la locomotora de un tren regular de pasajeros fue impactada en la región de Mykolaiv. Una estación de ferrocarril y una locomotora diésel resultaron dañadas, pero el equipo de Ukrzaliznytsia manejó bien la situación: avisaron a la gente a tiempo y nadie resultó herido. Casi 170 pasajeros fueron evacuados. También fue golpeada una locomotora eléctrica en Kovel\", dijo Zelenskyy el miércoles X.\n\nSegún él, los ataques rusos continuaron también en otras regiones de Ucrania. Las operaciones de extinción de incendios comenzaron en Kiev desde la noche y las regiones de Kherson, Donetsk y Poltava fueron atacadas.\n\nEl presidente también expresó sus condolencias a las familias de los fallecidos en el ataque ruso a un minibús en Nikopol.\n\nHizo hincapié en la necesidad de proteger vidas humanas obligando a Rusia a detener esta \"guerra estúpida\".\n\n\"Y los obsequios al agresor en forma de flexibilización de las sanciones ciertamente no harán nada para promover la paz. Y ahora mismo, en estos mismos días, el Congreso de los Estados Unidos está considerando un importante proyecto de ley Lindsey Graham que podría enviar las señales correctas y ayudar a tomar los pasos correctos hacia una paz genuina. También se están llevando a cabo discusiones en la UE sobre la extensión de las sanciones contra Rusia por su guerra\", añadió Zelenskyy."}, {"id": "1be8d3c550de", "title_original": "Ukrainian forces strike Russian bomber in Crimea and drone ground control stations in Donetsk Oblast", "text_original": "Ukraine's defence forces struck a Russian Su-24 tactical bomber in Saky in temporarily occupied Crimea and a number of other important Russian military assets on 15 September and on the night of 15-16 September.\n\nDetails: The Ukrainian military reported that a Su-24 aircraft had been hit at the Saky airfield in temporarily occupied Crimea. The extent of the damage is still being assessed.\n\nA site used by Russian forces to store, prepare and launch attack UAVs was also struck near the city of Donetsk.\n\nRussian UAV ground control stations were hit in Staromlynivka and Pokrovsk in Donetsk Oblast and Pokrovske in Zaporizhzhia Oblast.\n\nIn addition, a Russian ammunition depot was struck in Dovzhansk, Luhansk Oblast. Fuel and lubricant storage facilities used by Russian forces were hit in Rovenky, Luhansk Oblast, and Berdiansk, Zaporizhzhia Oblast.\n\nUkrainian forces struck sites in Suvorove and Rysove in temporarily occupied Crimea equipped with Russian automated surveillance systems known as Grenader, used to monitor and detect movement.", "link": "https://www.pravda.com.ua/eng/news/2026/09/16/8053690/", "source_id": "ukrainska_pravda_en", "source_name": "Ukrainska Pravda (EN)", "perspective": "ukraine", "language": "en", "bias_note": "Uno de los periódicos más leídos e históricos de Ucrania (versión internacional en inglés).", "published": "2026-09-16T09:40:00+00:00", "category": "frente", "relevance_score": 35, "date_added": "2026-09-16", "title_es": "Las fuerzas ucranianas atacan un bombardero ruso en Crimea y estaciones de control terrestre de drones en la región de Donetsk", "text_es": "Las fuerzas de defensa de Ucrania atacaron un bombardero táctico ruso Su-24 en Saky, en la Crimea ocupada temporalmente, y varios otros activos militares rusos importantes el 15 de septiembre y la noche del 15 al 16 de septiembre.\n\nDetalles: El ejército ucraniano informó que un avión Su-24 había sido alcanzado en el aeródromo de Saky en la Crimea temporalmente ocupada. Aún se está evaluando el alcance de los daños.\n\nUn sitio utilizado por las fuerzas rusas para almacenar, preparar y lanzar vehículos aéreos no tripulados de ataque también fue atacado cerca de la ciudad de Donetsk.\n\nLas estaciones de control terrestre de vehículos aéreos no tripulados rusos fueron alcanzadas en Staromlynivka y Pokrovsk en el óblast de Donetsk y en Pokrovske en el óblast de Zaporizhzhia.\n\nAdemás, un depósito de municiones ruso fue atacado en Dovzhansk, provincia de Luhansk. Las instalaciones de almacenamiento de combustible y lubricantes utilizadas por las fuerzas rusas fueron alcanzadas en Rovenky, en el óblast de Luhansk, y en Berdiansk, en el óblast de Zaporizhzhia.\n\nLas fuerzas ucranianas atacaron sitios en Suvorove y Rysove en Crimea ocupada temporalmente, equipados con sistemas de vigilancia automatizados rusos conocidos como Grenader, utilizados para monitorear y detectar movimientos."}, {"id": "91a38d256884", "title_original": "В Беларуси освободят 25 политзаключенных. США снимут санкции с двух компаний", "text_original": "По итогам визита в Беларусь спецпосланника президента США Джона Коула Минск начал освобождать политзаключенных. \"В качестве жеста доброй воли Беларусь освободит 25 человек\", - цитирует слова Коула белорусское госагентство БелТА утром в среду, 16 сентября.\n\nКоул также указал, что США со своей стороны снимут санкции с двух белорусских компаний - предприятия по производству лакокрасочных изделий \"Лакокраска\" и государственного лесопромышленного концерна \"Беллесбумпром\". Одновременно он заявил, что Беларусь и Соединенные Штаты добились \"значительного прогресса\" в переговорах и согласовали \"промежуточный договор\".\n\n\"Стороны продолжат работу над решением остающихся вопросов. Как только все вопросы будут решены и согласованы обеими сторонами, последуют дальнейшие освобождения людей и снятие санкций с белорусских компаний\", - добавил Коул.\n\nНакануне вечером родственники некоторых заключенных узнали, что смогут забрать своих близких из исправительных колоний уже утром 16 сентября, пишет правозащитный центр \"Вясна\".\n\nВизит Коула в Минск начался 15 сентября, в этот день прошла его встреча с правителем Беларуси Александром Лукашенко. Ранее визиты Коула в Беларусь также завершались освобождением политзаключенных. В частности, большая группа заключенных была освобождена в декабре 2025 года. Среди прочих на свободу тогда вышла одна из лидеров белорусской оппозиции Мария Колесникова. В марте на свободу вышли еще 250 политзаключенных.\n\nНа конец августа 2026 года, по данным \"Вясны\", в местах лишения свободы в Беларуси находились 889 политических заключенных.", "link": "https://www.dw.com/ru/в-беларуси-освободят-25-политзаключенных-сша-снимут-санкции-с-двух-компаний/a-79288199?maca=rus-rss-ru-all-1126-xml-mrss", "source_id": "dw_russian", "source_name": "Deutsche Welle (DW Ruso)", "perspective": "international", "language": "ru", "bias_note": "Radiodifusora pública internacional de Alemania con análisis exhaustivo del conflicto para la audiencia rusoparlante.", "published": "2026-09-16T09:25:00+00:00", "category": "drones", "relevance_score": 13, "date_added": "2026-09-16", "title_es": "En Bielorrusia serán liberados 25 presos políticos. Estados Unidos levantará las sanciones a dos empresas", "text_es": "Tras la visita del enviado especial del presidente estadounidense, John Cole, a Bielorrusia, Minsk comenzó a liberar a presos políticos. “Como gesto de buena voluntad, Bielorrusia liberará a 25 personas”, citó la agencia estatal bielorrusa BelTA a Cole la mañana del miércoles 16 de septiembre.\n\nCole también indicó que Estados Unidos, por su parte, levantará las sanciones impuestas a dos empresas bielorrusas: la empresa productora de pinturas y barnices Lakokraska y la empresa maderera estatal Bellesbumprom. Al mismo tiempo, dijo que Bielorrusia y Estados Unidos habían logrado \"progresos significativos\" en las negociaciones y acordaron un \"acuerdo provisional\".\n\n\"Las partes seguirán trabajando para resolver las cuestiones restantes. Una vez que todas las cuestiones estén resueltas y acordadas por ambas partes, seguirán nuevas liberaciones de personas y el levantamiento de las sanciones a las empresas bielorrusas\", añadió Cole.\n\nLa noche anterior, los familiares de algunos presos se enteraron de que podrían recoger a sus seres queridos en las colonias penitenciarias la mañana del 16 de septiembre, escribe el centro de derechos humanos Viasna.\n\nLa visita de Cole a Minsk comenzó el 15 de septiembre y ese día se reunió con el gobernante de Bielorrusia, Alexander Lukashenko. Anteriormente, las visitas de Cole a Bielorrusia también resultaron en la liberación de presos políticos. En particular, en diciembre de 2025 fue liberado un gran grupo de prisioneros. Entre otros, fue liberada una de las líderes de la oposición bielorrusa, Maria Kolesnikova. En marzo fueron liberados otros 250 presos políticos.\n\nA finales de agosto de 2026, según Viasna, había 889 presos políticos en prisión en Bielorrusia."}, {"id": "1ebda6effc7f", "title_original": "На войне погиб генерал-майор Антон Грунис, который докладывал Путину о захвате Константиновки. Две недели назад ему вручили Звезду Героя России", "text_original": "Погиб российский генерал-майор Антон Грунис, командир 4-й мотострелковой бригады Южной группировки войск. Смерть Груниса, о которой ранее сообщали украинские и российские источники, подтвердил замначальника Главного военно-политического управления ВС РФ, командир «Ахмата» генерал-лейтенант Апты Алаудинов.\n\nПодробности Алаудинов сообщать не стал. В посте в мессенджере «Макс», который цитирует ТАСС, он лишь заявил, что Грунис «погиб героем, до конца выполнив свой священный долг».\n\nКомандующий Силами беспилотных систем ВСУ Роберт Бровди (позывной «Мадяр»), в свою очередь, объявил, что Грунис был убит 12 сентября 2026 года в Донецкой области в результате удара украинского беспилотника.\n\nБровди напомнил, что именно Грунис в июле докладывал президенту РФ о взятии Константиновки. Этот город российские войска до сих пор не контролируют полностью. Путин тогда заявил, что Грунис — «человек с литовской фамилией, родился в Казани, воюет блестяще».\n\nПо словам Бровди, Грунис — седьмой высокопоставленный российский военный, убитый в результате ударов Сил беспилотных систем ВСУ.\n\nВ конце августа Минобороны РФ сообщало, что глава ведомства Андрей Белоусов вручил Грунису Звезду Героя России «за мужество и героизм, проявленные при исполнении воинского долга».", "link": "https://meduza.io/news/2026/09/16/na-voyne-pogib-general-mayor-anton-grunis-kotoryy-dokladyval-putinu-o-zahvate-konstantinovki-dve-nedeli-nazad-emu-vruchili-zvezdu-geroya-rossii", "source_id": "meduza_ru", "source_name": "Meduza (RU)", "perspective": "russia_independent", "language": "ru", "bias_note": "Principal medio ruso de investigación independiente prohibido por el Kremlin (sede en Letonia).", "published": "2026-09-16T09:14:20+00:00", "category": "frente", "relevance_score": 33, "date_added": "2026-09-16", "title_es": "El general de división Anton Grunis, que informó a Putin sobre la captura de Konstantinovka, murió durante la guerra. Hace dos semanas le concedieron la Estrella del Héroe de Rusia", "text_es": "Murió el mayor general ruso Anton Grunis, comandante de la 4.ª brigada de fusileros motorizados del Grupo de Fuerzas del Sur. La muerte de Grunis, informada anteriormente por fuentes ucranianas y rusas, fue confirmada por el subjefe de la Dirección Político-Militar Principal de las Fuerzas Armadas de Rusia, comandante de Akhmat, el teniente general Apty Alaudinov.\n\nAlaudinov no proporcionó detalles. En una publicación en el Max Messenger, citada por TASS, se limitó a afirmar que Grunis “murió como un héroe, habiendo cumplido con su deber sagrado hasta el final”.\n\nEl comandante de las Fuerzas de Sistemas No Tripulados de las Fuerzas Armadas de Ucrania, Robert Brovdi (distintivo de llamada “Madyar”), a su vez, anunció que Grunis fue asesinado el 12 de septiembre de 2026 en la región de Donetsk como resultado de un ataque con drones ucranianos.\n\nBrovdi recordó que fue Grunis quien en julio informó al presidente de la Federación Rusa sobre la captura de Konstantinovka. Las tropas rusas aún no controlan completamente esta ciudad. Putin luego dijo que Grunis es “un hombre de apellido lituano, nacido en Kazán, que lucha de manera brillante”.\n\nSegún Brovdi, Grunis es el séptimo oficial militar ruso de alto rango muerto como resultado de ataques de las Fuerzas de Sistemas No Tripulados de las Fuerzas Armadas de Ucrania.\n\nA finales de agosto, el Ministerio de Defensa ruso informó que el jefe del departamento, Andrei Belousov, otorgó a Grunis la Estrella del Héroe de Rusia “por el coraje y el heroísmo demostrados en el desempeño del deber militar”."}, {"id": "a9961ee1f277", "title_original": "One killed, five injured in Kherson – Military Administration", "text_original": "Over the past 24 hours, Russian occupation forces launched strikes on four settlements within Kherson urban community, reported Yaroslav Shanko, head of Kherson City Military Administration.\n\n\"As a result of Russian attacks in Kherson community, one person was killed and five were injured,\" Shanko wrote on his Telegram channel.\n\nKherson, Antonivka, Kamyshany, and Zymovnyk came under Russian artillery fire and drone strikes.\n\nThe strikes also damaged private homes, apartment buildings, non-residential structures, and civilian vehicles.", "link": "https://en.interfax.com.ua/news/general/1205094.html", "source_id": "interfax_ukraine", "source_name": "Interfax-Ucrania", "perspective": "ukraine", "language": "en", "bias_note": "Agencia de noticias ucraniana de referencia para despachos militares y declaraciones gubernamentales.", "published": "2026-09-16T08:45:21+00:00", "category": "drones", "relevance_score": 25, "date_added": "2026-09-16", "title_es": "Un muerto y cinco heridos en Jersón – Administración militar", "text_es": "Durante las últimas 24 horas, las fuerzas de ocupación rusas lanzaron ataques contra cuatro asentamientos dentro de la comunidad urbana de Kherson, informó Yaroslav Shanko, jefe de la Administración Militar de la ciudad de Kherson.\n\n\"Como resultado de los ataques rusos en la comunidad de Kherson, una persona murió y cinco resultaron heridas\", escribió Shanko en su canal de Telegram.\n\nKherson, Antonivka, Kamyshany y Zymovnyk fueron objeto de fuego de artillería rusa y ataques con drones.\n\nLos ataques también dañaron viviendas privadas, edificios de apartamentos, estructuras no residenciales y vehículos civiles."}, {"id": "44ff4aa21e1b", "title_original": "США обвинили россиян в финансировании терроризма и подготовке заказных убийств", "text_original": "В отношении нескольких граждан России в Южном округе Нью-Йорка было выдвинуто обвинение по подозрению в финансировании терроризма и сговоре с целью совершения заказных убийств по всему миру, в том числе на территории США. Об этом говорится в пресс-релизе Минюста США, обнародованном во вторник, 15 сентября. Отмечается, что обвиняемые, по данным ведомства, работали на российские спецслужбы.\n\nКак следует из обвинительного заключения, суть которого излагается в пресс-релизе, генпрокуратура США считает, что обвиняемые, помимо прочего, выплачивали вознаграждение лицам на территории США и в других странах \"за проведение предварительной разведки и осуществление целенаправленных убийств, а также поручали своим сообщникам совершать и пытаться совершать теракты против гражданской и военной инфраструктуры в европейских странах, которые поддерживают Украину или считаются поддерживающими ее\". В расследовании по этому делу принимало участие ФБР.\n\nОбвиняемые действовали в рамках глобальной сети по организации убийств RIS Network, которая вела свою деятельность и на территории Соединенных Штатов, следует из сообщения. Как заявил помощник генерального прокурора по вопросам национальной безопасности Джон Айзенберг, они \"пытались вербовать граждан США и иностранцев для совершения убийств по поручению Кремля\".\n\nТем временем телеканал ABC News передал со ссылкой на генпрокурора США Тодда Бланша,  что выдвинутые обвинения касаются, кроме прочего, попыток совершить убийство некоего российского диссидента, который, как полагали обвиняемые, находился на территории Вашингтона, в округе Колумбия.\n\nПо данным Минюста США, сеть RIS Network является \"подразделением (государственного. - Ред.) аппарата РФ, занимающегося атаками за рубежом, в том числе убийствами\". Эта сеть сфокусировала внимание на российских диссидентах и перебежчиках и, с недавнего времени, - на странах, которые считаются союзниками Украины.\n\nЧто касается личностей обвиняемых, то трое из них, по данным властей США, занимают высокие должности внутри сети RIS Network. Это Юрий Храмеев, известный также под прозвищем \"Полковник Юрий\" - бывший полковник российских  спецслужб, участвовавший в рекрутировании ряда людей для совершения убийств в отношении российских диссидентов. Сын Юрия Храмеева Кирилл, по данным генпрокуратуры США, - офицер ФСБ.", "link": "https://www.dw.com/ru/сша-обвинили-россиян-в-финансировании-терроризма-и-подготовке-заказных-убийств/a-79284911?maca=rus-rss-ru-all-1126-xml-mrss", "source_id": "dw_russian", "source_name": "Deutsche Welle (DW Ruso)", "perspective": "international", "language": "ru", "bias_note": "Radiodifusora pública internacional de Alemania con análisis exhaustivo del conflicto para la audiencia rusoparlante.", "published": "2026-09-16T01:25:00+00:00", "category": "frente", "relevance_score": 15, "date_added": "2026-09-16", "title_es": "Estados Unidos acusó a los rusos de financiar el terrorismo y preparar asesinatos por contrato.", "text_es": "Varios ciudadanos rusos fueron acusados ​​en el Distrito Sur de Nueva York de sospecha de financiación del terrorismo y conspiración para cometer asesinatos por encargo en todo el mundo, incluido Estados Unidos. Así se afirma en un comunicado de prensa del Departamento de Justicia de Estados Unidos, publicado el martes 15 de septiembre. Se señala que el acusado, según el departamento, trabajaba para los servicios de inteligencia rusos.\n\nComo se desprende de la acusación, cuya esencia se expone en un comunicado de prensa, la Fiscalía General de los Estados Unidos cree que los acusados, entre otras cosas, pagaron recompensas a personas en los Estados Unidos y en otros países \"por realizar inteligencia preliminar y llevar a cabo asesinatos selectivos, y también ordenaron a sus cómplices que llevaran a cabo e intentaran llevar a cabo ataques terroristas contra infraestructura civil y militar en países europeos que apoyan o se considera que apoyan a Ucrania\". El FBI participó en la investigación de este caso.\n\nLos acusados ​​actuaron como parte de la red global de asesinatos RIS Network, que también operaba en Estados Unidos, según el informe. Como dijo el Fiscal General Adjunto para Seguridad Nacional, John Eisenberg, \"intentaron reclutar ciudadanos estadounidenses y extranjeros para cometer asesinatos en nombre del Kremlin\".\n\nMientras tanto, ABC News informó, citando al Fiscal General de los Estados Unidos, Todd Blanche, que los cargos presentados se relacionan, entre otras cosas, con intentos de cometer el asesinato de cierto disidente ruso que, como creía el acusado, se encontraba en Washington, DC.\n\nSegún el Departamento de Justicia de Estados Unidos, la Red RIS es \"una división del aparato (estatal - Ed.) de la Federación Rusa, involucrada en ataques en el extranjero, incluidos asesinatos\". Esta red ha centrado la atención en los disidentes y desertores rusos y, más recientemente, en los países considerados aliados de Ucrania.\n\nEn cuanto a las identidades de los acusados, tres de ellos, según las autoridades estadounidenses, ocupan altos cargos dentro de la Red RIS. Se trata de Yuri Khrameev, también conocido con el sobrenombre de \"Coronel Yuri\", un ex coronel de los servicios secretos rusos que participó en el reclutamiento de varias personas para llevar a cabo asesinatos contra disidentes rusos. Kirill, el hijo de Yuri Khrameev, según la Fiscalía General de Estados Unidos, es un agente del FSB."}, {"id": "56b5c3a9f826", "title_original": "Война в Иране: США впервые признали дефицит боеприпасов у армии", "text_original": "Впервые за более чем шесть месяцев, прошедших с начала войны США и Израиля против Ирана, Соединенные Штаты официально признали, что американская армия столкнулась с недостатком боеприпасов. Как передает в среду, 16 сентября, агентство AFP, в обязательном отчете, предоставленном Пентагоном Конгрессу США, говорится, что вследствие войны в Иране ВС США испытывают дефицит снарядов.\n\nПо оценке независимого бюджетного бюро Конгресса, к данному моменту война в Иране обошлась стране в 38 млрд  долларов (в пересчете: 33 млрд евро). Как следует из отчета генерального инспектора Пентагона, 22,3 млрд долларов из этой суммы были потрачены на боеприпасы. \"Война привела к образованию пробелов в стратегических запасах и дефициту в сферах промышленности и обеспечения пополнения запасов снарядов\", - цитирует AFP отчет.\n\nЧтобы компенсировать нехватку боеприпасов, Пентагон \"работает над тем, чтобы ускорить процессы закупки и производства, а также запастись впрок материалами, комплектующими и избранными видами снарядов\". Однако расширение производственных мощностей требует \"значительного времени на подготовку\", указывают в американском оборонном ведомстве.\n\nПрезидент США Дональд Трамп неоднократно отвергал критику, связанную с сокращением запасов вооружений у американской армии из-за войны в Иране.\n\nМежду тем, по оценке AFP, дефицит вооружений у ВС США может вызвать беспокойство у Украины и Тайваня, зависящих от американский поставок оружия. Так, Украина, ведущая оборонительную войну против России, срочно нуждается в ракетах для американского ЗРК Patriot. В свою очередь для Тайбэя соглашения с Вашингтоном о закупке вооружений играют важную роль с точки зрения сдерживания Пекина, считающего Тайвань частью Китая.\n\nСогласно отчету Пентагона, за время войны в Иране семь солдат США погибли в ходе боевых действий и еще семь - в результате других событий. 417 военных США были ранены в ходе боевых операций.", "link": "https://www.dw.com/ru/война-в-иране-сша-впервые-признали-дефицит-боеприпасов-у-армии/a-79284718?maca=rus-rss-ru-all-1126-xml-mrss", "source_id": "dw_russian", "source_name": "Deutsche Welle (DW Ruso)", "perspective": "international", "language": "ru", "bias_note": "Radiodifusora pública internacional de Alemania con análisis exhaustivo del conflicto para la audiencia rusoparlante.", "published": "2026-09-16T00:12:00+00:00", "category": "frente", "relevance_score": 23, "date_added": "2026-09-16", "title_es": "Guerra en Irán: Estados Unidos admitió por primera vez la escasez de municiones en el ejército", "text_es": "Por primera vez en más de seis meses desde el inicio de la guerra entre Estados Unidos e Israel contra Irán, Estados Unidos ha reconocido oficialmente que el ejército estadounidense se enfrenta a una escasez de municiones. Como informó la AFP el miércoles 16 de septiembre, un informe obligatorio presentado por el Pentágono al Congreso de los EE.UU. afirma que, como consecuencia de la guerra en Irán, las Fuerzas Armadas de los EE.UU. están experimentando una escasez de proyectiles.\n\nLa independiente Oficina de Presupuesto del Congreso estima que la guerra en Irán le ha costado hasta ahora al país 38.000 millones de dólares (conversión: 33.000 millones de euros). Según el informe del inspector general del Pentágono, 22.300 millones de dólares de esta cantidad se gastaron en municiones. \"La guerra ha provocado lagunas en las reservas estratégicas y escasez en los sectores de la industria y el reabastecimiento de proyectiles\", cita el informe de la AFP.\n\nPara compensar la escasez de municiones, el Pentágono está \"trabajando para acelerar los procesos de adquisición y producción, así como para almacenar materiales, componentes y tipos selectos de proyectiles\". Sin embargo, ampliar la capacidad de producción requiere “un tiempo de preparación considerable”, señala el Departamento de Defensa de Estados Unidos.\n\nEl presidente estadounidense, Donald Trump, ha rechazado en repetidas ocasiones las críticas relacionadas con la reducción de los arsenales de armas en el ejército estadounidense debido a la guerra en Irán.\n\nMientras tanto, según la AFP, la escasez de armas en las Fuerzas Armadas estadounidenses puede preocupar a Ucrania y Taiwán, que dependen del suministro de armas estadounidense. Por lo tanto, Ucrania, que libra una guerra defensiva contra Rusia, necesita urgentemente misiles para el sistema de defensa aérea Patriot estadounidense. A su vez, para Taipei, los acuerdos de compra de armas con Washington juegan un papel importante en términos de contener a Beijing, que considera a Taiwán parte de China.\n\nSegún un informe del Pentágono, durante la guerra de Irán, siete soldados estadounidenses murieron en combate y otros siete a consecuencia de otros hechos. 417 militares estadounidenses resultaron heridos durante operaciones de combate."}, {"id": "f1411e8689ad", "title_original": "Генпрокурор США: группа россиян, связанная со спецслужбами, обвиняется в подготовке убийства российского оппозиционера в Вашингтоне", "text_original": "Генеральный прокурор США Тодд Бланш заявил, что прокуратура в Нью-Йорке предъявила обвинения нескольким гражданам России, работавшим на российскую разведку. Об этом он сказал на брифинге в Белом доме, его слова приводит ABC News.\n\nРоссиян обвинили в финансировании терроризма и участии в сговоре с целью совершения убийств по всему миру. По словам генпрокурора, обвиняемые планировали убить «российского диссидента», который, по их мнению, находился в Вашингтоне.\n\nО личностях обвиняемых Бланш ничего не сообщил. Он также не рассказал, о ком из российских оппозиционеров идет речь, и когда готовилось покушение на него.\n\nНа сайте Минюста США на момент публикации новости информации о деле также не было.", "link": "https://meduza.io/news/2026/09/15/genprokuror-ssha-gruppa-rossiyan-svyazannaya-so-spetssluzhbami-obvinyaetsya-v-podgotovke-ubiystva-rossiyskogo-oppozitsionera-v-vashingtone", "source_id": "meduza_ru", "source_name": "Meduza (RU)", "perspective": "russia_independent", "language": "ru", "bias_note": "Principal medio ruso de investigación independiente prohibido por el Kremlin (sede en Letonia).", "published": "2026-09-15T20:33:32+00:00", "category": "drones", "relevance_score": 23, "date_added": "2026-09-16", "title_es": "Fiscal General de Estados Unidos: un grupo de rusos asociados a los servicios de inteligencia son acusados ​​de preparar el asesinato de un líder de la oposición rusa en Washington", "text_es": "El fiscal general de Estados Unidos, Todd Blanche, dijo que los fiscales de Nueva York presentaron cargos contra varios ciudadanos rusos que trabajaron para la inteligencia rusa. Lo dijo en una sesión informativa en la Casa Blanca, sus palabras fueron citadas por ABC News.\n\nLos rusos fueron acusados ​​de financiar el terrorismo y de conspirar para cometer asesinatos en todo el mundo. Según el fiscal general, los acusados ​​planeaban matar a un “disidente ruso” que, en su opinión, se encontraba en Washington.\n\nBlanche no informó nada sobre las identidades de los acusados. Tampoco dijo de cuál de los opositores rusos estaba hablando ni cuándo se estaba preparando el atentado contra su vida.\n\nAl momento de publicación de la noticia tampoco había información sobre el caso en el sitio web del Departamento de Justicia de Estados Unidos."}, {"id": "87922c0eb642", "title_original": "Denmark says Russian warship fired flares at military helicopter", "text_original": "Denmark has accused a Russian warship of firing two emergency flares at one of its helicopters while it was tracking the vessel in the Baltic Sea.\n\nThe Danish government has summoned the Russian ambassador over the incident, which it said happened during a \"routine\" monitoring operation on Monday.\n\nPrime Minister Mette Frederiksen branded the Russian action \"reckless\" and said it was designed to \"intimidate and divide\".\n\nRussia said it would \"thoroughly investigate\" the incident but accused Danish helicopters of making \"dangerous manoeuvres\" near Russian warships.\n\nIt came on the same day that Nato forces shot down a drone over Lithuania in the latest security scare on the alliance's eastern flank, where tensions remain high amid Russia's full-scale invasion of Ukraine.\n\nIn a statement detailing the incident in the Baltic Sea, the Danish armed forces said: \"One of the air force's Fennec helicopters was today fired at with flares during a routine photographic operation of a Russian frigate, which was located in international waters off Gedser.\"", "link": "https://www.bbc.co.uk/news/articles/cwn8mjl31p5yo?at_medium=RSS&at_campaign=rss", "source_id": "bbc_europe", "source_name": "BBC News (Europa)", "perspective": "international", "language": "en", "bias_note": "Servicio público británico con amplia red de corresponsales de guerra e investigación OSINT.", "published": "2026-09-15T11:40:00+00:00", "category": "drones", "relevance_score": 19, "date_added": "2026-09-16", "title_es": "Dinamarca dice que un buque de guerra ruso disparó bengalas contra un helicóptero militar", "text_es": "Dinamarca acusó a un buque de guerra ruso de disparar dos bengalas de emergencia a uno de sus helicópteros mientras rastreaba al buque en el Mar Báltico.\n\nEl gobierno danés convocó al embajador ruso por el incidente, que según dijo ocurrió durante una operación de monitoreo \"rutinaria\" el lunes.\n\nLa primera ministra Mette Frederiksen calificó la acción rusa de \"imprudente\" y dijo que estaba diseñada para \"intimidar y dividir\".\n\nRusia dijo que \"investigaría a fondo\" el incidente, pero acusó a los helicópteros daneses de realizar \"maniobras peligrosas\" cerca de los buques de guerra rusos.\n\nSe produjo el mismo día en que las fuerzas de la OTAN derribaron un dron sobre Lituania en el último susto de seguridad en el flanco oriental de la alianza, donde las tensiones siguen siendo altas en medio de la invasión a gran escala de Ucrania por parte de Rusia.\n\nEn un comunicado que detalla el incidente en el Mar Báltico, las fuerzas armadas danesas dijeron: \"Uno de los helicópteros Fennec de la fuerza aérea fue atacado hoy con bengalas durante una operación fotográfica de rutina de una fragata rusa, que se encontraba en aguas internacionales frente a Gedser\"."}, {"id": "2c2921d292bc", "title_original": "Ukrainian Attack Kills One in Belgorod, Hits Commercial and Industrial Sites Across Russia", "text_original": "Overnight Ukrainian drone and missile strikes across southern Russia killed one person and struck commercial and industrial sites, regional officials said Tuesday.\n\nActing Belgorod region Governor Alexander Shuvayev confirmed one death in an attack near the border with Ukraine. He also said that a woman who was hospitalized for her injuries following strikes earlier this month had died.\n\nIn the nearby Rostov region, Governor Yury Slyusar said an Ozon warehouse was among several sites damaged during a missile attack on the port city of Taganrog.\n\nOzon confirmed that it suspended operations at the facility, where it said a fire broke out. No one was hurt, the company said.\n\nFederal investigators launched a criminal probe into terrorism over the attacks on Taganrog, citing damage to Ozon and other residential and agricultural buildings.\n\nSamara region Governor Vyacheslav Fedorishchev said an “industrial facility” was damaged in overnight strikes. Unconfirmed reports said that a fire broke out at the Syzran Oil Refinery.", "link": "https://www.themoscowtimes.com/2026/09/15/ukrainian-attack-kills-one-in-belgorod-hits-commercial-and-industrial-sites-across-russia-a93708", "source_id": "the_moscow_times", "source_name": "The Moscow Times", "perspective": "russia_independent", "language": "en", "bias_note": "Diario independiente ruso en el exilio crítico con Putin y con cobertura de ataques en territorio ruso.", "published": "2026-09-15T08:22:00+00:00", "category": "drones", "relevance_score": 25, "date_added": "2026-09-16", "title_es": "Ataque ucraniano mata a una persona en Belgorod y alcanza sitios comerciales e industriales en toda Rusia", "text_es": "Los ataques nocturnos con drones y misiles ucranianos en el sur de Rusia mataron a una persona y afectaron sitios comerciales e industriales, dijeron el martes funcionarios regionales.\n\nEl gobernador en funciones de la región de Belgorod, Alexander Shuvayev, confirmó una muerte en un ataque cerca de la frontera con Ucrania. También dijo que una mujer que fue hospitalizada por sus heridas tras los ataques de principios de este mes había muerto.\n\nEn la cercana región de Rostov, el gobernador Yury Slyusar dijo que un almacén de Ozon se encontraba entre varios sitios dañados durante un ataque con misiles contra la ciudad portuaria de Taganrog.\n\nOzon confirmó que suspendió las operaciones en la instalación, donde dijo que se produjo un incendio. Nadie resultó herido, dijo la empresa.\n\nLos investigadores federales iniciaron una investigación penal sobre terrorismo por los ataques a Taganrog, citando daños a Ozon y otros edificios residenciales y agrícolas.\n\nEl gobernador de la región de Samara, Vyacheslav Fedorishchev, dijo que una \"instalación industrial\" resultó dañada en los ataques nocturnos. Informes no confirmados decían que se produjo un incendio en la refinería de petróleo de Syzran."}, {"id": "f3a1597bb1e2", "title_original": "Ukrainian Drone Strike in Sochi Wounds 5", "text_original": "Five people including a child were wounded in an overnight Ukrainian drone attack on the Black Sea resort city of Sochi, local officials said Monday.\n\nEmergency authorities said only one of the victims was hospitalized for their injuries. Three homes were also damaged as a result of the air assault, they added.\n\nSochi Mayor Andrei Proshunin said firefighters extinguished fires that had broken out from the attack. He warned people not to approach any drone debris.\n\nProshunin later announced the closure of Sochis beache’s due to the ongoing risk of drone strikes.\n\nIn the neighboring Rostov region, Governor Yury Slyusar said air defense systems intercepted 50 drones over the region. He reported damage to civilian infrastructure but said that no one was hurt.\n\nRussia’s Defense Ministry said it intercepted 399 Ukrainian drones across Russia and annexed Crimea between Sunday night and Monday morning.", "link": "https://www.themoscowtimes.com/2026/09/14/ukrainian-drone-strike-in-sochi-wounds-5-a93699", "source_id": "the_moscow_times", "source_name": "The Moscow Times", "perspective": "russia_independent", "language": "en", "bias_note": "Diario independiente ruso en el exilio crítico con Putin y con cobertura de ataques en territorio ruso.", "published": "2026-09-14T09:25:00+00:00", "category": "drones", "relevance_score": 35, "date_added": "2026-09-16", "title_es": "Ataque ucraniano con drones en Sochi deja cinco heridos", "text_es": "Cinco personas, incluido un niño, resultaron heridas en un ataque nocturno con aviones no tripulados ucranianos en la ciudad turística de Sochi, en el Mar Negro, dijeron funcionarios locales el lunes.\n\nLas autoridades de emergencia dijeron que solo una de las víctimas fue hospitalizada por sus heridas. Tres viviendas también resultaron dañadas como consecuencia del ataque aéreo, añadieron.\n\nEl alcalde de Sochi, Andrei Proshunin, dijo que los bomberos extinguieron los incendios que se habían desatado tras el ataque. Advirtió a la gente que no se acercara a los restos de ningún dron.\n\nProshunin anunció más tarde el cierre de las playas de Sochis debido al riesgo constante de ataques con aviones no tripulados.\n\nEn la vecina región de Rostov, el gobernador Yury Slyusar dijo que los sistemas de defensa aérea interceptaron 50 drones sobre la región. Informó de daños a la infraestructura civil, pero dijo que nadie resultó herido.\n\nEl Ministerio de Defensa de Rusia dijo que interceptó 399 drones ucranianos en toda Rusia y anexó Crimea entre el domingo por la noche y el lunes por la mañana."}, {"id": "c60f7782d617", "title_original": "Swedish left-wing bloc narrowly ahead with election too close to call", "text_original": "Sweden's general election remains too close to call with the left-wing bloc marginally ahead as the vote count continues.\n\nWith more than 90% of ballots processed early on Monday, the left-wing bloc was in front by approximately 20,000 votes.\n\nPreliminary counts by Sweden's electoral authority projected the Social Democrats' Magdalena Andersson would likely finish with a three-seat majority over the rival four-party coalition led by current conservative Prime Minister Ulf Kristersson.\n\nKristersson has been supported in government by the hard-right Sweden Democrats (SD), which have neo-Nazi roots. He has promised cabinet jobs for the SD if he stays in charge.\n\nClose race in Sweden as hard right eyes role in government\n\nEarly on Monday morning, Kristersson said it remained unclear who would form the next government.", "link": "https://www.bbc.co.uk/news/articles/c0qx5d79kdeo?at_medium=RSS&at_campaign=rss", "source_id": "bbc_europe", "source_name": "BBC News (Europa)", "perspective": "international", "language": "en", "bias_note": "Servicio público británico con amplia red de corresponsales de guerra e investigación OSINT.", "published": "2026-09-14T08:36:09+00:00", "category": "frente", "relevance_score": 15, "date_added": "2026-09-16", "title_es": "El bloque de izquierda sueco se adelanta por poco y las elecciones están demasiado reñidas para convocarlas", "text_es": "Las elecciones generales de Suecia siguen siendo demasiado reñidas para convocarlas, con el bloque de izquierda ligeramente por delante mientras continúa el recuento de votos.\n\nCon más del 90% de los votos procesados ​​a primera hora del lunes, el bloque de izquierda estaba por delante por aproximadamente 20.000 votos.\n\nLos recuentos preliminares de la autoridad electoral de Suecia proyectaron que Magdalena Andersson, de los socialdemócratas, probablemente terminaría con una mayoría de tres escaños sobre la coalición rival de cuatro partidos encabezada por el actual Primer Ministro conservador Ulf Kristersson.\n\nKristersson ha sido apoyado en el gobierno por los Demócratas Suecos (SD), de extrema derecha, que tienen raíces neonazis. Ha prometido puestos en el gabinete del SD si permanece en el cargo.\n\nReñida carrera en Suecia mientras la extrema derecha juega un papel en el gobierno\n\nEarly on Monday morning, Kristersson said it remained unclear who would form the next government."}, {"id": "7292bb28b3be", "title_original": "Why a fresh wave of North Korean soldiers may fight in Russia's war in Ukraine", "text_original": "An enemy that swarmed the battlefield in large groups while under fire, seemingly oblivious to the dangers of drones and fire from automatic weapons. An elite corps of ghost soldiers who chose suicide over surrender. They fought and died in their thousands, then apparently vanished from the battlefield.\n\nNorth Korea's soldiers were sent to fight by Pyongyang alongside Russian forces as they sought to repel a Ukrainian offensive on Moscow's territory at the end of 2024. They paid a heavy price, as many as 3,000 killed in action from the 13,000 deployed.\n\nUltimately, they would adapt their tactics, and with Russia would drive Ukrainian forces from its Kursk region. In combat terms, little has been heard of them since, but according to Ukraine's president, Volodymyr Zelensky, North Korean forces, and their weaponry, are soon to make a dramatic return to Russia's war in Ukraine.\n\nLast month, Zelensky warned that up to 50,000 North Koreans will be deployed in Russia, revising an earlier estimate of 30,000 troops. He called on South Korea to provide support for his country's air defence.\n\nBut why, after such heavy losses, would North Korea send more men to fight for Russia, and what happened to its soldiers sent in the first place?\n\n\"They're still there\", said Dr Yang Uk, research fellow at the Asan Institute for Policy Studies, Center for Foreign Policy and National Security in Seoul. \"They are defending Russian territory for another counterattack from Ukraine. And we believe that some of the engineer corps or workers might be in [the Russian-occupied] Donbas area but that's not the combat troops.\"", "link": "https://www.bbc.co.uk/news/articles/cgl7zrnxxy6o?at_medium=RSS&at_campaign=rss", "source_id": "bbc_europe", "source_name": "BBC News (Europa)", "perspective": "international", "language": "en", "bias_note": "Servicio público británico con amplia red de corresponsales de guerra e investigación OSINT.", "published": "2026-09-13T23:16:33+00:00", "category": "frente", "relevance_score": 41, "date_added": "2026-09-16", "title_es": "Why a fresh wave of North Korean soldiers may fight in Russia's war in Ukraine", "text_es": "An enemy that swarmed the battlefield in large groups while under fire, seemingly oblivious to the dangers of drones and fire from automatic weapons. An elite corps of ghost soldiers who chose suicide over surrender. They fought and died in their thousands, then apparently vanished from the battlefield.\n\nNorth Korea's soldiers were sent to fight by Pyongyang alongside Russian forces as they sought to repel a Ukrainian offensive on Moscow's territory at the end of 2024. They paid a heavy price, as many as 3,000 killed in action from the 13,000 deployed.\n\nUltimately, they would adapt their tactics, and with Russia would drive Ukrainian forces from its Kursk region. In combat terms, little has been heard of them since, but according to Ukraine's president, Volodymyr Zelensky, North Korean forces, and their weaponry, are soon to make a dramatic return to Russia's war in Ukraine.\n\nLast month, Zelensky warned that up to 50,000 North Koreans will be deployed in Russia, revising an earlier estimate of 30,000 troops. He called on South Korea to provide support for his country's air defence.\n\nBut why, after such heavy losses, would North Korea send more men to fight for Russia, and what happened to its soldiers sent in the first place?\n\n\"They're still there\", said Dr Yang Uk, research fellow at the Asan Institute for Policy Studies, Center for Foreign Policy and National Security in Seoul. \"They are defending Russian territory for another counterattack from Ukraine. And we believe that some of the engineer corps or workers might be in [the Russian-occupied] Donbas area but that's not the combat troops.\""}, {"id": "20e594ab5691", "title_original": "Russian Attacks Kill 9, Injure Dozens in Ukraine as Moscow Says It Hit Ships, Plants", "text_original": "Russian airstrikes in several Ukrainian regions on Saturday killed nine people, injured dozens and damaged residential buildings and infrastructure across the country, local officials said.\n\nThe civilian death toll has risen sharply in Ukraine over the past two months as Russia steps up attacks on power plants and other infrastructure. Ukraine has hit energy facilities and warehouses in distant parts of Russia, and both sides have targeted each other's shipping.\n\n“Basically, the Russians have expanded the war away from the front, where they have no success, into the economy, and their tactics are as basic as it gets: destroying every site that could help people cope with the conditions of war,” Zelensky wrote.\n\n“Russia wants to kill the Ukrainian economy and break our resistance,” Zelensky added.\n\nThe city council in Kramatorsk, one of Ukraine's frontline “fortress cities” that Russia wants to capture, said Russian forces attacked private cars, killing three people in three incidents over a 90-minute period. Four people were injured.\n\n“These are not military targets,” the council said. “They are ordinary civilian cars. People were going about their business.”", "link": "https://www.themoscowtimes.com/2026/09/13/russian-attacks-kill-6-injure-dozens-in-ukraine-as-moscow-says-it-hit-ships-plants-a93694", "source_id": "the_moscow_times", "source_name": "The Moscow Times", "perspective": "russia_independent", "language": "en", "bias_note": "Diario independiente ruso en el exilio crítico con Putin y con cobertura de ataques en territorio ruso.", "published": "2026-09-13T07:00:00+00:00", "category": "frente", "relevance_score": 21, "date_added": "2026-09-16", "title_es": "Russian Attacks Kill 9, Injure Dozens in Ukraine as Moscow Says It Hit Ships, Plants", "text_es": "Russian airstrikes in several Ukrainian regions on Saturday killed nine people, injured dozens and damaged residential buildings and infrastructure across the country, local officials said.\n\nThe civilian death toll has risen sharply in Ukraine over the past two months as Russia steps up attacks on power plants and other infrastructure. Ukraine has hit energy facilities and warehouses in distant parts of Russia, and both sides have targeted each other's shipping.\n\n“Basically, the Russians have expanded the war away from the front, where they have no success, into the economy, and their tactics are as basic as it gets: destroying every site that could help people cope with the conditions of war,” Zelensky wrote.\n\n“Russia wants to kill the Ukrainian economy and break our resistance,” Zelensky added.\n\nThe city council in Kramatorsk, one of Ukraine's frontline “fortress cities” that Russia wants to capture, said Russian forces attacked private cars, killing three people in three incidents over a 90-minute period. Four people were injured.\n\n“These are not military targets,” the council said. “They are ordinary civilian cars. People were going about their business.”"}, {"id": "72cdd459e63e", "title_original": "Russians seek answers over hundreds missing after Ukraine's 2024 incursion", "text_original": "\"I used to have complete faith in our country,\" says Lyubov. The last time she spoke to her mother was a day after Ukrainian forces broke into Russia's Kursk region more than two years ago.\n\nNow she feels \"resentful towards the [Russian] state\", in a country where most people avoid criticising the full-scale invasion unleashed on Ukraine in February 2022.\n\nThe local governor says more than 300 Russians are still missing in Kursk region, but no-one really knows the true figure.\n\nLyubov says she tried to persuade her mother to leave her village in the Sudzha area, but blames Russian state TV \"propaganda\" for her refusal to listen. Some 2,000 people remained in the settlements captured by Ukraine's military, Russian authorities estimate.\n\n\"The state channels were convincing viewers that 'everything is under control: two or three days, and it'll be just as it was before',\" she recalls.\n\nShe still fails to understand why Russian authorities could not stop Ukrainian soldiers storming two border checkpoints in August 2024, taking around 40 prisoners and bombing a convoy carrying Russian soldiers.", "link": "https://www.bbc.co.uk/news/articles/c62ene9kr71o?at_medium=RSS&at_campaign=rss", "source_id": "bbc_europe", "source_name": "BBC News (Europa)", "perspective": "international", "language": "en", "bias_note": "Servicio público británico con amplia red de corresponsales de guerra e investigación OSINT.", "published": "2026-09-12T23:51:05+00:00", "category": "frente", "relevance_score": 17, "date_added": "2026-09-16", "title_es": "Russians seek answers over hundreds missing after Ukraine's 2024 incursion", "text_es": "\"I used to have complete faith in our country,\" says Lyubov. The last time she spoke to her mother was a day after Ukrainian forces broke into Russia's Kursk region more than two years ago.\n\nNow she feels \"resentful towards the [Russian] state\", in a country where most people avoid criticising the full-scale invasion unleashed on Ukraine in February 2022.\n\nThe local governor says more than 300 Russians are still missing in Kursk region, but no-one really knows the true figure.\n\nLyubov says she tried to persuade her mother to leave her village in the Sudzha area, but blames Russian state TV \"propaganda\" for her refusal to listen. Some 2,000 people remained in the settlements captured by Ukraine's military, Russian authorities estimate.\n\n\"The state channels were convincing viewers that 'everything is under control: two or three days, and it'll be just as it was before',\" she recalls.\n\nShe still fails to understand why Russian authorities could not stop Ukrainian soldiers storming two border checkpoints in August 2024, taking around 40 prisoners and bombing a convoy carrying Russian soldiers."}, {"id": "c46c9012ec0e", "title_original": "Kremlin Says No Decision Yet on Putin's G20 Visit, Dismisses Zelensky's Meeting Proposal", "text_original": "Moscow has yet to decide whether Russian President Vladimir Putin will travel to the G20 summit in Miami in December, Interfax reported, citing Kremlin spokesman Dmitry Peskov.\n\n\"We don't know yet whether we'll be going to Miami,\" Peskov said.\n\nEarlier on Saturday, Kremlin foreign policy aide Yury Ushakov said the possibility of Putin attending the summit \"has not even been discussed\" in Moscow.\n\nIn April, the Kremlin said Putin could travel to the G20 summit after U.S. President ​Donald Trump suggested his attendance would be very helpful.\n\nCommenting on Ukrainian President Volodymyr Zelensky's remarks that he would travel to Miami if Putin attends and would seek a meeting with him, Peskov reiterated Moscow's long-standing position that if the Ukrainian leader wants to meet his Russian counterpart, he should come to Moscow.\n\nWe are facing unprecedented challenges. Russia's Prosecutor General's Office has designated The Moscow Times as an \"undesirable\" organization, criminalizing our work and putting our staff at risk of prosecution. This follows our earlier unjust labeling as a \"foreign agent.\"", "link": "https://www.themoscowtimes.com/2026/09/12/kremlin-says-no-decision-yet-on-putins-g20-visit-dismisses-zelenskys-meeting-proposal-a93693", "source_id": "the_moscow_times", "source_name": "The Moscow Times", "perspective": "russia_independent", "language": "en", "bias_note": "Diario independiente ruso en el exilio crítico con Putin y con cobertura de ataques en territorio ruso.", "published": "2026-09-12T13:15:20+00:00", "category": "diplomacia", "relevance_score": 21, "date_added": "2026-09-16", "title_es": "Kremlin Says No Decision Yet on Putin's G20 Visit, Dismisses Zelensky's Meeting Proposal", "text_es": "Moscow has yet to decide whether Russian President Vladimir Putin will travel to the G20 summit in Miami in December, Interfax reported, citing Kremlin spokesman Dmitry Peskov.\n\n\"We don't know yet whether we'll be going to Miami,\" Peskov said.\n\nEarlier on Saturday, Kremlin foreign policy aide Yury Ushakov said the possibility of Putin attending the summit \"has not even been discussed\" in Moscow.\n\nIn April, the Kremlin said Putin could travel to the G20 summit after U.S. President ​Donald Trump suggested his attendance would be very helpful.\n\nCommenting on Ukrainian President Volodymyr Zelensky's remarks that he would travel to Miami if Putin attends and would seek a meeting with him, Peskov reiterated Moscow's long-standing position that if the Ukrainian leader wants to meet his Russian counterpart, he should come to Moscow.\n\nWe are facing unprecedented challenges. Russia's Prosecutor General's Office has designated The Moscow Times as an \"undesirable\" organization, criminalizing our work and putting our staff at risk of prosecution. This follows our earlier unjust labeling as a \"foreign agent.\""}]</script>
  <script id="perspectives-data" type="application/json">{"ukraine": {"name": "Fuentes Ucranianas", "short_name": "Ucrania", "icon": "🇺🇦", "badge_class": "badge-ukraine", "description": "Cobertura desde el terreno, partes del Estado Mayor de las FFAA de Ucrania y periodismo de investigación local."}, "russia_independent": {"name": "Rusia Independiente (Exilio / Sin Censura)", "short_name": "Rusia Independiente", "icon": "🕊️", "badge_class": "badge-ru-ind", "description": "Medios rusos independientes operando desde el exterior sin censura del Kremlin."}, "russia_official": {"name": "Rusia Oficial (Estatal / Retórica del Kremlin)", "short_name": "Rusia Oficial", "icon": "🇷🇺", "badge_class": "badge-ru-off", "description": "Agencias estatales rusas; fundamental para conocer comunicados militares del Kremlin, declaraciones oficiales y narrativa gubernamental."}, "international": {"name": "Análisis Internacional & OSINT", "short_name": "Internacional", "icon": "🌐", "badge_class": "badge-intl", "description": "Análisis estratégico y corresponsalías de medios globales (BBC, Deutsche Welle) y reportes de inteligencia."}}</script>

  <script>
    const DAILY_ARTICLES = JSON.parse(document.getElementById('daily-data').textContent);
    const HISTORIC_ARTICLES = JSON.parse(document.getElementById('historic-data').textContent);
    const PERSPECTIVES = JSON.parse(document.getElementById('perspectives-data').textContent);

    let activeTab = 'today'; // 'today' | 'archive'
    let currentPersp = 'all';
    let currentCat = 'all';
    let searchQuery = '';
    let onlySaved = false;
    let savedIds = new Set(JSON.parse(localStorage.getItem('war_monitor_saved') || '[]'));

    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function getParagraphs(text) {
      if (!text) return [];
      return text.split(/\r?\n\r?\n/).map(p => p.trim()).filter(Boolean);
    }

    function getDataset() {
      return activeTab === 'today' ? DAILY_ARTICLES : HISTORIC_ARTICLES;
    }

    function render() {
      document.getElementById('savedCount').textContent = savedIds.size;
      const data = getDataset();

      let filtered = data.filter(a => {
        if (onlySaved && !savedIds.has(a.id)) return false;
        if (currentPersp !== 'all' && a.perspective !== currentPersp) return false;
        if (currentCat !== 'all' && a.category !== currentCat) return false;

        if (searchQuery.trim()) {
          const q = searchQuery.toLowerCase();
          const full = `${a.title_es || ''} ${a.text_es || ''} ${a.source_name || ''}`.toLowerCase();
          if (!full.includes(q)) return false;
        }
        return true;
      });

      const modeLabel = activeTab === 'today' ? 'Edición de Hoy' : 'Hemeroteca Histórica';
      document.getElementById('tabModeIndicator').textContent = `${modeLabel}:`;
