s dos funcionarios.\n\nEstados Unidos está estudiando medidas de este tipo a gran escala, a pesar de las advertencias de los aliados de la OTAN sobre la creciente amenaza de una agresión rusa en Europa, señala el canal de televisión. La medida podría cambiar radicalmente las relaciones de Estados Unidos con aliados clave y obligar a los países europeos a forjar nuevas asociaciones en un momento de inestabilidad debido a las guerras en Ucrania y Medio Oriente, indica el material."}, {"id": "5d7be271a71c", "title_original": "Ukrainian air defense shoot down 69 of 93 enemy UAVs; hits recorded at 13 locations", "text_original": "Ukrainian defense forces shot down 69 out of 93 enemy drones overnight into Friday, though enemy aerial weapons struck 13 locations, the Air Force of the Armed Forces of Ukraine reported.\n\n\"According to preliminary data, as of 08:00, air defense systems shot down or suppressed 69 enemy UAVs—including Shahed and Gerbera types, other drone types, and three Banderol/Dan-T units,\" the message reads.\n\nIn total, overnight into September 18 (starting at 18:00 on September 17), the enemy launched an attack using 93 strike UAVs—including Shahed types (46 of which were jet-powered), Gerberas, Parodiya decoy drones, and Banderol/Dan-T units—from the following directions: Orel and Millerovo (Russian Federation), temporarily occupied Donetsk and Hvardeyske (temporarily occupied Autonomous Republic of Crimea), and the Sea of ​​Azov.\n\nThe air attack was repelled by aviation, anti-aircraft missile troops, electronic warfare and unmanned systems units, and mobile fire groups of the Ukrainian defense forces.\n\nMeanwhile, attacks from enemy aerial weapons were recorded at 13 locations, and debris from downed objects fell at three locations. Additionally, some enemy munitions failed to reach their targets; information regarding them is being clarified.\n\nThe attack is ongoing, and enemy UAVs remain in the airspace, the command added.", "link": "https://en.interfax.com.ua/news/general/1206268.html", "source_id": "interfax_ukraine", "source_name": "Interfax-Ucrania", "perspective": "ukraine", "language": "en", "bias_note": "Agencia de noticias ucraniana de referencia para despachos militares y declaraciones gubernamentales.", "published": "2026-09-18T06:38:54+00:00", "category": "frente", "relevance_score": 25, "date_added": "2026-09-18", "title_es": "La defensa aérea ucraniana derriba 69 de 93 vehículos aéreos no tripulados enemigos; visitas registradas en 13 ubicaciones", "text_es": "Las fuerzas de defensa ucranianas derribaron 69 de 93 drones enemigos durante la noche del viernes, aunque las armas aéreas enemigas atacaron 13 lugares, informó la Fuerza Aérea de las Fuerzas Armadas de Ucrania.\n\n\"Según datos preliminares, a las 08:00, los sistemas de defensa aérea derribaron o suprimieron 69 vehículos aéreos no tripulados enemigos, incluidos los tipos Shahed y Gerbera, otros tipos de drones y tres unidades Banderol/Dan-T\", se lee en el mensaje.\n\nEn total, durante la noche del 18 de septiembre (a partir de las 18:00 del 17 de septiembre), el enemigo lanzó un ataque utilizando 93 vehículos aéreos no tripulados de ataque, incluidos los tipos Shahed (46 de los cuales eran propulsados por aviones), Gerberas, drones señuelo Parodiya y unidades Banderol/Dan-T, desde las siguientes direcciones: Orel y Millerovo (Federación de Rusia), Donetsk y Hvardeyske (República Autónoma de Rusia, temporalmente ocupada). Crimea) y el Mar de Azov.\n\nEl ataque aéreo fue repelido por la aviación, las tropas de misiles antiaéreos, las unidades de guerra electrónica y sistemas no tripulados y los grupos de fuego móviles de las fuerzas de defensa ucranianas.\n\nMientras tanto, se registraron ataques con armas aéreas enemigas en 13 lugares y en tres lugares cayeron escombros de objetos derribados. Además, algunas municiones enemigas no lograron alcanzar sus objetivos; Se está aclarando información sobre ellos.\n\nEl ataque continúa y los vehículos aéreos no tripulados enemigos permanecen en el espacio aéreo, añadió el comando."}, {"id": "cdb3a0e298c3", "title_original": "Battlefield sees 230 combat clashes over past day – Ukraine's General Staff", "text_original": "The Russians are putting pressure along the entire line of contact. A total of 230 combat clashes have occurred over the past day, most of them on the Pokrovsk and Kostiantynivka fronts.\n\nSource: General Staff of the Armed Forces of Ukraine on Facebook, information as of 08:00 on 18 September\n\nDetails: On the North Slobozhanshchyna front and in the operational zone in Russia's Kursk Oblast, one Russian attack was recorded. The Russians conducted 42 strikes on Ukrainian positions and settlements.\n\nOn the South Slobozhanshchyna front, Ukrainian forces repelled 14 Russian attacks towards the settlements of Mala Vovcha, Buhaivka, Kozacha Lopan, Lyman, Prylipka, Ternova, Karaichne, Potykhonove, Rybalchyne and Zakharivka.\n\nOn the Kupiansk front, the Russians made three attempts to improve their positions, conducting assaults towards the settlements of Petropavlivka and Kivsharivka.\n\nOn the Lyman front, Ukraine's defence forces repelled 10 Russian attacks towards the settlements of Kopanky, Hrekivka, Shyikivka, Novoselivka, Lyman and Dibrova.", "link": "https://www.pravda.com.ua/eng/news/2026/09/18/8054011/", "source_id": "ukrainska_pravda_en", "source_name": "Ukrainska Pravda (EN)", "perspective": "ukraine", "language": "en", "bias_note": "Uno de los periódicos más leídos e históricos de Ucrania (versión internacional en inglés).", "published": "2026-09-18T06:28:00+00:00", "category": "frente", "relevance_score": 27, "date_added": "2026-09-18", "title_es": "En Battlefield se produjeron 230 enfrentamientos durante el último día: Estado Mayor de Ucrania", "text_es": "Los rusos están ejerciendo presión a lo largo de toda la línea de contacto. Durante el último día se produjeron en total 230 enfrentamientos, la mayoría de ellos en los frentes de Pokrovsk y Kostiantynivka.\n\nFuente: Estado Mayor de las Fuerzas Armadas de Ucrania en Facebook, información a las 08:00 horas del 18 de septiembre.\n\nDetalles: En el frente norte de Slobozhanshchyna y en la zona operativa en el óblast ruso de Kursk, se registró un ataque ruso. Los rusos llevaron a cabo 42 ataques contra posiciones y asentamientos ucranianos.\n\nEn el frente sur de Slobozhanshchyna, las fuerzas ucranianas repelieron 14 ataques rusos hacia los asentamientos de Mala Vovcha, Buhaivka, Kozacha Lopan, Lyman, Prylipka, Ternova, Karaichne, Potykhonove, Rybalchyne y Zakharivka.\n\nEn el frente de Kupiansk, los rusos hicieron tres intentos de mejorar sus posiciones, realizando asaltos hacia los asentamientos de Petropavlivka y Kivsharivka.\n\nEn el frente de Lyman, las fuerzas de defensa de Ucrania repelieron 10 ataques rusos hacia los asentamientos de Kopanky, Hrekivka, Shyikivka, Novoselivka, Lyman y Dibrova."}, {"id": "36be2238235d", "title_original": "Russia attacks Ukraine with 93 UAVs, 72 downed", "text_original": "Russian forces have attacked Ukraine with 93 drones of various types since the evening of 17 September. Air defence has destroyed 72 UAVs, while hits have been recorded at 13 locations.\n\nQuote: \"As of 08:00, [Ukrainian] air defence forces had destroyed or jammed 69 Shahed, Gerbera and other types of drones as well as three Banderol/Dan-T drone missiles. Hits by aerial assets have been recorded at 13 locations and the fall of downed aerial assets (debris) at three locations.\"\n\nDetails: The Air Force also noted that some of the aerial assets did not reach their targets.\n\nThe drones were launched from the Russian cities of Oryol and Millerovo as well as temporarily occupied Donetsk and Hvardiiske in Crimea.\n\nAircraft, anti-aircraft missile units, electronic warfare assets, unmanned systems units and mobile fire groups from Ukraine's defence forces have been involved in repelling the attack.\n\nAs of 08:00, the attack is ongoing, with several Russian UAVs still in Ukrainian airspace.", "link": "https://www.pravda.com.ua/eng/news/2026/09/18/8054006/", "source_id": "ukrainska_pravda_en", "source_name": "Ukrainska Pravda (EN)", "perspective": "ukraine", "language": "en", "bias_note": "Uno de los periódicos más leídos e históricos de Ucrania (versión internacional en inglés).", "published": "2026-09-18T05:23:00+00:00", "category": "frente", "relevance_score": 25, "date_added": "2026-09-18", "title_es": "Rusia ataca a Ucrania con 93 vehículos aéreos no tripulados, 72 derribados", "text_es": "Las fuerzas rusas han atacado Ucrania con 93 drones de distintos tipos desde la tarde del 17 de septiembre. La defensa aérea destruyó 72 vehículos aéreos no tripulados y se registraron impactos en 13 lugares.\n\nCita: \"A las 08:00, las fuerzas de defensa aérea [ucranianas] habían destruido o bloqueado 69 Shahed, Gerbera y otros tipos de drones, así como tres misiles Banderol/Dan-T. Se han registrado impactos de medios aéreos en 13 lugares y la caída de medios aéreos derribados (escombros) en tres lugares\".\n\nDetalles: La Fuerza Aérea también señaló que algunos de los activos aéreos no alcanzaron sus objetivos.\n\nLos drones fueron lanzados desde las ciudades rusas de Oryol y Millerovo, así como desde las ocupadas temporalmente Donetsk y Hvardiiske en Crimea.\n\nPara repeler el ataque participaron aviones, unidades de misiles antiaéreos, medios de guerra electrónica, unidades de sistemas no tripulados y grupos de fuego móviles de las fuerzas de defensa de Ucrania.\n\nA las 08:00 horas, el ataque continúa y varios vehículos aéreos no tripulados rusos todavía se encuentran en el espacio aéreo ucraniano."}, {"id": "ceea323672ed", "title_original": "В Ярославле после атак БПЛА прекратил работу НПЗ \"Славнефти\"", "text_original": "Нефтеперерабатывающий завод \"Славнефть-Ярославнефтеоргсинтез\" (ЯНОС), входящий в число крупнейших НПЗ России, после очередной атаки украинских беспилотниковостановил переработку нефти и отгрузки топлива. Об этом в четверг, 17 сентября, сообщило агентство Reuters со ссылкой на четыре источника в отрасли.\n\nПо данным собеседников СМИ, в результате атаки дронов, произошедшей в ночь на 17 сентября, на заводе ЯНОС была повреждена установка переработки нефти АВТ-3, которая обеспечивала 40 процентов мощности предприятия. Губернатор Ярославской области Михаил Евраев подтвердил повреждения и пожар на заводе, возгорание тушили несколько часов.\n\nСМИ отмечают, что в ночь на 28 августа на заводе была выведена из строя еще одна установка, АВТ-4, которая обеспечивала около 33 процентов мощности ЯНОС. Она так и не возобновила работу. После произошедших атак ЯНОС прекратил биржевые отгрузки топлива.\n\nСМИ включают НПЗ \"Славнефти\" в Ярославле в пятерку крупнейших в России нефтеперерабатывающих предприятий по объему по объему переработки сырья. Так, установка АВТ-3 могла перерабатывать около 17 тысяч метрических тонн сырья в сутки. Ежегодно завод поставлял на рынки более 2,6 млн тонн бензина и 4 млн тонн дизеля, при этом ЯНОС снабжал топливом Подмосковье.\n\nС начала полномасштабной войны, развязанной РФ против Украины, завод в Ярославле неоднократно подвергался ударам украинских БПЛА, а в 2026 году на предприятииминимум восемь раз возникали пожары.\n\nПри этом ЯНОС - уже второй крупный НПЗ в регионе, приостановивший в сентябре работу из-за последствий атак БПЛА. С 6 сентября топливо не отгружает НПЗ \"Роснефти\" в Рязани, мощность которого составляет 17 млн тонн нефти в год. Заявленная мощность Ярославского НПЗ - 15 млн тонн нефти в год.", "link": "https://www.dw.com/ru/в-ярославле-после-атак-бпла-прекратил-работу-нпз-славнефти/a-79317320?maca=rus-rss-ru-all-1126-xml-mrss", "source_id": "dw_russian", "source_name": "Deutsche Welle (DW Ruso)", "perspective": "international", "language": "ru", "bias_note": "Radiodifusora pública internacional de Alemania con análisis exhaustivo del conflicto para la audiencia rusoparlante.", "published": "2026-09-18T03:45:00+00:00", "category": "frente", "relevance_score": 13, "date_added": "2026-09-18", "title_es": "En Yaroslavl, tras los ataques con vehículos aéreos no tripulados, la refinería de petróleo de Slavneft dejó de funcionar", "text_es": "La refinería de petróleo Slavneft-Yaroslavnefteorgsintez (YANOS), una de las más grandes de Rusia, detuvo la refinación de petróleo y los envíos de combustible después de otro ataque de drones ucranianos. Reuters informó esto el jueves 17 de septiembre, citando cuatro fuentes de la industria.\n\nSegún los interlocutores de los medios, como resultado de un ataque con drones ocurrido la noche del 17 de septiembre, la unidad de refinación de petróleo AVT-3, que proporcionaba el 40 por ciento de la capacidad de la planta, resultó dañada en la planta de YANOS. El gobernador de la región de Yaroslavl, Mikhail Evraev, confirmó los daños y el incendio en la planta; el fuego fue extinguido durante varias horas.\n\nLos medios señalan que en la noche del 28 de agosto otra unidad de la planta, la AVT-4, que proporcionaba alrededor del 33 por ciento de la capacidad de YANOS, fue desactivada. Ella nunca reanudó su trabajo. Después de los ataques, YANOS detuvo los envíos de combustible en existencias.\n\nLos medios incluyen la refinería de Slavneft en Yaroslavl entre las cinco refinerías de petróleo más grandes de Rusia en términos de volumen de procesamiento de materias primas. Así, la instalación AVT-3 podría procesar alrededor de 17 mil toneladas de materias primas por día. Cada año, la planta suministra a los mercados más de 2,6 millones de toneladas de gasolina y 4 millones de toneladas de diésel, mientras que YANOS suministra combustible a la región de Moscú.\n\nDesde el comienzo de la guerra a gran escala desatada por la Federación Rusa contra Ucrania, la planta de Yaroslavl ha sido atacada repetidamente por vehículos aéreos no tripulados ucranianos y, en 2026, se produjeron incendios en la planta al menos ocho veces.\n\nAl mismo tiempo, YANOS es la segunda gran refinería de la región que suspende sus operaciones en septiembre debido a las consecuencias de los ataques de vehículos aéreos no tripulados. Desde el 6 de septiembre no se envía combustible desde la refinería de Rosneft en Riazán, que tiene una capacidad de 17 millones de toneladas de petróleo al año. La capacidad declarada de la refinería de Yaroslavl es de 15 millones de toneladas de petróleo al año."}, {"id": "d77c7a0a20f9", "title_original": "Боец рассказал подробности освобождения Розовки", "text_original": "МОСКВА, 18 сен - РИА Новости. Освобождение Розовки Запорожской области осложнялось постоянными атаками украинских FPV-дронов и гексакоптеров \"Баба-яга\", рассказал штурмовик группировки \"Восток\" с позывным Тимоха.\n\nОб освобождении этого населенного пункта Минобороны РФ сообщило в четверг. Его взяли под контроль штурмовые подразделения пятой отдельной танковой бригады 36-й общевойсковой армии группировки \"Восток\".\n\n\"Наша задача была зачистить лесополосы и забрать населенный пункт (Розовка - ред.). Сложность заключалась в том, что по всему маршруту нас постоянно атаковали FPV-дроны и тяжелые коптеры \"Баба-яга\", - сказал Тимоха на видео Минобороны РФ.\n\nКроме того, продолжил боец, противник сидел в хорошо укрепленных блиндажах, обложенных мешками с глиной, куда обычная граната просто не пролетала.\n\n\"В ходе воздушной разведки наш командир обнаружил впереди скрытый блиндаж на краю лесополосы… По позициям ВСУ отработала артиллерия из минометов, после чего мы зачистили этот блиндаж при помощи противотанковой мины\", - заключил Тимоха.", "link": "https://ria.ru/20260918/boets-2118370089.html", "source_id": "ria_novosti", "source_name": "RIA Novosti (РИА)", "perspective": "russia_official", "language": "ru", "bias_note": "Agencia estatal rusa del conglomerado Rossiya Segodnya. Postura y partes de guerra oficiales del Kremlin.", "published": "2026-09-18T02:16:41+00:00", "category": "frente", "relevance_score": 15, "date_added": "2026-09-18", "title_es": "El luchador contó los detalles de la liberación de Rozovka.", "text_es": "MOSCÚ, 18 de septiembre - RIA Novosti. La liberación de Rozovka, en la región de Zaporozhye, se vio complicada por los constantes ataques de los drones ucranianos FPV y los hexacópteros Baba Yaga, según informó un avión de ataque del grupo Vostok con el distintivo de llamada Timokha.\n\nEl Ministerio de Defensa ruso anunció el jueves la liberación de este asentamiento. Fue tomada bajo el control de unidades de asalto de la quinta brigada de tanques separada del 36.º ejército interarmas del grupo Vostok.\n\n\"Nuestra tarea era limpiar las zonas forestales y recuperar el asentamiento (Rozovka - ed.). La dificultad fue que a lo largo de toda la ruta fuimos atacados constantemente por drones FPV y helicópteros pesados ​​Baba Yaga\", dijo Timokha en el vídeo del Ministerio de Defensa ruso.\n\nAdemás, continuó el soldado, el enemigo estaba sentado en refugios bien fortificados, forrados con bolsas de arcilla, donde una granada común simplemente no podía volar.\n\n\"Durante el reconocimiento aéreo, nuestro comandante descubrió un refugio escondido delante del borde del cinturón forestal... La artillería disparó morteros contra las posiciones de las Fuerzas Armadas de Ucrania, después de lo cual limpiamos este refugio utilizando una mina antitanque\", concluyó Timoja."}, {"id": "bf1f6eb18093", "title_original": "Боец рассказал подробности эвакуации мирных жителей из Харьковской области", "text_original": "МОСКВА, 18 сен - РИА Новости. Эвакуация мирных жителей из Ольховатки Харьковской области происходит двойками-тройками под полным контролем российский войск, рассказал командир штурмовой роты группировки \"Север\" с позывным Шальной.\n\nМинобороны России сообщило в четверг об освобождении этого населенного пункта бойцами группировки войск \"Север\"\n\n\"Когда мы пришли в эту деревню (Ольховатку - ред.), мирное население все нашли, там прозвучала фраза от них: \"Мы вас очень долго ждали\". Четыре года, говорит, мы вас ждем. Все, вот мы пришли и сейчас начинаем их потихонечку высвобождать, выводить\", - сказал командир на видео Минобороны РФ.\n\nПо его словам, хоть мирные жители и рвутся эвакуироваться, в таком деле все должно проходить постепенно и аккуратно.\n\n\"Так и получается, потихонечку, помаленечку, там, троечками, двоечками выходим. Мы контролим весь процесс самостоятельно, то есть они сидят и ждут нашей команды, когда мы за ними придем. То есть мы говорим об условных часах, дате, времени, когда мы за ними придем. Приходим и выводим\", - заключил Шальной.", "link": "https://ria.ru/20260918/vs-2118369891.html", "source_id": "ria_novosti", "source_name": "RIA Novosti (РИА)", "perspective": "russia_official", "language": "ru", "bias_note": "Agencia estatal rusa del conglomerado Rossiya Segodnya. Postura y partes de guerra oficiales del Kremlin.", "published": "2026-09-18T02:10:39+00:00", "category": "frente", "relevance_score": 27, "date_added": "2026-09-18", "title_es": "El combatiente contó los detalles de la evacuación de civiles de la región de Jarkov.", "text_es": "MOSCÚ, 18 de septiembre - RIA Novosti. La evacuación de civiles de Olkhovatka, en la región de Jarkov, se produce de dos en dos y de tres en tres bajo el control total de las tropas rusas, afirmó el comandante de la compañía de asalto del grupo Norte con el distintivo de llamada Crazy.\n\nEl Ministerio de Defensa ruso anunció el jueves la liberación de esta localidad por parte de los combatientes del grupo de tropas Norte.\n\n\"Cuando llegamos a este pueblo (Olkhovatka - ed.), encontramos a todos los civiles, había una frase suya: \"Los hemos estado esperando durante mucho tiempo\". Desde hace cuatro años, dice, le estamos esperando. Eso es todo, así que vinimos y ahora estamos empezando a liberarlos lentamente, a eliminarlos”, dijo el comandante en el video del Ministerio de Defensa ruso.\n\nSegún él, aunque los civiles desean evacuar, en tal caso todo debe realizarse de forma gradual y cuidadosa.\n\n\"Y así, poco a poco, poco a poco, salimos en C y D. Controlamos todo el proceso nosotros mismos, es decir, ellos se sientan y esperan nuestra orden cuando vamos a buscarlos. Es decir, estamos hablando de las horas, fechas y horas convencionales en que venimos a buscarlos. Venimos y los sacamos\", concluyó Shalnoy."}, {"id": "565109b5ada3", "title_original": "В бундесвере призвали немцев участвовать в обороне страны", "text_original": "МОСКВА, 18 сен - РИА Новости. Генеральный инспектор бундесвера Карстен Бройер, выступая на конференции по безопасности в Праге, призвал граждан Германии быть готовыми участвовать в обороне страны вместе с ее вооруженными силами.\n\n\"Без вас мы, солдаты, обречены на провал. Но провал - не вариант. Ведь провал означал бы, что наши сообщества, какими мы их знаем, оказались бы под смертельной угрозой. Мы все вместе сидим в одной лодке\", - приводит его слова с мероприятия газета Bild.\n\nБройер при этом отметил, что одной армии для победы в \"гибридной войне\" будет недостаточно. Он призвал учиться \"опыту Украины\" и добавил, что Берлин должен осознанно подходить к использованию новых технологий.\n\nГермания в апреле впервые в своей истории официально утвердила военную стратегию. В документе заявлена цель создать самую сильную армию в Европе до 2039 года. Россия в стратегии определена как \"главная угроза\". Пресс-секретарь президента РФ Дмитрий Песков заявил, что военная концепция Германии - это квинтэссенция конфронтации Европы против России.\n\nПрезидент России Владимир Путин ранее заявлял, что НАТО, наращивая свои военные бюджеты, провоцирует глобальную милитаризацию и гонку вооружений. Он также указывал, что для этого используются лживые заявления о якобы угрозе со стороны России, с помощью которых западные элиты выколачивают деньги из налогоплательщиков и объясняют свои ошибки в экономике.", "link": "https://ria.ru/20260918/germaniya-2118369680.html", "source_id": "ria_novosti", "source_name": "RIA Novosti (РИА)", "perspective": "russia_official", "language": "ru", "bias_note": "Agencia estatal rusa del conglomerado Rossiya Segodnya. Postura y partes de guerra oficiales del Kremlin.", "published": "2026-09-18T02:03:44+00:00", "category": "frente", "relevance_score": 21, "date_added": "2026-09-18", "title_es": "La Bundeswehr llamó a los alemanes a participar en la defensa del país.", "text_es": "MOSCÚ, 18 de septiembre - RIA Novosti. El inspector general de la Bundeswehr, Carsten Breuer, durante una conferencia de seguridad en Praga llamó a los ciudadanos alemanes a estar dispuestos a participar en la defensa del país junto con sus fuerzas armadas.\n\n\"Sin ustedes, los soldados estamos condenados al fracaso. Pero el fracaso no es una opción. Después de todo, el fracaso significaría que nuestras comunidades tal como las conocemos estarían bajo una amenaza mortal. Todos estamos sentados juntos en el mismo barco\", citó el periódico Bild durante el evento.\n\nBreuer señaló que un ejército no será suficiente para ganar una “guerra híbrida”. Pidió aprender de “la experiencia de Ucrania” y añadió que Berlín debería adoptar un enfoque consciente en el uso de las nuevas tecnologías.\n\nEn abril, Alemania aprobó oficialmente una estrategia militar por primera vez en su historia. El documento establece el objetivo de crear el ejército más poderoso de Europa para 2039. Rusia es identificada en la estrategia como la “principal amenaza”. El portavoz del presidente ruso, Dmitry Peskov, afirmó que el concepto militar alemán es la quintaesencia de la confrontación de Europa contra Rusia.\n\nEl presidente ruso, Vladimir Putin, afirmó anteriormente que la OTAN, al aumentar sus presupuestos militares, está provocando una militarización global y una carrera armamentista. También señaló que se trata del uso de declaraciones falsas sobre una supuesta amenaza de Rusia, con la ayuda de las cuales las élites occidentales extorsionan a los contribuyentes y explican sus errores en la economía."}, {"id": "22e3af5040c6", "title_original": "Назван оклад срочников, служащих в противопожарных подразделениях", "text_original": "МОСКВА, 18 сен - РИА Новости. Ежемесячный оклад срочников, проходящих службу по призыву в подразделениях противопожарной службы, будет составлять 2758 рублей, следует из постановления правительства РФ от 15 сентября 2026 года.\n\n\"Размеры окладов по воинским должностям военнослужащих, проходящих военную службу по призыву в... воинских подразделениях федеральной противопожарной службы Государственной противопожарной службы... - 2758 рублей\", - говорится в тексте документа.\n\nТакой же размер оклада будет у проходящих службу по призыву в войсках национальной гвардии РФ, спасательных воинских формированиях, органах безопасности и государственной охраны, отмечается в постановлении.\n\nРанее Минобороны РФ предложило повысить оклады военнослужащих и ряда сотрудников силовых ведомств на 4% с 1 октября 2026 года, следует из подготовленного министерством проекта постановления правительства РФ.", "link": "https://ria.ru/20260918/sluzhba-2118367375.html", "source_id": "ria_novosti", "source_name": "RIA Novosti (РИА)", "perspective": "russia_official", "language": "ru", "bias_note": "Agencia estatal rusa del conglomerado Rossiya Segodnya. Postura y partes de guerra oficiales del Kremlin.", "published": "2026-09-18T01:15:41+00:00", "category": "frente", "relevance_score": 15, "date_added": "2026-09-18", "title_es": "Se ha anunciado el salario de los reclutas que sirven en los departamentos de bomberos.", "text_es": "MOSCÚ, 18 de septiembre - RIA Novosti. El salario mensual de los reclutas que prestan servicio militar obligatorio en las unidades del servicio de bomberos será de 2.758 rublos, según se desprende del decreto del gobierno ruso del 15 de septiembre de 2026.\n\n\"Los salarios de los puestos militares del personal militar que realiza el servicio militar obligatorio en... las unidades militares del servicio federal de bomberos del Servicio Estatal de Bomberos... ascienden a 2.758 rublos\", dice el texto del documento.\n\nLa misma cantidad salarial se otorgará a quienes sirvan bajo servicio militar obligatorio en la Guardia Nacional Rusa, unidades militares de rescate, agencias de seguridad y agencias de protección estatal, señala la resolución.\n\nAnteriormente, el Ministerio de Defensa de Rusia propuso aumentar los salarios del personal militar y de varios empleados de las fuerzas del orden en un 4% a partir del 1 de octubre de 2026, como se desprende del proyecto de resolución del gobierno ruso preparado por el ministerio."}, {"id": "6124460583ad", "title_original": "В Одессе прогремели взрывы", "text_original": "МОСКВА, 18 сен - РИА Новости. Взрывы прозвучали в Одессе на фоне воздушной тревоги, сообщает украинский телеканал \"Общественное\".\n\n\"В Одессе прозвучал взрыв... Еще взрыв\", - говорится в сообщении в Telegram-канале \"Общественного\".\n\nПо данным онлайн-карты украинского министерства цифровой трансформации, в части Одесской области звучит сигнал воздушной тревоги.", "link": "https://ria.ru/20260918/odessa-2118367023.html", "source_id": "ria_novosti", "source_name": "RIA Novosti (РИА)", "perspective": "russia_official", "language": "ru", "bias_note": "Agencia estatal rusa del conglomerado Rossiya Segodnya. Postura y partes de guerra oficiales del Kremlin.", "published": "2026-09-18T01:09:52+00:00", "category": "frente", "relevance_score": 17, "date_added": "2026-09-18", "title_es": "Explosiones ocurrieron en Odessa", "text_es": "MOSCÚ, 18 de septiembre - RIA Novosti. Se produjeron explosiones en Odessa en medio de una advertencia de ataque aéreo, informa el canal de televisión ucraniano \"Public\".\n\n“Se escuchó una explosión en Odessa... Otra explosión”, dice un mensaje en el canal Telegram de Obshchestvennoe.\n\nSegún el mapa en línea del Ministerio de Transformación Digital de Ucrania, suena una alarma de ataque aéreo en una parte de la región de Odessa."}, {"id": "7bf10f3e7f6e", "title_original": "Russian drones hit Konotop, damaging schools, hospitals, railway and gas network – photos", "text_original": "A large-scale Russian drone attack on the city of Konotop in Sumy Oblast has damaged educational and healthcare facilities, houses, the gas distribution network and railway infrastructure.\n\nSource: Konotop Mayor Artem Semenikhin\n\nDetails: The attack damaged the city's social and critical infrastructure facilities. A nursery school and the building of School No. 11 were damaged.\n\nQuote: \"Many houses have been damaged. We have damage to medical facilities. The railway has also sustained damage...\"\n\nDetails: Damage to the gas distribution network has left a significant part of the city without gas supplies. Many power lines have also been severed.\n\nEarly reports indicate that two women have been injured.", "link": "https://www.pravda.com.ua/eng/news/2026/09/18/8053997/", "source_id": "ukrainska_pravda_en", "source_name": "Ukrainska Pravda (EN)", "perspective": "ukraine", "language": "en", "bias_note": "Uno de los periódicos más leídos e históricos de Ucrania (versión internacional en inglés).", "published": "2026-09-18T00:43:00+00:00", "category": "frente", "relevance_score": 25, "date_added": "2026-09-18", "title_es": "Drones rusos atacaron Konotop y dañaron escuelas, hospitales, redes ferroviarias y de gas – fotos", "text_es": "Un ataque ruso a gran escala con aviones no tripulados contra la ciudad de Konotop, en el óblast de Sumy, ha dañado instalaciones educativas y sanitarias, viviendas, la red de distribución de gas y la infraestructura ferroviaria.\n\nFuente: Alcalde de Konotop, Artem Semenikhin\n\nDetalles: El ataque dañó las instalaciones sociales y de infraestructura crítica de la ciudad. Una guardería y el edificio de la Escuela N° 11 resultaron dañados.\n\nCita: \"Muchas casas han resultado dañadas. Tenemos daños en las instalaciones médicas. El ferrocarril también ha sufrido daños...\"\n\nDetalles: Los daños en la red de distribución de gas han dejado a una parte importante de la ciudad sin suministro de gas. También se han cortado muchas líneas eléctricas.\n\nLos primeros informes indican que dos mujeres resultaron heridas."}, {"id": "0927ba059f62", "title_original": "Russia and Ukraine Exchange Bodies of 275 Fallen Soldiers", "text_original": "Russia and Ukraine exchanged the remains of 275 soldiers killed during the war, officials and Belarusian state media reported Thursday.\n\nThe exchange took place at the Novaya Guta border crossing point in Belarus, Shamsail Saraliyev, a State Duma lawmaker from the ruling United Russia party and member of a parliamentary group dedicated to the conflict, told the RBC news outlet.\n\nRussia handed over 252 bodies to Ukrainian authorities, while Ukraine returned 23 bodies.\n\n“Belarus continues its humanitarian mission,” the country’s state news agency Belta said in a report that included photos of the exchange.\n\nThe Ukrainian military confirmed the swap and credited its search teams for continuing their work “despite the threat of drone strikes, remote mining and enemy shelling.”\n\nUkraine’s Coordination Headquarters for the Treatment of Prisoners of War said law enforcement agencies will work to identify the 252 returned bodies. It said the International Committee of the Red Cross assisted in the exchange.", "link": "https://www.themoscowtimes.com/2026/09/17/russia-and-ukraine-exchange-bodies-of-275-fallen-soldiers-a93737", "source_id": "the_moscow_times", "source_name": "The Moscow Times", "perspective": "russia_independent", "language": "en", "bias_note": "Diario independiente ruso en el exilio crítico con Putin y con cobertura de ataques en territorio ruso.", "published": "2026-09-17T11:17:01+00:00", "category": "drones", "relevance_score": 13, "date_added": "2026-09-18", "title_es": "Rusia y Ucrania intercambian los cuerpos de 275 soldados caídos", "text_es": "Rusia y Ucrania intercambiaron los restos de 275 soldados muertos durante la guerra, informaron el jueves funcionarios y medios estatales bielorrusos.\n\nEl intercambio tuvo lugar en el paso fronterizo de Novaya Guta en Bielorrusia, dijo al medio de comunicación RBC Shamsail Saraliyev, legislador de la Duma Estatal del partido gobernante Rusia Unida y miembro de un grupo parlamentario dedicado al conflicto.\n\nRusia entregó 252 cadáveres a las autoridades ucranianas, mientras que Ucrania devolvió 23 cadáveres.\n\n\"Bielorrusia continúa su misión humanitaria\", dijo la agencia estatal de noticias del país, Belta, en un informe que incluía fotografías del intercambio.\n\nEl ejército ucraniano confirmó el intercambio y dio crédito a sus equipos de búsqueda por continuar su trabajo “a pesar de la amenaza de ataques con drones, minería remota y bombardeos enemigos”.\n\nLa Sede de Coordinación para el Tratamiento de Prisioneros de Guerra de Ucrania dijo que las agencias encargadas de hacer cumplir la ley trabajarán para identificar los 252 cuerpos devueltos. Dijo que el Comité Internacional de la Cruz Roja ayudó en el intercambio."}, {"id": "b667047d1718", "title_original": "Силы ПВО уничтожили десять БПЛА, летевших на Москву", "text_original": "МОСКВА, 18 сен - РИА Новости. Силы ПВО уничтожили 10 БПЛА, летевших на Москву, сообщил мэр столицы Сергей Собянин.\n\n\"Десять БПЛА, летевших на Москву, уничтожены силами ПВО Минобороны\", - написал Собянин в канале на платформе \"Макс\".\n\nОн отметил, что на месте падения обломков работают специалисты экстренных служб.", "link": "https://ria.ru/20260918/moskva-2118359110.html", "source_id": "ria_novosti", "source_name": "RIA Novosti (РИА)", "perspective": "russia_official", "language": "ru", "bias_note": "Agencia estatal rusa del conglomerado Rossiya Segodnya. Postura y partes de guerra oficiales del Kremlin.", "published": "2026-09-17T22:33:38+00:00", "category": "frente", "relevance_score": 23, "date_added": "2026-09-17", "title_es": "Las fuerzas de defensa aérea destruyeron diez vehículos aéreos no tripulados que volaban hacia Moscú", "text_es": "MOSCÚ, 18 de septiembre - RIA Novosti. Las fuerzas de defensa aérea destruyeron 10 vehículos aéreos no tripulados que volaban hacia Moscú, afirmó el alcalde de la capital, Serguéi Sobianin.\n\n\"Diez vehículos aéreos no tripulados que volaban hacia Moscú fueron destruidos por las fuerzas de defensa aérea del Ministerio de Defensa\", escribió Sobyanin en un canal de la plataforma Max.\n\nSeñaló que en el lugar de la caída de los escombros se encuentran trabajando especialistas de los servicios de emergencia."}, {"id": "f3e7bf57eb68", "title_original": "«Рёнхап»: замглавы МИД КНДР посетит Генассамблею ООН", "text_original": "Замглавы МИД Северной Кореи Ким Сон Ген планирует посетить сессию Генеральной Ассамблеи ООН в Нью-Йорке. Об этом со ссылкой на источник пишет южнокорейское агентство «Рёнхап».\n\nПо информации агентства, северокорейский дипломат примет участие в общих прениях высокого уровня, которые пройдут с 22 по 26 сентября и 28 сентября. Во время визита он также планирует встретиться с Генеральным секретарем ООН Антониу Гутерришем и представителями дружественных Пхеньяну государств.\n\nВ 2025 году Ким Сон Ген уже представлял Пхеньян на сессии ООН. На ней он заявил о категорическом отказе Северной Кореи от ликвидации своей ядерной программы.", "link": "https://www.kommersant.ru/doc/8957478", "source_id": "kommersant", "source_name": "Kommersant (Коммерсантъ)", "perspective": "russia_official", "language": "ru", "bias_note": "Diario de referencia ruso sobre política exterior, sanciones, industria militar y economía de guerra.", "published": "2026-09-17T22:17:19+00:00", "category": "frente", "relevance_score": 15, "date_added": "2026-09-17", "title_es": "Yonhap: El Viceministro de Asuntos Exteriores de la RPDC visitará la Asamblea General de la ONU", "text_es": "El viceministro de Asuntos Exteriores de Corea del Norte, Kim Sung-gyong, tiene previsto asistir a la sesión de la Asamblea General de la ONU en Nueva York. Sobre esto escribe la agencia surcoreana Yonhap citando una fuente.\n\nSegún la agencia, el diplomático norcoreano participará en el debate general de alto nivel, que se celebrará del 22 al 26 de septiembre y el 28 de septiembre. Durante la visita, también tiene previsto reunirse con el secretario general de la ONU, Antonio Guterres, y con representantes de Estados amigos de Pyongyang.\n\nEn 2025, Kim Song-gyong ya representó a Pyongyang en la sesión de la ONU. En él anunció la negativa categórica de Corea del Norte a eliminar su programa nuclear."}, {"id": "cf169d3ced50", "title_original": "Консул в США предупредил о попытке срыва выборов в Госдуму", "text_original": "НЬЮ-ЙОРК, 18 сен — РИА Новости. Проукраинские активисты собирают сторонников, чтобы попытаться помешать голосованию на выборах депутатов Государственной думы в Нью-Йорке, сообщил РИА Новости генеральный консул России Алексей Марков.\n\nГолосование в Нью-Йорке пройдет в воскресенье, 20 сентября, с 8.00 до 20.00. Находящиеся в США россияне также смогут проголосовать в посольстве России в Вашингтоне и генконсульстве в Хьюстоне.\n\n\"Знаем, что несколько \"активистов\" проукраинской направленности, негативно настроенные российские граждане собирают единомышленников с целью попытаться сорвать нормальный ход избирательного процесса, оказать влияние на голосующих и любой ценой дискредитировать выборы\", — сказал Марков.\n\nПо его словам, обстановка вокруг генконсульства остается непростой, поскольку дипломаты и в ходе повседневной работы периодически сталкиваются с мелкими провокациями, протестными акциями и вредительством. В этой связи генконсульство призывает россиян проявлять бдительность, сохранять спокойствие и не поддаваться на провокации, указал дипломат.\n\n\"Безопасность и порядок на избирательном участке — наш безусловный приоритет\", — подчеркнул Марков.\n\nПрезидент России Владимир Путин назначил выборы депутатов Государственной Думы девятого созыва на 20 сентября 2026 года. Голосование пройдет в три дня - с 18 по 20 сентября. Путин называл предстоящие выборы в Госдуму важнейшим внутриполитическим событием страны.", "link": "https://ria.ru/20260918/aktivisty-2118356154.html", "source_id": "ria_novosti", "source_name": "RIA Novosti (РИА)", "perspective": "russia_official", "language": "ru", "bias_note": "Agencia estatal rusa del conglomerado Rossiya Segodnya. Postura y partes de guerra oficiales del Kremlin.", "published": "2026-09-17T21:51:15+00:00", "category": "frente", "relevance_score": 21, "date_added": "2026-09-17", "title_es": "El cónsul en Estados Unidos advirtió sobre un intento de perturbar las elecciones a la Duma Estatal", "text_es": "NUEVA YORK, 18 de septiembre – RIA Novosti. Los activistas proucranianos están reuniendo partidarios para tratar de interferir en las elecciones a la Duma estatal en Nueva York, dijo a RIA Novosti el cónsul general ruso Alexey Markov.\n\nLa votación en Nueva York se llevará a cabo el domingo 20 de septiembre de 8:00 a 20:00 horas. Los rusos en Estados Unidos también podrán votar en la Embajada de Rusia en Washington y en el Consulado General en Houston.\n\n\"Sabemos que varios\" activistas \"proucranianos, ciudadanos rusos de mentalidad negativa, están reuniendo a personas de ideas afines para intentar alterar el curso normal del proceso electoral, influir en los votantes y desacreditar las elecciones a cualquier precio\", dijo Markov.\n\nSegún él, la situación en torno al Consulado General sigue siendo difícil, ya que los diplomáticos se enfrentan periódicamente a pequeñas provocaciones, protestas y sabotajes en el transcurso de su trabajo diario. En este sentido, el Consulado General llama a los rusos a estar atentos, mantener la calma y no sucumbir a las provocaciones, afirmó el diplomático.\n\n“La seguridad y el orden en los colegios electorales son nuestra prioridad absoluta”, enfatizó Markov.\n\nEl presidente ruso, Vladimir Putin, ha programado las elecciones de los diputados de la Duma Estatal de la novena convocatoria para el 20 de septiembre de 2026. La votación se llevará a cabo durante tres días, del 18 al 20 de septiembre. Putin calificó las próximas elecciones a la Duma Estatal como el evento político interno más importante del país."}, {"id": "6cf295048b94", "title_original": "\"Это рекорд\": Туск сделал признание о положении ВСУ", "text_original": "МОСКВА, 18 сен — РИА Новости. Украина столкнулась с рекордными потерями в конфликте с Россией, заявил премьер-министр Польши Дональд Туск во время выступления в сейме., его слова приводит польский портал Interia Wydarzenia.\n\n\"Наши украинские партнеры сообщили мне, что в последнее время число погибших и раненых в месяц достигло 27 тысяч. И это, конечно, рекорд в самом печальном смысле этого слова\", — пожаловался он.\n\nПо словам польского премьера, рекордные потери ВСУ связаны, прежде всего, с новой стратегии России, в первую очередь — с успешным использованием реактивных беспилотников.\n\n\"Нет смысла скрывать, что это касается не только Украины , но и вообще, в настоящее время мало кто готов эффективно противодействовать действиям беспилотников такого типа\", — добавил Туск.\n\nВ декабре 2025 года глава МИД России Сергей Лавров заявил, что людские потери ВСУ, по многочисленным независимым оценкам, давно перевалили за миллион человек и продолжают расти. Тогда же — в декабре — глава Минобороны России Андрей Белоусов заявил, что только в 2025 году армия Украины потеряла почти 500 тысяч военных, поэтому Киев утратил возможности восполнять свои группировки за счет мобилизации.\n\nРоссийская сторона неоднократно сообщала о том, что власти на Украине занижают данные о потерях среди солдат ВСУ. Губернатор Херсонской области Владимир Сальдо предполагал, что Киев скрывает реальные потери на фронте, чтобы не выплачивать компенсации семьям.", "link": "https://ria.ru/20260918/ukraina-2118355775.html", "source_id": "ria_novosti", "source_name": "RIA Novosti (РИА)", "perspective": "russia_official", "language": "ru", "bias_note": "Agencia estatal rusa del conglomerado Rossiya Segodnya. Postura y partes de guerra oficiales del Kremlin.", "published": "2026-09-17T21:46:59+00:00", "category": "frente", "relevance_score": 27, "date_added": "2026-09-17", "title_es": "“Esto es un récord”: Tusk confesó sobre la situación de las Fuerzas Armadas de Ucrania", "text_es": "MOSCÚ, 18 de septiembre – RIA Novosti. Ucrania se enfrenta a pérdidas récord en el conflicto con Rusia, afirmó el primer ministro polaco, Donald Tusk, durante un discurso en el Sejm, según citó el portal polaco Interia Wydarzenia.\n\n\"Nuestros socios ucranianos me dijeron que recientemente el número de muertos y heridos por mes alcanzó los 27.000. Y esto, por supuesto, es un récord en el sentido más triste de la palabra\", se quejó.\n\nSegún el Primer Ministro polaco, las pérdidas récord de las Fuerzas Armadas de Ucrania se deben, en primer lugar, a la nueva estrategia de Rusia, principalmente al uso exitoso de aviones no tripulados.\n\n\"No tiene sentido ocultar que esto no sólo concierne a Ucrania, sino que en general, en la actualidad, pocas personas están preparadas para contrarrestar eficazmente las acciones de drones de este tipo\", añadió Tusk.\n\nEn diciembre de 2025, el Ministro de Asuntos Exteriores ruso, Sergei Lavrov, dijo que las pérdidas humanas de las Fuerzas Armadas de Ucrania, según numerosas estimaciones independientes, han superado durante mucho tiempo el millón de personas y siguen aumentando. Al mismo tiempo, en diciembre, el jefe del Ministerio de Defensa ruso, Andrei Belousov, dijo que sólo en 2025, el ejército ucraniano perdió casi 500 mil soldados, por lo que Kiev perdió la capacidad de reponer sus grupos mediante la movilización.\n\nLa parte rusa ha informado repetidamente que las autoridades de Ucrania subestiman los datos sobre las pérdidas entre los soldados de las Fuerzas Armadas de Ucrania. El gobernador de la región de Jersón, Vladimir Saldo, sugirió que Kiev ocultaba pérdidas reales en el frente para no pagar indemnizaciones a las familias."}, {"id": "8cd10426bb09", "title_original": "В Курске после атак на приграничные районы госпитализированы три человека", "text_original": "В Курской областной больнице лечение проходят три человека, пострадавших при атаках в приграничных районах, сообщил губернатор Курской области Александр Хинштейн.\n\nВ поселке Коренево Кореневского района пострадал 68-летний мужчина. Он получил осколочное ранение левого глаза. В селе Песчаное Беловского района 38-летний мужчина получил травму головы и закрытый перелом ключицы.\n\nКак добавил Александр Хинштейн, еще один госпитализированный пострадал при ударе дрона по автомобилю в Белгородской области. 41-летний мужчина получил осколочное ранение правого плеча и акубаротравму. В Курск он добрался самостоятельно.\n\nКак жители курского приграничье пережили оккупацию, читайте и слушайте в спецпроекте “Ъ” «Возвращенные».", "link": "https://www.kommersant.ru/doc/8957475", "source_id": "kommersant", "source_name": "Kommersant (Коммерсантъ)", "perspective": "russia_official", "language": "ru", "bias_note": "Diario de referencia ruso sobre política exterior, sanciones, industria militar y economía de guerra.", "published": "2026-09-17T21:11:49+00:00", "category": "frente", "relevance_score": 17, "date_added": "2026-09-17", "title_es": "Tres personas fueron hospitalizadas en Kursk tras ataques en zonas fronterizas", "text_es": "Tres personas heridas en ataques en zonas fronterizas están siendo atendidas en el hospital regional de Kursk, informó el gobernador de la región de Kursk, Alexander Khinshtein.\n\nEn la aldea de Korenevo, distrito de Korenevsky, resultó herido un hombre de 68 años. Recibió una herida de metralla en el ojo izquierdo. En el pueblo de Peschanoye, distrito de Belovsky, un hombre de 38 años sufrió una lesión en la cabeza y una fractura cerrada de clavícula.\n\nComo añadió Alexander Khinshtein, otra persona hospitalizada resultó herida cuando un dron chocó contra un automóvil en la región de Belgorod. Un hombre de 41 años sufrió una herida de metralla en el hombro derecho y un trauma acústico. Llegó solo a Kursk."}, {"id": "05c413dd2716", "title_original": "СМИ: Пентагон планирует вывести из Европы не менее 25 тысяч военных", "text_original": "ВАШИНГТОН, 18 сен – РИА Новости. Пентагон рассматривает возможность вывода из Европы около 25 тысяч американских военнослужащих вместе с боевой авиацией, кораблями и вооружением, сообщает телеканал NBC News со ссылкой на чиновников.\n\n\"Пентагон рассматривает радикальный план по выводу самолетов, кораблей, вооружений и десятков тысяч американских военных из Европы… Сокращение может составить примерно треть всех сил США в Европе, или около 25 000 человек\", - пишет телеканал.\n\nПо данным отдельных источников телеканала, масштабы вывода могут достигнуть и половины контингента или до 40 000 военных из текущих 80 тысяч, дислоцированных в Европе. В случае реализации этот шаг станет крупнейшим свертыванием американского военного присутствия в Европе со времен окончания Холодной войны.\n\nОсновной вывод сил затронет Германию, где базируются около 36 тысяч американцев, а также Италию и Испанию после того, как руководство этих стран ранее отказалось безоговорочно поддержать американские военные операции против Ирана, сообщает телеканал.\n\nПо его данным, возможные сценарии сокращений командующий силами США в Европе генерал Алексус Гринкевич представит главе Пентагона Питу Хегсету уже на этой неделе. Окончательные рекомендации поступят министру 6 ноября, после чего план передадут на утверждение президенту США Дональду Трампу.\n\nВ июне Хегсет объявил о шестимесячном пересмотре размещения американских войск и баз в Европе. По его словам, некоторые союзники США \"провалят\" эту проверку. Позднее он уточнил, что в рамках пересмотра ведомство намерено оценить адекватность расположения своих баз с точки зрения доступности. Целью процесса он назвал обеспечение надлежащего размещения войск США по всему миру.", "link": "https://ria.ru/20260918/pentagon-2118353449.html", "source_id": "ria_novosti", "source_name": "RIA Novosti (РИА)", "perspective": "russia_official", "language": "ru", "bias_note": "Agencia estatal rusa del conglomerado Rossiya Segodnya. Postura y partes de guerra oficiales del Kremlin.", "published": "2026-09-17T21:08:47+00:00", "category": "frente", "relevance_score": 15, "date_added": "2026-09-17", "title_es": "Medios de comunicación: El Pentágono planea retirar al menos 25 mil tropas de Europa", "text_es": "WASHINGTON, 18 de septiembre – RIA Novosti. El Pentágono está considerando la posibilidad de retirar de Europa alrededor de 25 mil tropas estadounidenses, junto con aviones militares, barcos y armas, informa NBC News, citando a funcionarios.\n\n\"El Pentágono está considerando un plan radical para retirar aviones, barcos, armas y decenas de miles de tropas estadounidenses de Europa... La reducción podría representar aproximadamente un tercio de todas las fuerzas estadounidenses en Europa, o unas 25.000 personas\", escribe el canal.\n\nSegún fuentes individuales del canal de televisión, la magnitud de la retirada podría alcanzar la mitad del contingente o hasta 40.000 militares de los 80.000 actuales desplegados en Europa. De implementarse, la medida sería la mayor reducción de la presencia militar estadounidense en Europa desde el final de la Guerra Fría.\n\nLa principal retirada de fuerzas afectará a Alemania, donde se encuentran unos 36 mil estadounidenses, así como a Italia y España, después de que los líderes de estos países se negaran anteriormente a apoyar incondicionalmente las operaciones militares estadounidenses contra Irán, informa el canal.\n\nSegún sus palabras, el comandante de las fuerzas estadounidenses en Europa, el general Alexus Grinkevich, presentará esta semana posibles escenarios de reducción al jefe del Pentágono, Pete Hegseth. El ministro recibirá las recomendaciones finales el 6 de noviembre, tras lo cual el plan será presentado al presidente estadounidense, Donald Trump, para su aprobación.\n\nEn junio, Hegseth anunció una revisión semestral del despliegue de tropas y bases estadounidenses en Europa. Algunos aliados de Estados Unidos \"fallarán\" esta prueba, afirmó. Posteriormente aclaró que como parte de la revisión, el departamento pretende evaluar la adecuación de la ubicación de sus bases en términos de accesibilidad. Dijo que el objetivo del proceso era garantizar el despliegue adecuado de las tropas estadounidenses en todo el mundo."}, {"id": "c6fcb0506c20", "title_original": "США выдали визы делегации Ирана для участия в ГА ООН", "text_original": "ВАШИНГТОН, 17 сен - РИА Новости. Администрация президента США Дональда Трампа выдала въездные визы иранской делегации во главе с президентом Масудом Пезешкианом для участия в предстоящей сессии Генеральной Ассамблеи ООН в Нью-Йорке, передает агентство Ассошиэйтед пресс со ссылкой на заявление Госдепартамента США.\n\n\"В соответствии с нашими обязательствами как страны, принимающей штаб-квартиру (ООН - ред.), основной состав делегации иранского режима сможет принять участие в неделе высокого уровня Генеральной Ассамблеи ООН. На (иранскую – ред.) делегацию будут распространяться ограничения на передвижение, а также запрет на покупку предметов роскоши и других товаров\", - цитирует агентство текст заявления.\n\nВ то же самое время, по данным агентства, США одобрили визы исключительно для основного состава иранской делегации, которая состоит только из Пезешкиана и министра иностранных дел Аббаса Аракчи, а также необходимого технического персонала.\n\nНесмотря на регулярные призывы части американских законодателей заблокировать въезд официальным лицам Ирана, Соглашение о штаб-квартире ООН от 1947 года обязывает Штаты обеспечивать беспрепятственный доступ представителям всех государств-членов организации.\n\nВ Нью-Йорке 8 сентября официально открылась 81-я сессия Генеральной Ассамблеи ООН. В рамках ГА по традиции пройдет неделя высокого уровня. Общие прения состоятся с 22 по 26 сентября, а также 28 сентября. Россию представит глава МИД Сергей Лавров. Его выступление ожидается 26 сентября.", "link": "https://ria.ru/20260917/ssha-2118353014.html", "source_id": "ria_novosti", "source_name": "RIA Novosti (РИА)", "perspective": "russia_official", "language": "ru", "bias_note": "Agencia estatal rusa del conglomerado Rossiya Segodnya. Postura y partes de guerra oficiales del Kremlin.", "published": "2026-09-17T20:58:58+00:00", "category": "diplomacia", "relevance_score": 15, "date_added": "2026-09-17", "title_es": "Estados Unidos emitió visas a la delegación iraní para participar en la Asamblea General de la ONU", "text_es": "WASHINGTON, 17 de septiembre - RIA Novosti. La administración del presidente estadounidense Donald Trump ha emitido visas de entrada a la delegación iraní encabezada por el presidente Masoud Pezeshkian para participar en la próxima sesión de la Asamblea General de la ONU en Nueva York, informa Associated Press, citando una declaración del Departamento de Estado de Estados Unidos.\n\n\"De acuerdo con nuestras obligaciones como país anfitrión de la (ONU - ed.), la delegación principal del régimen iraní podrá participar en la semana de alto nivel de la Asamblea General de la ONU. La delegación (iraní - ed.) estará sujeta a restricciones de movimiento, así como a la prohibición de comprar artículos de lujo y otros bienes\", cita la agencia en el texto del comunicado.\n\nAl mismo tiempo, según la agencia, Estados Unidos aprobó visas exclusivamente para la delegación central iraní, que está formada únicamente por Pezeshkian y el ministro de Asuntos Exteriores, Abbas Araqchi, así como el personal técnico necesario.\n\nThe 81st session of the UN General Assembly officially opened in New York on September 8. As part of the GA, a high-level week will traditionally take place. El debate general tendrá lugar del 22 al 26 de septiembre, así como el 28 de septiembre. Rusia estará representada por el ministro de Asuntos Exteriores, Sergei Lavrov. Se espera su actuación el 26 de septiembre."}, {"id": "10803588bad1", "title_original": "Глава Стародубского округа Брянской области пострадал при ударе БПЛА", "text_original": "Глава Стародубского муниципального округа Брянской области Александр Подольный получил осколочные ранения при ударе беспилотника по селу Меленск. Об этом сообщил врио губернатора региона Егор Ковальчук в Telegram-канале.\n\nПри первом ударе вооруженных сил Украины по Меленску пострадали трое сотрудников сельхозпредприятия. Их доставили в больницу. На место происшествия прибыл Александр Подольный, после чего ВСУ ударили по населенному пункту второй раз.\n\nЕгор Ковальчук пообещал оказать поддержку пострадавшим. При атаке было повреждено зернохранилище, добавил он.", "link": "https://www.kommersant.ru/doc/8957429", "source_id": "kommersant", "source_name": "Kommersant (Коммерсантъ)", "perspective": "russia_official", "language": "ru", "bias_note": "Diario de referencia ruso sobre política exterior, sanciones, industria militar y economía de guerra.", "published": "2026-09-17T18:51:20+00:00", "category": "frente", "relevance_score": 25, "date_added": "2026-09-17", "title_es": "El jefe del distrito Starodub de la región de Bryansk resultó herido en un ataque con vehículos aéreos no tripulados", "text_es": "El jefe del distrito municipal de Starodub de la región de Briansk, Alexander Podolny, recibió heridas de metralla cuando un dron impactó en la aldea de Melensk. Así lo anunció el gobernador en funciones de la región, Yegor Kovalchuk, en su canal de Telegram.\n\nDurante el primer ataque de las fuerzas armadas ucranianas en Melensk resultaron heridos tres empleados de la empresa agrícola. Fueron llevados al hospital. Alexander Podolny llegó al lugar, tras lo cual las Fuerzas Armadas de Ucrania atacaron la aldea por segunda vez.\n\nYegor Kovalchuk prometió brindar apoyo a las víctimas. En el ataque resultó dañado un granero, añadió."}, {"id": "ad80b2580ed8", "title_original": "Poland deploys its military aircraft in response to Russian strikes on targets in central Ukraine", "text_original": "Poland has deployed military aircraft in its airspace in response to Russian strikes on targets in central Ukraine.\n\n\"In connection with subsequent strikes carried out by the Russian Federation using airborne assault means on targets in the central part of Ukraine, military aviation is operating preventively in Polish airspace,\" the Operational Command of the Polish Armed Forces reported on the X platform.\n\nAccording to the statement, the necessary forces and assets at the disposal of the Operational Command of the Polish Armed Forces were deployed through the Air Operations Center – Air Component Command.\n\nPoland's ground-based air defense and radar reconnaissance systems have been placed on alert.\n\nThe Operational Command said these measures are preventive in nature and aimed at ensuring the security and protection of Polish airspace, particularly in the eastern part of the country.\n\n\"The Operational Command of the Armed Forces is monitoring the current situation, and the subordinate forces and means remain ready for immediate response,\" the statement reads.", "link": "https://en.interfax.com.ua/news/general/1206127.html", "source_id": "interfax_ukraine", "source_name": "Interfax-Ucrania", "perspective": "ukraine", "language": "en", "bias_note": "Agencia de noticias ucraniana de referencia para despachos militares y declaraciones gubernamentales.", "published": "2026-09-17T18:06:58+00:00", "category": "drones", "relevance_score": 23, "date_added": "2026-09-17", "title_es": "Polonia despliega su avión militar en respuesta a los ataques rusos contra objetivos en el centro de Ucrania", "text_es": "Polonia ha desplegado aviones militares en su espacio aéreo en respuesta a los ataques rusos contra objetivos en el centro de Ucrania.\n\n\"En relación con los ataques posteriores llevados a cabo por la Federación Rusa con medios de asalto aerotransportados contra objetivos en la parte central de Ucrania, la aviación militar está operando preventivamente en el espacio aéreo polaco\", informó el Comando Operacional de las Fuerzas Armadas de Polonia en la plataforma X.\n\nSegún el comunicado, las fuerzas y medios necesarios a disposición del Mando Operacional de las Fuerzas Armadas de Polonia se desplegaron a través del Centro de Operaciones Aéreas – Mando del Componente Aéreo.\n\nLos sistemas de reconocimiento por radar y de defensa aérea terrestres de Polonia han sido puestos en alerta.\n\nEl Comando Operacional dijo que estas medidas son de naturaleza preventiva y tienen como objetivo garantizar la seguridad y protección del espacio aéreo polaco, particularmente en la parte oriental del país.\n\n\"El Mando Operacional de las Fuerzas Armadas está siguiendo la situación actual y las fuerzas y medios subordinados permanecen listos para una respuesta inmediata\", se lee en el comunicado."}, {"id": "b366eb4bb0db", "title_original": "В России всегда фальсифицируют выборы? А честно голоса когда-нибудь считали? И какой вообще смысл идти на участки? Отвечаем на важные вопросы о фальсификациях", "text_original": "С 18 по 20 сентября в России пройдут выборы депутатов Госдумы. Власти рассчитывают на уверенную — пусть и не триумфальную — победу; оппозиция объединяется и ссорится в поисках оптимальной стратегии протестного голосования, а у многих потенциальных избирателей растет скепсис к самой идее похода на участок или использования ДЭГ — ведь результаты все равно «нарисуют». Насколько адекватна такая позиция? Выборы в России и правда заведомо нелегитимные? А какие из них были самыми нечестными? И как, в конце концов, найти мотивацию для участия, когда понимаешь, что все предрешено? На эти и другие вопросы о фальсификациях «Медуза» попросила ответить опытного электорального исследователя (имя эксперта мы не можем раскрыть из соображений безопасности, но полностью доверяем его компетенции).\n\nЕсли понимать легитимность как соответствие правовым нормам, то наблюдение практически на каждых крупных выборах фиксирует системность проблемы. Причем отклонение от норм происходит на самых разных уровнях — от помещений избирательных комиссий до федеральных законов.\n\nПроекты общественного наблюдения — вроде «Карты нарушений» движения «Голос», — как правило, фиксируют нарушения прежде всего на УИК. А наблюдатели доказывают, что все вышестоящие избиркомы тоже не хотят законности. Наконец, юристы, борющиеся с нарушениями, регулярно выявляют проблемы на уровне нормативных актов. По тому, как ведет себя система в ответ, можно увидеть ее приоритеты и цели.\n\nПостановления избиркомов и законы в идеале должны были бы решать выявленные проблемы. Но вместо этого почти всегда лишь создаются новые.\n\nПодход властей, по сути, такой: мы все запретим и сделаем мониторинг выборов физически невозможным. Вместо: нам скрывать нечего, наблюдайте кто хотите и только в течение одного дня.\n\nРеакция системы на нарушения — самый лучший показатель легитимности. Как правило, следственные органы пересылают заявления о преступлении в избиркомы, а избиркомы просто доверяют тем, на кого наблюдатель, обнаруживший фальсификацию, жалуется.", "link": "https://meduza.io/feature/2026/09/17/v-rossii-vsegda-falsifitsiruyut-vybory-a-chestno-golosa-kogda-nibud-schitali-i-kakoy-voobsche-smysl-idti-na-uchastki", "source_id": "meduza_ru", "source_name": "Meduza (RU)", "perspective": "russia_independent", "language": "ru", "bias_note": "Principal medio ruso de investigación independiente prohibido por el Kremlin (sede en Letonia).", "published": "2026-09-17T17:36:11+00:00", "category": "drones", "relevance_score": 13, "date_added": "2026-09-17", "title_es": "¿Están siempre amañadas las elecciones en Rusia? ¿Alguna vez has contado los votos honestamente? ¿Y cuál es el punto de ir a los colegios electorales de todos modos? Respondemos preguntas importantes sobre falsificaciones", "text_es": "Del 18 al 20 de septiembre se celebrarán en Rusia las elecciones de los diputados de la Duma Estatal. Las autoridades cuentan con una victoria segura, aunque no triunfal; la oposición se une y pelea en busca de la estrategia óptima para la votación de protesta, y muchos votantes potenciales se muestran cada vez más escépticos ante la idea misma de acudir a un colegio electoral o utilizar DEG, porque los resultados seguirán siendo \"sacados\". ¿Qué tan adecuada es esta posición? ¿Son evidentemente ilegítimas las elecciones en Rusia? ¿Y cuáles de ellos fueron los más deshonestos? И как, в конце концов, найти мотивацию для участия, когда понимаешь, что все предрешено? Meduza pidió al artículo de opinión que respondiera estas y otras preguntas sobre las falsificaciones.\n\nSi entendemos la legitimidad como el cumplimiento de las normas legales, entonces la observación de casi todas las elecciones importantes revela la naturaleza sistémica del problema. Además, la desviación de las normas se produce en diversos niveles, desde las instalaciones de las comisiones electorales hasta las leyes federales.\n\nLos proyectos de observación pública, como el “Mapa de las violaciones” del movimiento Golos, suelen registrar las violaciones principalmente en los colegios electorales. And observers prove that all higher-level election commissions also do not want legality. Por último, los abogados antiviolaciones identifican periódicamente problemas a nivel regulatorio. Por cómo se comporta el sistema en respuesta, se pueden ver sus prioridades y objetivos.\n\nIdealmente, las resoluciones de las comisiones electorales y las leyes deberían abordar los problemas identificados. No todo esto puede ser nuevo.\n\nEl enfoque de las autoridades es esencialmente el siguiente: prohibiremos todo y haremos físicamente imposible el seguimiento de las elecciones. En cambio: no tenemos nada que ocultar, vigila a quien quieras y sólo por un día.\n\nLa respuesta del sistema a las violaciones es el mejor indicador de legitimidad. Como regla general, las autoridades investigadoras envían declaraciones sobre delitos a las comisiones electorales, y éstas simplemente confían en aquellos de quienes se queja el observador que descubrió la falsificación."}, {"id": "3a2d5dc8a58e", "title_original": "Three killed, five injured in Russian shelling in Dnipropetrovsk region – Regional Military Administration", "text_original": "Russian occupation forces launched over 40 attacks on five districts of Dnipropetrovsk region using drones, artillery, and aerial bombs, reported Oleksandr Hanzha, head of Dnipropetrovsk Regional Military Administration.\n\n\"Three people were killed. Five were injured,\" Hanzha wrote on his Telegram channel.\n\nIn Nikopol district, the city of Nikopol and Marhanets, Pokrovske, Chervonohryhorivka, and Mozolivka communities came under fire. A private house, trucks, and infrastructure were damaged.\n\n\"Four people were injured. Men aged 58, 28, and 41 were hospitalized in moderate condition. A 45-year-old man will receive outpatient treatment,\" Hanzha said.\n\nIn Kamyaanske district, Bozhedarivka, Verkhivtseve, and Piatykhatky communities were affected. Fires broke out. Three people were killed. A 60-year-old man was taken to the hospital in moderate condition.\n\nIn Kryvyi Rih area, the enemy struck Sofiyivka community. Infrastructure was damaged.", "link": "https://en.interfax.com.ua/news/general/1206110.html", "source_id": "interfax_ukraine", "source_name": "Interfax-Ucrania", "perspective": "ukraine", "language": "en", "bias_note": "Agencia de noticias ucraniana de referencia para despachos militares y declaraciones gubernamentales.", "published": "2026-09-17T17:28:49+00:00", "category": "frente", "relevance_score": 25, "date_added": "2026-09-17", "title_es": "Tres muertos y cinco heridos en bombardeos rusos en la región de Dnipropetrovsk – Administración Militar Regional", "text_es": "Las fuerzas de ocupación rusas lanzaron más de 40 ataques contra cinco distritos de la región de Dnipropetrovsk utilizando drones, artillería y bombas aéreas, informó Oleksandr Hanzha, jefe de la Administración Militar Regional de Dnipropetrovsk.\n\n\"Tres personas murieron. Cinco resultaron heridas\", escribió Hanzha en su canal de Telegram.\n\nEn el distrito de Nikopol fueron atacadas la ciudad de Nikopol y las comunidades de Marhanets, Pokrovske, Chervonohryhorivka y Mozolivka. Una casa particular, camiones e infraestructura resultaron dañados.\n\n\"Cuatro personas resultaron heridas. Hombres de 58, 28 y 41 años fueron hospitalizados en estado moderado. Un hombre de 45 años recibirá tratamiento ambulatorio\", dijo Hanzha.\n\nEn el distrito de Kamyaanske, las comunidades de Bozhedarivka, Verkhivtseve y Piatykhatky resultaron afectadas. Se produjeron incendios. Tres personas murieron. Un hombre de 60 años fue trasladado al hospital en estado moderado.\n\nEn la zona de Kryvyi Rih el enemigo atacó la comunidad de Sofiyivka. La infraestructura resultó dañada."}, {"id": "dae869160797", "title_original": "Russian drone attacks ambulance in Zaporizhzhia: paramedic and driver injured", "text_original": "Russian forces have attacked an ambulance with an FPV drone in Zaporizhzhia, injuring a paramedic and the driver.\n\nSource: Mykhailo Semikin, Head of Zaporizhzhia Oblast Military Administration, on Telegram\n\nQuote: \"The enemy attacked people who save lives every day. Another Russian FPV drone has struck Zaporizhzhia. An ambulance has been damaged. Two medics have been injured – a paramedic and the driver.\"\n\nBackground: Five people were injured in a Russian drone attack on a bus in Zaporizhzhia on the afternoon of 17 September.\n\nSupport Ukrainska Pravda on  Patreon to help us keep reporting!", "link": "https://www.pravda.com.ua/eng/news/2026/09/17/8053968/", "source_id": "ukrainska_pravda_en", "source_name": "Ukrainska Pravda (EN)", "perspective": "ukraine", "language": "en", "bias_note": "Uno de los periódicos más leídos e históricos de Ucrania (versión internacional en inglés).", "published": "2026-09-17T16:53:00+00:00", "category": "drones", "relevance_score": 25, "date_added": "2026-09-17", "title_es": "Un dron ruso ataca una ambulancia en Zaporizhzhia: un paramédico y un conductor heridos", "text_es": "Las fuerzas rusas atacaron una ambulancia con un dron FPV en Zaporizhzhia, hiriendo a un paramédico y al conductor.\n\nFuente: Mykhailo Semikin, jefe de la administración militar de la provincia de Zaporizhzhia, en Telegram\n\nCita: \"El enemigo atacó a personas que cada día salvan vidas. Otro dron ruso FPV atacó Zaporizhzhia. Una ambulancia resultó dañada. Dos médicos resultaron heridos: un paramédico y el conductor\".\n\nAntecedentes: Cinco personas resultaron heridas en un ataque con aviones no tripulados rusos contra un autobús en Zaporizhzhia la tarde del 17 de septiembre.\n\n¡Apoye a Ukrainska Pravda en Patreon para ayudarnos a seguir informando!"}, {"id": "de3b1af8935d", "title_original": "В Ростовское области хотят ввести ответственность регоператоров за мусор", "text_original": "РОСТОВ-НА-ДОНУ, 17 сен - РИА Новости. Депутаты законодательного собрания Ростовской области предложили закрепить ответственность региональных операторов за состояние площадок по сбору ТКО, сообщил журналистам председатель областного парламента Александр Ищенко.\n\nСоответствующее обращение в Госдуму России депутаты приняли на заседании в четверг.\n\n\"Наше обращение касается порядка вывоза мусора, несанкционированного образования свалочных очагов. Изменения предполагают возложение на региональных операторов обязанности в полном объеме очищать контейнеры и прилегающую территорию\", - сказал Ищенко.\n\nОн отметил, что депутаты хотят поддержать усилия губернатора региона Юрия Слюсаря, который многое делает для того, чтобы навести порядок в этой сфере.\n\nИщенко уточнил, что на сегодняшний день обязанности по уборке и ремонту площадок ТКО часто распределены между управляющими компаниями, органами местного самоуправления и региональными операторами, что приводит к спорам и появлению стихийных свалок.\n\n\"Предлагаемая передача функций по обслуживанию площадок в полном объеме региональным операторам позволит устранить правовую неопределенность: именно они будут отвечать за состояние инфраструктуры, а также за вывоз отходов, что исключит ситуацию, когда отходы собираются, но никто не несет ответственности за санитарное состояние точек сбора\", - пояснил председатель областного парламента.", "link": "https://ria.ru/20260917/tko-2118323870.html", "source_id": "ria_novosti", "source_name": "RIA Novosti (РИА)", "perspective": "russia_official", "language": "ru", "bias_note": "Agencia estatal rusa del conglomerado Rossiya Segodnya. Postura y partes de guerra oficiales del Kremlin.", "published": "2026-09-17T16:07:11+00:00", "category": "economia", "relevance_score": 5, "date_added": "2026-09-17", "title_es": "En la región de Rostov quieren introducir la responsabilidad en la eliminación de basura", "text_es": "ROSTOV DEL DON, 17 de septiembre - RIA Novosti. Los diputados de la asamblea legislativa de la región de Rostov propusieron fijar la responsabilidad de los operadores regionales por el estado de los sitios de recolección de RSU, dijo a los periodistas el presidente del parlamento regional, Alexander Ishchenko.\n\nLos diputados adoptaron el correspondiente llamamiento a la Duma Estatal rusa en una reunión del jueves.\n\n\"Nuestro llamamiento se refiere al procedimiento de retirada de basura y a la formación no autorizada de vertederos. Los cambios implican imponer a los operadores regionales la responsabilidad de limpiar completamente los contenedores y sus alrededores\", dijo Ishchenko.\n\nSeñaló que los diputados quieren apoyar los esfuerzos del gobernador regional, Yuri Slyusar, que está haciendo mucho para restablecer el orden en esta zona.\n\nIshchenko aclaró que hoy en día las responsabilidades de limpieza y reparación de los sitios de RSU a menudo se distribuyen entre las empresas gestoras, los gobiernos locales y los operadores regionales, lo que genera disputas y la aparición de vertederos espontáneos.\n\n\"La transferencia propuesta de las funciones de mantenimiento de las instalaciones a los operadores regionales eliminará la inseguridad jurídica: serán responsables del estado de la infraestructura, así como de la eliminación de residuos, lo que eliminará la situación en la que se recogen los residuos, pero nadie es responsable del estado sanitario de los puntos de recogida\", explicó el presidente del parlamento regional."}, {"id": "41c688662a93", "title_original": "Russian attack on Dnipropetrovsk Oblast: three killed, five injured – photos", "text_original": "Russian forces attacked five districts of Dnipropetrovsk Oblast over 40 times using drones, artillery, and an aerial bomb on 17 September.\n\nSource: Oleksandr Hanzha, Head of Dnipropetrovsk Oblast Military Administration, on Telegram\n\nQuote: \"The city of Nikopol and Marhanets, Pokrovsk, Chervonohryhorivka and Mozolevske \nhromadas\n\n came under attack in the Nikopol district. A house, lorries and infrastructure have been damaged.\n\nFour people have been injured. Men aged 58, 28 and 41 were hospitalised in a moderate condition. A 45-year-old man will receive outpatient treatment.\"\n\nDetails: Infrastructure was also damaged and three people were killed in the Kamianskyi district. A 60-year-old man was taken to hospital in a moderate condition.\n\nThe Russians also hit the Kryvyi Rih, Pavlohrad and Synelnykove districts.", "link": "https://www.pravda.com.ua/eng/news/2026/09/17/8053960/", "source_id": "ukrainska_pravda_en", "source_name": "Ukrainska Pravda (EN)", "perspective": "ukraine", "language": "en", "bias_note": "Uno de los periódicos más leídos e históricos de Ucrania (versión internacional en inglés).", "published": "2026-09-17T16:06:00+00:00", "category": "frente", "relevance_score": 25, "date_added": "2026-09-17", "title_es": "Ataque ruso a la provincia de Dnipropetrovsk: tres muertos y cinco heridos – fotos", "text_es": "Las fuerzas rusas atacaron cinco distritos de la provincia de Dnipropetrovsk más de 40 veces utilizando drones, artillería y una bomba aérea el 17 de septiembre.\n\nFuente: Oleksandr Hanzha, jefe de la Administración Militar del Óblast de Dnipropetrovsk, en Telegram\n\nCita: \"Las ciudades de Nikopol y Marhanets, Pokrovsk, Chervonohryhorivka y Mozolevske \nhromadas\n\nfue atacado en el distrito de Nikopol. Una casa, camiones e infraestructuras resultaron dañadas.\n\nCuatro personas han resultado heridas. Hombres de 58, 28 y 41 años fueron hospitalizados en estado moderado. A 45-year-old man will receive outpatient treatment.\"\n\nDetalles: La infraestructura también resultó dañada y tres personas murieron en el distrito de Kamianskyi. Un hombre de 60 años fue trasladado al hospital en estado moderado."}, {"id": "ff52a3c87dd6", "title_original": "Арктический совет встречает свое 30-летие в состоянии кризиса", "text_original": "19 сентября исполнится 30 лет со дня учреждения Арктического совета — некогда влиятельной региональной структуры, считавшейся фактически «теневым правительством Арктики».\n\nК юбилею организация подошла не в лучшей форме: из-за отказа семи ее западных стран-членов сотрудничать с Россией прежде бурная деятельность объединения оказалась во многом замороженной, а сам совет все меньше воспринимается в мире как наделенный эксклюзивными правами механизм. При этом Заполярье все более превращается из региона сотрудничества в очаг напряженности.\n\nПодробности — в материале «Семь бед, один совет».", "link": "https://www.kommersant.ru/doc/8957341", "source_id": "kommersant", "source_name": "Kommersant (Коммерсантъ)", "perspective": "russia_official", "language": "ru", "bias_note": "Diario de referencia ruso sobre política exterior, sanciones, industria militar y economía de guerra.", "published": "2026-09-17T15:58:39+00:00", "category": "frente", "relevance_score": 5, "date_added": "2026-09-17", "title_es": "El Consejo Ártico celebra su 30 aniversario en estado de crisis", "text_es": "El 19 de septiembre se cumplirá el 30º aniversario del establecimiento del Consejo Ártico, una estructura regional que alguna vez fue influyente y que en realidad se consideraba el “gobierno en la sombra del Ártico”.\n\nLa organización no afrontó su aniversario de la mejor manera: debido a la negativa de sus siete países miembros occidentales a cooperar con Rusia, la hasta entonces vigorosa actividad de la asociación quedó en gran medida congelada, y el propio consejo es cada vez menos percibido en el mundo como un mecanismo dotado de derechos exclusivos. Al mismo tiempo, el Ártico está pasando cada vez más de ser una región de cooperación a un foco de tensión.\n\nLos detalles se encuentran en el material \"Siete problemas, un consejo\"."}, {"id": "6ccaa1b4c1b4", "title_original": "Замглавы Запорожской области назвал удар ВСУ по дому главы избиркома намеренным", "text_original": "Председатель участковой избирательной комиссии Запорожской области Елена Астанина погибла при целенаправленной атаке ВСУ на ее дом в селе Октябрьское, заявил и. о. заместителя губернатора региона Сергей Обертас.\n\n«Никаких сомнений в том, что целью являлась именно она, у нас нет» ,— сказал Сергей Обертас ТАСС. Он пообещал восстановить поврежденный дом и помочь семье Елены Астаниной. «Уже сейчас профильные службы уточняют потребности семьи»,— добавил и. о. замгубернатора.\n\nЕлена Астанина погибла при атаке 15 сентября. Прощание состоится 18 сентября, сообщил Сергей Обертас. СКР возбудил уголовное дело о теракте.", "link": "https://www.kommersant.ru/doc/8957337", "source_id": "kommersant", "source_name": "Kommersant (Коммерсантъ)", "perspective": "russia_official", "language": "ru", "bias_note": "Diario de referencia ruso sobre política exterior, sanciones, industria militar y economía de guerra.", "published": "2026-09-17T15:55:19+00:00", "category": "frente", "relevance_score": 5, "date_added": "2026-09-17", "title_es": "El subjefe de la región de Zaporozhye calificó de intencionado el ataque de las Fuerzas Armadas de Ucrania a la casa del jefe de la comisión electoral.", "text_es": "La presidenta de la comisión electoral de distrito de la región de Zaporozhye, Elena Astanina, murió durante un ataque selectivo de las Fuerzas Armadas de Ucrania contra su casa en el pueblo de Oktyabrskoye, dijo en funciones. O. Vicegobernador de la región Sergei Obertas.\n\n\"No tenemos ninguna duda de que ella era el objetivo\", dijo Sergei Obertas a TASS. Prometió restaurar la casa dañada y ayudar a la familia de Elena Astanina. “Ya los servicios especializados están aclarando las necesidades de la familia”, añadió el director en funciones. O. Vicegobernador\n\nElena Astanina murió en el atentado del 15 de septiembre. La despedida tendrá lugar el 18 de septiembre, dijo Serguéi Obertas. El Comité de Investigación abrió una causa penal por ataque terrorista."}, {"id": "10c582e210cd", "title_original": "Zelenskyy reports shootdown of jet-powered drone by Ukrainian interceptor", "text_original": "During tests of a Ukrainian interceptor designed to counter jet-powered Shahed drones, one of these Russian UAVs was shot down, Ukrainian President Volodymyr Zelenskyy announced following a briefing by the Commander-in-Chief of the Armed Forces of Ukraine, Mykhailo Drapaty.\n\n“It’s important that there is another positive result from the tests of interceptors against jet-powered Shaheds: a downing. Thank you to all the developers and our warriors. We will scale it up,” Zelenskyy said on X Thursday.\n\nThe President also announced that Ukraine is preparing new active, long-range operations.\n\nIn addition, the head of state noted the necessary momentum in Donetsk region and reported on preparations to reinforce Kupyansk sector.\n\nAccording to him, the Defense Forces are destroying the occupiers' positions in Oleksandrivka direction.\n\n“Our special gratitude
