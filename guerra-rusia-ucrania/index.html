a fue atacado hoy con bengalas durante una operación fotográfica de rutina de una fragata rusa, que se encontraba en aguas internacionales frente a Gedser\"."}, {"id": "2c2921d292bc", "title_original": "Ukrainian Attack Kills One in Belgorod, Hits Commercial and Industrial Sites Across Russia", "text_original": "Overnight Ukrainian drone and missile strikes across southern Russia killed one person and struck commercial and industrial sites, regional officials said Tuesday.\n\nActing Belgorod region Governor Alexander Shuvayev confirmed one death in an attack near the border with Ukraine. He also said that a woman who was hospitalized for her injuries following strikes earlier this month had died.\n\nIn the nearby Rostov region, Governor Yury Slyusar said an Ozon warehouse was among several sites damaged during a missile attack on the port city of Taganrog.\n\nOzon confirmed that it suspended operations at the facility, where it said a fire broke out. No one was hurt, the company said.\n\nFederal investigators launched a criminal probe into terrorism over the attacks on Taganrog, citing damage to Ozon and other residential and agricultural buildings.\n\nSamara region Governor Vyacheslav Fedorishchev said an “industrial facility” was damaged in overnight strikes. Unconfirmed reports said that a fire broke out at the Syzran Oil Refinery.", "link": "https://www.themoscowtimes.com/2026/09/15/ukrainian-attack-kills-one-in-belgorod-hits-commercial-and-industrial-sites-across-russia-a93708", "source_id": "the_moscow_times", "source_name": "The Moscow Times", "perspective": "russia_independent", "language": "en", "bias_note": "Diario independiente ruso en el exilio crítico con Putin y con cobertura de ataques en territorio ruso.", "published": "2026-09-15T08:22:00+00:00", "category": "drones", "relevance_score": 25, "date_added": "2026-09-16", "title_es": "Ataque ucraniano mata a una persona en Belgorod y alcanza sitios comerciales e industriales en toda Rusia", "text_es": "Los ataques nocturnos con drones y misiles ucranianos en el sur de Rusia mataron a una persona y afectaron sitios comerciales e industriales, dijeron el martes funcionarios regionales.\n\nEl gobernador en funciones de la región de Belgorod, Alexander Shuvayev, confirmó una muerte en un ataque cerca de la frontera con Ucrania. También dijo que una mujer que fue hospitalizada por sus heridas tras los ataques de principios de este mes había muerto.\n\nEn la cercana región de Rostov, el gobernador Yury Slyusar dijo que un almacén de Ozon se encontraba entre varios sitios dañados durante un ataque con misiles contra la ciudad portuaria de Taganrog.\n\nOzon confirmó que suspendió las operaciones en la instalación, donde dijo que se produjo un incendio. Nadie resultó herido, dijo la empresa.\n\nLos investigadores federales iniciaron una investigación penal sobre terrorismo por los ataques a Taganrog, citando daños a Ozon y otros edificios residenciales y agrícolas.\n\nEl gobernador de la región de Samara, Vyacheslav Fedorishchev, dijo que una \"instalación industrial\" resultó dañada en los ataques nocturnos. Informes no confirmados decían que se produjo un incendio en la refinería de petróleo de Syzran."}, {"id": "f3a1597bb1e2", "title_original": "Ukrainian Drone Strike in Sochi Wounds 5", "text_original": "Five people including a child were wounded in an overnight Ukrainian drone attack on the Black Sea resort city of Sochi, local officials said Monday.\n\nEmergency authorities said only one of the victims was hospitalized for their injuries. Three homes were also damaged as a result of the air assault, they added.\n\nSochi Mayor Andrei Proshunin said firefighters extinguished fires that had broken out from the attack. He warned people not to approach any drone debris.\n\nProshunin later announced the closure of Sochis beache’s due to the ongoing risk of drone strikes.\n\nIn the neighboring Rostov region, Governor Yury Slyusar said air defense systems intercepted 50 drones over the region. He reported damage to civilian infrastructure but said that no one was hurt.\n\nRussia’s Defense Ministry said it intercepted 399 Ukrainian drones across Russia and annexed Crimea between Sunday night and Monday morning.", "link": "https://www.themoscowtimes.com/2026/09/14/ukrainian-drone-strike-in-sochi-wounds-5-a93699", "source_id": "the_moscow_times", "source_name": "The Moscow Times", "perspective": "russia_independent", "language": "en", "bias_note": "Diario independiente ruso en el exilio crítico con Putin y con cobertura de ataques en territorio ruso.", "published": "2026-09-14T09:25:00+00:00", "category": "drones", "relevance_score": 35, "date_added": "2026-09-16", "title_es": "Ataque ucraniano con drones en Sochi deja cinco heridos", "text_es": "Cinco personas, incluido un niño, resultaron heridas en un ataque nocturno con aviones no tripulados ucranianos en la ciudad turística de Sochi, en el Mar Negro, dijeron funcionarios locales el lunes.\n\nLas autoridades de emergencia dijeron que solo una de las víctimas fue hospitalizada por sus heridas. Tres viviendas también resultaron dañadas como consecuencia del ataque aéreo, añadieron.\n\nEl alcalde de Sochi, Andrei Proshunin, dijo que los bomberos extinguieron los incendios que se habían desatado tras el ataque. Advirtió a la gente que no se acercara a los restos de ningún dron.\n\nProshunin anunció más tarde el cierre de las playas de Sochis debido al riesgo constante de ataques con aviones no tripulados.\n\nEn la vecina región de Rostov, el gobernador Yury Slyusar dijo que los sistemas de defensa aérea interceptaron 50 drones sobre la región. Informó de daños a la infraestructura civil, pero dijo que nadie resultó herido.\n\nEl Ministerio de Defensa de Rusia dijo que interceptó 399 drones ucranianos en toda Rusia y anexó Crimea entre el domingo por la noche y el lunes por la mañana."}, {"id": "c60f7782d617", "title_original": "Swedish left-wing bloc narrowly ahead with election too close to call", "text_original": "Sweden's general election remains too close to call with the left-wing bloc marginally ahead as the vote count continues.\n\nWith more than 90% of ballots processed early on Monday, the left-wing bloc was in front by approximately 20,000 votes.\n\nPreliminary counts by Sweden's electoral authority projected the Social Democrats' Magdalena Andersson would likely finish with a three-seat majority over the rival four-party coalition led by current conservative Prime Minister Ulf Kristersson.\n\nKristersson has been supported in government by the hard-right Sweden Democrats (SD), which have neo-Nazi roots. He has promised cabinet jobs for the SD if he stays in charge.\n\nClose race in Sweden as hard right eyes role in government\n\nEarly on Monday morning, Kristersson said it remained unclear who would form the next government.", "link": "https://www.bbc.co.uk/news/articles/c0qx5d79kdeo?at_medium=RSS&at_campaign=rss", "source_id": "bbc_europe", "source_name": "BBC News (Europa)", "perspective": "international", "language": "en", "bias_note": "Servicio público británico con amplia red de corresponsales de guerra e investigación OSINT.", "published": "2026-09-14T08:36:09+00:00", "category": "frente", "relevance_score": 15, "date_added": "2026-09-16", "title_es": "El bloque de izquierda sueco se adelanta por poco y las elecciones están demasiado reñidas para convocarlas", "text_es": "Las elecciones generales de Suecia siguen siendo demasiado reñidas para convocarlas, con el bloque de izquierda ligeramente por delante mientras continúa el recuento de votos.\n\nCon más del 90% de los votos procesados ​​a primera hora del lunes, el bloque de izquierda estaba por delante por aproximadamente 20.000 votos.\n\nLos recuentos preliminares de la autoridad electoral de Suecia proyectaron que Magdalena Andersson, de los socialdemócratas, probablemente terminaría con una mayoría de tres escaños sobre la coalición rival de cuatro partidos encabezada por el actual Primer Ministro conservador Ulf Kristersson.\n\nKristersson ha sido apoyado en el gobierno por los Demócratas Suecos (SD), de extrema derecha, que tienen raíces neonazis. Ha prometido puestos en el gabinete del SD si permanece en el cargo.\n\nReñida carrera en Suecia mientras la extrema derecha juega un papel en el gobierno\n\nEarly on Monday morning, Kristersson said it remained unclear who would form the next government."}, {"id": "7292bb28b3be", "title_original": "Why a fresh wave of North Korean soldiers may fight in Russia's war in Ukraine", "text_original": "An enemy that swarmed the battlefield in large groups while under fire, seemingly oblivious to the dangers of drones and fire from automatic weapons. An elite corps of ghost soldiers who chose suicide over surrender. They fought and died in their thousands, then apparently vanished from the battlefield.\n\nNorth Korea's soldiers were sent to fight by Pyongyang alongside Russian forces as they sought to repel a Ukrainian offensive on Moscow's territory at the end of 2024. They paid a heavy price, as many as 3,000 killed in action from the 13,000 deployed.\n\nUltimately, they would adapt their tactics, and with Russia would drive Ukrainian forces from its Kursk region. In combat terms, little has been heard of them since, but according to Ukraine's president, Volodymyr Zelensky, North Korean forces, and their weaponry, are soon to make a dramatic return to Russia's war in Ukraine.\n\nLast month, Zelensky warned that up to 50,000 North Koreans will be deployed in Russia, revising an earlier estimate of 30,000 troops. He called on South Korea to provide support for his country's air defence.\n\nBut why, after such heavy losses, would North Korea send more men to fight for Russia, and what happened to its soldiers sent in the first place?\n\n\"They're still there\", said Dr Yang Uk, research fellow at the Asan Institute for Policy Studies, Center for Foreign Policy and National Security in Seoul. \"They are defending Russian territory for another counterattack from Ukraine. And we believe that some of the engineer corps or workers might be in [the Russian-occupied] Donbas area but that's not the combat troops.\"", "link": "https://www.bbc.co.uk/news/articles/cgl7zrnxxy6o?at_medium=RSS&at_campaign=rss", "source_id": "bbc_europe", "source_name": "BBC News (Europa)", "perspective": "international", "language": "en", "bias_note": "Servicio público británico con amplia red de corresponsales de guerra e investigación OSINT.", "published": "2026-09-13T23:16:33+00:00", "category": "frente", "relevance_score": 41, "date_added": "2026-09-16", "title_es": "Why a fresh wave of North Korean soldiers may fight in Russia's war in Ukraine", "text_es": "An enemy that swarmed the battlefield in large groups while under fire, seemingly oblivious to the dangers of drones and fire from automatic weapons. An elite corps of ghost soldiers who chose suicide over surrender. They fought and died in their thousands, then apparently vanished from the battlefield.\n\nNorth Korea's soldiers were sent to fight by Pyongyang alongside Russian forces as they sought to repel a Ukrainian offensive on Moscow's territory at the end of 2024. They paid a heavy price, as many as 3,000 killed in action from the 13,000 deployed.\n\nUltimately, they would adapt their tactics, and with Russia would drive Ukrainian forces from its Kursk region. In combat terms, little has been heard of them since, but according to Ukraine's president, Volodymyr Zelensky, North Korean forces, and their weaponry, are soon to make a dramatic return to Russia's war in Ukraine.\n\nLast month, Zelensky warned that up to 50,000 North Koreans will be deployed in Russia, revising an earlier estimate of 30,000 troops. He called on South Korea to provide support for his country's air defence.\n\nBut why, after such heavy losses, would North Korea send more men to fight for Russia, and what happened to its soldiers sent in the first place?\n\n\"They're still there\", said Dr Yang Uk, research fellow at the Asan Institute for Policy Studies, Center for Foreign Policy and National Security in Seoul. \"They are defending Russian territory for another counterattack from Ukraine. And we believe that some of the engineer corps or workers might be in [the Russian-occupied] Donbas area but that's not the combat troops.\""}, {"id": "20e594ab5691", "title_original": "Russian Attacks Kill 9, Injure Dozens in Ukraine as Moscow Says It Hit Ships, Plants", "text_original": "Russian airstrikes in several Ukrainian regions on Saturday killed nine people, injured dozens and damaged residential buildings and infrastructure across the country, local officials said.\n\nThe civilian death toll has risen sharply in Ukraine over the past two months as Russia steps up attacks on power plants and other infrastructure. Ukraine has hit energy facilities and warehouses in distant parts of Russia, and both sides have targeted each other's shipping.\n\n“Basically, the Russians have expanded the war away from the front, where they have no success, into the economy, and their tactics are as basic as it gets: destroying every site that could help people cope with the conditions of war,” Zelensky wrote.\n\n“Russia wants to kill the Ukrainian economy and break our resistance,” Zelensky added.\n\nThe city council in Kramatorsk, one of Ukraine's frontline “fortress cities” that Russia wants to capture, said Russian forces attacked private cars, killing three people in three incidents over a 90-minute period. Four people were injured.\n\n“These are not military targets,” the council said. “They are ordinary civilian cars. People were going about their business.”", "link": "https://www.themoscowtimes.com/2026/09/13/russian-attacks-kill-6-injure-dozens-in-ukraine-as-moscow-says-it-hit-ships-plants-a93694", "source_id": "the_moscow_times", "source_name": "The Moscow Times", "perspective": "russia_independent", "language": "en", "bias_note": "Diario independiente ruso en el exilio crítico con Putin y con cobertura de ataques en territorio ruso.", "published": "2026-09-13T07:00:00+00:00", "category": "frente", "relevance_score": 21, "date_added": "2026-09-16", "title_es": "Russian Attacks Kill 9, Injure Dozens in Ukraine as Moscow Says It Hit Ships, Plants", "text_es": "Russian airstrikes in several Ukrainian regions on Saturday killed nine people, injured dozens and damaged residential buildings and infrastructure across the country, local officials said.\n\nThe civilian death toll has risen sharply in Ukraine over the past two months as Russia steps up attacks on power plants and other infrastructure. Ukraine has hit energy facilities and warehouses in distant parts of Russia, and both sides have targeted each other's shipping.\n\n“Basically, the Russians have expanded the war away from the front, where they have no success, into the economy, and their tactics are as basic as it gets: destroying every site that could help people cope with the conditions of war,” Zelensky wrote.\n\n“Russia wants to kill the Ukrainian economy and break our resistance,” Zelensky added.\n\nThe city council in Kramatorsk, one of Ukraine's frontline “fortress cities” that Russia wants to capture, said Russian forces attacked private cars, killing three people in three incidents over a 90-minute period. Four people were injured.\n\n“These are not military targets,” the council said. “They are ordinary civilian cars. People were going about their business.”"}, {"id": "72cdd459e63e", "title_original": "Russians seek answers over hundreds missing after Ukraine's 2024 incursion", "text_original": "\"I used to have complete faith in our country,\" says Lyubov. The last time she spoke to her mother was a day after Ukrainian forces broke into Russia's Kursk region more than two years ago.\n\nNow she feels \"resentful towards the [Russian] state\", in a country where most people avoid criticising the full-scale invasion unleashed on e settlements captured by Ukraine's military, Russian authorities estimate.\n\n\"The state channels were convincing viewers that 'everything is under control: two or three days, and it'll be just as it was before',\" she recalls.\n\nShe still fails to understand why Russian authorities could not stop Ukrainian soldiers storming two border checkpoints in August 2024, taking around 40 prisoners and bombing a convoy carrying Russian soldiers."}, {"id": "c46c9012ec0e", "title_original": "Kremlin Says No Decision Yet on Putin's G20 Visit, Dismisses Zelensky's Meeting Proposal", "text_original": "Moscow has yet to decide whether Russian President Vladimir Putin will travel to the G20 summit in Miami in December, Interfax reported, citing Kremlin spokesman Dmitry Peskov.\n\n\"We don't know yet whether we'll be going to Miami,\" Peskov said.\n\nEarlier on Saturday, Kremlin foreign policy aide Yury Ushakov said the possibility of Putin attending the summit \"has not even been discussed\" in Moscow.\n\nIn April, the Kremlin said Putin could travel to the G20 summit after U.S. President ​Donald Trump suggested his attendance would be very helpful.\n\nCommenting on Ukrainian President Volodymyr Zelensky's remarks that he would travel to Miami if Putin attends and would seek a meeting with him, Peskov reiterated Moscow's long-standing position that if the Ukrainian leader wants to meet his Russian counterpart, he should come to Moscow.\n\nWe are facing unprecedented challenges. Russia's Prosecutor General's Office has designated The Moscow Times as an \"undesirable\" organization, criminalizing our work and putting our staff at risk of prosecution. This follows our earlier unjust labeling as a \"foreign agent.\"", "link": "https://www.themoscowtimes.com/2026/09/12/kremlin-says-no-decision-yet-on-putins-g20-visit-dismisses-zelenskys-meeting-proposal-a93693", "source_id": "the_moscow_times", "source_name": "The Moscow Times", "perspective": "russia_independent", "language": "en", "bias_note": "Diario independiente ruso en el exilio crítico con Putin y con cobertura de ataques en territorio ruso.", "published": "2026-09-12T13:15:20+00:00", "category": "diplomacia", "relevance_score": 21, "date_added": "2026-09-16", "title_es": "Kremlin Says No Decision Yet on Putin's G20 Visit, Dismisses Zelensky's Meeting Proposal", "text_es": "Moscow has yet to decide whether Russian President Vladimir Putin will travel to the G20 summit in Miami in December, Interfax reported, citing Kremlin spokesman Dmitry Peskov.\n\n\"We don't know yet whether we'll be going to Miami,\" Peskov said.\n\nEarlier on Saturday, Kremlin foreign policy aide Yury Ushakov said the possibility of Putin attending the summit \"has not even been discussed\" in Moscow.\n\nIn April, the Kremlin said Putin could travel to the G20 summit after U.S. President ​Donald Trump suggested his attendance would be very helpful.\n\nCommenting on Ukrainian President Volodymyr Zelensky's remarks that he would travel to Miami if Putin attends and would seek a meeting with him, Peskov reiterated Moscow's long-standing position that if the Ukrainian leader wants to meet his Russian counterpart, he should come to Moscow.\n\nWe are facing unprecedented challenges. Russia's Prosecutor General's Office has designated The Moscow Times as an \"undesirable\" organization, criminalizing our work and putting our staff at risk of prosecution. This follows our earlier unjust labeling as a \"foreign agent.\""}]</script>
  <script id="perspectives-data" type="application/json">{"ukraine": {"name": "Fuentes Ucranianas", "short_name": "Ucrania", "icon": "🇺🇦", "badge_class": "badge-ukraine", "description": "Cobertura desde el terreno, partes del Estado Mayor de las FFAA de Ucrania y periodismo de investigación local."}, "russia_independent": {"name": "Rusia Independiente (Exilio / Sin Censura)", "short_name": "Rusia Independiente", "icon": "🕊️", "badge_class": "badge-ru-ind", "description": "Medios rusos independientes operando desde el exterior sin censura del Kremlin."}, "russia_official": {"name": "Rusia Oficial (Estatal / Retórica del Kremlin)", "short_name": "Rusia Oficial", "icon": "🇷🇺", "badge_class": "badge-ru-off", "description": "Agencias estatales rusas; fundamental para conocer comunicados militares del Kremlin, declaraciones oficiales y narrativa gubernamental."}, "international": {"name": "Análisis Internacional & OSINT", "short_name": "Internacional", "icon": "🌐", "badge_class": "badge-intl", "description": "Análisis estratégico y corresponsalías de medios globales (BBC, Deutsche Welle) y reportes de inteligencia."}}</script>

  <script>
    const DAILY_ARTICLES = JSON.parse(document.getElementById('daily-data').textContent);
    const HISTORIC_ARTICLES = JSON.parse(document.getElementById('historic-data').textContent);
    const PERSPECTIVES = JSON.parse(document.getElementById('perspectives-data').textContent);

    let activeTab = 'today'; // 'today' | 'archive'
    let currentPersp = 'all';
    let currentCat = 'all';
    let searchQuery = '';
    let onlySaved = false;
    let savedIds = new Set(JSON.parse(localStorage.getItem('war_monitor_saved') || '[]'));

    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function getParagraphs(text) {
      if (!text) return [];
      return text.split(/\r?\n\r?\n/).map(p => p.trim()).filter(Boolean);
    }

    function getDataset() {
      return activeTab === 'today' ? DAILY_ARTICLES : HISTORIC_ARTICLES;
    }

    function render() {
      document.getElementById('savedCount').textContent = savedIds.size;
      const data = getDataset();

      let filtered = data.filter(a => {
        if (onlySaved && !savedIds.has(a.id)) return false;
        if (currentPersp !== 'all' && a.perspective !== currentPersp) return false;
        if (currentCat !== 'all' && a.category !== currentCat) return false;

        if (searchQuery.trim()) {
          const q = searchQuery.toLowerCase();
          const full = `${a.title_es || ''} ${a.text_es || ''} ${a.source_name || ''}`.toLowerCase();
          if (!full.includes(q)) return false;
        }
        return true;
      });

      const modeLabel = activeTab === 'today' ? 'Edición de Hoy' : 'Hemeroteca Histórica';
      document.getElementById('tabModeIndicator').textContent = `${modeLabel}:`;
      document.getElementById('resultsCount').textContent = `${filtered.length} ${filtered.length === 1 ? 'noticia' : 'noticias'}`;

      const grid = document.getElementById('cardsGrid');
      if (filtered.length === 0) {
        grid.innerHTML = '<div class="col-span-2 p-12 text-center text-slate-500 text-sm">No se encontraron noticias con los criterios seleccionados.</div>';
        return;
      }

      grid.innerHTML = filtered.map(a => {
        const isSaved = savedIds.has(a.id);
        const pInfo = PERSPECTIVES[a.perspective] || { name: a.perspective, icon: '📰', badge_class: 'badge-intl' };
        const title = a.title_es || a.title_original;
        const bodyText = a.text_es || a.text_original || '';
        
        // Párrafos para la tarjeta
        const paragraphs = getParagraphs(bodyText);
        const firstParagraph = paragraphs[0] || 'Información no disponible.';
        const secondParagraph = paragraphs[1] || '';
        const hasMore = paragraphs.length > 2;

        const langBadge = a.language === 'ru' ? '🇷🇺 Ruso' : (a.language === 'uk' ? '🇺🇦 Ucraniano' : '🇬🇧 Inglés');
        const dateTag = a.date_added ? a.date_added : (a.published ? a.published.substring(0, 10) : '');

        let catBadge = '';
        if (a.category === 'frente') catBadge = '<span class="px-2 py-0.5 rounded text-[10px] font-bold bg-rose-500/10 text-rose-400 border border-rose-500/20">💥 Frente</span>';
        else if (a.category === 'drones') catBadge = '<span class="px-2 py-0.5 rounded text-[10px] font-bold bg-purple-500/10 text-purple-400 border border-purple-500/20">🛰️ Drones</span>';
        else if (a.category === 'armamento') catBadge = '<span class="px-2 py-0.5 rounded text-[10px] font-bold bg-amber-500/10 text-amber-400 border border-amber-500/20">🛡️ Armas</span>';
        else if (a.category === 'diplomacia') catBadge = '<span class="px-2 py-0.5 rounded text-[10px] font-bold bg-blue-500/10 text-blue-400 border border-blue-500/20">🤝 Diplomacia</span>';
        else if (a.category === 'economia') catBadge = '<span class="px-2 py-0.5 rounded text-[10px] font-bold bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">📉 Sanciones</span>';

        return `
          <article class="p-4 sm:p-5 rounded-2xl bg-slate-900/85 border border-slate-800 flex flex-col justify-between gap-3 hover:border-slate-700 transition shadow-lg shadow-black/40">
            <div class="space-y-2.5">
              <!-- Meta encabezado -->
              <div class="flex items-center justify-between text-xs gap-2 flex-wrap">
                <div class="flex items-center gap-1.5 truncate">
                  <span class="font-bold text-slate-300 bg-slate-800 px-2 py-0.5 rounded text-[11px] truncate max-w-[140px]">${a.source_name}</span>
                  <span class="text-[10px] text-slate-500 font-mono">Traducido del ${langBadge}</span>
                  ${catBadge}
                </div>
                <div class="flex items-center gap-1 text-[11px] text-slate-500 font-mono">
                  <i data-lucide="calendar" class="w-3 h-3"></i>
                  <span>${dateTag}</span>
                </div>
              </div>

              <!-- Título en español -->
              <h3 class="text-sm sm:text-base font-bold text-white hover:text-sky-300 transition leading-snug cursor-pointer" onclick="openModal('${a.id}')">
                ${title}
              </h3>

              <!-- NOTICIA COMPLETA TRADUCIDA EN ESPAÑOL -->
              <div class="text-xs sm:text-sm text-slate-300 leading-relaxed space-y-2 cursor-pointer" onclick="openModal('${a.id}')">
                <p>${firstParagraph}</p>
                ${secondParagraph ? `<p>${secondParagraph}</p>` : ''}
                ${hasMore ? `<div class="text-xs font-semibold text-sky-400 hover:text-sky-300 flex items-center gap-1 pt-1"><span>Ver artículo completo (${paragraphs.length} párrafos traducidos)...</span> <i data-lucide="chevron-right" class="w-3.5 h-3.5"></i></div>` : ''}
              </div>
            </div>

            <!-- Pie de tarjeta -->
            <div class="flex items-center justify-between pt-2.5 border-t border-slate-800/80 text-xs">
              <button onclick="toggleSave('${a.id}')" class="p-1 rounded text-slate-400 hover:text-amber-400 transition flex items-center gap-1 ${isSaved ? 'text-amber-400 font-bold' : ''}">
                <i data-lucide="star" class="w-3.5 h-3.5 ${isSaved ? 'fill-amber-400 text-amber-400' : ''}"></i>
                <span class="text-[11px]">${isSaved ? 'Guardado' : 'Guardar'}</span>
              </button>

              <div class="flex items-center gap-2">
                <button onclick="openModal('${a.id}')" class="px-3 py-1.5 rounded-xl bg-sky-600 hover:bg-sky-500 text-white font-semibold transition text-xs shadow-md shadow-sky-600/20">
                  Leer completo
                </button>
                <a href="${a.link}" target="_blank" rel="noopener noreferrer" class="px-2.5 py-1.5 rounded-xl bg-slate-800 text-slate-400 hover:text-slate-200 text-xs transition" title="Abrir fuente original">
                  Fuente ↗
                </a>
              </div>
            </div>
          </article>
        `;
      }).join('');

      if (window.lucide) window.lucide.createIcons();
    }

    function toggleSave(id) {
      if (savedIds.has(id)) savedIds.delete(id);
      else savedIds.add(id);
      localStorage.setItem('war_monitor_saved', JSON.stringify(Array.from(savedIds)));
      render();
    }

    function openModal(id) {
      const data = getDataset();
      const a = data.find(x => x.id === id) || DAILY_ARTICLES.find(x => x.id === id) || HISTORIC_ARTICLES.find(x => x.id === id);
      if (!a) return;

      const pInfo = PERSPECTIVES[a.perspective] || { name: a.perspective };
      const langBadge = a.language === 'ru' ? '🇷🇺 Ruso' : (a.language === 'uk' ? '🇺🇦 Ucraniano' : '🇬🇧 Inglés');

      document.getElementById('mBadges').innerHTML = `
        <span class="bg-sky-500/20 text-sky-300 font-bold px-2 py-0.5 rounded">${a.source_name}</span>
        <span class="bg-slate-800 text-slate-400 px-2 py-0.5 rounded">Traducido del ${langBadge}</span>
        <span class="text-slate-500 text-[11px]">${a.published ? a.published.substring(0, 10) : ''}</span>
      `;

      document.getElementById('mTitle').textContent = a.title_es || a.title_original;
      document.getElementById('mBiasText').textContent = a.bias_note || 'Fuente periodística en zona de conflicto.';

      // Párrafos completos traducidos
      const paragraphs = getParagraphs(a.text_es || a.text_original);
      document.getElementById('mFullStory').innerHTML = paragraphs.map(p => `<p class="leading-relaxed mb-3">${p}</p>`).join('');

      // Texto original
      const origParas = getParagraphs(a.text_original);
      document.getElementById('mOriginalStory').innerHTML = `
        <div class="font-bold text-slate-300 mb-1.5">${a.title_original}</div>
        ${origParas.map(p => `<p class="mb-2">${p}</p>`).join('')}
      `;

      document.getElementById('mLink').href = a.link;

      const isSaved = savedIds.has(a.id);
      document.getElementById('mBookmarkLabel').textContent = isSaved ? 'Guardado' : 'Guardar';
      document.getElementById('mBookmarkBtn').onclick = () => {
        toggleSave(a.id);
        const nowSaved = savedIds.has(a.id);
        document.getElementById('mBookmarkLabel').textContent = nowSaved ? 'Guardado' : 'Guardar';
      };

      document.getElementById('modal').showModal();
      if (window.lucide) window.lucide.createIcons();
    }

    // Pestañas Hoy vs Hemeroteca
    const tabTodayBtn = document.getElementById('tabTodayBtn');
    const tabArchiveBtn = document.getElementById('tabArchiveBtn');

    tabTodayBtn.onclick = () => {
      activeTab = 'today';
      tabTodayBtn.className = "flex items-center gap-1.5 px-3.5 py-1.5 rounded-xl font-bold transition bg-sky-600 text-white shadow-md shadow-sky-600/20";
      tabArchiveBtn.className = "flex items-center gap-1.5 px-3.5 py-1.5 rounded-xl font-semibold transition text-slate-400 hover:text-slate-200";
      render();
    };

    tabArchiveBtn.onclick = () => {
      activeTab = 'archive';
      tabArchiveBtn.className = "flex items-center gap-1.5 px-3.5 py-1.5 rounded-xl font-bold transition bg-sky-600 text-white shadow-md shadow-sky-600/20";
      tabTodayBtn.className = "flex items-center gap-1.5 px-3.5 py-1.5 rounded-xl font-semibold transition text-slate-400 hover:text-slate-200";
      render();
    };

    // Filtro Guardados
    document.getElementById('savedFilterBtn').onclick = () => {
      onlySaved = !onlySaved;
      document.getElementById('savedFilterBtn').classList.toggle('bg-amber-500/20', onlySaved);
      document.getElementById('savedFilterBtn').classList.toggle('text-amber-300', onlySaved);
      render();
    };

    // Filtros por Perspectiva
    document.querySelectorAll('.persp-pill').forEach(btn => {
      btn.onclick = () => {
        document.querySelectorAll('.persp-pill').forEach(b => {
          b.classList.remove('active', 'bg-sky-600/20', 'text-sky-300', 'border-sky-500/30');
          b.classList.add('bg-slate-900', 'text-slate-400', 'border-slate-800');
        });
        btn.classList.add('active', 'bg-sky-600/20', 'text-sky-300', 'border-sky-500/30');
        btn.classList.remove('bg-slate-900', 'text-slate-400', 'border-slate-800');
        currentPersp = btn.dataset.persp;
        render();
      };
    });

    // Filtros por Categoría
    document.querySelectorAll('.cat-pill').forEach(btn => {
      btn.onclick = () => {
        document.querySelectorAll('.cat-pill').forEach(b => {
          b.classList.remove('active', 'bg-slate-800', 'text-slate-200', 'border-slate-700');
          b.classList.add('bg-slate-900', 'text-slate-400', 'border-slate-800');
        });
        btn.classList.add('active', 'bg-slate-800', 'text-slate-200', 'border-slate-700');
        btn.classList.remove('bg-slate-900', 'text-slate-400', 'border-slate-800');
        currentCat = btn.dataset.cat;
        render();
      };
    });

    // Búsqueda en tiempo real
    document.getElementById('searchInput').addEventListener('input', (e) => {
      searchQuery = e.target.value;
      render();
    });

    // Cierre modal con click en backdrop
    document.getElementById('modal').addEventListener('click', (e) => {
      if (e.target.id === 'modal') e.target.close();
    });

    // Render inicial
    render();
  </script>
</body>
</html>
