_original": "Prices for Russia’s ESPO blend of crude oil bound for China surged past $120 per barrel this week, Reuters reported Friday, citing trading sources and market data.\n\nChinese state-owned refiners rushed to lock in November and December ESPO cargoes early, although they typically purchase the grade one or two months in advance due to the short shipping distance.\n\nThe buying spree pushed the ESPO grade’s price premium over benchmark ICE Brent to record levels of $20 to $30 per barrel.\n\nESPO is a low-sulfur, light Siberian crude exported primarily via the Kozmino port in Russia's Far East. China primarily imports the unique blend, as well as Arctic and Sakhalin grades.\n\nThe surge in premium costs comes as Iran and its proxies continue to retaliate against U.S. strikes and economic warfare. Saudi Arabia shut down a critical oil pipeline last week after it said militants in Iraq launched drones at the facility, which was being used as an export route to bypass the effective closure of the Strait of Hormuz.\n\nThe rising cost of ESPO mirrors a similar surge seen with Russia’s flagship Urals blend in March and April 2026 after the United States and Israel first launched attacks against Iran.", "link": "https://www.themoscowtimes.com/2026/09/18/russian-far-east-crude-tops-120-per-barrel-as-middle-east-supply-shocks-drive-chinese-demand-a93748", "source_id": "the_moscow_times", "source_name": "The Moscow Times", "perspective": "russia_independent", "language": "en", "bias_note": "Diario independiente ruso en el exilio crítico con Putin y con cobertura de ataques en territorio ruso.", "published": "2026-09-18T14:57:46+00:00", "category": "frente", "relevance_score": 23, "date_added": "2026-09-18", "title_es": "El crudo ruso del Lejano Oriente supera los 120 dólares por barril mientras los shocks de oferta en Medio Oriente impulsan la demanda china", "text_es": "Los precios de la mezcla rusa ESPO de petróleo crudo con destino a China superaron los 120 dólares por barril esta semana, informó Reuters el viernes, citando fuentes comerciales y datos del mercado.\n\nLas refinerías estatales chinas se apresuraron a asegurar con antelación los cargamentos ESPO de noviembre y diciembre, aunque normalmente compran la calidad con uno o dos meses de antelación debido a la corta distancia de envío.\n\nLa ola de compras impulsó la prima de precio del grado ESPO sobre el índice de referencia ICE Brent a niveles récord de 20 a 30 dólares por barril.\n\nESPO es un crudo siberiano ligero y bajo en azufre que se exporta principalmente a través del puerto de Kozmino en el Lejano Oriente de Rusia. China importa principalmente la mezcla única, así como las calidades Arctic y Sakhalin.\n\nEl aumento en los costos de las primas se produce mientras Irán y sus representantes continúan tomando represalias contra los ataques y la guerra económica de Estados Unidos. Arabia Saudita cerró un oleoducto crítico la semana pasada después de decir que militantes en Irak lanzaron drones contra la instalación, que estaba siendo utilizada como ruta de exportación para evitar el cierre efectivo del Estrecho de Ormuz.\n\nEl aumento del costo de ESPO refleja un aumento similar observado con la mezcla insignia de Rusia en los Urales en marzo y abril de 2026, después de que Estados Unidos e Israel lanzaran por primera vez ataques contra Irán."}, {"id": "0020d5a5958b", "title_original": "Ukrainian, Romanian presidents discuss SAFE, drone co-production, Black Sea security", "text_original": "During the Carpathian Eight Summit, Ukrainian President Volodymyr Zelenskyy discussed with Romanian President Nicușor Dan cooperation within the SAFE framework, joint drone production, infrastructure and humanitarian projects, as well as security in the Black Sea region.\n\n\"I am grateful for the active dialogue and substantive cooperation between us. Today we are expanding it to include another dimension – the regional one – with a focus on our shared Carpathian Mountains. This holds significant potential not only for the economy but also for security and deeper ties between our peoples,\" Zelenskyy said on Facebook on Friday.\n\nAccording to him, during the meeting, the parties discussed which projects could accelerate cooperation and provide mutual assistance.\n\n\"These include, in particular, SAFE and the joint production of drones, infrastructure and humanitarian issues, and, of course, security in the Black Sea region,\" the head of state said.", "link": "https://en.interfax.com.ua/news/general/1206666.html", "source_id": "interfax_ukraine", "source_name": "Interfax-Ucrania", "perspective": "ukraine", "language": "en", "bias_note": "Agencia de noticias ucraniana de referencia para despachos militares y declaraciones gubernamentales.", "published": "2026-09-18T14:43:30+00:00", "category": "drones", "relevance_score": 31, "date_added": "2026-09-18", "title_es": "Los presidentes de Ucrania y Rumania debaten SAFE, la coproducción de drones y la seguridad del Mar Negro", "text_es": "Durante la Octava Cumbre de los Cárpatos, el presidente ucraniano Volodymyr Zelenskyy discutió con el presidente rumano Nicușor Dan la cooperación en el marco SAFE, la producción conjunta de drones, proyectos de infraestructura y humanitarios, así como la seguridad en la región del Mar Negro.\n\n\"Estoy agradecido por el diálogo activo y la cooperación sustantiva entre nosotros. Hoy lo estamos ampliando para incluir otra dimensión -la regional- con un enfoque en nuestros Cárpatos compartidos. Esto tiene un potencial significativo no sólo para la economía sino también para la seguridad y lazos más profundos entre nuestros pueblos\", dijo Zelenskyy en Facebook el viernes.\n\nSegún sus palabras, durante la reunión las partes discutieron qué proyectos podrían acelerar la cooperación y brindar asistencia mutua.\n\n\"Estos incluyen, en particular, SAFE y la producción conjunta de drones, infraestructura y cuestiones humanitarias y, por supuesto, la seguridad en la región del Mar Negro\", dijo el Jefe de Estado."}, {"id": "10a3b40f5466", "title_original": "Председатель гражданской коллегии Верховного суда Юрий Глазов уходит в отставку", "text_original": "Высшая квалификационная коллегия судей (ВККС) на заседании 21 сентября рассмотрит заявление об отставке зампредседателя Верховного суда (ВС) — председателя судебной коллегии по гражданским делам 64-летнего Юрия Глазова. Шестилетний срок его полномочий истекает 23 сентября, претендовать на переназначение судья не пытался.\n\nКонкурс на эту должность был объявлен еще в апреле. Рекомендацию к назначению получил судья ВС Олег Нефедов, в марте назначенный на должность председателя дисциплинарной коллегии ВС (известен тем, что рассматривал дела о признании экстремистскими и запрете движений ЛГБТ и сатанистов). Судья Нефедов оказался единственным кандидатом на эту вакансию.\n\nСвою карьеру Юрий Глазов начал в 1990 году в суде Ленинского района Курска, в январе 2007 года был назначен первым зампредом Арбитражного суда Белгородской области, а потом его возглавил. С 2013 года до назначения в ВС он возглавлял Арбитражный суд Поволжского округа.", "link": "https://www.kommersant.ru/doc/8969959", "source_id": "kommersant", "source_name": "Kommersant (Коммерсантъ)", "perspective": "russia_official", "language": "ru", "bias_note": "Diario de referencia ruso sobre política exterior, sanciones, industria militar y economía de guerra.", "published": "2026-09-18T14:25:11+00:00", "category": "frente", "relevance_score": 17, "date_added": "2026-09-18", "title_es": "Dimite el presidente del Colegio Civil del Tribunal Supremo, Yuri Glazov", "text_es": "En una reunión que se celebrará el 21 de septiembre, la Junta Superior de Jueces (CJQJ) considerará la dimisión del vicepresidente del Tribunal Supremo (CS), presidente de la sala judicial para casos civiles, Yuri Glazov, de 64 años. Su mandato de seis años expira el 23 de septiembre y el juez no solicitó una reelección.\n\nEl concurso para este puesto se anunció en abril. La recomendación para el nombramiento fue recibida por el juez del Tribunal Supremo Oleg Nefedov, quien en marzo fue designado para el cargo de presidente del consejo disciplinario del Tribunal Supremo (conocido por considerar casos sobre el reconocimiento de movimientos LGBT y satanistas como extremistas y su prohibición). El juez Nefedov era el único candidato para esta vacante.\n\nYuri Glazov comenzó su carrera en 1990 en el Tribunal de Distrito Leninsky de Kursk, en enero de 2007 fue nombrado primer vicepresidente del Tribunal de Arbitraje de la Región de Belgorod y luego lo dirigió. Desde 2013 hasta su nombramiento como miembro del Tribunal Supremo, dirigió el Tribunal de Arbitraje del Distrito del Volga."}, {"id": "f3d5f9962f37", "title_original": "Russian drone drops explosives on hospital grounds in Kherson – photos", "text_original": "Russian forces dropped explosives from a drone onto the grounds of a hospital in Kherson on 18 September, damaging service vehicles.\n\nSource: Yaroslav Shanko, Head of Kherson City Military Administration\n\nDetails: Shanko said Russian forces attacked the hospital grounds in the city's Korabelnyi district with a drone shortly after 14:00.\n\nQuote: \"Several service vehicles have been damaged in the attack. No injuries have been reported.\"\n\nBackground: On 16 September, one person was killed and another injured in Russian drone attacks on Kherson.\n\nSupport Ukrainska Pravda on  Patreon to help us keep reporting!", "link": "https://www.pravda.com.ua/eng/news/2026/09/18/8054113/", "source_id": "ukrainska_pravda_en", "source_name": "Ukrainska Pravda (EN)", "perspective": "ukraine", "language": "en", "bias_note": "Uno de los periódicos más leídos e históricos de Ucrania (versión internacional en inglés).", "published": "2026-09-18T14:02:00+00:00", "category": "drones", "relevance_score": 25, "date_added": "2026-09-18", "title_es": "Un dron ruso lanza explosivos en un hospital de Jersón – fotos", "text_es": "Las fuerzas rusas arrojaron explosivos desde un dron en los terrenos de un hospital en Kherson el 18 de septiembre, dañando vehículos de servicio.\n\nFuente: Yaroslav Shanko, jefe de la administración militar de la ciudad de Kherson\n\nDetalles: Shanko dijo que las fuerzas rusas atacaron los terrenos del hospital en el distrito Korabelnyi de la ciudad con un dron poco después de las 14:00.\n\nCita: \"En el ataque resultaron dañados varios vehículos de servicio. No se han registrado heridos\".\n\nAntecedentes: El 16 de septiembre, una persona murió y otra resultó herida en ataques con drones rusos contra Kherson.\n\n¡Apoye a Ukrainska Pravda en Patreon para ayudarnos a seguir informando!"}, {"id": "524167b0865b", "title_original": "Russian drone strikes office building in Odesa", "text_original": "A Russian drone has struck an office building in Odesa.\n\nSource: Serhii Lysak, Head of Odesa City Military Administration; Suspilne, Ukraine's national public broadcaster\n\nQuote from Lysak: \"The enemy has attacked the city. It struck a busy area in central Odesa. An office building has been damaged. We are establishing all the details.\"\n\nDetails: Suspilne posted a photo of the damaged building.\n\nYour support on  Patreon helps us keep the news free and accessible.", "link": "https://www.pravda.com.ua/eng/news/2026/09/18/8054100/", "source_id": "ukrainska_pravda_en", "source_name": "Ukrainska Pravda (EN)", "perspective": "ukraine", "language": "en", "bias_note": "Uno de los periódicos más leídos e históricos de Ucrania (versión internacional en inglés).", "published": "2026-09-18T13:34:00+00:00", "category": "drones", "relevance_score": 25, "date_added": "2026-09-18", "title_es": "Un dron ruso ataca un edificio de oficinas en Odesa", "text_es": "Un dron ruso ha impactado un edificio de oficinas en Odesa.\n\nFuente: Serhii Lysak, Jefe de la Administración Militar de la ciudad de Odesa; Suspilne, la emisora ​​pública nacional de Ucrania\n\nCita de Lysak: \"El enemigo atacó la ciudad. Golpeó una zona muy transitada en el centro de Odesa. Un edificio de oficinas resultó dañado. Estamos afinando todos los detalles\".\n\nDetalles: Suspilne publicó una foto del edificio dañado.\n\nTu apoyo en Patreon nos ayuda a mantener las noticias gratuitas y accesibles."}, {"id": "1dffc970228c", "title_original": "Операция «Вивальди» — это и правда большой успех ВСУ? Пала ли Малая Токмачка? И как две армии готовятся к новым битвам за Донбасс? Карта боев на 18 сентября", "text_original": "Командующий 3-м армейским корпусом ВСУ Андрей Билецкий на этой неделе сообщил, что его части успешно проводят операцию «Вивальди». Первая фаза (из четырех), по его словам, близка к завершению: подразделения ВС РФ в районе города Лимана, пытавшиеся прорваться к реке Северский Донец напротив Славянска, оттеснены за реку Черный Жеребец (приток Северского Донца). Судя по опубликованным видео, положение российской группировки действительно ухудшилось в результате продолжительного (в несколько месяцев) наступления ВСУ. Однако подтверждений тому, что ВСУ вытеснили противника за Черный Жеребец, пока нет. «Медуза» ведет хронику большой войны с февраля 2022-го. За это время мы изучили тысячи документальных свидетельств конфликта, нарисовали сотни карт фронта, написали десятки сводок о ходе боевых действий (архив можно изучить здесь; предыдущее обновление — здесь). Это кропотливая работа, которая отнимает много времени и ресурсов. Чтобы мы могли продолжать рассказывать о войне в том же масштабе, пожалуйста, поддержите «Медузу»! Лиман\n\nРоссийские войска (20-я армия) в начале 2025 года форсировали Черный Жеребец в районе Макеевки, а летом (25-я армия) — южнее в районе Торского. С тех пор эти две группировки пытались пробиться к Лиману с севера и востока. В начале лета 2026-го они организовали штурм города, но потерпели неудачу. В этот момент российское наступление достигло наибольших успехов. Штурмовики 20-й армии были замечены на окраинах Святогорска, просочились в тыл ВСУ на 10–12 километров до реки Оскол и даже форсировали малыми силами Северский Донец около Пришиба к востоку от Святогорска; а 25-я армия зашла в Лиман и пыталась пробиться к переправам южнее города.Однако в этот же момент началось контрнаступление 3-го корпуса ВСУ. Уже в июле российские войска были выбиты из Лимана (кроме юго-восточной окраины). Позже украинские силы перешли в наступление на других участках: против северного фланга 20-й армии у Карповки и Редкодуба, против ее южного фланга у Яровой и на стыке с 25-й армией из «кармана» в районе села Ставки.В начале сентября Владимир Путин неожиданно сообщил, что ВС РФ захватили Святогорск. Хуже момента для такого заявления придумать было нельзя: именно тогда войска 20-й армии откатывались из лесов к востоку от Святогорска и на других участках фронта. Читайте на Медузе\nК моменту заявления Билецкого опубликованными видео были подтверждены продвижения ВСУ в районе Яровой и Новоселовки; из района Редкодуба и Краповки до села Среднее; из «кармана» в Ставках и от Лимана — в тыл 20-й армии в Колодезях и до окраин Заречного на реке Черный Жеребец.При этом 25-я армия ВС РФ продолжает удерживать позиции в районе Лимана. Пока не ясно, остаются ли ее позиции в Зеленой Долине и Шандриголово. Никаких визуальных подтверждений выхода ВСУ к Черному Жеребцу или форсирования реки (как это утверждают некоторые неофициальные украинские источники) пока не появилось.Планы следующих фаз наступления Билецкий не назвал. Стоит отметить, что несколько недель назад он получил новое назначение — и теперь командует не только корпусом, но и вновь созданной оперативно-тактической группировкой «Центр», призванной защитить Славянск и соседний Краматорск от наступления ВС РФ с севера и с востока.Вполне возможно, что ВСУ попробуют контратаками остановить намного более опасное с оперативной точки зрения наступление ВС РФ вдоль южного берега Северского Донца на город Николаевку и в районе канала Северский Донец — Донбасс к восточным окраинам Дружковки и южным окраинам Краматорска.\n\nВ последние дни подразделения ВСУ, к которым перебросили подкрепления (46-я аэромобильная бригада, ранее воевавшая на стыке Днепропетровской, Запорожской и Донецкой областей, а также как минимум один штурмовой полк), пытаются контратаковать в районе Рай-Александровки к юго-востоку от Николаевки. Российское наступление на Дружковку и Доброполье\nЧитайте на Медузе\nПохоже, российское командование осознало, что войска, наступающие на агломерацию Славянска и Краматорска, имеющимися силами добиться успеха не смогут. Группировка, которая пытается пробиться к Дружковке с запада вдоль русла реки Казенный Торец, была усилена частями 90-й танковой дивизии и 41-й общевойсковой армии, ранее более года воевавших на стыке Днепропетровской, Запорожской и Донецкой областей (в том числе против 46-й бригады ВСУ, тоже переброшенной в центр Донбасса).Пополненная группировка ВС РФ смогла пробиться на несколько километров к дороге Доброполье — Краматорск, а также подойти почти к окраинам Дружковки. Читайте на Медузе\nОдновременно часть войск, ранее наступавших на участке между Добропольем и Дружковкой, получила новую задачу: усилить давление на Доброполье с востока. Другая группировка ВС РФ начала наступление с целью обойти Доброполье с юго-запада. Однако пока эти российские удары не привели к решительному успеху.Обе армии, очевидно, готовятся к осенне-зимней кампании и тяжелым боям к юго-западу и юго-востоку от Краматорска, для чего стягивают силы в центральную часть Донбасса. Орехов и Малая Токмачка\n\nВС РФ захватили Малую Токмачку — село, ставшее мемом скорее благодаря своему названию, нежели оперативной значимости. Для подтверждения российское командование организовало большую видеосъемку с воздуха: на ней военнослужащие водрузили флаги РФ по всему селу. При этом, судя по записям, опубликованным ВСУ, фронт уже ушел на несколько километров на северо-запад от Малой Токмачки. Как Малая Токмачка превратилась в символ сопротивления ВСУШтурм Малой Токмачки стал главным военным мемом года (хотя ничего смешного в бесконечной кровавой мясорубке, конечно, нет) Но если серьезно, почему у российской армии никак не получается захватить это село? Читайте на Медузе\nЗахват Малой Токмачки стал возможен не вследствие усилий воевавшего за нее годами 70-го мотострелкового полка ВС РФ, а из-за быстрого продвижения соседей. Российские войска группировки «Днепр» через Новоданиловку вышли на окраину города Орехова (это местная «крепость» ВСУ, на которой основана вся украинская оборона в центральной части Запорожской области). В то же время другая крупная группировка ВС РФ («Восток»), наступающая со стороны Гуляйполя, несмотря на месяцы контратак ВСУ, достигла дороги Орехов — Новониколаевка, выйдя в тыл 118-й механизированной бригаде ВСУ, защищавшей Малую Токмачку. После этого оборона села стала невозможна.Положение ВСУ под Ореховом продолжает ухудшаться. Российское командование задействовало к юго-западу от города силы одной из десантно-штурмовых дивизий с явным намерением охватить город еще и с запада. Ранее эта дивизия была задействована на берегу Днепра к югу от Запорожья — в районе поселка Степногорск. Летом ВСУ контратаковали в Степногорске и окрестностях. Уже тогда высказывались предположения, что это стало возможным из-за ухода из района российских десантников — на некий неизвестный участок фронта. Теперь они «всплыли» под Ореховом в момент решительного наступления ВС РФ на город. Как меняется контроль двух армий над территориями\n \n \nИнтерактивная карта боевых действий\nОтдел «Разбор»", "link": "https://meduza.io/feature/2026/09/18/operatsiya-vivaldi-eto-i-pravda-bolshoy-uspeh-vsu-pala-li-malaya-tokmachka-i-kak-dve-armii-gotovyatsya-k-novym-bitvam-za-donbass", "source_id": "meduza_ru", "source_name": "Meduza (RU)", "perspective": "russia_independent", "language": "ru", "bias_note": "Principal medio ruso de investigación independiente prohibido por el Kremlin (sede en Letonia).", "published": "2026-09-18T13:33:38+00:00", "category": "frente", "relevance_score": 33, "date_added": "2026-09-18", "title_es": "¿Es realmente la Operación Vivaldi un gran éxito para las Fuerzas Armadas de Ucrania? ¿Cayó Malaya Tokmachka? ¿Y cómo se preparan los dos ejércitos para nuevas batallas por Donbass? Cartelera de pelea para el 18 de septiembre", "text_es": "El comandante del 3.er Cuerpo de Ejército de las Fuerzas Armadas de Ucrania, Andrei Biletsky, anunció esta semana que sus unidades están llevando a cabo con éxito la Operación Vivaldi. La primera fase (de cuatro), según él, está a punto de completarse: unidades de las Fuerzas Armadas rusas en el área de la ciudad de Liman, que intentaron abrirse paso hacia el río Seversky Donets frente a Slavyansk, fueron empujadas hacia atrás más allá del río Black Stallion (un afluente del Seversky Donets). A juzgar por los vídeos publicados, la posición del grupo ruso realmente empeoró como resultado de la ofensiva de larga duración (varios meses) de las Fuerzas Armadas de Ucrania. Sin embargo, aún no hay confirmación de que las Fuerzas Armadas de Ucrania hayan obligado al enemigo a detrás del Semental Negro. Meduza narra la gran guerra desde febrero\n\nLas tropas rusas (20.º ejército) cruzaron el Semental Negro en el área de Makeevka a principios de 2025, y en el verano (25.º ejército) más al sur en el área de Torskoye. Desde entonces, estos dos grupos han estado tratando de abrirse paso hacia el Limán desde el norte y el este. A principios del verano de 2026, organizaron un asalto a la ciudad, pero fracasaron. En este punto, la ofensiva rusa logró su mayor éxito. Se avistaron tropas de asalto del 20.º ejército en las afueras de Svyatogorsk, se infiltraron en la retaguardia de las Fuerzas Armadas de Ucrania a 10 o 12 kilómetros del río Oskol e incluso cruzaron el Seversky Donets con pequeñas fuerzas cerca de Prishib al este de Svyatogorsk; y el 25.º Ejército entró en Limán e intentó abrirse camino hacia los cruces al sur de la ciudad. Sin embargo\n\nEn los últimos días, unidades de las Fuerzas Armadas de Ucrania, a las que se han transferido refuerzos (la 46.ª brigada aeromóvil, que anteriormente luchó en el cruce de las regiones de Dnepropetrovsk, Zaporozhye y Donetsk, así como al menos un regimiento de asalto), están intentando contraatacar en la zona de Rai-Alexandrovka al sureste de Nikolaevka. Ofensiva rusa sobre Druzhkovka y Dobropolye\nSigue leyendoMedusa\nParece que el mando ruso se dio cuenta de que las tropas que avanzaban hacia la aglomeración de Slavyansk y Kramatorsk no podrían lograr el éxito con las fuerzas disponibles. El grupo, que intenta avanzar hacia Druzhkovka desde el oeste a lo largo del río Kazenny Torets, fue reforzado por unidades de la 90.ª División Panzer\n\nLas Fuerzas Armadas rusas capturaron Malaya Tokmachka, una aldea que se convirtió en un meme más por su nombre que por su importancia operativa. Para confirmarlo, el mando ruso organizó una gran filmación de vídeo desde el aire: en él, militares izaron banderas rusas por todo el pueblo. Al mismo tiempo, a juzgar por los registros publicados por las Fuerzas Armadas de Ucrania, el frente ya se ha desplazado varios kilómetros al noroeste de Malaya Tokmachka. Cómo Malaya Tokmachka se convirtió en un símbolo de resistencia a las Fuerzas Armadas de Ucrania El asalto a Malaya Tokmachka se convirtió en el principal meme militar del año (aunque, por supuesto, no hay nada divertido en la interminable y sangrienta picadora de carne) Pero, en serio, ¿por qué el ejército ruso no puede capturar esta aldea? chitá"}, {"id": "ef533cfe919d", "title_original": "Man injured in Russian FPV drone strike on civilian car in Kharkiv Oblast", "text_original": "A 67-year-old man has been injured in a Russian FPV drone strike on a civilian car in Kharkiv Oblast.\n\nSource: Kharkiv Oblast Prosecutor's Office\n\nQuote: \"At around 13:00 on 18 September, Russian forces used an FPV drone to attack a car travelling near the village of Slatyne towards Derhachi.\n\nThe strike injured a 67-year-old man.\"\n\nDetails: The man was taken to hospital with multiple shrapnel wounds to his head and torso.\n\nHe is currently in a moderate condition.", "link": "https://www.pravda.com.ua/eng/news/2026/09/18/8054093/", "source_id": "ukrainska_pravda_en", "source_name": "Ukrainska Pravda (EN)", "perspective": "ukraine", "language": "en", "bias_note": "Uno de los periódicos más leídos e históricos de Ucrania (versión internacional en inglés).", "published": "2026-09-18T13:01:00+00:00", "category": "frente", "relevance_score": 25, "date_added": "2026-09-18", "title_es": "Un hombre herido en un ataque con un dron ruso FPV contra un vehículo civil en la provincia de Járkov", "text_es": "Un hombre de 67 años resultó herido en un ataque con un dron ruso FPV contra un automóvil civil en el Óblast de Járkov.\n\nFuente: Fiscalía de la provincia de Járkov\n\nCita: \"Alrededor de las 13:00 horas del 18 de septiembre, las fuerzas rusas utilizaron un dron FPV para atacar un automóvil que viajaba cerca del pueblo de Slatyne hacia Derhachi.\n\nEl golpe hirió a un hombre de 67 años.\"\n\nDetalles: El hombre fue trasladado al hospital con múltiples heridas de metralla en la cabeza y el torso.\n\nActualmente se encuentra en estado moderado."}, {"id": "5d58d10ba277", "title_original": "Russian weekly losses top 10,000 troops killed and wounded for third week running – Estonian intelligence chief", "text_original": "Estonian intelligence has noted that Russian losses in the war against Ukraine have remained above 10,000 troops killed and wounded for a third consecutive week, exceeding the number Russia can recruit.\n\nSource: Estonian public broadcasting network ERR, citing Colonel Ants Kiviselg, Head of the Intelligence Centre of the Estonian Defence Forces, as reported by European Pravda\n\nDetails: Kiviselg said Russia's average losses this week are around 1,600 personnel per day, meaning total losses for the week amount to just over 11,000 troops killed and wounded.\n\nQuote: \"The trend therefore continues, with Russia losing more troops on the battlefield than it is able to recruit.\"\n\nMore details: Kiviselg also said that Ukraine has for the first time released data on its counteroffensive towards Lyman in Donetsk Oblast, where around 85 sq km of territory has been liberated and mopped up in the course of the operation.\n\nQuote: \"Ukrainian operations in Donetsk Oblast are currently continuing.\"", "link": "https://www.pravda.com.ua/eng/news/2026/09/18/8054087/", "source_id": "ukrainska_pravda_en", "source_name": "Ukrainska Pravda (EN)", "perspective": "ukraine", "language": "en", "bias_note": "Uno de los periódicos más leídos e históricos de Ucrania (versión internacional en inglés).", "published": "2026-09-18T12:17:00+00:00", "category": "frente", "relevance_score": 27, "date_added": "2026-09-18", "title_es": "Las pérdidas semanales rusas superan los 10.000 soldados muertos y heridos por tercera semana consecutiva: jefe de inteligencia de Estonia", "text_es": "La inteligencia estonia ha observado que las pérdidas rusas en la guerra contra Ucrania se mantienen por encima de los 10.000 soldados muertos y heridos por tercera semana consecutiva, superando el número que Rusia puede reclutar.\n\nFuente: Red de radiodifusión pública de Estonia ERR, citando al coronel Ants Kiviselg, jefe del Centro de Inteligencia de las Fuerzas de Defensa de Estonia, según informó European Pravda.\n\nDetalles: Kiviselg dijo que las pérdidas promedio de Rusia esta semana son de alrededor de 1.600 efectivos por día, lo que significa que las pérdidas totales de la semana ascienden a poco más de 11.000 soldados muertos y heridos.\n\nCita: \"Por lo tanto, la tendencia continúa: Rusia pierde más tropas en el campo de batalla de las que puede reclutar\".\n\nMás detalles: Kiviselg también dijo que Ucrania ha publicado por primera vez datos sobre su contraofensiva contra Lyman en la provincia de Donetsk, donde durante la operación se han liberado y limpiado alrededor de 85 kilómetros cuadrados de territorio.\n\nCita: \"Actualmente continúan las operaciones ucranianas en la provincia de Donetsk\"."}, {"id": "c0c8ae696f12", "title_original": "Ukraine's 3rd Army Corps says it has crippled Russia's elite Rubicon drone unit", "text_original": "Ukraine's 3rd Army Corps has said that in the course of the Operation Vivaldi offensive in northern Donetsk Oblast, it has inflicted losses on Russia's elite Rubicon drone unit that have forced the Russian command to withdraw it from the Lyman-Borova front.\n\nSource: 3rd Army Corps in a comment to Ukrainska Pravda\n\nQuote: \"Fighters from the 3rd Army Corps have inflicted losses on the elite Russian drone unit in the course of the Operation Vivaldi offensive. The enemy command has been forced to withdraw Rubicon from the Lyman-Borova front.\n\nSoldiers from the 3rd Army Corps have disabled Rubicon's command-and-control system, destroying its logistics, ammunition depots, drone launch sites and newly formed units and killing their experienced drone operators. The Russians are now no longer able to quickly replenish the unit with equipment and trained personnel.\n\nLosing personnel and equipment and being unable to deploy because of Ukrainian electronic warfare and air defence systems, the enemy began to abandon its positions, leaving equipment behind. To preserve what remained of the unit, the Russian command has decided to redeploy Rubicon to another sector.\"\n\nDetails: The 3rd Army Corps said the Russians had initially deployed Rubicon to the Lyman-Borova front as a priority area.", "link": "https://www.pravda.com.ua/eng/news/2026/09/18/8054081/", "source_id": "ukrainska_pravda_en", "source_name": "Ukrainska Pravda (EN)", "perspective": "ukraine", "language": "en", "bias_note": "Uno de los periódicos más leídos e históricos de Ucrania (versión internacional en inglés).", "published": "2026-09-18T11:57:00+00:00", "category": "frente", "relevance_score": 35, "date_added": "2026-09-18", "title_es": "El 3.er Cuerpo de Ejército de Ucrania dice que ha paralizado la unidad de élite de drones Rubicón de Rusia", "text_es": "El 3.er Cuerpo de Ejército de Ucrania ha dicho que en el curso de la ofensiva de la Operación Vivaldi en el norte del Óblast de Donetsk, ha infligido pérdidas a la unidad de élite rusa de drones Rubicón que han obligado al comando ruso a retirarla del frente Lyman-Borova.\n\nFuente: 3.er Cuerpo de Ejército en un comentario a Ukrainska Pravda\n\nCita: \"Los combatientes del 3.er Cuerpo de Ejército infligieron pérdidas a la unidad de élite rusa de drones durante la ofensiva de la Operación Vivaldi. El mando enemigo se vio obligado a retirar Rubicon del frente Lyman-Borova.\n\nLos soldados del 3er Cuerpo de Ejército han desactivado el sistema de comando y control de Rubicon, destruyendo su logística, depósitos de municiones, sitios de lanzamiento de drones y unidades recién formadas y matando a sus experimentados operadores de drones. Los rusos ya no pueden reponer rápidamente la unidad con equipos y personal capacitado.\n\nAl perder personal y equipos y al no poder desplegarse debido a los sistemas de guerra electrónica y defensa aérea ucranianos, el enemigo comenzó a abandonar sus posiciones, dejando atrás equipos. Para preservar lo que queda de la unidad, el mando ruso ha decidido redesplegar Rubicón a otro sector.\"\n\nDetalles: El 3.er Cuerpo de Ejército dijo que los rusos habían desplegado inicialmente Rubicón en el frente Lyman-Borova como área prioritaria."}, {"id": "f1a7e2852d10", "title_original": "С войны - в Госдуму: кто пополняет путинскую \"новую элиту\"", "text_original": "В России с 18 по 20 сентября проходят выборы в Госдуму IX созыва. Всего будут избраны 450 членов нижней палаты парламента: 225 по партийным спискам и 225 по одномандатным округам. На выборы в Госдуму зарегистрирован 4361 кандидат: 2774 человека баллотируются по федеральным партийным спискам, еще 1587 - по одномандатным округам. Кресла депутатов могут занять участники войны против Украины - Центральная избирательная комиссия РФ насчитала 186 таких человек: 76 баллотируются по одномандатным округам, еще 110 включены в федеральные списки пяти парламентских партий: 52 - от \"Единой России\", по 11 - от ЛДПР и \"Справедливой России\", девять - от КПРФ, двое - от \"Новых людей\".\n\nЭто - кадровые военные, бывшие гражданские и политики, получившие военный статус \"участника \"СВО\". В 2024 году президент РФ Владимир Путин назвал российских участников войны в Украине \"подлинной элитой\" России и пообещал посты в государственных структурах и региональных органах власти. Незадолго до выборов он публично выступил с призывом поддержать \"настоящих патриотов\" - то есть проголосовать за \"Единую Россию\". Впрочем, до этапа выборов добрались немногие участники войны - около 630 из них выставляли свою кандидатуру на праймериз.\n\nПомощь вернувшимся с войны - одна из главных тем в интервью кандидатов с военным прошлым. Александр Зицер из \"Новых людей\" предлагает готовить консультантов из их числа. \"Очень сложно найти общий язык с психологом, который не военный\", - объяснял он \"Коммерсанту\". Константин Рыжак из \"Справедливой России\" критикует действия Центробанка и систему ЕГЭ, выступая за сокращение социального неравенства. Командир бригады имени Александра Невского Алексей Верещагин из ЛДПР называет себя \"адептом империи\" и обещает добиваться лучшего снабжения военных, включая свое подразделение. А кандидат КПРФ Антон Шилов возмущается обогащением на войне: \"Кому - война, а кому - бизнес\". При этом участник наступления на Гостомель называет ошибкой вывод российских войск из-под Киева.\n\nНо насколько они будут обладать реальной властью, получив мандат депутата? Политический обозреватель онлайн-издания \"Медуза\" Андрей Перцев в интервью DW выразил сомнение в том, что вернувшиеся с фронта получат субъектность. Ключевые посты, по его оценке, останутся за проверенными представителями системы, которая не позволит развернуться бывшим военным.\n\nПолитолог Михаил Комин в исследовании для Европейского совета по международным отношениям оценивает продвижение участников войны как способ укрепить милитаристский курс страны. Насколько влиятельными они станут в Госдуме, покажут полученные мандаты, должности в комитетах и предложенные законы.\n\nОтметка \"участник \"СВО\" в биографии кандидата не обязательно означает опыт боевых действий, отмечает журналист \"Важных историй\" Никита Кондратьев. По его словам, на практике к этой категории могут относить и тех, кто работал в органах власти на оккупированных территориях Украины или помогал российской армии. Кондратьев приводит пример медали Минобороны \"Участнику \"СВО\": ее могут вручать за выполнение трудовых обязанностей, связанных с войной. Поэтому сама награда или отметка в биографии еще не подтверждает участия в боях.", "link": "https://www.dw.com/ru/с-войны-в-госдуму-кто-пополняет-путинскую-новую-элиту/a-79325502?maca=rus-rss-ru-all-1126-xml-mrss", "source_id": "dw_russian", "source_name": "Deutsche Welle (DW Ruso)", "perspective": "international", "language": "ru", "bias_note": "Radiodifusora pública internacional de Alemania con análisis exhaustivo del conflicto para la audiencia rusoparlante.", "published": "2026-09-18T11:45:00+00:00", "category": "frente", "relevance_score": 21, "date_added": "2026-09-18", "title_es": "De la guerra a la Duma Estatal: quién se suma a la “nueva élite” de Putin", "text_es": "En Rusia, del 18 al 20 de septiembre se celebran las elecciones a la Duma Estatal de la novena convocatoria. Se elegirán en total 450 miembros de la cámara baja del parlamento: 225 de listas partidistas y 225 de circunscripciones de mandato único. Para las elecciones a la Duma estatal están inscritos 4.361 candidatos: 2.774 personas se presentan en listas de partidos federales, otros 1.587 se presentan en circunscripciones de mandato único. Los escaños de diputados pueden ser ocupados por los participantes en la guerra contra Ucrania: la Comisión Electoral Central de la Federación Rusa contó 186 de esas personas: 76 se postulan en distritos electorales de mandato único, otros 110 están incluidos en las listas federales de cinco partidos parlamentarios: 52 de Rusia Unida, 11 de LDPR y Rusia Justa, nueve del Partido Comunista de la Federación Rusa.\n\nSe trata de militares de carrera, ex civiles y políticos que recibieron el estatus militar de \"participantes del Distrito Militar Norte\". En 2024, el presidente ruso Vladimir Putin llamó a los participantes rusos en la guerra de Ucrania la “verdadera élite” de Rusia y prometió puestos en las estructuras estatales y las autoridades regionales. Poco antes de las elecciones, hizo un llamado público a apoyar a los \"verdaderos patriotas\", es decir, a votar por \"Rusia Unida\". Sin embargo, pocos participantes en la guerra llegaron a la etapa electoral. alrededor de 630 de ellos se presentaron como candidatos en las primarias.\n\nLa ayuda a quienes regresan de la guerra es uno de los temas principales en las entrevistas con candidatos con experiencia militar. Alexander Zitser de New People propone formar consultores entre ellos. \"Es muy difícil encontrar un lenguaje común con un psicólogo que no es militar\", explicó a Kommersant. Konstantin Ryzhak de Rusia Justa critica las acciones del Banco Central y del sistema del Examen Estatal Unificado y aboga por una reducción de la desigualdad social. El comandante de la brigada Alexander Nevsky, Alexey Vereshchagin del LDPR, se autodenomina “adepto del imperio” y promete lograr mejores suministros para los militares, incluida su unidad. Y el candidato del Partido Comunista de la Federación Rusa, Anton Shilov, está indignado por el enriquecimiento en la guerra: “¿A quién le importa?”\n\nPero ¿cuánto poder real tendrán una vez que reciban un mandato adjunto? El observador político de la publicación en línea Meduza Andrei Pertsev, en una entrevista con DW, expresó sus dudas de que quienes regresan del frente reciban subjetividad. Los puestos clave, en su opinión, permanecerán en manos de representantes probados del sistema, lo que no permitirá que los ex militares se den la vuelta.\n\nEl politólogo Mikhail Komin, en un estudio para el Consejo Europeo de Relaciones Exteriores, evalúa la promoción de los participantes en la guerra como una forma de fortalecer el rumbo militarista del país. La influencia que tendrán en la Duma estatal se verá en los mandatos recibidos, en los puestos en los comités y en las leyes propuestas.\n\nLa marca \"participante de SVO\" en la biografía de un candidato no significa necesariamente experiencia de combate, señala el periodista de \"Important Stories\", Nikita Kondratyev. Según él, en la práctica también pueden incluirse en esta categoría aquellos que trabajaron en organismos gubernamentales en los territorios ocupados de Ucrania o ayudaron al ejército ruso. Kondratyev da un ejemplo de medalla del Ministerio de Defensa para “participante de la SVO”: se puede otorgar por el desempeño de tareas laborales relacionadas con la guerra. Por lo tanto, el premio en sí o una marca en la biografía aún no confirma la participación en las batallas."}, {"id": "1c795ca4403d", "title_original": "Уоррен Баффетт ушел с поста председателя совета директоров Berkshire Hathaway", "text_original": "96-летний инвестор Уоррен Баффетт покинул пост председателя совета директоров компании Berkshire Hathaway, сообщает The New York Times.\n\nБаффетт стал почетным председателем компании и сохраняет за собой место в совете директоров. Новым председателем станет его сын Говард Баффетт.\n\n«Возможность быть председателем [совета директоров] стала для меня величайшей честью всей жизни, и я никогда не воспринимал ваше доверие как должное», — говорится в письме Баффетта акционерам. Он добавил, что «время берет свое».\n\nУоррен Баффетт купил Berkshire Hathaway в 1965 году — тогда это была небольшая текстильная мануфактура из Небраски, родного штата инвестора. На ее основе Баффетт построил огромный конгломерат, занимающийся инвестициями и страховым бизнесом. Forbes оценивает состояние Баффета в 144 миллиарда долларов. Он занимает 10-е место в рейтинге богатейших людей мира по версии журнала.\n\nВ мае 2025 года Баффетт покинул пост генерального директора компании. Его занял его давний заместитель Грег Абель.", "link": "https://meduza.io/news/2026/09/18/uorren-baffett-ushel-s-posta-predsedatelya-soveta-direktorov-berkshire-hathaway", "source_id": "meduza_ru", "source_name": "Meduza (RU)", "perspective": "russia_independent", "language": "ru", "bias_note": "Principal medio ruso de investigación independiente prohibido por el Kremlin (sede en Letonia).", "published": "2026-09-18T11:14:06+00:00", "category": "frente", "relevance_score": 15, "date_added": "2026-09-18", "title_es": "Warren Buffett deja el cargo de presidente del consejo de administración de Berkshire Hathaway", "text_es": "El inversor Warren Buffett, de 96 años, ha dejado su cargo de presidente del consejo de administración de Berkshire Hathaway, informa The New York Times.\n\nBuffett se convirtió en presidente emérito de la empresa y conserva su puesto en la junta directiva. Su hijo Howard Buffett será el nuevo presidente.\n\n\"La oportunidad de servir como presidente [de la junta] ha sido el mayor honor de mi vida, y nunca he dado por sentada su confianza\", dijo Buffett en su carta a los accionistas. Añadió que “el tiempo está pasando factura”.\n\nWarren Buffett compró Berkshire Hathaway en 1965, entonces un pequeño fabricante textil en Nebraska, el estado natal del inversor. Sobre esta base, Buffett construyó un enorme conglomerado dedicado a inversiones y negocios de seguros. Forbes estima la riqueza de Buffett en 144 mil millones de dólares. Ocupa el décimo lugar en el ranking de la revista de las personas más ricas del mundo.\n\nEn mayo de 2025, Buffett dejó el cargo de director ejecutivo de la empresa. Lo ocupó su antiguo adjunto, Greg Abel."}, {"id": "dde9870c2111", "title_original": "Defense forces strike Orion UAV ground control station in Crimea – AFU General Staff", "text_original": "Units of Ukraine's Defense Forces struck a number of key Russian targets on Thursday and overnight into Friday, including an Orion drone ground control station at the Saky airfield in Crimea, the press service of the General Staff of the Armed Forces of Ukraine reported.\n\n\"Specifically, an enemy Orion unmanned aerial vehicle ground control station was struck near the settlement of Novofedorivka at the Saky airfield in Crimea,\" the message posted on Telegram says.\n\nThe General Staff noted that the Orion (also known as Inokhodets) is a Russian MALE-class (Medium-Altitude Long-Endurance) reconnaissance and strike UAV system. It is capable of remaining airborne for up to 24 hours, conducting electro-optical reconnaissance and target designation at altitudes of up to 7.5 km, and carrying guided aerial munitions with a total weight of 200–250 kg.\n\nIn addition, a site used for the storage, preparation, and launch of strike UAVs was struck near Donetsk.\n\nIn Luhansk region, strikes were confirmed against an enemy ammunition depot near Dovzhansk and a logistics depot belonging to occupation forces near Kypuche.", "link": "https://en.interfax.com.ua/news/general/1206509.html", "source_id": "interfax_ukraine", "source_name": "Interfax-Ucrania", "perspective": "ukraine", "language": "en", "bias_note": "Agencia de noticias ucraniana de referencia para despachos militares y declaraciones gubernamentales.", "published": "2026-09-18T11:12:50+00:00", "category": "frente", "relevance_score": 35, "date_added": "2026-09-18", "title_es": "Las fuerzas de defensa atacan la estación de control terrestre de vehículos aéreos no tripulados Orion en Crimea – Estado Mayor de las Fuerzas Armadas de Ucrania", "text_es": "Unidades de las Fuerzas de Defensa de Ucrania atacaron varios objetivos rusos clave el jueves y durante la noche del viernes, incluida una estación de control terrestre de drones Orion en el aeródromo de Saky en Crimea, informó el servicio de prensa del Estado Mayor de las Fuerzas Armadas de Ucrania.\n\n\"Específicamente, una estación de control terrestre de vehículos aéreos no tripulados enemigos Orion fue atacada cerca del asentamiento de Novofedorivka en el aeródromo de Saky en Crimea\", dice el mensaje publicado en Telegram.\n\nEl Estado Mayor señaló que el Orion (también conocido como Inokhodets) es un sistema UAV ruso de reconocimiento y ataque de clase MALE (altitud media y larga resistencia). Es capaz de permanecer en el aire hasta 24 horas, realizar reconocimiento electroóptico y designación de objetivos a altitudes de hasta 7,5 km y transportar municiones aéreas guiadas con un peso total de 200 a 250 kg.\n\nAdemás, cerca de Donetsk fue atacado un lugar utilizado para el almacenamiento, preparación y lanzamiento de vehículos aéreos no tripulados de ataque.\n\nEn la región de Luhansk, se confirmaron ataques contra un depósito de municiones enemigo cerca de Dovzhansk y un depósito de logística perteneciente a las fuerzas de ocupación cerca de Kypuche."}, {"id": "678d987840c1", "title_original": "Украина получила от Евросоюза 3,3 млрд евро на ракеты и дроны", "text_original": "Киев получил от Европейского Союза очередной транш в 3,3 млрд евро в рамках программы Ukraine Support Loan. Об этом утром в пятницу, 18 сентября, сообщил в своем Telegram-канале премьер-министр Украины Сергей Корецкий.\n\n\"Средства направим на первоочередные оборонные нужды, в частности, закупку ракет и дронов\", - уточнил глава украинского правительства.\n\n11 сентября Еврокомиссия одобрила выделение Украине еще 6,1 млрд евро на закупку систем противовоздушной и противоракетной обороны - в частности, ракет-перехватчиков PAC-3 для зенитно-ракетных комплексов Patriot, - а также боеприпасов, дронов и средств радиоэлектронной борьбы. Средства будут выделены из кредита ЕС для поддержки Украины на 2026-2027 годы.\n\nПо словам еврокомиссара по обороне Андрюса Кубилюса, Украина рассчитывает получить как можно больше ракет-перехватчиков для комплексов Paptriot до наступления зимы. Рассматривается схема, при которой страны-партнеры передадут Киеву ракеты из своих запасов, а позже получат замену из будущих поставок.\n\nОбъем одобренной Евросоюзом оборонной помощи Украине в рамках программы Ukraine Support Loan на 2026 год достиг 28,3 млрд евро. Для этих средств уже определены основные закупки, поставщики и сроки поставок.\n\n5 августа в Киеве заявили, что ВСУ не удалось перехватить ни одной из 28 выпущенных Россией баллистических ракет из-за отсутствия необходимых средств ПВО. Издание Politico писало, что особенно остро ощущается дефицит ракет-перехватчиков PAC-3 и PAC-2. Трудности с поставками ракет для ЗРК Patriot начались в мире в марте и апреле на фоне активного использования их в войне США и Израиля против Ирана.", "link": "https://www.dw.com/ru/украина-получила-от-евросоюза-3-3-млрд-евро-на-ракеты-и-дроны/a-79322893?maca=rus-rss-ru-all-1126-xml-mrss", "source_id": "dw_russian", "source_name": "Deutsche Welle (DW Ruso)", "perspective": "international", "language": "ru", "bias_note": "Radiodifusora pública internacional de Alemania con análisis exhaustivo del conflicto para la audiencia rusoparlante.", "published": "2026-09-18T10:02:00+00:00", "category": "frente", "relevance_score": 23, "date_added": "2026-09-18", "title_es": "Ucrania recibió 3.300 millones de euros de la Unión Europea para misiles y drones", "text_es": "Kiev recibió otro tramo de 3.300 millones de euros de la Unión Europea como parte del programa de préstamos de apoyo a Ucrania. Así lo anunció el primer ministro de Ucrania, Serguéi Koretsky, la mañana del viernes 18 de septiembre en su canal de Telegram.\n\n\"Usaremos los fondos para necesidades prioritarias de defensa, en particular, para la compra de misiles y drones\", dijo el jefe del gobierno ucraniano.\n\nEl 11 de septiembre, la Comisión Europea aprobó la asignación de otros 6.100 millones de euros a Ucrania para la compra de sistemas de defensa aérea y antimisiles -en particular, misiles interceptores PAC-3 para los sistemas de misiles antiaéreos Patriot-, así como municiones, drones y equipos de guerra electrónica. Los fondos procederán del préstamo de la UE para apoyar a Ucrania durante el período 2026-2027.\n\nSegún el comisario europeo de Defensa, Andrius Kubilius, Ucrania espera recibir tantos misiles interceptores para los complejos Paptriot como sea posible antes del inicio del invierno. Se está considerando un plan según el cual los países socios transferirán misiles de sus reservas a Kiev y luego recibirán repuestos en futuras entregas.\n\nEl volumen de asistencia de defensa a Ucrania aprobado por la Unión Europea en el marco del programa de Préstamos de Apoyo a Ucrania para 2026 alcanzó los 28,3 mil millones de euros. Para estos fondos ya se han determinado las principales compras, proveedores y fechas de entrega.\n\nEl 5 de agosto, Kiev anunció que las Fuerzas Armadas de Ucrania no pudieron interceptar ninguno de los 28 misiles balísticos disparados por Rusia debido a la falta de los sistemas de defensa aérea necesarios. Politico escribió que la escasez de misiles interceptores PAC-3 y PAC-2 es especialmente grave. Las dificultades con el suministro de misiles para los sistemas de defensa aérea Patriot comenzaron en el mundo en marzo y abril en el contexto de su uso activo en la guerra de Estados Unidos e Israel contra Irán."}, {"id": "9cf3593bc622", "title_original": "Drone Attacks Disrupt First Day of Voting in Southern Russia and Occupied Ukraine", "text_original": "Ukrainian drone strikes disrupted the work of election workers at polling stations in southern Russia and parts of occupied Ukraine, Russian authorities said Friday, the first day of a three-day voting period for parliamentary and regional races.\n\n“There are small incidents I can’t fail to mention,” Russia’s Central Election Commission (CEC) chief Ella Pamfilova told reporters during a morning press conference. “In the Krasnodar region, one polling station had to be moved to an alternative location because the windows were broken due to damage from a drone.”\n\nFourteen polling stations in the occupied Luhansk region of eastern Ukraine briefly lost power after drones damaged energy infrastructure, Pamfilova said, though the sites eventually switched to backup power supplies.\n\nAndrei Proshunin, the mayor of the southern resort city of Sochi, said election workers and voters were forced to seek shelter Friday morning due to an air raid alert. He did not say whether any additional safety measures had been introduced across the city’s more than 240 polling stations amid near-daily drone attacks.\n\nRussia is holding elections for the lower-house State Duma for the first time since President Vladimir Putin ordered the full-scale invasion of Ukraine in February 2022. Alongside parliamentary races, gubernatorial elections and votes for local legislative assemblies are taking place in several regions.\n\nEarlier this week, the CEC said one of its members was killed in a drone attack in the occupied Zaporizhzhia region. Voting is also taking place in parts of occupied Ukraine, which Russia claims to have annexed in September 2022.", "link": "https://www.themoscowtimes.com/2026/09/18/drone-attacks-disrupt-first-day-of-voting-in-southern-russia-and-occupied-ukraine-a93742", "source_id": "the_moscow_times", "source_name": "The Moscow Times", "perspective": "russia_independent", "language": "en", "bias_note": "Diario independiente ruso en el exilio crítico con Putin y con cobertura de ataques en territorio ruso.", "published": "2026-09-18T08:59:00+00:00", "category": "drones", "relevance_score": 31, "date_added": "2026-09-18", "title_es": "Ataques con aviones no tripulados interrumpen el primer día de elecciones en el sur de Rusia y la Ucrania ocupada", "text_es": "Los ataques con drones ucranianos perturbaron el trabajo de los trabajadores electorales en los colegios electorales en el sur de Rusia y en partes de la Ucrania ocupada, dijeron las autoridades rusas el viernes, el primer día de un período de votación de tres días para las elecciones parlamentarias y regionales.\n\n\"Hay pequeños incidentes que no puedo dejar de mencionar\", dijo a los periodistas la jefa de la Comisión Electoral Central (CEC) de Rusia, Ella Pamfilova, durante una conferencia de prensa matutina. \"En la región de Krasnodar, un colegio electoral tuvo que ser trasladado a un lugar alternativo porque las ventanas se rompieron debido a los daños causados ​​por un dron\".\n\nCatorce colegios electorales en la región ocupada de Luhansk, en el este de Ucrania, se quedaron brevemente sin electricidad después de que los drones dañaran la infraestructura energética, dijo Pamfilova, aunque los sitios finalmente cambiaron a suministros de energía de respaldo.\n\nAndrei Proshunin, alcalde de la ciudad turística sureña de Sochi, dijo que los trabajadores electorales y los votantes se vieron obligados a buscar refugio el viernes por la mañana debido a una alerta de ataque aéreo. No dijo si se habían introducido medidas de seguridad adicionales en los más de 240 colegios electorales de la ciudad en medio de ataques casi diarios con drones.\n\nRusia está celebrando elecciones para la Duma Estatal de la cámara baja por primera vez desde que el presidente Vladimir Putin ordenó la invasión a gran escala de Ucrania en febrero de 2022. Además de las elecciones parlamentarias, en varias regiones se están celebrando elecciones para gobernador y votaciones para las asambleas legislativas locales.\n\nA principios de esta semana, la CCA dijo que uno de sus miembros murió en un ataque con aviones no tripulados en la región ocupada de Zaporizhzhia. También se están llevando a cabo votaciones en partes de la Ucrania ocupada, que Rusia afirma haber anexado en septiembre de 2022."}, {"id": "d57e5cddb5bc", "title_original": "«Планируем все необходимые шаги для защиты своих прав». В Nestle и «Ашан» прокомментировали указ Путина о введении временного управления в компаниях", "text_original": "Компания Nestle «принимает к сведению» указ президента России, по которому в «Нестле Россия» вводится «временная внешняя администрация».\n\n«Компания оценивает ситуацию и возможные варианты действий. Nestlе планирует предпринять все необходимые шаги для защиты своих прав и обеспечения непрерывности бизнес-операций в интересах всех заинтересованных сторон, особенно своих сотрудников», — говорится в заявлении компании.\n\nРоссийская «дочка» французской Auchan — ООО «Ашан» — после указа Путина продолжает работать в штатном режиме. Компания «направила запрос о разъяснениях» указа (кому именно, не уточняется»).\n\n«После получения соответствующей информации мы сможем предоставить более детальный комментарий. На сегодняшний день компания и все ее объекты продолжают работать в штатном режиме, без каких-либо изменений», — сказали РБК в компании.\n\nКомпания «Л.Е.В. Менеджмент» была зарегистрирована в октябре 2024 года в Москве. Ее генеральным директором значится Андрей Краюшкин. По данным «Новой газеты Европа», полное имя гендиректора «Л.Е.В. Менеджмент», а также его дата рождения, совпадают с именем генерал-майора МВД Андрея Краюшкина — бывшего первого заместителя управления по вопросам миграции.", "link": "https://meduza.io/news/2026/09/18/planiruem-vse-neobhodimye-shagi-dlya-zaschity-svoih-prav-v-nestle-i-ashan-prokommentirovali-ukaz-putina-o-vvedenii-vremennogo-upravleniya-v-kompaniyah", "source_id": "meduza_ru", "source_name": "Meduza (RU)", "perspective": "russia_independent", "language": "ru", "bias_note": "Principal medio ruso de investigación independiente prohibido por el Kremlin (sede en Letonia).", "published": "2026-09-18T08:40:32+00:00", "category": "economia", "relevance_score": 21, "date_added": "2026-09-18", "title_es": "\"Estamos planeando todas las medidas necesarias para proteger nuestros derechos\". Nestlé y Auchan comentaron el decreto de Putin sobre la introducción de la gestión temporal en las empresas", "text_es": "La empresa Nestlé “toma nota” del decreto del presidente ruso según el cual se introduce en Nestlé Rusia una “administración externa temporal”.\n\n\"La empresa está evaluando la situación y los posibles cursos de acción. Nestlé planea tomar todas las medidas necesarias para proteger sus derechos y garantizar la continuidad de las operaciones comerciales en interés de todas las partes interesadas, especialmente de sus empleados\", dijo la empresa en un comunicado.\n\nLa filial rusa de la francesa Auchan, Auchan LLC, sigue funcionando con normalidad tras el decreto de Putin. La empresa “envió una solicitud de aclaración” del decreto (a quién no se especificó exactamente).\n\n\"Una vez que recibamos la información relevante, podremos hacer un comentario más detallado. A día de hoy, la empresa y todas sus instalaciones siguen funcionando con normalidad, sin ningún cambio\", dijo la empresa a RBC.\n\nLa empresa \"L.E.V. Management\" se registró en octubre de 2024 en Moscú. Su director general es Andrey Krayushkin. Según Novaya Gazeta Europa, el nombre completo del director general de L.E.V. Gestión”, así como su fecha de nacimiento, coincide con el nombre del mayor general del Ministerio del Interior, Andrei Krayushkin, ex primer subdirector de asuntos migratorios."}, {"id": "7d8f52bd00ab", "title_original": "ВСУ потеряли свыше 1240 боевиков в зоне действий \"Юга\" за неделю", "text_original": "МОСКВА, 18 сен - РИА Новости. ВСУ потеряли более 1240 военнослужащих, шесть боевых бронированных машин за неделю в зоне ответственности \"Южной\" группировки, сообщило Минобороны РФ.\n\nКак отметили в ведомстве, на прошедшей неделе подразделения \"Южной\" группировки улучшили положение по переднему краю, активными действиями вчера был освобожден населенный пункт Веролюбовка Донецкой Народной Республики.\n\n\"За неделю в зоне ответственности \"Южной\" группировки войск ВСУ потеряли более 1240 военнослужащих, шесть боевых бронированных машин, 141 автомобиль и 10 орудий полевой артиллерии\", - говорится в сводке.", "link": "https://ria.ru/20260918/svo-2118445987.html", "source_id": "ria_novosti", "source_name": "RIA Novosti (РИА)", "perspective": "russia_official", "language": "ru", "bias_note": "Agencia estatal rusa del conglomerado Rossiya Segodnya. Postura y partes de guerra oficiales del Kremlin.", "published": "2026-09-18T08:36:59+00:00", "category": "frente", "relevance_score": 27, "date_added": "2026-09-18", "title_es": "Las Fuerzas Armadas de Ucrania perdieron en una semana más de 1.240 militantes en la zona de operaciones “Sur”", "text_es": "MOSCÚ, 18 de septiembre - RIA Novosti. Las Fuerzas Armadas de Ucrania perdieron más de 1.240 militares y seis vehículos blindados de combate en una semana en la zona de responsabilidad del grupo “Sur”, informó el Ministerio de Defensa ruso.\n\nComo señaló el departamento, la semana pasada las unidades del grupo \"Sur\" mejoraron la situación en la línea del frente; Ayer, mediante acciones activas, fue liberada la aldea de Verolubovka de la República Popular de Donetsk.\n\n\"En el transcurso de una semana, más de 1.240 militares, seis vehículos blindados de combate, 141 vehículos y 10 cañones de artillería de campaña se perdieron en la zona de responsabilidad del grupo de tropas del Sur de las Fuerzas Armadas de Ucrania\", dice el informe."}, {"id": "5284c11b6cc1", "title_original": "ВС России продолжили сжимать кольцо окружения ВСУ под Харьковом", "text_original": "МОСКВА, 18 сен - РИА Новости. Подразделения российской группировки войск \"Север\" на прошедшей недели продолжили сжимать внутреннее и расширять внешнее кольцо окружения формирований ВСУ в Харьковской области, сообщили в Минобороны России.\n\nВ Минобороны РФ добавили, что в результате решительных действий установлен контроль над населенными пунктами Черняков, Широкое, Шевченково, Ольховатка и Малая Волчья Харьковской области, все попытки прорыва из окружения были пресечены.\n\nПрезидент РФ Владимир Путин 1 сентября заявил, что в северо-восточной части Харьковской области завершено окружение группировки противника численностью до 2 тысяч человек. Как заявлял Путин, ликвидация котла позволит отодвинуть линию боевого соприкосновения от приграничных районов Белгородской области как минимум на 20 километров. Минобороны РФ 7 сентября сообщало, что в окружении находится около 1,7 тысячи военных ВСУ.", "link": "https://ria.ru/20260918/vsu-2118444129.html", "source_id": "ria_novosti", "source_name": "RIA Novosti (РИА)", "perspective": "russia_official", "language": "ru", "bias_note": "Agencia estatal rusa del conglomerado Rossiya Segodnya. Postura y partes de guerra oficiales del Kremlin.", "published": "2026-09-18T08:33:34+00:00", "category": "frente", "relevance_score": 33, "date_added": "2026-09-18", "title_es": "Las Fuerzas Armadas de Rusia continuaron reforzando el cerco de las Fuerzas Armadas de Ucrania cerca de Jarkov.", "text_es": "MOSCÚ, 18 de septiembre - RIA Novosti. Durante la semana pasada, unidades del grupo de fuerzas rusas “Norte” continuaron comprimiendo el anillo interior y ampliando el anillo exterior de cerco de las Fuerzas Armadas de Ucrania en la región de Jarkov, informó el Ministerio de Defensa ruso.\n\nEl Ministerio de Defensa ruso agregó que, como resultado de acciones decisivas, se estableció el control sobre los asentamientos de Chernyakov, Shirokoe, Shevchenkovo, Olkhovatka y Malaya Volchya en la región de Jarkov, y se detuvieron todos los intentos de romper el cerco.\n\nEl presidente ruso, Vladimir Putin, anunció el 1 de septiembre que se había completado el cerco de un grupo enemigo de hasta 2.000 personas en la parte noreste de la región de Jarkov. Como afirmó Putin, la liquidación del caldero permitirá alejar la línea de contacto de combate de las zonas fronterizas de la región de Belgorod al menos 20 kilómetros. El 7 de septiembre, el Ministerio de Defensa ruso informó que alrededor de 1,7 mil militares de las Fuerzas Armadas de Ucrania estaban rodeados."}, {"id": "730f79e225ba", "title_original": "Российские войска освободили Золотой Колодезь в ДНР", "text_original": "МОСКВА, 18 сен - РИА Новости. Российские подразделения группировки \"Центр\" освободили населенный пункт Золотой Колодезь в ДНР, сообщило в пятницу Минобороны РФ.\n\n\"В результате активных наступательных действий подразделений группировки войск \"Центр\" в течении недели освобожден населенный пункт Веселое, а вчера освобожден населенный пункт Золотой Колодезь Донецкой Народной Республики\", - говорится в сообщении российского военного ведомства.", "link": "https://ria.ru/20260918/svo-2118443715.html", "source_id": "ria_novosti", "source_name": "RIA Novosti (РИА)", "perspective": "russia_official", "language": "ru", "bias_note": "Agencia estatal rusa del conglomerado Rossiya Segodnya. Postura y partes de guerra oficiales del Kremlin.", "published": "2026-09-18T08:32:58+00:00", "category": "frente", "relevance_score": 27, "date_added": "2026-09-18", "title_es": "Las tropas rusas liberaron el Pozo Dorado en la RPD", "text_es": "MOSCÚ, 18 de septiembre - RIA Novosti. Unidades rusas del grupo Centro liberaron la aldea de Zolotoy Kolodez en la RPD, informó el viernes el Ministerio de Defensa ruso.\n\n\"Como resultado de las acciones ofensivas activas de unidades del grupo de tropas del Centro, la aldea de Veseloye fue liberada en una semana, y ayer fue liberada la aldea de Zolotoy Kolodez de la República Popular de Donetsk\", dijo el departamento militar ruso en un comunicado."}, {"id": "5cc7448ce24d", "title_original": "ВС России освободили Веролюбовку в ДНР", "text_original": "МОСКВА, 18 сен - РИА Новости. Российская армия взяла под контроль населенный пункт Веролюбовка в ДНР, сообщило Минобороны РФ.\n\n\"Вчера был освобожден населенный пункт Веролюбовка Донецкой Народной Республики\", - говорится в сообщении.", "link": "https://ria.ru/20260918/verolyubovka-2118442710.html", "source_id": "ria_novosti", "source_name": "RIA Novosti (РИА)", "perspective": "russia_official", "language": "ru", "bias_note": "Agencia estatal rusa del conglomerado Rossiya Segodnya. Postura y partes de guerra oficiales del Kremlin.", "published": "2026-09-18T08:31:08+00:00", "category": "frente", "relevance_score": 27, "date_added": "2026-09-18", "title_es": "Las Fuerzas Armadas rusas liberaron Verolubovka en la RPD", "text_es": "MOSCÚ, 18 de septiembre - RIA Novosti. El ejército ruso tomó el control de la aldea de Verolubovka en la RPD, informó el Ministerio de Defensa ruso.\n\n\"Ayer fue liberada la aldea de Verolubovka de la República Popular de Donetsk\", dice el mensaje."}, {"id": "f8e0c37faf9f", "title_original": "Более 4,2 млн человек проголосовали досрочно в 12 регионах России", "text_original": "Более 4,2 млн человек проголосовали досрочно в 12 приграничных российских регионах, в том числе на Донбассе и в Новороссии. Об этом сообщила глава Центризбиркома Элла Памфилова.\n\n«На вчерашний вечер всего досрочно проголосовало 4 215 210 избирателей. Это наши четыре воссоединенных региона: Донецкая, Луганская народные республики, Херсонская область, Запорожская область... Плюс еще восемь приграничных, где интенсивно, извините, бьют»,— уточнила глава ЦИКа на брифинге.\n\nГолосование на выборах в Госдуму проходит три дня — с 18 по 20 сентября. Досрочное голосование стартовало 4 сентября. Такую возможность получили избиратели в «прифронтовых» субъектах, где введен «средний уровень реагирования».\n\nПодробности — в материале «Ъ» «Опережающее голосование».", "link": "https://www.kommersant.ru/doc/8957721", "source_id": "kommersant", "source_name": "Kommersant (Коммерсантъ)", "perspective": "russia_official", "language": "ru", "bias_note": "Diario de referencia ruso sobre política exterior, sanciones, industria militar y economía de guerra.", "published": "2026-09-18T08:24:47+00:00", "category": "frente", "relevance_score": 17, "date_added": "2026-09-18", "title_es": "Más de 4,2 millones de personas votaron anticipadamente en 12 regiones de Rusia", "text_es": "Más de 4,2 millones de personas votaron anticipadamente en 12 regiones fronterizas rusas, incluidas Donbass y Novorossiya. Así lo anunció la jefa de la Comisión Electoral Central, Ella Pamfilova.\n\n\"Hasta ayer por la tarde votaron anticipadamente 4.215.210 electores. Éstas son nuestras cuatro regiones reunificadas: Donetsk, las repúblicas populares de Lugansk, la región de Jersón, la región de Zaporozhye... Además de otras ocho regiones fronterizas, donde, disculpen, están siendo duramente golpeadas\", aclaró el jefe de la Comisión Electoral Central en una sesión informativa.\n\nLa votación en las elecciones a la Duma estatal se lleva a cabo durante tres días, del 18 al 20 de septiembre. La votación anticipada comenzó el 4 de septiembre. Esta oportunidad se brindó a los votantes de las regiones de “primera línea”, donde se introdujo un “nivel medio de respuesta”.\n\nLos detalles se encuentran en el artículo de Kommersant “Votación anticipada”."}, {"id": "4cc1f8b70e20", "title_original": "ВС России поразили объекты ВСУ в Днепропетровской области", "text_original": "МОСКВА, 18 сен - РИА Новости. Расчет БПЛА-К \"Герань-4\" уничтожил радиолокационную станцию П-19МА и \"купольную\" станцию радиоэлектронной борьбы ВСУ в районе населенного пункта Широкое в Днепропетровской области, сообщили в Минобороны России.\n\n\"(Нанесено поражение - ред.) радиолокационной станции П-19МА ВСУ расчетом БПЛА-К \"Герань-4\" в районе населенного пункта Широкое в Днепропетровской области\", - говорится в сообщении.\n\nПо данным ведомства, там же была уничтожена \"купольная\" станция радиоэлектронной борьбы.", "link": "https://ria.ru/20260918/voennye-2118437730.html", "source_id": "ria_novosti", "source_name": "RIA Novosti (РИА)", "perspective": "russia_official", "language": "ru", "bias_note": "Agencia estatal rusa del conglomerado Rossiya Segodnya. Postura y partes de guerra oficiales del Kremlin.", "published": "2026-09-18T08:19:15+00:00", "category": "frente", "relevance_score": 23, "date_added": "2026-09-18", "title_es": "Las Fuerzas Armadas de Rusia atacaron instalaciones de las Fuerzas Armadas de Ucrania en la región de Dnipropetrovsk", "text_es": "MOSCÚ, 18 de septiembre - RIA Novosti. La tripulación del UAV-K \"Geran-4\" destruyó la estación de radar P-19MA y la estación de guerra electrónica \"domo\" de las Fuerzas Armadas de Ucrania en el área de la aldea de Shirokoe en la región de Dnepropetrovsk, informó el Ministerio de Defensa ruso.\n\n\"(La estación de radar P-19MA de las Fuerzas Armadas de Ucrania fue dañada por la tripulación del UAV-K \"Geran-4\" en el área de la aldea de Shirokoe en la región de Dnepropetrovsk\", dice el mensaje.\n\nSegún el departamento, allí también fue destruida una estación de guerra electrónica \"domo\"."}, {"id": "ca3a30c98842", "title_original": "Enemy attacks Konotop with drones: educational institutions, hospitals, railway, and gas infrastructure damaged", "text_original": "A massive Russian drone attack on Konotop, Sumy region, has damaged educational institutions, medical facilities, private homes, the gas distribution network, and the railway.\n\nAccording to Konotop Mayor Artem Semenikhin, the enemy attack destroyed social and critical infrastructure facilities in the city. Specifically, a kindergarten and School No. 11 sustained damage.\n\n\"Many private homes are damaged. Medical facilities have sustained damage. The railway is also damaged...\" he wrote.\n\nDamage to the gas distribution network has left a significant part of the city without gas service. Numerous power transmission lines were also damaged.", "link": "https://en.interfax.com.ua/news/general/1206334.html", "source_id": "interfax_ukraine", "source_name": "Interfax-Ucrania", "perspective": "ukraine", "language": "en", "bias_note": "Agencia de noticias ucraniana de referencia para despachos militares y declaraciones gubernamentales.", "published": "2026-09-18T08:06:12+00:00", "category": "frente", "relevance_score": 25, "date_added": "2026-09-18", "title_es": "El enemigo ataca Konotop con drones: instituciones educativas, hospitales, infraestructuras ferroviarias y de gas dañadas", "text_es": "Un ataque masivo con drones rusos contra Konotop, en la región de Sumy, ha dañado instituciones educativas, instalaciones médicas, viviendas privadas, la red de distribución de gas y el ferrocarril.\n\nSegún el alcalde de Konotop, Artem Semenikhin, el ataque enemigo destruyó instalaciones sociales y de infraestructura crítica en la ciudad. En concreto, una guardería y la Escuela N° 11 sufrieron daños.\n\n\"Muchas casas privadas han resultado dañadas. Las instalaciones médicas han sufrido daños. El ferrocarril también ha sufrido daños...\", escribió.\n\nLos daños en la red de distribución de gas han dejado sin servicio de gas a una parte importante de la ciudad. También resultaron dañadas numerosas líneas de transmisión de energía."}, {"id": "7395055718ac", "title_original": "Памфилова отреагировала на провокации во время выборов словами «не стоят выеденного яйца» // Глава Центризбиркома Памфилова прокомментировала провокации на выборах в Госдуму", "text_original": "Попытки провокаций на российских выборах «не стоят выеденного яйца» и не помешают свободному волеизъявлению граждан. Об этом заявила на брифинге председатель Центральной избирательной комиссии (ЦИК) Элла Памфилова.\n\n«Люди идут на избирательные участки, и мы их приветствуем. То есть голосование, назло всем провокаторам, недоброжелателям, идет нормально, в штатном режиме»,— сказала госпожа Памфилова.\n\nПо словам главы ЦИКа, на досрочных выборах депутатов Госдумы IX созыва проголосовали уже более 260 тыс. избирателей. В 12 приграничных регионах, в том числе в ДНР, ЛНР, Запорожской и Херсонской областях, в голосовании поучаствовали свыше 4,2 млн человек. Жители новых регионов стали участниками выборов федерального значения впервые после присоединения к России.", "link": "https://www.kommersant.ru/doc/8957674", "source_id": "kommersant", "source_name": "Kommersant (Коммерсантъ)", "perspective": "russia_official", "language": "ru", "bias_note": "Diario de referencia ruso sobre política exterior, sanciones, industria militar y economía de guerra.", "published": "2026-09-18T07:47:56+00:00", "category": "frente", "relevance_score": 17, "date_added": "2026-09-18", "title_es": "Pamfilova respondió a las provocaciones durante las elecciones con las palabras \"no vale la pena\" // La jefa de la Comisión Electoral Central, Pamfilova, comentó sobre las provocaciones durante las elecciones a la Duma Estatal.", "text_es": "Los intentos de provocación en las elecciones rusas “no valen un carajo” y no interferirán con la libre expresión de la voluntad de los ciudadanos. Así lo afirmó en una sesión informativa la presidenta de la Comisión Electoral Central (CEC), Ella Pamfilova.\n\n\"La gente va a las urnas y les damos la bienvenida. Es decir, la votación, a pesar de todos los provocadores y malvados, se desarrolla con normalidad, como siempre\", dijo Pamfilova.\n\nSegún el jefe de la Comisión Electoral Central, en las elecciones anticipadas de los diputados a la Duma estatal de la novena convocatoria ya votaron más de 260 mil electores. En 12 regiones fronterizas, incluidas la RPD, la RPL, Zaporozhye y Kherson, participaron en la votación más de 4,2 millones de personas. Los residentes de las nuevas regiones participaron por primera vez en las elecciones federales después de unirse a Rusia."}, {"id": "e6a1b27acb91", "title_original": "Выборы в Сочи прервали из-за атаки БПЛА", "text_original": "В Сочи объявлен режим беспилотной опасности. На всех избирательных участках, открытых для голосования за депутатов Госдумы, приняты «исчерпывающие меры безопасности». Об этом сообщил мэр города Андрей Прошунин в Telegram-канале.\n\nЧленов избирательных комиссий, наблюдателей и голосующих, находящихся на участках, переместили в укрытие до снятия режима атаки БПЛА. Господин Прошунин призвал граждан соблюдать меры предосторожности. После завершения атаки участки возобновят работу, заверил мэр.\n\nС 18 по 20 сентября в России проходят выборы депутатов Госдумы IX созыва. Тогда же состоятся прямые выборы глав восьми субъектов: в Мордовии, Тыве, Чечне, Белгородской, Брянской, Пензенской, Тверской и Ульяновской областях. В граничащих с Украиной регионах и там, где действует военное положение, принят особый порядок голосования.", "link": "https://www.kommersant.ru/doc/8957642", "source_id": "kommersant", "source_name": "Kommersant (Коммерсантъ)", "perspective": "russia_official", "language": "ru", "bias_note": "Diario de referencia ruso sobre política exterior, sanciones, industria militar y economía de guerra.", "published": "2026-09-18T07:16:51+00:00", "category": "frente", "relevance_score": 25, "date_added": "2026-09-18", "title_es": "Las elecciones en Sochi fueron interrumpidas por un ataque con vehículos aéreos no tripulados", "text_es": "En Sochi se ha declarado un régimen de peligro no tripulado. En todos los colegios electorales abiertos para la votación de los diputados de la Duma estatal se han adoptado \"extensas medidas de seguridad\". Así lo anunció el alcalde de la ciudad, Andrei Proshunin, en su canal de Telegram.\n\nLos miembros de las comisiones electorales, los observadores y los votantes ubicados en los colegios electorales fueron trasladados a refugios hasta que cesó el ataque de los vehículos aéreos no tripulados. Proshunin llamó a los ciudadanos a tomar precauciones. Una vez finalizado el ataque, los sitios reanudarán sus trabajos, aseguró el alcalde.\n\nDel 18 al 20 de septiembre se celebran en Rusia las elecciones de diputados a la Duma Estatal de la novena convocatoria. Al mismo tiempo se celebrarán elecciones directas de los jefes de ocho regiones: en las regiones de Mordovia, Tuvá, Chechenia, Bélgorod, Briansk, Penza, Tver y Uliánovsk. En las regiones fronterizas con Ucrania y donde está en vigor la ley marcial, se ha adoptado un procedimiento de votación especial."}, {"id": "1944a45be20a", "title_original": "NBC News: США могут вывести из Европы до половины военного контингента", "text_original": "По информации телекомпании NBC News, Пентагон рассматривает возможность вывода из Европы почти трети американского контингента. Европейские страны могут покинуть 25 тысяч и более американских военнослужащих, сообщает телеканал в четверг, 17 сентября, со ссылкой на семь действующих и бывших американских и западных должностных лиц.\n\nДва собеседника журналистов отметили, что сокращение может быть еще больше - до 40 000 военнослужащих, что составляет около половины американского контингента в Европе.\n\nПо всей вероятности, сокращение контингента затронет Германию, Италию и Испанию, указали три действующих и один бывший американские чиновники и еще одно западное официальное лицо. В этих трех странах базируется основная часть американских войск в Европе, при этом их лидеры вступали в конфликт с президентом США Дональдом Трампом из-за войны с Ираном, напоминает NBC News.\n\nПлан радикального сокращения военного присутствия США в Европе предусматривает также вывод авиации, кораблей и вооружений. Если эти намерения будут реализованы, это станет самым значительным сокращением 80-тысячного американского военного присутствия в Европе со времен окончания холодной войны.\n\nНикаких решений в этой связи пока не принято, отмечает телеканал со ссылкой на высокопоставленного чиновника Минобороны США и двух других официальных лиц.\n\nСтоль масштабные меры изучаются Соединенными Штатами, несмотря на предупреждения союзников по НАТО о растущей угрозе российской агрессии в Европе, отмечает телеканал. Этот шаг может радикально изменить отношения США с ключевыми союзниками и вынудить европейские страны налаживать новые партнерские отношения во времена нестабильности из-за войн в Украине и на Ближнем Востоке, указывается в материале.", "link": "https://www.dw.com/ru/nbc-news-сша-могут-вывести-из-европы-до-половины-военного-контингента/a-79318872?maca=rus-rss-ru-all-1126-xml-mrss", "source_id": "dw_russian", "source_name": "Deutsche Welle (DW Ruso)", "perspective": "international", "language": "ru", "bias_note": "Radiodifusora pública internacional de Alemania con análisis exhaustivo del conflicto para la audiencia rusoparlante.", "published": "2026-09-18T07:01:00+00:00", "category": "frente", "relevance_score": 15, "date_added": "2026-09-18", "title_es": "NBC News: Estados Unidos puede retirar hasta la mitad de su contingente militar de Europa", "text_es": "Según NBC News, el Pentágono está considerando la posibilidad de retirar casi un tercio del contingente estadounidense de Europa. Los países europeos pueden dejar 25 mil o más tropas estadounidenses, informó el canal de televisión el jueves 17 de septiembre, citando a siete funcionarios estadounidenses y occidentales actuales y anteriores.\n\nDos interlocutores de los periodistas señalaron que la reducción podría ser aún mayor: hasta 40.000 soldados, aproximadamente la mitad del contingente estadounidense en Europa.\n\nEs probable que la reducción afecte a Alemania, Italia y España, dijeron tres funcionarios estadounidenses actuales y un ex, y un funcionario occidental. Estos tres países albergan la mayor parte de las tropas estadounidenses en Europa, y sus líderes se han enfrentado con el presidente estadounidense, Donald Trump, por la guerra con Irán, recuerda NBC News.\n\nEl plan para una reducción radical de la presencia militar estadounidense en Europa prevé también la retirada de aviones, barcos y armas. Si estas intenciones se implementan, será la mayor reducción de la presencia militar estadounidense de 80.000 efectivos en Europa desde el final de la Guerra Fría.\n\nAún no se ha tomado ninguna decisión al respecto, señala el canal de televisión citando a un alto funcionario del Departamento de Defensa de Estados Unidos y a otro
