д. Кейн сделал такое заявление через несколько дней после того, как США впервые заявили о выводе на орбиту космического оружия.\n\nЕще один высокопоставленный американский военачальник, генерал-лейтенант Грегори Гэньон, возглавляющий Командование боевых сил Космических сил США, объяснил эти приготовления действиями «потенциальных противников», прежде всего Китая.\n\nКосмические силы — новый вид вооруженных сил США. Они были созданы во время первого президентского срока Трампа в 2019 году. По словам Гэньона, в ближайшие пять лет США планируют увеличить численность Космических сил вдвое — примерно до 25 тысяч человек.\n\nКитай создал собственные военные космические подразделения в 2024 году для реагирования на кризисные ситуации в космосе. В ответ на вывод американского оружия в космос в МИД КНР заявили, что Пекин выступает «против размещения оружия, милитаризации и гонки вооружений в космическом пространстве».\n\nКак отмечает Associated Press, серия заявлений американских военных противоречит давно принятым международным конвенциям и договоренностям об использовании космического пространства исключительно в мирных целях.\n\nТак Договор о космосе, подписанный США и Китаем в 1967 году, прямо предписывает использовать Луну и другие небесные тела «исключительно в мирных целях». Документ запрещает размещать в космосе ядерное оружие и оружие массового уничтожения.", "link": "https://meduza.io/news/2026/09/17/voennyy-sovetnik-trampa-prizval-gotovitsya-k-boevym-deystviyam-na-orbite-luny", "source_id": "meduza_ru", "source_name": "Meduza (RU)", "perspective": "russia_independent", "language": "ru", "bias_note": "Principal medio ruso de investigación independiente prohibido por el Kremlin (sede en Letonia).", "published": "2026-09-17T07:56:22+00:00", "category": "armamento", "relevance_score": 15, "date_added": "2026-09-17", "title_es": "El asesor militar de Trump llamó a prepararse para operaciones militares en la órbita lunar", "text_es": "El ejército estadounidense necesita prepararse para operaciones de combate no sólo en la órbita terrestre baja, sino también alrededor de la Luna. Así lo afirmó el presidente del Estado Mayor Conjunto de Estados Unidos, general Dan Cain, hablando en la conferencia Air, Space and Cyber ​​​​conference en National Harbor, Maryland. Kane hizo esta declaración unos días después de que Estados Unidos anunciara por primera vez el lanzamiento de armas espaciales a la órbita.\n\nOtro alto líder militar estadounidense, el teniente general Gregory Gagnon, que dirige el Comando de la Fuerza de Combate de las Fuerzas Espaciales de Estados Unidos, atribuyó estos preparativos a las acciones de “adversarios potenciales”, principalmente China.\n\nLa Fuerza Espacial es una nueva rama del ejército estadounidense. They were created during Trump's first term in office in 2019. According to Gagnon, in the next five years the United States plans to double the size of the Space Force to approximately 25 thousand people.\n\nChina creó sus propias unidades espaciales militares en 2024 para responder a las crisis en el espacio. En respuesta a la retirada de armas estadounidenses al espacio, el Ministerio de Asuntos Exteriores chino afirmó que Beijing está “en contra del despliegue de armas, la militarización y la carrera armamentista en el espacio exterior”.\n\nComo señala Associated Press, una serie de declaraciones del ejército estadounidense contradicen convenciones y acuerdos internacionales establecidos desde hace mucho tiempo sobre el uso del espacio ultraterrestre exclusivamente con fines pacíficos.\n\nAsí, el Tratado sobre el Espacio Ultraterrestre, firmado por Estados Unidos y China en 1967, exige directamente el uso de la Luna y otros cuerpos celestes “exclusivamente con fines pacíficos”. El documento prohíbe la colocación de armas nucleares y armas de destrucción masiva en el espacio."}, {"id": "7cf94a61d0b8", "title_original": "Two killed, 6 injured in Donetsk region in past day", "text_original": "Russian occupiers shelled settlements in the Donetsk region 23 times over the past day, resulting in two deaths and six injuries, Regional Military Administration Head Vadym Filashkin has reported.\n\n\"Kramatorsk district. one person died in Maiaky within Sviatohirsk community. In Karpivka within Mykolaivka community, eight private houses were damaged. In Sloviansk, two people were injured, and three private houses, a post office, a restaurant, seven cars, and a gas station were damaged,\" he wrote on Telegram on Thursday morning.\n\nAccording to Regional Military Administration, a car was damaged in Kramatorsk; one person was killed and one injured in Malotaranivka; and two people were injured in Bilenke.\n\nIn Shostakivka within Novodonetske community, a production facility and three warehouses were damaged, while another two warehouses were damaged in Samiilivka. In Petrivka Persha within the Oleksandrivka community, a private house, three outbuildings, and a car were damaged, and a private house was damaged in Ocheretyne.\n\n\"In total, over the day, the Russians shelled settlements in Donetsk region 23 times. From the frontline, 718 people were evacuated, including 74 children,\" Regional Military Administration head reported.", "link": "https://en.interfax.com.ua/news/general/1205731.html", "source_id": "interfax_ukraine", "source_name": "Interfax-Ucrania", "perspective": "ukraine", "language": "en", "bias_note": "Agencia de noticias ucraniana de referencia para despachos militares y declaraciones gubernamentales.", "published": "2026-09-17T07:49:29+00:00", "category": "frente", "relevance_score": 27, "date_added": "2026-09-17", "title_es": "Dos muertos y seis heridos en la región de Donetsk el último día", "text_es": "Los ocupantes rusos bombardearon asentamientos en la región de Donetsk 23 veces durante el último día, lo que provocó dos muertos y seis heridos, informó el jefe de la Administración Militar Regional, Vadym Filashkin.\n\n\"Distrito de Kramatorsk. Una persona murió en Maiaky, en la comunidad de Sviatohirsk. En Karpivka, en la comunidad de Mykolaivka, ocho casas privadas sufrieron daños. En Sloviansk, dos personas resultaron heridas y tres casas privadas, una oficina de correos, un restaurante, siete coches y una gasolinera sufrieron daños\", escribió en Telegram el jueves por la mañana.\n\nSegún la administración militar regional, en Kramatorsk un coche resultó dañado; una persona murió y otra resultó herida en Malotaranivka; y dos personas resultaron heridas en Bilenke.\n\nEn Shostakivka, en la comunidad de Novodonetske, resultaron dañados una planta de producción y tres almacenes, mientras que otros dos almacenes sufrieron daños en Samiilivka. En Petrivka Persha, dentro de la comunidad de Oleksandrivka, resultaron dañados una casa privada, tres dependencias y un automóvil, y en Ocheretyne una casa privada.\n\n\"En total, durante el día, los rusos bombardearon los asentamientos en la región de Donetsk 23 veces. Del frente fueron evacuadas 718 personas, entre ellas 74 niños\", informó el jefe de la Administración Militar Regional."}, {"id": "1229c85ce56f", "title_original": "Турецкий судовладелец пожаловался в МУС на Украину из-за атаки БПЛА", "text_original": "Турецкий владелец грузового судна, атакованного беспилотниками в Черном море, подал жалобу в Международный уголовный суд (МУС) на Украину. Судоходная компания T&O Denizcilik совместно с выжившими членами экипажа и семьей погибшего в результате нападения моряка требует расследовать удар БПЛА в Черном море как возможное военное преступление в соответствии с нормами международного права, сообщили в среду, 16 сентября, турецкие СМИ.\n\nБалкер MV Reyhan Sari под турецким флагом 21 июля был атакован БПЛА близ порта Новороссийск. Судно перевозило уголь из российского порта Тамань в турецкий черноморский порт Трабзон. Официальные лица заявляли, что удар был нанесен Украиной. В результате атаки погиб сотрудник машинного отделения - 54-летний Саваш Чакар. Еще несколько членов экипажа получили ранения, при этом в жалобе не приводятся их имена и детали об их состоянии, пишет издание Turkiye Today.\n\nЖалоба T&O Denizcilik, семьи Чакара и выживших членов экипажа направлена в прокуратуру МУС. По словам адвоката Нури Корая Куруна, в канцелярию прокурора МУС также переданы свидетельства, подтверждающие позицию истцов. Он отметил, что судно было поражено кассетными боеприпасами. При этом бомба пробила обшивку судна и взорвалась внутри, выбросив сотни мелких поражающих элементов, сообщил адвокат истцов изданию HaberDenizde.\n\nЕсли прокуроры МУС примут решение о начале официального расследования, дело может быть передано в суд для дальнейшего разбирательства.\n\nВласти Турции неоднократно выражали протест в связи с ударами РФ и Украины в Черном море. В частности, в конце августа после двух атак на связанные с Турцией суда в МИД в Анкаре был вызван посол Украины в Турции Нариман Джелял. \"В ходе встречи Турция предупредила об абсолютной необходимости обеспечения безопасности людей, имущества, судоходства и окружающей среды в Черном море\", - передает слова министерства AFP.\n\n8 августа министр иностранных дел Турции Хакан Фидан предложил России и Украине договориться о моратории на удары по судам в Черном море. Тогда в Анкаре сообщили, что передали предложение обеим сторонам и ожидают их ответа. По словам Фидана, Турция призвала Москву и Киев создать механизм, который позволил бы прекратить атаки в Черном море. Министр отметил, что с такой просьбой ранее обращалась и украинская сторона.", "link": "https://www.dw.com/ru/турецкий-судовладелец-пожаловался-в-мус-на-украину-из-за-атаки-бпла/a-79301560?maca=rus-rss-ru-all-1126-xml-mrss", "source_id": "dw_russian", "source_name": "Deutsche Welle (DW Ruso)", "perspective": "international", "language": "ru", "bias_note": "Radiodifusora pública internacional de Alemania con análisis exhaustivo del conflicto para la audiencia rusoparlante.", "published": "2026-09-17T07:49:00+00:00", "category": "frente", "relevance_score": 13, "date_added": "2026-09-17", "title_es": "El armador turco se quejó ante la CPI sobre Ucrania debido al ataque de un UAV", "text_es": "El propietario turco de un carguero atacado por drones en el Mar Negro ha presentado una denuncia contra Ucrania ante la Corte Penal Internacional (CPI). La compañía naviera T&O Denizcilik, junto con los miembros de la tripulación supervivientes y la familia del marinero muerto en el ataque, exigen que el ataque con vehículos aéreos no tripulados en el Mar Negro sea investigado como un posible crimen de guerra de conformidad con el derecho internacional, informaron los medios turcos el miércoles 16 de septiembre.\n\nEl granelero de bandera turca MV Reyhan Sari fue atacado por un UAV cerca del puerto de Novorossiysk el 21 de julio. El barco transportaba carbón desde el puerto ruso de Taman al puerto turco de Trabzon en el Mar Negro. Las autoridades dijeron que el ataque fue llevado a cabo por Ucrania. Como resultado del ataque, murió un empleado de la sala de máquinas, Savash Chakar, de 54 años. Varios otros miembros de la tripulación resultaron heridos, pero la denuncia no proporciona sus nombres ni detalles sobre su estado, escribe Turkiye Today.\n\nLa denuncia de T&O Denizcilik, la familia Chakar y los tripulantes supervivientes ha sido enviada a la Fiscalía de la CPI. Según el abogado Nuri Koray Kurun, también se han presentado a la fiscalía de la CPI pruebas que confirman la posición de los demandantes. Señaló que el barco fue alcanzado por municiones en racimo. Al mismo tiempo, la bomba atravesó el casco del barco y explotó en el interior, expulsando cientos de pequeños elementos destructivos, dijo el abogado de los demandantes a HaberDenizde.\n\nSi los fiscales de la CPI deciden abrir una investigación formal, el caso podría enviarse a los tribunales para continuar con los procedimientos.\n\nLas autoridades turcas han protestado repetidamente en relación con los ataques de la Federación Rusa y Ucrania en el Mar Negro. En particular, a finales de agosto, tras dos ataques a barcos asociados con Turquía, el embajador de Ucrania en Turquía, Nariman Jelal, fue convocado al Ministerio de Asuntos Exteriores en Ankara. \"Durante la reunión, Türkiye advirtió sobre la absoluta necesidad de garantizar la seguridad de las personas, los bienes, el transporte marítimo y el medio ambiente en el Mar Negro\", afirmó el ministerio citando a la AFP.\n\nEl 8 de agosto, el Ministro de Asuntos Exteriores turco, Hakan Fidan, propuso que Rusia y Ucrania acordaran una moratoria sobre los ataques a barcos en el Mar Negro. Luego Ankara dijo que había transmitido la propuesta a ambas partes y que estaba esperando su respuesta. Según Fidan, Türkiye pidió a Moscú y Kiev que crearan un mecanismo que detuviera los ataques en el Mar Negro. El ministro señaló que la parte ucraniana ya había hecho tal petición anteriormente."}, {"id": "0322952c1734", "title_original": "Russia's northern pincer in Donetsk Oblast has effectively been routed – Ukrainian commander", "text_original": "Brigadier General Andrii Biletskyi, Commander of Ukraine's 3rd Army Corps, has said the \"northern pincer\" of Russian forces, which was meant to encircle Ukrainian fortress cities in Donetsk Oblast, has effectively been routed.\n\nSource: Biletskyi on air, reported by Ukrinform, a Ukrainian news agency\n\nQuote from Biletskyi: \"The Russians had a plan for the Donetsk front: to encircle the fortress cities from the north and south. From the south, the encirclement was to come through Dobropillia; from the north, it was to come through the salient that is now being cut off, towards Sviatohirsk and then on to Barvinkove. That is where the two Russian pincers – the Dobropillia pincer from the south and the Sviatohirsk pincer from the north – were supposed to meet.\"\n\nDetails: Biletskyi reported that Russian infiltration near Dobropillia was stopped last year and that the situation there remains difficult but under control.\n\nQuote: \"The northern pincer has effectively been routed and destroyed.\"\n\nMore details: Biletskyi also pointed out that it is now critically important to \"paralyse logistics, paralyse the rear and not give the Russians the opportunity to renew this advance\".", "link": "https://www.pravda.com.ua/eng/news/2026/09/17/8053846/", "source_id": "ukrainska_pravda_en", "source_name": "Ukrainska Pravda (EN)", "perspective": "ukraine", "language": "en", "bias_note": "Uno de los periódicos más leídos e históricos de Ucrania (versión internacional en inglés).", "published": "2026-09-17T07:45:00+00:00", "category": "frente", "relevance_score": 27, "date_added": "2026-09-17", "title_es": "La pinza norte de Rusia en la provincia de Donetsk ha sido efectivamente derrotada: comandante ucraniano", "text_es": "El general de brigada Andrii Biletskyi, comandante del 3.er Cuerpo de Ejército de Ucrania, ha dicho que la \"pinza norte\" de las fuerzas rusas, que debía rodear las ciudades fortaleza ucranianas en el óblast de Donetsk, ha sido efectivamente derrotada.\n\nFuente: Biletskyi en directo, informado por Ukrinform, una agencia de noticias ucraniana.\n\nCita de Biletskyi: \"Los rusos tenían un plan para el frente de Donetsk: rodear las ciudades fortaleza por el norte y el sur. Desde el sur, el cerco debía pasar por Dobropillia; desde el norte, debía pasar por el saliente que ahora está siendo cortado, hacia Sviatohirsk y luego hasta Barvinkove. Allí es donde se encuentran las dos pinzas rusas: la pinza de Dobropillia del sur y la pinza de Sviatohirsk del norte – se suponía que nos encontraríamos.\"\n\nDetalles: Biletskyi informó que la infiltración rusa cerca de Dobropillia fue detenida el año pasado y que la situación allí sigue siendo difícil pero bajo control.\n\nCita: \"La pinza del norte ha sido efectivamente derrotada y destruida\".\n\nMás detalles: Biletskyi también señaló que ahora es de vital importancia \"paralizar la logística, paralizar la retaguardia y no dar a los rusos la oportunidad de renovar este avance\"."}, {"id": "73c028b0990d", "title_original": "Occupiers strike railway station in Berestyn, Kharkiv region – Ukrzaliznytsia", "text_original": "The railway station building in Berestyn, Kharkiv region, suffered significant damage as a result of a hostile drone attack, though no people were injured, Ukrzaliznytsia's press service has reported.\n\n\"From the painful news: before dawn, an enemy UAV caused serious damage to the Berestyn station building,\" Ukrzaliznytsia stated in a Telegram post on Thursday.\n\nThe company reported that passengers and station employees were unharmed because they were sheltering in a safe place, and infrastructure inspections are currently underway. Trains to Berestyn have not been canceled.\n\n\"In Kyiv, the infrastructure of Mykilska Slobidka ring train station was damaged. Since morning, Kyiv City Express has been operating on a limited loop, bypassing Darnytsia – Pochayna section. Restoring it will take a day,\" Ukrzaliznytsia added.", "link": "https://en.interfax.com.ua/news/general/1205712.html", "source_id": "interfax_ukraine", "source_name": "Interfax-Ucrania", "perspective": "ukraine", "language": "en", "bias_note": "Agencia de noticias ucraniana de referencia para despachos militares y declaraciones gubernamentales.", "published": "2026-09-17T07:17:45+00:00", "category": "frente", "relevance_score": 25, "date_added": "2026-09-17", "title_es": "Los ocupantes atacan la estación de tren en Berestyn, región de Járkov – Ukrzaliznytsia", "text_es": "El edificio de la estación de ferrocarril en Berestyn, en la región de Járkov, sufrió daños importantes como resultado de un ataque hostil con drones, aunque no hubo heridos, informó el servicio de prensa de Ukrzaliznytsia.\n\n\"De la dolorosa noticia: antes del amanecer, un vehículo aéreo no tripulado enemigo causó graves daños al edificio de la estación de Berestyn\", afirmó Ukrzaliznytsia en una publicación en Telegram el jueves.\n\nLa empresa informó que los pasajeros y empleados de la estación resultaron ilesos porque se encontraban resguardados en un lugar seguro y actualmente se realizan inspecciones de infraestructura. Los trenes a Berestyn no han sido cancelados.\n\n\"En Kiev, la infraestructura de la estación de circunvalación de Mykilska Slobidka resultó dañada. Desde la mañana, el Kyiv City Express opera en un circuito limitado, evitando el tramo Darnytsia-Pochayna. Su restauración llevará un día\", añadió Ukrzaliznytsia."}, {"id": "2201883e983d", "title_original": "Минобороны России сообщило об ударах по мостам через Днестр // Минобороны: ВС РФ ударили по мостам через Днестр, дата-центру и «Запорожстали»", "text_original": "Минобороны России отчиталось о поражении за ночь двух цехов по производству БПЛА на Украине. Также удары были нанесены по двум мостам через Днестр и комбинату «Запорожсталь».\n\nПо данным российского оборонного ведомства, удары осуществлены оружием наземного, морского и воздушного базирования, а также беспилотниками. В результате поражены:\n\nВ порту Черноморск атакованы два сухогруза с грузами военного назначения. Также в 11 км восточнее Одессы нанесен удар по судну, доставлявшему в местный порт грузы для ВСУ.", "link": "https://www.kommersant.ru/doc/8956771", "source_id": "kommersant", "source_name": "Kommersant (Коммерсантъ)", "perspective": "russia_official", "language": "ru", "bias_note": "Diario de referencia ruso sobre política exterior, sanciones, industria militar y economía de guerra.", "published": "2026-09-17T07:12:33+00:00", "category": "frente", "relevance_score": 35, "date_added": "2026-09-17", "title_es": "El Ministerio de Defensa ruso informó sobre ataques a puentes sobre el Dniéster // Ministerio de Defensa: Las Fuerzas Armadas rusas atacaron puentes sobre el Dniéster, un centro de datos y Zaporizhstal", "text_es": "El Ministerio de Defensa ruso informó sobre la destrucción de dos talleres de producción de vehículos aéreos no tripulados en Ucrania durante la noche. Además, se produjeron huelgas en dos puentes que cruzan el Dniéster y en la planta de Zaporizhstal.\n\nSegún el Ministerio de Defensa ruso, los ataques se llevaron a cabo con armas terrestres, marítimas y aéreas, así como con drones. Como resultado, se vieron afectados:\n\nEn el puerto de Chernomorsk fueron atacados dos buques de carga seca que transportaban cargamento militar. Además, a 11 kilómetros al este de Odessa fue alcanzado un barco que transportaba cargamento para las Fuerzas Armadas de Ucrania al puerto local."}, {"id": "340c57386281", "title_original": "Российская армия ударила по металлургическим предприятиям на Украине // Минобороны: ВС РФ ударили по предприятиям металлургии и ТЭК на Украине", "text_original": "Российские подразделения минувшей ночью нанесли удар по предприятиям металлургической и радиоэлектронной промышленности Украины. Также — по объектам ВПК и энергетической инфраструктуры в Киеве, Запорожье и Одесской области. Об этом заявили в российском Минобороны.\n\nСогласно сводке ведомства, также БПЛА «Герань» поразили четыре судна в порту Черноморск.", "link": "https://www.kommersant.ru/doc/8956736", "source_id": "kommersant", "source_name": "Kommersant (Коммерсантъ)", "perspective": "russia_official", "language": "ru", "bias_note": "Diario de referencia ruso sobre política exterior, sanciones, industria militar y economía de guerra.", "published": "2026-09-17T06:27:56+00:00", "category": "frente", "relevance_score": 35, "date_added": "2026-09-17", "title_es": "El ejército ruso atacó empresas metalúrgicas en Ucrania // Ministerio de Defensa: Las Fuerzas Armadas rusas atacaron empresas metalúrgicas y de combustible y energía en Ucrania", "text_es": "Anoche unidades rusas atacaron empresas de la industria metalúrgica y radioelectrónica de Ucrania. También sobre el complejo militar-industrial y las instalaciones de infraestructura energética en Kiev, Zaporozhye y la región de Odessa. Así lo afirmó el Ministerio de Defensa ruso.\n\nSegún el informe del departamento, el UAV Geran también alcanzó cuatro barcos en el puerto de Chernomorsk."}, {"id": "a3ecfc01f46f", "title_original": "Injured in nighttime attack on Odesa region rises to 7, 10 apartments in multi-story building destroyed – Kiper", "text_original": "The number of injured as a result of a massive nighttime attack by Russian occupation forces on the Odesa region has increased to seven people, including two children, Head of the Regional Military Administration Oleh Kiper reported on his Telegram channel on Thursday morning.\n\n\"Almost the entire night, Odesa region was under a massive combined enemy attack: seven people were injured, including two children aged 4 and 13. One of the Russian drones hit a multi-story residential building in Odesa. Ten apartments on the 14th-16th floors were destroyed, and 11 cars were damaged. As of this minute, three injured people are known, including a 4-year-old child,\" Kiper wrote.\n\nAccording to him, as a result of other strikes, at least five private homes, a kindergarten, a dormitory, a restaurant's summer terrace, warehouse and garage facilities, as well as passenger cars were damaged. Another four people, including an elderly woman and a 13-year-old child, were injured at these sites.\n\nEmergency rescue operations are underway at the impact sites, and operational headquarters have been deployed.\n\nEarlier, as of 07:00, the City Military Administration reported six injured individuals (including two children) due to strikes on a 19-story building and the city's private sector.", "link": "https://en.interfax.com.ua/news/general/1205671.html", "source_id": "interfax_ukraine", "source_name": "Interfax-Ucrania", "perspective": "ukraine", "language": "en", "bias_note": "Agencia de noticias ucraniana de referencia para despachos militares y declaraciones gubernamentales.", "published": "2026-09-17T06:12:51+00:00", "category": "drones", "relevance_score": 25, "date_added": "2026-09-17", "title_es": "Ya son 7 los heridos en el ataque nocturno en la región de Odesa y 10 apartamentos de un edificio de varias plantas destruidos – Kiper", "text_es": "El número de heridos como resultado del ataque masivo nocturno de las fuerzas de ocupación rusas en la región de Odesa aumentó a siete personas, incluidos dos niños, informó el jueves por la mañana el jefe de la Administración Militar Regional, Oleh Kiper, en su canal Telegram.\n\n\"Casi toda la noche, la región de Odesa estuvo bajo un ataque enemigo combinado masivo: siete personas resultaron heridas, entre ellas dos niños de 4 y 13 años. Uno de los drones rusos impactó en un edificio residencial de varias plantas en Odesa. Diez apartamentos de los pisos 14 a 16 fueron destruidos y 11 coches resultaron dañados. Hasta este momento se conocen tres heridos, entre ellos un niño de 4 años\", escribió Kiper.\n\nSegún sus palabras, como resultado de otras huelgas resultaron dañados al menos cinco casas privadas, una guardería, una residencia de estudiantes, una terraza de verano de un restaurante, almacenes y garajes, así como turismos. Otras cuatro personas, entre ellas una anciana y un niño de 13 años, resultaron heridas en estos lugares.\n\nSe están llevando a cabo operaciones de rescate de emergencia en los lugares del impacto y se han desplegado centros operativos.\n\nAnteriormente, a las 07:00 horas, la Administración Militar de la ciudad informó de seis personas heridas (incluidos dos niños) debido a ataques a un edificio de 19 pisos y al sector privado de la ciudad."}, {"id": "bef82a1af15a", "title_original": "Air defense downs and suppresses 131 Russian aerial targets overnight, impacts at 36 locations", "text_original": "Ukrainian air defense forces, as of 08:00 on Thursday, shot down and suppressed 131 enemy targets during a massive nighttime attack by Russian forces, with Kyiv, Zaporizhia, and Odesa regions being the main directions, the Air Force of the Armed Forces of Ukraine reported on its Telegram channel.\n\n\"On the night of September 17 (starting from 18:00 on September 16), the enemy attacked with: Onyx anti-ship missiles from Russia's Kursk region; Iskander-M/S-400/KN-23 ballistic missiles from Russia's Bryansk and Voronezh regions; four Kalibr sea-launched cruise missiles from the waters of the Caspian Sea; 10 Banderol/Dan-T targets from the airspace of the Sea of Azov basin; and 157 Shahed-type strike UAVs (more than half of them jet-powered) and Parodiya-type decoy drones,\" the report stated.\n\nAccording to preliminary data, air defense destroyed and neutralized seven Banderol/Dan-T targets, as well as 124 Shahed, Gerbera, and other modification drones.\n\nAt the same time, impacts of enemy missiles and strike drones were recorded at 36 locations, along with falling debris from intercepted targets at five locations.", "link": "https://en.interfax.com.ua/news/general/1205666.html", "source_id": "interfax_ukraine", "source_name": "Interfax-Ucrania", "perspective": "ukraine", "language": "en", "bias_note": "Agencia de noticias ucraniana de referencia para despachos militares y declaraciones gubernamentales.", "published": "2026-09-17T06:08:53+00:00", "category": "frente", "relevance_score": 25, "date_added": "2026-09-17", "title_es": "La defensa aérea derriba y suprime 131 objetivos aéreos rusos durante la noche e impacta en 36 lugares", "text_es": "Las fuerzas de defensa aérea ucranianas, a las 08:00 del jueves, derribaron y suprimieron 131 objetivos enemigos durante un ataque nocturno masivo por parte de las fuerzas rusas, siendo las regiones de Kiev, Zaporizhia y Odesa las principales direcciones, informó la Fuerza Aérea de las Fuerzas Armadas de Ucrania en su canal Telegram.\n\n\"En la noche del 17 de septiembre (a partir de las 18:00 del 16 de septiembre), el enemigo atacó con: misiles antibuque Onyx desde la región rusa de Kursk; misiles balísticos Iskander-M/S-400/KN-23 desde las regiones rusas de Bryansk y Voronezh; cuatro misiles de crucero Kalibr lanzados desde el mar desde las aguas del Mar Caspio; 10 objetivos Banderol/Dan-T desde el espacio aéreo de la cuenca del Mar de Azov; y 157 vehículos aéreos no tripulados de ataque del tipo Shahed (más de la mitad de ellos propulsados por aviones a reacción) y drones señuelo del tipo Parodiya\", afirma el informe.\n\nSegún datos preliminares, la defensa aérea destruyó y neutralizó siete objetivos Banderol/Dan-T, así como 124 drones Shahed, Gerbera y otros drones modificados.\n\nAl mismo tiempo, se registraron impactos de misiles enemigos y drones de ataque en 36 lugares, así como caída de escombros de objetivos interceptados en cinco lugares."}, {"id": "e4bc1b98eeb6", "title_original": "Enemy attacks on Sumy region kill 1, injure 15 – police", "text_original": "A civilian was killed and 15 others were injured as a result of Russian strikes across Sumy region, the regional police department reported on Telegram on Thursday morning.\n\n\"A 64-year-old man was killed in Sumy community as a result of guided aerial bomb strikes. Men aged 73, 69, 64, 50, 50, and 37, women aged 76 and 69, as well as a 14-year-old boy and girl, sustained bodily injuries. In addition, a 40-year-old man was wounded in a UAV attack,\" the report reads.\n\nAccording to law enforcement, a 30-year-old man was injured by a drone strike in the Sadivska community, and three women aged 78, 71, and 56 were wounded in an enemy drone attack in Hutir-Mykhailivska community.\n\nAdditionally, a 60-year-old man who was wounded during an enemy UAV attack on September 15 in Seredyna-Buda community sought medical assistance.\n\nPolice investigators have launched criminal proceedings over violations of the laws and customs of war.", "link": "https://en.interfax.com.ua/news/general/1205661.html", "source_id": "interfax_ukraine", "source_name": "Interfax-Ucrania", "perspective": "ukraine", "language": "en", "bias_note": "Agencia de noticias ucraniana de referencia para despachos militares y declaraciones gubernamentales.", "published": "2026-09-17T06:08:12+00:00", "category": "frente", "relevance_score": 25, "date_added": "2026-09-17", "title_es": "Ataques enemigos en la región de Sumy matan a una persona y 15 resultan heridos: policía", "text_es": "Un civil murió y otros 15 resultaron heridos como resultado de los ataques rusos en la región de Sumy, informó el jueves por la mañana el departamento de policía regional en Telegram.\n\n\"En la localidad de Sumy murió un hombre de 64 años como resultado de ataques con bombas aéreas guiadas. Sufrieron heridas hombres de 73, 69, 64, 50, 50 y 37 años, mujeres de 76 y 69 años, así como un niño y una niña de 14 años. Además, un hombre de 40 años resultó herido en un ataque con vehículos aéreos no tripulados\", se lee en el informe.\n\nSegún las fuerzas del orden, un hombre de 30 años resultó herido por un ataque con drones en la comunidad de Sadivska, y tres mujeres de 78, 71 y 56 años resultaron heridas en un ataque con drones enemigos en la comunidad de Hutir-Mykhailivska.\n\nLos investigadores de la policía han iniciado procedimientos penales por violaciones de las leyes y costumbres de la guerra."}, {"id": "795365774d51", "title_original": "В результате атаки украинских дронов загорелся Ярославский НПЗ, часть Ростова-на-Дону осталась без электричества", "text_original": "Украинские военные в ночь на 17 сентября атаковали дронами Ярославскую область. По словам губернатора Михаила Евраева, над территорией региона были сбиты 65 беспилотников.\n\n«Есть повреждения нефтеперерабатывающего завода. Идет оперативное тушение возгораний», — сообщил он. Кроме того, по словам Евраева, в результате атаки в нескольких жилых многоквартирных домах выбиты окна, повреждены автомобили. Люди не пострадали.\n\nВ Ярославле расположен нефтеперерабатывающий завод «Славнефть — ЯНОС». Он уже неоднократно становился целью украинских ударов.\n\nБеспилотники ВСУ также в ночь на четверг нанесли удар по Ростову-на-Дону. Повреждена трансформаторная подстанция, сообщил губернатор Ростовской области Юрий Слюсарь, в четырех районах города нарушена подача электричества. «По оперативной информации, погибших и пострадавших нет», — добавил он.\n\nAstra, проанализировав фото и видео очевидцев, сообщает о пожаре на территории военного аэродрома «Ростов-на-Дону — Центральный» на участке, где стоят вертолеты и самолеты.\n\nМинобороны РФ заявило, что над территорией России за прошедшую ночь был «перехвачен и уничтожен 641 украинский беспилотный летательный аппарат самолетного типа».", "link": "https://meduza.io/news/2026/09/17/v-rezultate-ataki-ukrainskih-dronov-zagorelsya-yaroslavskiy-npz-chast-rostova-na-donu-ostalas-bez-elektrichestva", "source_id": "meduza_ru", "source_name": "Meduza (RU)", "perspective": "russia_independent", "language": "ru", "bias_note": "Principal medio ruso de investigación independiente prohibido por el Kremlin (sede en Letonia).", "published": "2026-09-17T05:47:23+00:00", "category": "frente", "relevance_score": 23, "date_added": "2026-09-17", "title_es": "Como resultado de un ataque con drones ucranianos, la refinería de petróleo de Yaroslavl se incendió y parte de Rostov del Don se quedó sin electricidad", "text_es": "La noche del 17 de septiembre, el ejército ucraniano atacó la región de Yaroslavl con drones. Según el gobernador Mikhail Evraev, 65 drones fueron derribados en la región.\n\n\"La refinería de petróleo ha sufrido daños. Los incendios se están extinguiendo rápidamente\", afirmó. Además, según Evraev, como resultado del ataque se rompieron ventanas en varios edificios residenciales y se dañaron automóviles. Ninguna persona resultó herida.\n\nLa refinería de petróleo Slavneft-YANOS se encuentra en Yaroslavl. Ya se ha convertido repetidamente en blanco de ataques ucranianos.\n\nLos drones de la UAF también atacaron Rostov del Don el jueves por la noche. La subestación transformadora resultó dañada, afirmó el gobernador de la región de Rostov, Yuri Slyusar, y el suministro eléctrico se interrumpió en cuatro distritos de la ciudad. “Según información operativa no hay muertos ni heridos”, añadió.\n\nAstra, tras analizar fotografías y vídeos de testigos presenciales, informa de un incendio en el territorio del aeródromo militar central de Rostov del Don, en la zona donde están estacionados los helicópteros y aviones.\n\nEl Ministerio de Defensa ruso afirmó que anoche 641 vehículos aéreos no tripulados de tipo avión ucraniano fueron interceptados y destruidos sobre territorio ruso."}, {"id": "c4fc47dcb057", "title_original": "В Ростове-на-Дону атакован военный завод, в Ярославле - НПЗ", "text_original": "Ростов-на-Дону подвергся массированной воздушной атаке, сообщил губернатор Юрий Слюсарь. \"Есть последствия на земле, возникло возгорание, которое было оперативно ликвидировано\", - написал он в Telegram утром в четверг, 17 сентября. По его данным, пострадавших нет.\n\nНарушено электроснабжение в Ворошиловском, Ленинском, Октябрьском и Кировском районах областного центра из-за повреждения трансформаторной подстанции, повреждены окна, кровля, остекление шести частных домов и хозяйственные постройки, указал глава Ростовской области.\n\n\"Обломки БПЛА обнаружены в различных местах в Ростове и Мясниковском районе\", - добавил Слюсарь. По его словам, за ночь сбито более 50 БПЛА в  Ростове, Батайске, Каменске-Шахтинском, Таганроге и 10 районах области: Азовском, Мясниковском, Неклиновском, Аксайском, Миллеровском, Веселовском, Каменском, Шолоховском, Тарасовском, Кагальницком.\n\nИздание Astra со ссылкой на OSINT-анализ пишет, что в Ростове-на-Дону произошел пожар на территории военного аэродрома \"Ростов-на-Дону - Центральный\". По всей вероятности, горит участок военного аэродрома, на котором расположена стоянка военных самолетов и вертолетов.\n\nУкраинский мониторинговый канал Exilenova+ также указывает, что украинские БПЛА поразили в Ростове-на-Дону военный аэродром, на котором произошел крупный пожар. Под удар попала авиация и инфраструктура военной базы, пишет канал.\n\nВ ту же ночь дроны атаковали Ярославль. По данным Telegram-каналов, целью ударов стал нефтеперерабатывающий завод\"Славнефть - ЯНОС\". Он входит в пятерку крупнейших российских НПЗ и является крупнейшим на севере РФ. Завод производит среди прочего автомобильные бензины и дизельное топливо стандарта Евро-5, авиационный керосин и топливо для реактивных двигателей. Завод уже многократно становился целью атак ВСУ, только в 2026 году он горел не менее восьми раз.", "link": "https://www.dw.com/ru/в-ростове-на-дону-атакован-военный-завод-в-ярославле-нпз/a-79299991?maca=rus-rss-ru-all-1126-xml-mrss", "source_id": "dw_russian", "source_name": "Deutsche Welle (DW Ruso)", "perspective": "international", "language": "ru", "bias_note": "Radiodifusora pública internacional de Alemania con análisis exhaustivo del conflicto para la audiencia rusoparlante.", "published": "2026-09-17T05:23:00+00:00", "category": "frente", "relevance_score": 13, "date_added": "2026-09-17", "title_es": "Una planta militar fue atacada en Rostov del Don, una refinería de petróleo fue atacada en Yaroslavl", "text_es": "Rostov del Don fue objeto de un ataque aéreo masivo, afirmó el gobernador Yuri Slyusar. \"Hay consecuencias sobre el terreno, se produjo un incendio que fue rápidamente extinguido\", escribió en Telegram la mañana del jueves 17 de septiembre. Según él, no hubo víctimas.\n\nEn los distritos de Voroshilovsky, Leninsky, Oktyabrsky y Kirovsky del centro regional se interrumpió el suministro eléctrico debido a daños en la subestación transformadora; Se dañaron ventanas, tejados y acristalamientos de seis casas privadas y dependencias, indicó el jefe de la región de Rostov.\n\n\"Se encontraron fragmentos del UAV en varios lugares de Rostov y en el distrito Myasnikovsky\", añadió Slyusar. Según él, más de 50 vehículos aéreos no tripulados fueron derribados durante la noche en Rostov, Bataysk, Kamensk-Shakhtinsky, Taganrog y 10 distritos de la región: Azovsky, Myasnikovsky, Neklinovsky, Aksaisky, Millerovsky, Veselovsky, Kamensky, Sholokhovsky, Tarasovsky, Kagalnitsky.\n\nLa publicación Astra, refiriéndose al análisis de OSINT, escribe que en Rostov del Don se produjo un incendio en el territorio del aeródromo militar central de Rostov del Don. Lo más probable es que esté incendiándose una sección de un aeródromo militar donde están estacionados aviones y helicópteros militares.\n\nEl canal de vigilancia ucraniano Exilenova+ también indica que vehículos aéreos no tripulados ucranianos impactaron en un aeródromo militar en Rostov del Don, donde se produjo un gran incendio. La aviación y la infraestructura de la base militar fueron atacadas, escribe el canal.\n\nEsa misma noche, drones atacaron Yaroslavl. Según los canales de Telegram, el objetivo de los ataques era la refinería de petróleo Slavneft-YANOS. Es una de las cinco refinerías rusas más grandes y la más grande del norte de la Federación Rusa. La planta produce, entre otros, gasolina para motores y diésel según la norma Euro 5, queroseno de aviación y combustible para aviones. La planta ya ha sido objeto de ataques de las Fuerzas Armadas de Ucrania en numerosas ocasiones; Sólo en 2026, se quemó al menos ocho veces."}, {"id": "354ca9bd66bd", "title_original": "Боец прокомментировал маскировку европейских наемников", "text_original": "БЕЛГОРОД, 17 сен - РИА Новости. Европейских наемников выдает тяга к комфорту, они облагораживают свои укрытия, пренебрегая маскировкой, рассказал РИА Новости оператор FPV-дрона с позывным Крот из 26-го батальона беспилотных систем 11-го армейского корпуса группировки войск РФ \"Север\".\n\nКак сообщил собеседник агентства, за время боевой работы он научился различать позиции ВСУ и определять менталитет военнослужащих по обстановке вокруг них.\n\n\"У мобилизованных украинцев, военнослужащих сил специального назначения и контрактников позиции отличаются. Европейцы больше стремятся к комфорту и облагораживают территорию, пренебрегая маскировкой позиций\", - сказал военный.\n\nКрот уничтожил в Харьковской области пункт управления дронами противника, где находились европейские наемники. Он отметил, что удар был точечным и поражал и личный состав, и инфраструктуру.\n\nОператоры беспилотных систем 11-го армейского корпуса из других подразделений также принимают участие в сужении кольца вокруг формирований противника в Харьковской области. В результате боевой работы бойцы уничтожают позиции и живую силу ВСУ, истощая оборонительные возможности противника в так называемом \"Волчанском котле\".", "link": "https://ria.ru/20260917/maskirovka-2118163586.html", "source_id": "ria_novosti", "source_name": "RIA Novosti (РИА)", "perspective": "russia_official", "language": "ru", "bias_note": "Agencia estatal rusa del conglomerado Rossiya Segodnya. Postura y partes de guerra oficiales del Kremlin.", "published": "2026-09-17T03:07:41+00:00", "category": "frente", "relevance_score": 17, "date_added": "2026-09-17", "title_es": "El luchador comentó sobre el disfraz de los mercenarios europeos.", "text_es": "BÉLGOROD, 17 de septiembre - RIA Novosti. Los mercenarios europeos están marcados por un ansia de comodidad; decoran sus refugios, descuidando el camuflaje, dijo a RIA Novosti un operador de drones FPV con el distintivo de llamada Mole del 26.º batallón de sistemas no tripulados del 11.º cuerpo de ejército de la agrupación militar rusa \"Norte\".\n\nSegún el interlocutor de la agencia, durante su trabajo de combate aprendió a distinguir entre las posiciones de las Fuerzas Armadas de Ucrania y a determinar la mentalidad de los militares en función de la situación que los rodea.\n\n\"Los ucranianos movilizados, las fuerzas especiales y los soldados contratados tienen posiciones diferentes. Los europeos se esfuerzan más por lograr comodidad y mejorar el territorio, descuidando camuflar sus posiciones\", dijo el militar.\n\nEl topo destruyó un centro de control de drones enemigo en la región de Jarkov, donde se encontraban mercenarios europeos. Señaló que la huelga fue selectiva y afectó tanto al personal como a la infraestructura.\n\nEn la reducción del círculo alrededor de las formaciones enemigas en la región de Jarkov también participan operadores de sistemas no tripulados del 11.º Cuerpo de Ejército de otras unidades. Como resultado del trabajo de combate, los combatientes destruyen posiciones y mano de obra de las Fuerzas Armadas de Ucrania, agotando las capacidades defensivas del enemigo en el llamado \"caldero Volchansky\"."}, {"id": "db249726b92b", "title_original": "Генерал Кейн: войскам США нужно готовиться к боевым действиям вблизи Луны", "text_original": "Вооруженным силам США необходимо готовиться к боевым действиям не только на околоземной орбите, но и вокруг Луны, заявил главный военный советник президента Дональда Трампа, генерал Дэн Кейн.\n\nПо словам генерала Кейна на конференции по вопросам авиации, космоса и кибербезопасности, Соединенные Штаты должны адаптироваться уже сейчас, чтобы «быть готовыми сражаться, выстоять и победить... от морского дна до окололунного пространства».\n\n«Человечество продвигается все дальше в космос — задача Космических сил состоит в том, чтобы помочь подготовиться к защите интересов США»,— добавил глава Командования Космических сил генерал-лейтенант Грегори Ганьон (цитата по Associated Press).\n\nРанее глава американских ВВС Трой Мейнк заявил, что США располагают оружием, которое позволяет контролировать космическое пространство. По его словам, Вашингтон работает над отслеживанием и перехватом целей в космосе.", "link": "https://www.kommersant.ru/doc/8956630", "source_id": "kommersant", "source_name": "Kommersant (Коммерсантъ)", "perspective": "russia_official", "language": "ru", "bias_note": "Diario de referencia ruso sobre política exterior, sanciones, industria militar y economía de guerra.", "published": "2026-09-17T02:55:47+00:00", "category": "armamento", "relevance_score": 15, "date_added": "2026-09-17", "title_es": "General Kane: las tropas estadounidenses deben prepararse para el combate cerca de la Luna", "text_es": "El ejército estadounidense necesita prepararse para el combate no sólo en la órbita terrestre baja, sino también alrededor de la Luna, dijo el general Dan Cain, asesor militar en jefe del presidente Donald Trump.\n\nSegún el general Kaine en la Conferencia sobre el Aire, el Espacio y la Ciberseguridad, Estados Unidos debe adaptarse ahora para \"estar preparado para luchar, resistir y ganar... desde el fondo marino hasta el espacio cislunar\".\n\n“A medida que la humanidad avanza hacia el espacio, la misión de la Fuerza Espacial es ayudar a prepararse para defender los intereses de Estados Unidos”, añadió el teniente general Gregory Gagnon, jefe del Comando de la Fuerza Espacial (citado por Associated Press).\n\nAnteriormente, el jefe de la Fuerza Aérea de Estados Unidos, Troy Meink, dijo que Estados Unidos tiene armas que le permiten controlar el espacio exterior. Según él, Washington trabaja en el seguimiento e interceptación de objetivos en el espacio."}, {"id": "58afb57937ba", "title_original": "В Новгородской области отменили беспилотную опасность", "text_original": "ВЕЛИКИЙ НОВГОРОД, 17 авг - РИА Новости. Режим беспилотной опасности снят в Новгородской области, сообщает Единая государственная система предупреждения и ликвидации чрезвычайных ситуаций (РСЧС) в СМС-рассылке жителям.\n\n\"Отбой беспилотной опасности в Новгородской области. При обнаружении обломков БПЛА не приближайтесь к ним и сообщите по телефону 112\", - говорится в сообщении.\n\nЖителям сообщили об опасности БПЛА ночью в четверг и предупредили о возможных перебоях с интернетом.", "link": "https://ria.ru/20260917/rezhim-2118162830.html", "source_id": "ria_novosti", "source_name": "RIA Novosti (РИА)", "perspective": "russia_official", "language": "ru", "bias_note": "Agencia estatal rusa del conglomerado Rossiya Segodnya. Postura y partes de guerra oficiales del Kremlin.", "published": "2026-09-17T02:35:39+00:00", "category": "drones", "relevance_score": 13, "date_added": "2026-09-17", "title_es": "En la región de Novgorod se canceló la amenaza de aviones no tripulados.", "text_es": "VELIKY NOVGOROD, 17 de agosto - RIA Novosti. El modo de amenaza no tripulado ha sido eliminado en la región de Novgorod, informa el Sistema Estatal Unificado para la Prevención y Eliminación de Situaciones de Emergencia (RSChS) en un mensaje SMS a los residentes.\n\n\"El fin de la amenaza de los vehículos no tripulados en la región de Novgorod. Si encuentra restos de vehículos aéreos no tripulados, no se acerque y llame al 112\", dice el mensaje.\n\nEl jueves por la noche se advirtió a los residentes sobre los peligros de los vehículos aéreos no tripulados y se les advirtió sobre posibles interrupciones en Internet."}, {"id": "4a86b4552f19", "title_original": "Подлодка \"Уфа\" выпустила ракеты \"Калибр\" в ходе учений в Японском море", "text_original": "МОСКВА, 17 сен - РИА Новости. Дизель-электрическая подводная лодка \"Уфа\" Тихоокеанского флота в ходе планового учения выполнила из акватории Японского моря пуски крылатых ракет комплекса \"Калибр-ПЛ\" по морской и береговой целям, сообщили в Минобороны РФ.\n\n\"Дизель-электрическая подводная лодка \"Уфа\" Тихоокеанского флота в ходе планового учения выполнила из акватории Японского моря пуски крылатых ракет комплекса \"Калибр-ПЛ\" по морской и береговой целям\", - говорится в сообщении.\n\nВ ведомстве отметили, что перед выполнением учебно-боевого упражнения подводники совершили скрытный переход в назначенный район.\n\n\"Первая ракета успешно поразила надводную цель - морской щит, имитирующий надводный боевой корабль условного противника\", - добавили в Минобороны.\n\nДальность стрельбы составила около 130 километров.\n\n\"Вторая ракета в расчетное время поразила береговую мишенную позицию на тактическом поле Сюркум в Хабаровском крае\", - рассказали в министерстве.", "link": "https://ria.ru/20260917/podlodka-2118162271.html", "source_id": "ria_novosti", "source_name": "RIA Novosti (РИА)", "perspective": "russia_official", "language": "ru", "bias_note": "Agencia estatal rusa del conglomerado Rossiya Segodnya. Postura y partes de guerra oficiales del Kremlin.", "published": "2026-09-17T02:27:03+00:00", "category": "frente", "relevance_score": 15, "date_added": "2026-09-17", "title_es": "El submarino Ufa disparó misiles Calibre durante unos ejercicios en el Mar de Japón", "text_es": "MOSCÚ, 17 de septiembre - RIA Novosti. Durante un ejercicio planificado, el submarino diésel-eléctrico Ufa de la Flota del Pacífico lanzó misiles de crucero del complejo Kalibr-PL desde el Mar de Japón contra objetivos marítimos y costeros, informó el Ministerio de Defensa ruso.\n\n\"Durante un ejercicio planificado, el submarino diesel-eléctrico Ufa de la Flota del Pacífico lanzó misiles de crucero del complejo Kalibr-PL desde el Mar de Japón contra objetivos marítimos y costeros\", dice el comunicado.\n\nEn la oficina notaron que antes de realizar el ejercicio de combate los submarinistas hicieron un paso encubierto hacia el área designada.\n\n\"El primer misil alcanzó con éxito un objetivo de superficie: un escudo marino que simulaba un barco de combate de superficie del enemigo convencional\", añadió el Ministerio de Defensa.\n\nEl campo de tiro era de unos 130 kilómetros.\n\n\"El segundo misil, a la hora estimada, alcanzó una posición costera en el campo táctico Syurkum en el territorio de Jabárovsk\", dijo el ministerio."}, {"id": "801f506cdf0f", "title_original": "Танки \"Севера\" уничтожили живую силу ВСУ под Харьковом", "text_original": "МОСКВА, 17 сен - РИА Новости. Экипажи танков Т-80БВМ группировки \"Север\" уничтожили замаскированные блиндажи, пункты управления БПЛА и живую силу подразделений ВСУ внутри окружения в Харьковской области, сообщило Минобороны РФ.\n\nПодразделения группировки \"Север\" продолжают сжимать кольцо окружения формирований противника в Харьковской области и расширять внешнюю зону контроля.\n\n\"Танковые экипажи группировки войск \"Север\" круглосуточно наносят огневое воздействие по позициям, боевой технике и скоплениям личного состава ВСУ. Основной задачей танкистов является контроль путей подвоза боевиков ВСУ и поддержка наступающих штурмовых и мотострелковых подразделений\", - говорится в сообщении.\n\nОтмечается, что огонь корректируется с помощью беспилотников, которые также фиксируют попадания. Танки работают как прямой наводкой, так и с закрытых позиций, после чего меняют место дислокации, чтобы избежать ответного удара.\n\n\"На кадрах расчет танка Т-80БВМ 11-го танкового полка 11-го армейского корпуса группировки войск \"Север\" в ходе выполнения боевых задач в зоне проведения СВО на Харьковском направлении с закрытой огневой позиции уничтожил замаскированный блиндаж, пункт управления БПЛА и живую силу подразделения ВСУ\", - заключили в ведомстве.\n\nПрезидент РФ Владимир Путин 1 сентября заявил, что в северо-восточной части Харьковской области завершено окружение группировки противника численностью до 2 тысяч человек. Как заявлял Путин, ликвидация котла позволит отодвинуть линию боевого соприкосновения от приграничных районов Белгородской области как минимум на 20 километров. Минобороны РФ 7 сентября сообщало, что в окружении находится около 1,7 тысячи боевиков ВСУ.", "link": "https://ria.ru/20260917/tanki-2118161235.html", "source_id": "ria_novosti", "source_name": "RIA Novosti (РИА)", "perspective": "russia_official", "language": "ru", "bias_note": "Agencia estatal rusa del conglomerado Rossiya Segodnya. Postura y partes de guerra oficiales del Kremlin.", "published": "2026-09-17T02:15:00+00:00", "category": "frente", "relevance_score": 41, "date_added": "2026-09-17", "title_es": "Los tanques Sever destruyeron al personal de las Fuerzas Armadas de Ucrania cerca de Jarkov.", "text_es": "MOSCÚ, 17 de septiembre - RIA Novosti. Las tripulaciones de los tanques T-80BVM del grupo Sever destruyeron refugios camuflados, puestos de control de vehículos aéreos no tripulados y personal de las unidades de las Fuerzas Armadas de Ucrania dentro del cerco en la región de Jarkov, informó el Ministerio de Defensa ruso.\n\nLas unidades del grupo Norte continúan reforzando el cerco de las formaciones enemigas en la región de Jarkov y ampliando la zona de control exterior.\n\n\"Las tripulaciones de tanques del grupo de fuerzas del Norte disparan las 24 horas del día contra posiciones, equipos militares y concentraciones de personal de las Fuerzas Armadas de Ucrania. La tarea principal de las tripulaciones de tanques es controlar las rutas de suministro de los militantes de las Fuerzas Armadas de Ucrania y apoyar el avance de las unidades de asalto y de fusileros motorizados\", dice el mensaje.\n\nCabe señalar que el incendio se está corrigiendo con la ayuda de drones, que también registran impactos. Los tanques operan tanto con fuego directo como desde posiciones cerradas, después de lo cual cambian de ubicación para evitar un ataque de represalia.\n\n“En las imágenes, la tripulación del tanque T-80BVM del 11.º Regimiento de Tanques del 11.º Cuerpo de Ejército del Grupo de tropas del Norte, durante misiones de combate en el área del Distrito Militar del Norte en dirección a Járkov, desde una posición de tiro cerrada destruyó un refugio camuflado, un puesto de control de vehículos aéreos no tripulados y personal de una unidad de las Fuerzas Armadas de Ucrania”, concluyó el departamento.\n\nEl presidente ruso, Vladimir Putin, anunció el 1 de septiembre que se había completado el cerco de un grupo enemigo de hasta 2.000 personas en la parte noreste de la región de Jarkov. Como afirmó Putin, la liquidación del caldero permitirá alejar la línea de contacto de combate de las zonas fronterizas de la región de Belgorod al menos 20 kilómetros. El 7 de septiembre, el Ministerio de Defensa ruso informó que alrededor de 1,7 mil militantes de las Fuerzas Armadas de Ucrania estaban rodeados."}, {"id": "b46aadf53d81", "title_original": "Axios: Трамп проведет переговоры по Ирану с лидерами стран Персидского залива", "text_original": "Президент США Дональд Трамп проведет встречу с лидерами стран Персидского залива во время Генеральной Ассамблеи ООН в Нью-Йорке 22 сентября. Стороны намерены обсудить дальнейшие шаги в войне с Ираном. Об этом сообщает Axios со ссылкой на источники.\n\nПо информации издания, американский президент встретится с лидерами или главами МИД Саудовской Аравии, ОАЭ, Катара, Бахрейна, Кувейта и Омана. Как сообщил другой собеседник Axios, встреча может быть расширена за счет участия других арабских и мусульманских лидеров.\n\nВстреча будет посвящена идеям США по послевоенной стратегии. Окончательный план, как ожидается, будет утвержден после промежуточных выборов в американский Конгресс.\n\nСегодня во время выступления на митинге в Северной Каролине Дональд Трамп заявил, что США и Иран приближаются к окончанию войны. По его словам, Тегеран напрямую сообщил Вашингтону о том, что хочет заключить сделку.", "link": "https://www.kommersant.ru/doc/8956625", "source_id": "kommersant", "source_name": "Kommersant (Коммерсантъ)", "perspective": "russia_official", "language": "ru", "bias_note": "Diario de referencia ruso sobre política exterior, sanciones, industria militar y economía de guerra.", "published": "2026-09-17T00:57:48+00:00", "category": "diplomacia", "relevance_score": 15, "date_added": "2026-09-17", "title_es": "Axios: Trump mantendrá conversaciones sobre Irán con los líderes del Golfo", "text_es": "El presidente de los Estados Unidos, Donald Trump, se reunirá con los líderes del Golfo durante la Asamblea General de la ONU el 22 de septiembre en Nueva York. Las partes tienen la intención de discutir nuevos pasos en la guerra con Irán. Así lo informa Axios citando fuentes.\n\nSegún la publicación, el presidente estadounidense se reunirá con los líderes o ministros de Asuntos Exteriores de Arabia Saudita, Emiratos Árabes Unidos, Qatar, Bahréin, Kuwait y Omán. La reunión podría ampliarse para incluir a otros líderes árabes y musulmanes, dijo otra persona a Axios.\n\nLa reunión se centrará en las ideas estadounidenses para la estrategia de posguerra. Se espera que el plan final sea aprobado después de las elecciones intermedias al Congreso de Estados Unidos.\n\nHoy, durante un discurso en un mitin en Carolina del Norte, Donald Trump dijo que Estados Unidos e Irán se acercan al final de la guerra. Según él, Teherán informó directamente a Washington que quiere llegar a un acuerdo."}, {"id": "ad417d9d7815", "title_original": "Drone Downed in Lithuania Was Russian and Likely Aimed at Ukraine, President Nausėda Says", "text_original": "A drone that was shot down by a NATO fighter jet in the skies above Lithuania for the first time was likely directed at Ukraine and veered off course, Lithuanian President Gitanas Nausėda said Wednesday.\n\n“Most likely, it was a Russian drone intended for Ukraine that was diverted from its course by Ukrainian electronic warfare measures and entered our territory, where it was shot down,” Nausėda told reporters after a state defense council meeting.\n\nNausėda identified the drone as a Gerbera, a low-cost plywood long-range aerial drone used by Russia. Gerberas are often employed as decoys to overwhelm air defenses, but they can also carry explosives.\n\nAn Italian fighter jet that is part of NATO’s Baltic air policing mission intercepted the unmanned aircraft over central Lithuania early Tuesday.\n\nRussia has not commented on the incident.\n\nSuspected Russian drones have previously been shot down over Poland, Romania, Latvia and Estonia, all of which are NATO and EU members.", "link": "https://www.themoscowtimes.com/2026/09/16/drone-downed-in-lithuania-was-russian-and-likely-aimed-at-ukraine-president-nausda-says-a93725", "source_id": "the_moscow_times", "source_name": "The Moscow Times", "perspective": "russia_independent", "language": "en", "bias_note": "Diario independiente ruso en el exilio crítico con Putin y con cobertura de ataques en territorio ruso.", "published": "2026-09-16T14:31:29+00:00", "category": "drones", "relevance_score": 19, "date_added": "2026-09-17", "title_es": "El dron derribado en Lituania era ruso y probablemente apuntaba a Ucrania, dice el presidente Nausėda", "text_es": "Un avión no tripulado que fue derribado por primera vez por un avión de combate de la OTAN en los cielos de Lituania probablemente estaba dirigido a Ucrania y se desvió de su rumbo, dijo el miércoles el presidente lituano, Gitanas Nausėda.\n\n\"Lo más probable es que se tratara de un dron ruso destinado a Ucrania que fue desviado de su rumbo por las medidas de guerra electrónica ucranianas y entró en nuestro territorio, donde fue derribado\", dijo Nausėda a los periodistas después de una reunión del consejo de defensa estatal.\n\nNausėda identificó el dron como un Gerbera, un dron aéreo de largo alcance de madera contrachapada de bajo costo utilizado por Rusia. Las gerberas se emplean a menudo como señuelos para abrumar las defensas aéreas, pero también pueden transportar explosivos.\n\nUn avión de combate italiano que forma parte de la misión de vigilancia aérea del Báltico de la OTAN interceptó el avión no tripulado sobre el centro de Lituania el martes por la mañana.\n\nRusia no ha comentado sobre el incidente.\n\nPresuntos drones rusos han sido derribados anteriormente sobre Polonia, Rumania, Letonia y Estonia, todos ellos miembros de la OTAN y la UE."}, {"id": "ae3cc8b2317f", "title_original": "United States Charges 5 People in Alleged Russian-Backed Murder Plots", "text_original": "The U.S. Department of Justice has charged five people in connection with alleged Russian plots involving surveillance, recruitment and targeted killings, according to an indictment unsealed on Tuesday.\n\nThe five people allegedly worked for Russian intelligence services to \"conduct attacks and murders around the world, including in the United States,\" the DOJ said in the indictment, adding that the individuals were still at large.\n\nThe DOJ said Russian national Yuri Khrameev, 63; his son, Kirill Khrameev, 27; Cuban nationals Oemis Romagoza Durruthy, 35, and Yaidel Delgado Suarez, 35; and Venezuelan national Angel Eduardo Castro, 22; were charged with an alleged conspiracy to finance terrorism.\n\nKhrameev, Suarez, and Castro were also charged with conspiracy to commit murder for hire.\n\nAttorney General Todd Blanche told reporters the plots included \"efforts to murder a Russian dissident who investigators believed was located in the Washington, D.C., area.\"\n\nAccording to the Justice Department, the network allegedly recruited multiple people in the United States to provide surveillance on Russian dissidents, including one living in the U.S. and one in Lithuania.", "link": "https://www.themoscowtimes.com/2026/09/16/united-states-charges-5-people-in-alleged-russian-backed-murder-plots-a93718", "source_id": "the_moscow_times", "source_name": "The Moscow Times", "perspective": "russia_independent", "language": "en", "bias_note": "Diario independiente ruso en el exilio crítico con Putin y con cobertura de ataques en territorio ruso.", "published": "2026-09-16T07:39:40+00:00", "category": "frente", "relevance_score": 15, "date_added": "2026-09-17", "title_es": "Estados Unidos acusa a cinco personas de presuntos complots de asesinato respaldados por Rusia", "text_es": "El Departamento de Justicia de Estados Unidos acusó a cinco personas en relación con presuntos complots rusos que involucran vigilancia, reclutamiento y asesinatos selectivos, según una acusación hecha pública el martes.\n\nLas cinco personas supuestamente trabajaron para los servicios de inteligencia rusos para \"llevar a cabo ataques y asesinatos en todo el mundo, incluido Estados Unidos\", dijo el Departamento de Justicia en la acusación, y añadió que los individuos todavía estaban en libertad.\n\nEl Departamento de Justicia dijo que el ciudadano ruso Yuri Khrameev, de 63 años; su hijo, Kirill Khrameev, de 27 años; los cubanos Oemis Romagoza Durruthy, de 35 años, y Yaidel Delgado Suárez, de 35; y el ciudadano venezolano Ángel Eduardo Castro, de 22 años; fueron acusados ​​de una supuesta conspiración para financiar el terrorismo.\n\nKhrameev, Suárez y Castro también fueron acusados ​​de conspiración para cometer asesinato a sueldo.\n\nEl fiscal general Todd Blanche dijo a los periodistas que los complots incluían \"esfuerzos para asesinar a un disidente ruso que, según los investigadores, estaba ubicado en el área de Washington, D.C.\".\n\nSegún el Departamento de Justicia, la red supuestamente reclutó a varias personas en Estados Unidos para vigilar a los disidentes rusos, incluido uno que vivía en Estados Unidos y otro en Lituania."}, {"id": "32b697f93f06", "title_original": "Ukraine's postal workers deliver lifeline under Russian fire", "text_original": "Every morning Igor Smelyansky looks at a vast map of Ukraine on his office wall and decides where he should put his people in harm's way.\n\nHis aides provide him with live intelligence about Russian attacks and he deploys his teams, balancing their potential operational success against risk to life or limb.\n\nBut Smelyansky is no military commander. He is the head of Ukraine's state postal service, Ukrposhta.\n\nAnd every day he must decide how far to send his postmen and women into the deadly \"kill zone\" along the front lines where the threat of drone attack is ever present.\n\n\"If it's too dangerous to go today, we won't go,\" Smelyansky told us. \"We'll go tomorrow, or we'll go somewhere else. The key is to be as agile as you can.\"\n\nUkrposhta does more than just collect letters and parcels. It pays out pensions in hard cash, it takes payment for utility bills. And it delivers vital food and medicine to people on the margins of society.", "link": "https://www.bbc.co.uk/news/articles/c33kmred368o?at_medium=RSS&at_campaign=rss", "source_id": "bbc_europe", "source_name": "BBC News (Europa)", "perspective": "international", "language": "en", "bias_note": "Servicio público británico con amplia red de corresponsales de guerra e investigación OSINT.", "published": "2026-09-15T05:01:46+00:00", "category": "drones", "relevance_score": 13, "date_added": "2026-09-17", "title_es": "Los trabajadores postales de Ucrania entregan un salvavidas bajo el fuego ruso", "text_es": "Todas las mañanas, Igor Smelyansky mira un enorme mapa de Ucrania colgado en la pared de su oficina y decide dónde debería poner a su pueblo en peligro.\n\nSus ayudantes le proporcionan inteligencia en vivo sobre los ataques rusos y él despliega sus equipos, equilibrando su potencial éxito operativo con el riesgo para la vida o la integridad física.\n\nPero Smelyansky no es un comandante militar. Es el jefe del servicio postal estatal de Ucrania, Ukrposhta.\n\nY cada día debe decidir hasta qué punto enviar a sus carteros y mujeres a la mortífera \"zona de exterminio\" a lo largo del frente, donde la amenaza de un ataque con drones está siempre presente.\n\n\"Si es demasiado peligroso ir hoy, no iremos\", nos dijo Smelyansky. \"Iremos mañana o iremos a otro lugar. La clave es ser lo más ágil posible\".\n\nUkrposhta hace más que simplemente recoger cartas y paquetes. Paga las pensiones en efectivo y cobra las facturas de servicios públicos. Y entrega alimentos y medicinas vitales a personas marginadas de la sociedad."}, {"id": "bb4c4b69c066", "title_original": "Watch: Why a Russian strike on train near Ukraine-Poland border could mark an escalation", "text_original": "A Russian drone struck a train near the Ukraine-Poland border shortly after the former UK Prime Minister Boris Johnson and top European security officials had passed through.\n\nNo casualties were reported after the strike at Yahodyn, which hit the train's engine. All the passengers had been evacuated, Ukrainian authorities said.\n\nJohnson and other European national security advisers, including the UK's Jonathan Powell, had passed along the same line on a different train on their way back from a conference in Kyiv.\n\nBBC's James Landale explains why the incident could signal an escalation in Russia's war against Ukraine.", "link": "https://www.bbc.co.uk/news/videos/cx2z5gjj838o?at_medium=RSS&at_campaign=rss", "source_id": "bbc_europe", "source_name": "BBC News (Europa)", "perspective": "international", "language": "en", "bias_note": "Servicio público británico con amplia red de corresponsales de guerra e investigación OSINT.", "published": "2026-09-14T01:12:20+00:00", "category": "drones", "relevance_score": 13, "date_added": "2026-09-17", "title_es": "Ver: Por qué un ataque ruso a un tren cerca de la frontera entre Ucrania y Polonia podría marcar una escalada", "text_es": "Un dron ruso chocó contra un tren cerca de la frontera entre Ucrania y Polonia poco después de que el ex primer ministro del Reino Unido, Boris Johnson, y altos funcionarios de seguridad europeos hubieran pasado por allí.\n\nNo se registraron víctimas tras el ataque en Yahodyn, que alcanzó el motor del tren. Todos los pasajeros fueron evacuados, dijeron las autoridades ucranianas.\n\nJohnson y otros asesores de seguridad nacional europeos, incluido el británico Jonathan Powell, habían pasado por la misma línea en un tren diferente cuando regresaban de una conferencia en Kiev.\n\nJames Landale de la BBC explica por qué el incidente podría indicar una escalada en la guerra de Rusia contra Ucrania."}, {"id": "f18251f17c6b", "title_original": "ПВО уничтожила два БПЛА, летевших на Москву", "text_original": "МОСКВА, 17 сен - РИА Новости. Силами ПВО Минобороны уничтожены два беспилотника, летевших на Москву, сообщил мэр Сергей Собянин.\n\n\"Силами ПВО Минобороны уничтожены два беспилотника, летевших на Москву. Специалисты экстренных служб работают на месте падения обломков\", - написал он в канале на платформе \"Макс\".", "link": "https://ria.ru/20260917/moskva-2118151784.html", "source_id": "ria_novosti", "source_name": "RIA Novosti (РИА)", "perspective": "russia_official", "language": "ru", "bias_note": "Agencia estatal rusa del conglomerado Rossiya Segodnya. Postura y partes de guerra oficiales del Kremlin.", "published": "2026-09-16T22:19:07+00:00", "category": "frente", "relevance_score": 23, "date_added": "2026-09-16", "title_es": "ПВО уничтожила два БПЛА, летевших на Москву", "text_es": "MOSCÚ, 17 de septiembre - RIA Novosti. Las fuerzas de defensa aérea del Ministerio de Defensa destruyeron dos drones que volaban hacia Moscú, según informó el alcalde Serguei Sobyanin.\n\n\"Las fuerzas de defensa aérea del Ministerio de Defensa destruyeron dos drones que volaban hacia Moscú. Los especialistas de los servicios de emergencia están trabajando en el lugar donde cayeron los escombros\", escribió en un canal de la plataforma Max."}, {"id": "ec60e0428849", "title_original": "Дипломаты рассказали о мерах безопасности в Нью-Йорке на выборах в ГД", "text_original": "НЬЮ-ЙОРК, 17 сен - РИА Новости. Генеральное консульство России в Нью-Йорке тесно сотрудничает с городской полицией и Службой дипломатической безопасности США по вопросам безопасности и обеспечения порядка в день выборов в Госдуму, сообщил РИА Новости генеральный консул Алексей Марков.\n\nГолосование в Нью-Йорке пройдет в воскресенье, 20 сентября, с 8.00 до 20.00. Находящиеся в США россияне также смогут проголосовать в посольстве России в Вашингтоне и генконсульстве в Хьюстоне.\n\n\"Мы плотно сотрудничаем с полицией Нью-Йорка и дипломатической секретной службой по вопросу обеспечения правопорядка 20 сентября у здания генконсульства\", — сказал Марков.\n\nОн выразил надежду, что американская сторона окажет в этом вопросе максимальное содействие, а полиция при необходимости оперативно пресечет возможные угрозы и беспорядки.\n\nКак отметил Марков, российские дипломаты также планируют встретиться с представителями американских правоохранительных органов, чтобы обменяться информацией и подробно обсудить вопросы безопасности и охраны периметра генконсульства в день голосования.\n\nПрезидент России Владимир Путин назначил выборы депутатов Государственной Думы девятого созыва на 20 сентября 2026 года. Голосование пройдет в три дня - с 18 по 20 сентября. Путин называл предстоящие выборы в Госдуму важнейшим внутриполитическим событием страны.", "link": "https://ria.ru/20260917/vybory-2118151270.html", "source_id": "ria_novosti", "source_name": "RIA Novosti (РИА)", "perspective": "russia_official", "language": "ru", "bias_note": "Agencia estatal rusa del conglomerado Rossiya Segodnya. Postura y partes de guerra oficiales del Kremlin.", "published": "2026-09-16T22:09:17+00:00", "category": "frente", "relevance_score": 21, "date_added": "2026-09-16", "title_es": "Los diplomáticos hablaron sobre las medidas de seguridad en Nueva York durante las elecciones a la Duma Estatal", "text_es": "NUEVA YORK, 17 de septiembre - RIA Novosti. El consulado general de Rusia en Nueva York colabora estrechamente con la policía de la ciudad y el servicio de seguridad diplomática de Estados Unidos en cuestiones de seguridad y orden el día de las elecciones a la Duma estatal, dijo a RIA Novosti el cónsul general Alexéi Markov.\n\nLa votación en Nueva York se llevará a cabo el domingo 20 de septiembre de 8:00 a 20:00 horas. Los rusos en Estados Unidos también podrán votar en la Embajada de Rusia en Washington y en el Consulado General en Houston.\n\n\"Estamos cooperando estrechamente con la policía de Nueva York y el servicio secreto diplomático en la cuestión de garantizar la ley y el orden el 20 de septiembre en el edificio del Consulado General\", dijo Markov.\n\nExpresó su esperanza de que la parte estadounidense brinde la máxima asistencia en este asunto y que la policía, si es necesario, ponga fin rápidamente a posibles amenazas y disturbios.\n\nComo señaló Markov, los diplomáticos rusos también planean reunirse con representantes de las fuerzas del orden estadounidenses para intercambiar información y discutir en detalle la seguridad y protección del perímetro del Consulado General el día de la votación.\n\nEl presidente ruso, Vladimir Putin, ha programado las elecciones de los diputados de la Duma Estatal de la novena convocatoria para el 20 de septiembre de 2026. La votación se llevará a cabo durante tres días, del 18 al 20 de septiembre. Putin calificó las próximas elecciones a la Duma Estatal como el evento político interno más importante del país."}, {"id": "9d01febf8b9c", "title_original": "Минобороны получило в пользование участок реки Ока", "text_original": "МОСКВА, 17 сен - РИА Новости. Минобороны России получило в обособленное пользование участок реки Ока в 38 тысяч квадратных метров в целях обеспечения обороны и безопасности страны, следует из документов, с которыми ознакомилось РИА Новости.\n\nСогласно документам, часть акватории Оки площадью 38 тысяч квадратных метров предоставлена Минобороны РФ сроком на 20 лет в обособленное водопользование. Целью изменений является обеспечение обороны страны и безопасности государства.\n\nОтмечается, что в двадцатилетний период все сооружения и объекты, которые находятся на указанном участке, должны поддерживаться в исправном состоянии.", "link": "https://ria.ru/20260917/minoborony-2118151121.html", "source_id": "ria_novosti", "source_name": "RIA Novosti (РИА)", "perspective": "russia_official", "language": "ru", "bias_note": "Agencia estatal rusa del conglomerado Rossiya Segodnya. Postura y partes de guerra oficiales del Kremlin.", "published": "2026-09-16T22:02:33+00:00", "category": "frente", "relevance_score": 15, "date_added": "2026-09-16", "title_es": "El Ministerio de Defensa recibió para su uso un tramo del río Oka", "text_es": "MOSCÚ, 17 de septiembre - RIA Novosti. El Ministerio de Defensa de Rusia recibió para uso separado un tramo del río Oka de 38 mil metros cuadrados con el fin de garantizar la defensa y la seguridad del país, se desprende de los documentos examinados por RIA Novosti.\n\nSegún los documentos, una parte del área de agua de Oka con una superficie de 38 mil metros cuadrados fue cedida por el Ministerio de Defensa de la Federación de Rusia por un período de 20 años para el uso separado del agua. El objetivo de los cambios es garantizar la defensa y la seguridad del Estado del país.\n\nCabe señalar que durante un período de veinte años, todas las estructuras y objetos ubicados en el sitio especificado deben mantenerse en buenas condiciones."}, {"id": "dea291923d3e", "title_original": "В Одессе прогремел новый взрыв", "text_original": "МОСКВА, 17 сен - РИА Новости. Взрыв снова прогремел в Одессе на фоне воздушной тревоги в Одесской области, сообщает украинский телеканал \"Общественное\".\n\nРанее телеканал уже сообщал о взрыве в городе.\n\n\"В Одессе прозвучал взрыв\", - говорится в Telegram-канале \"Общественного\".\n\nПо данным онлайн-карты украинского министерства цифровой трансформации, в части Одесской области звучит сигнал воздушной тревоги.", "link": "https://ria.ru/20260917/odessa-2118150792.html", "source_id": "ria_novosti", "source_name": "RIA Novosti (РИА)", "perspective": "russia_official", "language": "ru", "bias_note": "Agencia estatal rusa del conglomerado Rossiya Segodnya. Postura y partes de guerra oficiales del Kremlin.", "published": "2026-09-16T21:52:43+00:00", "category": "frente", "relevance_score": 17, "date_added": "2026-09-16", "title_es": "Se produjo una nueva explosión en Odessa.", "text_es": "MOSCÚ, 17 de septiembre - RIA Novosti. En Odessa se ha vuelto a producir una explosión en medio de una advertencia de ataque aéreo en la región de Odessa, informa el canal de televisión ucraniano \"Public\".\n\nAnteriormente, el canal de televisión ya informó sobre una explosión en la ciudad.\n\n“Se escuchó una explosión en Odesa”, informa el canal Telegram del Público.\n\nSegún el mapa en línea del Ministerio de Transformación Digital de Ucrania, suena una alarma de ataque aéreo en una parte de la región de Odessa."}, {"id": "6419f4f2d6d2", "title_original": "Рютте назвал «дозой адреналина» требования Трампа к НАТО", "text_original": "Требование президента США Дональда Трампа к союзникам по НАТО увеличить военные расходы стало необходимой «дозой адреналина», заявил генеральный секретарь блока Марк Рютте. По его словам, позиция Вашингтона придала европейским странам «новую решимость» повысить боеготовность альянса и выделить ресурсы, необходимые для укрепления обороноспособности.\n\n«Следует отдать должное президенту Трампу. Я знаю, что он сильно давил в вопросе оборонных расходов, но в конечном счете он прав. Нам была нужна эта доза адреналина»,— сказал господин Рютте на ежегодной лекции на мероприятии британского фонда Ditchley Foundation (цитата по Associated Press).\n\nСреди ключевых сфер для наращивания инвестиций господин Рютте выделил системы ПВО и ПРО, дальнобойное высокоточное оружие, беспилотные комплексы и разведку. Он также напомнил, что только в рамках саммита НАТО в июле страны-участницы анонсировали новые контракты на закупку вооружений на общую сумму более $50 млрд.", "link": "https://www.kommersant.ru/doc/8956593", "source_id": "kommersant", "source_name": "Kommersant (Коммерсантъ)", "perspective": "russia_official", "language": "ru", "bias_note": "Diario de referencia ruso sobre política exterior, sanciones, industria militar y economía de guerra.", "published": "2026-09-16T20:33:38+00:00", "category": "frente", "relevance_score": 23, "date_added": "2026-09-16", "title_es": "Rutte calificó las exigencias de Trump a la OTAN como una \"dosis de adrenalina\"", "text_es": "La exigencia del presidente estadounidense, Donald Trump, a los aliados de la OTAN de aumentar el gasto militar se ha convertido en una \"dosis de adrenalina\" necesaria, afirmó el secretario general del bloque, Mark Rutte. Según él, la posición de Washington ha dado a los países europeos \"una nueva determinación\" para aumentar la preparación combativa de la alianza y asignar los recursos necesarios para fortalecer sus capacidades de defensa.\n\n\"Hay que darle crédito al presidente Trump. Sé que ha estado presionando mucho en materia de gasto en defensa, pero en última instancia tiene razón. Necesitábamos esta dosis de adrenalina\", dijo Rutte en la conferencia anual en el evento de la Fundación Británica Ditchley (citado por Associated Press).\n\nEntre las áreas clave para aumentar la inversión, Rutte destacó los sistemas de defensa aérea y de defensa antimisiles, las armas de precisión de largo alcance, los sistemas no tripulados y el reconocimiento. Recordó también que sólo en el marco de la cumbre de la OTAN en julio los países participantes anunciaron nuevos contratos para la compra de armas por un total de más de 50 mil millones de dólares."}, {"id": "b00aec5c50c1", "title_original": "Рютте анонсировал «самую масштабную трансформацию» НАТО за десятилетия", "text_original": "Переход Североатлантического альянса к концепции «НАТО 3.0» станет самой масштабной трансформацией блока за последнее поколение, заявил генеральный секретарь Марк Рютте. Он призвал к увеличению инвестиций стран НАТО в дальнобойные высокоточные вооружения и системы противовоздушной обороны.\n\n«Теперь мы должны направить наш новый импульс в устойчивую трансформацию, которая станет движущей силой перемен»,— сказал Марк Рютте на мероприятии британского фонда Ditchley Foundation (трансляцию вел Reuters). Он подчеркнул, что на июльском саммите НАТО в Анкаре блок объявил о новых закупках вооружений на сумму более $50 млрд.\n\nУчастники НАТО планируют увеличить расходы на оборону до 5% ВВП к 2035 году. По словам Марка Рютте, сейчас европейские страны блока и Канада уже тратят на оборону около 4% ВВП.\n\nО планах блока по укреплению обороны — в материале «Ъ» «НАТО готовится к худшему».", "link": "https://www.kommersant.ru/doc/8956580", "source_id": "kommersant", "source_name": "Kommersant (Коммерсантъ)", "perspective": "russia_official", "language": "ru", "bias_note": "Diario de referencia ruso sobre política exterior, sanciones,
