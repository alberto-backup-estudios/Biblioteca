  <script id="daily-data" type="application/json">[{"id": "ee332923b21b", "title_original": "НАТО провело учения для отработки захвата гражданских судов, заявил Путин", "text_original": "МОСКВА, 18 сен - РИА Новости. НАТО провело в Балтийском море учения, одной из целей которых была отработка захвата гражданских судов, заявил президент России Владимир Путин.\n\n\"Тем не менее мы обратили внимание и на то, что вот сейчас только что прошли учения очередные в Балтийском море. Цель в том числе - отработка захвата гражданских судов. Ну, это нормально?\" - сказал глава государства на заседании Военно-промышленной комиссии.", "link": "https://ria.ru/20260918/putin-2118642147.html", "source_id": "ria_novosti", "source_name": "RIA Novosti (РИА)", "perspective": "russia_official", "language": "ru", "bias_note": "Agencia estatal rusa del conglomerado Rossiya Segodnya. Postura y partes de guerra oficiales del Kremlin.", "published": "2026-09-18T18:45:36+00:00", "category": "frente", "relevance_score": 11, "date_added": "2026-09-18", "title_es": "La OTAN realizó ejercicios para practicar la incautación de buques civiles, dijo Putin.", "text_es": "MOSCÚ, 18 de septiembre - RIA Novosti. La OTAN realizó ejercicios en el Mar Báltico, uno de cuyos objetivos era practicar la incautación de buques civiles, dijo el presidente ruso Vladimir Putin.\n\n\"Sin embargo, también llamamos la atención sobre el hecho de que acaba de realizarse otro ejercicio en el Mar Báltico. El objetivo, entre otras cosas, es practicar la incautación de buques civiles. Bueno, ¿es esto normal?\" - afirmó el Jefe de Estado en una reunión de la Comisión Militar-Industrial."}, {"id": "fadb418278a9", "title_original": "Путин призвал Запад жить дружно", "text_original": "МОСКВА, 18 сен - РИА Новости. Президент России Владимир Путин призвал страны Запада жить дружно, отметив, что в противном случае Москве придется отвечать.\n\n\"Так и хочется им сказать: \"Давайте лучше жить дружно, иначе ведь нам тоже придется отвечать\". Это должно быть для всех очевидным общим местом, понятным. По-другому не будет\", - сказал российский лидер в ходе заседания военно-промышленной комиссии.\n\nПутин отметил, что Россия готова к восстановлению отношений с европейскими соседями и дальнейшему сотрудничеству.", "link": "https://ria.ru/20260918/putin--2118641708.html", "source_id": "ria_novosti", "source_name": "RIA Novosti (РИА)", "perspective": "russia_official", "language": "ru", "bias_note": "Agencia estatal rusa del conglomerado Rossiya Segodnya. Postura y partes de guerra oficiales del Kremlin.", "published": "2026-09-18T18:44:08+00:00", "category": "frente", "relevance_score": 11, "date_added": "2026-09-18", "title_es": "Putin llamó a Occidente a vivir juntos", "text_es": "MOSCÚ, 18 de septiembre - RIA Novosti. El presidente ruso, Vladimir Putin, llamó a los países occidentales a vivir juntos y señaló que, de lo contrario, Moscú tendrá que responder.\n\n“Sólo quiero decirles: “Será mejor que vivamos juntos, sino también tendremos que responder”. Este debería ser un lugar común obvio para todos, comprensible. No será de otra manera”, afirmó el líder ruso durante una reunión de la comisión militar-industrial.\n\nPutin señaló que Rusia está dispuesta a restablecer las relaciones con sus vecinos europeos y a ampliar la cooperación."}, {"id": "dd447d9290aa", "title_original": "\"Кучка казнокрадов\" узурпировала власть в Киеве, заявил Путин", "text_original": "МОСКВА, 18 сен - РИА Новости. Власть в Киеве узурпирована \"кучкой казнокрадов\", которым нужна война, чтобы оставаться у власти, заявил президент России Владимир Путин.\n\nОн отметил, что режим на Украине не может защищать демократию, потому что выродился в диктатуру.\n\n\"Выборы, как известно, на Украине не проводятся. Власть узурпирована \"кучкой казнокрадов\", коррупционеров, которым нужна война для того, чтобы оставаться у власти без выборов и создавать дальше условия для ограбления своего собственного народа, для того, чтобы набивать карманы деньгами спонсоров, в том числе - и из Европы\", - сказал глава государства на заседании Военно-промышленной комиссии.", "link": "https://ria.ru/20260918/putin-2118641161.html", "source_id": "ria_novosti", "source_name": "RIA Novosti (РИА)", "perspective": "russia_official", "language": "ru", "bias_note": "Agencia estatal rusa del conglomerado Rossiya Segodnya. Postura y partes de guerra oficiales del Kremlin.", "published": "2026-09-18T18:39:56+00:00", "category": "frente", "relevance_score": 11, "date_added": "2026-09-18", "title_es": "\"Un grupo de malversadores\" usurparon el poder en Kyiv, dijo Putin", "text_es": "MOSCÚ, 18 de septiembre - RIA Novosti. El poder en Kiev ha sido usurpado por un “grupo de malversadores” que necesitan la guerra para permanecer en el poder, dijo el presidente ruso Vladimir Putin.\n\nSeñaló que el régimen de Ucrania no puede defender la democracia porque ha degenerado en una dictadura.\n\n\"En Ucrania, como sabemos, no se celebran elecciones. El poder ha sido usurpado por un \"grupo de malversadores\", funcionarios corruptos que necesitan la guerra para permanecer en el poder sin elecciones y crear condiciones para robar a su propio pueblo, para llenarse los bolsillos con dinero de los patrocinadores, incluso de Europa\", dijo el Jefe de Estado en una reunión de la Comisión Militar-Industrial."}, {"id": "c5c01423afdc", "title_original": "Вместо того, чтобы услышать граждан, ЕС нагнетает ситуацию, заявил Путин", "text_original": "МОСКВА, 18 сен - РИА Новости. Вместо того, чтобы остановиться и услышать своих граждан, которые не хотят войны с Россией, лидеры Европы нагнетают ситуацию дальше, заявил президент РФ Владимир Путин.\n\nГлава государства отметил, что некоторые европейские лидеры открыто заявляют о том, что готовятся к войне с Россией. По мнению президента, таким образом они пытаются спасти свои падающие рейтинги, прикрывая свои ошибки в экономической и социальной политике.\n\n\"Вместо того, чтобы остановиться, услышать своих граждан, которые на выборах дают ясно понять, что они никакой войны с Россией не хотят, тем не менее, эти лидеры продолжают нагнетать ситуацию дальше\", - сказал Путин в ходе заседания военно-промышленной комиссии.", "link": "https://ria.ru/20260918/putin-2118641044.html", "source_id": "ria_novosti", "source_name": "RIA Novosti (РИА)", "perspective": "russia_official", "language": "ru", "bias_note": "Agencia estatal rusa del conglomerado Rossiya Segodnya. Postura y partes de guerra oficiales del Kremlin.", "published": "2026-09-18T18:39:30+00:00", "category": "frente", "relevance_score": 11, "date_added": "2026-09-18", "title_es": "En lugar de escuchar a los ciudadanos, la UE está agravando la situación, afirmó Putin.", "text_es": "MOSCÚ, 18 de septiembre - RIA Novosti. En lugar de detenerse y escuchar a sus ciudadanos que no quieren la guerra con Rusia, los líderes europeos están intensificando aún más la situación, dijo el presidente ruso Vladimir Putin.\n\nEl Jefe de Estado señaló que algunos líderes europeos declaran abiertamente que se están preparando para una guerra con Rusia. Según el presidente, de esta manera intentan salvar su caída en el rating, encubriendo sus errores en la política económica y social.\n\n\"En lugar de detenerse y escuchar a sus ciudadanos, que dejaron claro durante las elecciones que no quieren ninguna guerra con Rusia, estos líderes continúan agravando aún más la situación\", dijo Putin durante una reunión de la comisión militar-industrial."}, {"id": "5ba2c21951a1", "title_original": "Мощи Дмитрия Донского привезли из зоны СВО в «Новый Херсонес»", "text_original": "Ковчег с мощами святого князя Дмитрия Донского из зоны СВО привезли в Севастополь, в Свято-Владимирский мужской монастырь. Обитель входит в состав историко-археологического парка «Новый Херсонес». Об этом сообщила пресс-служба Минобороны России.\n\nМощи встретили в Свято-Владимирском соборе. Там состоялся молебен с акафистом, который возглавил епископ Ялтинский Нестор, викарий Симферопольской епархии. Приложиться к мощам святого пришли военнослужащие Вооруженных сил РФ, курсанты Черноморского высшего военно-морского ордена Красной Звезды училища имени П. С. Нахимова, взрослые и дети.\n\nМощи Дмитрия Донского обрели в июле во время реставрационных работ в Архангельском соборе в Москве. Их частицы поместили в несколько ковчегов, чтобы привезти для поклонения в храмы по всей России. В зону СВО ковчег с мощами доставили 8 сентября. Для поклонения верующих привезли частицу правой руки Дмитрия Донского — «той самой правой руки, которой он держал меч на Куликовом поле». До этого мощи уже привозили военнослужащим группировок «Юг», «Север» и «Запад».", "link": "https://www.kommersant.ru/doc/8970109", "source_id": "kommersant", "source_name": "Kommersant (Коммерсантъ)", "perspective": "russia_official", "language": "ru", "bias_note": "Diario de referencia ruso sobre política exterior, sanciones, industria militar y economía de guerra.", "published": "2026-09-18T18:37:53+00:00", "category": "frente", "relevance_score": 27, "date_added": "2026-09-18", "title_es": "Las reliquias de Dmitri Donskoi fueron trasladadas desde la zona del Distrito Militar del Norte a \"Nuevo Chersoneso\"", "text_es": "El arca con las reliquias del santo príncipe Dmitri Donskoi fue traída desde la zona del Distrito Militar del Norte a Sebastopol, al monasterio de San Vladimir. El monasterio forma parte del parque histórico y arqueológico “Nuevo Chersonesos”. Así lo informó el servicio de prensa del Ministerio de Defensa ruso.\n\nLas reliquias fueron recogidas en la catedral de San Vladimir. Allí se celebró un servicio de oración con un acatista, encabezado por el obispo Néstor de Yalta, vicario de la diócesis de Simferopol. Para venerar las reliquias del santo vinieron militares de las Fuerzas Armadas de la Federación Rusa, cadetes de la Orden Naval Superior del Mar Negro de la Escuela Estrella Roja que lleva el nombre de P. S. Nakhimov, adultos y niños.\n\nLas reliquias de Dmitry Donskoy fueron encontradas en julio durante los trabajos de restauración en la Catedral del Arcángel de Moscú. Sus partículas fueron colocadas en varias arcas para ser llevadas para el culto en iglesias de toda Rusia. El arca con las reliquias fue entregada a la zona del Distrito Militar del Norte el 8 de septiembre. Para el culto de los creyentes, trajeron un trozo de la mano derecha de Dmitry Donskoy, \"la misma mano derecha con la que sostenía la espada en el campo de Kulikovo\". Antes de esto, las reliquias ya habían sido entregadas a los militares de las facciones del Sur, del Norte y del Oeste."}, {"id": "56874c6d8227", "title_original": "Россия готова к восстановлению отношений с Европой, заявил Путин", "text_original": "МОСКВА, 18 сен - РИА Новости. Россия готова к сотрудничеству и восстановлению отношений с европейскими соседями, заявил президент РФ Владимир Путин.\n\n\"Мы готовы к сотрудничеству, к восстановлению отношений с европейскими соседями\", - сказал российский лидер в ходе заседания Военно-промышленной комиссии.", "link": "https://ria.ru/20260918/putin-2118640909.html", "source_id": "ria_novosti", "source_name": "RIA Novosti (РИА)", "perspective": "russia_official", "language": "ru", "bias_note": "Agencia estatal rusa del conglomerado Rossiya Segodnya. Postura y partes de guerra oficiales del Kremlin.", "published": "2026-09-18T18:37:29+00:00", "category": "frente", "relevance_score": 11, "date_added": "2026-09-18", "title_es": "Rusia está dispuesta a restablecer las relaciones con Europa, afirmó Putin", "text_es": "MOSCÚ, 18 de septiembre - RIA Novosti. Rusia está dispuesta a cooperar y restablecer las relaciones con sus vecinos europeos, afirmó el presidente ruso Vladimir Putin.\n\n\"Estamos dispuestos a cooperar y restablecer las relaciones con nuestros vecinos europeos\", afirmó el líder ruso durante una reunión de la Comisión Militar-Industrial."}, {"id": "f231d8af5215", "title_original": "Армия должна быть готова быстро ответить на внешние угрозы, заявил Путин", "text_original": "МОСКВА, 18 сен - РИА Новости. Армия России и силовые структуры должны быть готовы быстро и эффективно ответить на потенциальные внешние угрозы, сообщил президент России Владимир Путин.\n\nВ ходе выступления на заседании военно-промышленной комиссии он отметил, что в его ходе предстоит поговорить о проекте новой Госпрограммы вооружения и о Программе развития оборонно-промышленного комплекса.\n\n\"Они станут основой для разработки и серийного производства современных систем вооружения и техники для оснащения нашей армии и других силовых структур, чтобы они были готовы быстро и эффективно ответить на потенциальные внешние угрозы\", - сказал Путин на заседании.", "link": "https://ria.ru/20260918/putin-2118640821.html", "source_id": "ria_novosti", "source_name": "RIA Novosti (РИА)", "perspective": "russia_official", "language": "ru", "bias_note": "Agencia estatal rusa del conglomerado Rossiya Segodnya. Postura y partes de guerra oficiales del Kremlin.", "published": "2026-09-18T18:37:27+00:00", "category": "frente", "relevance_score": 11, "date_added": "2026-09-18", "title_es": "El ejército debe estar preparado para responder rápidamente a las amenazas externas, afirmó Putin.", "text_es": "MOSCÚ, 18 de septiembre - RIA Novosti. El ejército y las fuerzas de seguridad rusos deben estar preparados para responder rápida y eficazmente a posibles amenazas externas, afirmó el presidente ruso Vladimir Putin.\n\nDurante su intervención en la reunión de la comisión militar-industrial, señaló que durante la reunión se discutiría el borrador del nuevo Programa Estatal de Armamento y el Programa para el Desarrollo del Complejo Industrial-Defensa.\n\n\"Se convertirán en la base para el desarrollo y la producción en masa de sistemas y equipos de armas modernos para equipar a nuestro ejército y otras fuerzas de seguridad de modo que estén preparados para responder rápida y eficazmente a posibles amenazas externas\", dijo Putin en la reunión."}, {"id": "ad66419c68a4", "title_original": "Пентагон обнародовал новые файлы о НЛО и секретной военной программе", "text_original": "Пентагон рассекретил и опубликовал шестую партию документов, аудио и видеофайлов о неопознанных летающих объектах (НЛО). Всего в этих документах 71 файл: 55 текстовых, 15 видео и 1 аудио. Данные касаются событий с 1952 по 2025 год. Большинство обнародованных случаев встречи с НЛО остаются в статусе «неразгаданных».\n\nВ новый пакет вошли архивные файлы проекта ВВС США Project Blue Book, который с 1952 по 1969 год собирал и анализировал сообщения об НЛО и был самым масштабным из известных проектов правительства США этого направления в ХХ веке. Кроме того, Пентагон включил в пакет свежие видеозаписи перемещения НЛО, сделанные американскими военными и полицией в 2023–2025 годах на Ближнем Востоке и в Желтом море.\n\nОпрошенные CBS News эксперты отмечают, что наиболее важные документы в этой партии касаются секретной программы разведывательного управления Минобороны США по применению перспективных систем аэрокосмического оружия (Advanced Aerospace Weapon System Applications Program, AAWSAP). Программа была создана в 2007–2008 годах для изучения перспективных аэрокосмических угроз и прорывных технологий зарубежных противников, а также неопознанных воздушных явлений. Она существовала до 2012 года, и за годы работы специалисты успели изучить такие направления, как сверхсветовое перемещение, антигравитация, отрицательная энергия, вакуумная инженерия, высокочастотные гравитационно-волновые коммуникации, влияние электромагнитного излучения на биологические ткани человека, включая анализ физиологических эффектов при контактах с аномальными объектами, и т. п.\n\nОбнародование документов об НЛО было сделано по указанию президента США Дональда Трампа, который в середине апреля пообещал раскрыть «любопытные» данные на эту тему. Первый пакет из 158 файлов был опубликован 8 мая.", "link": "https://www.kommersant.ru/doc/8970093", "source_id": "kommersant", "source_name": "Kommersant (Коммерсантъ)", "perspective": "russia_official", "language": "ru", "bias_note": "Diario de referencia ruso sobre política exterior, sanciones, industria militar y economía de guerra.", "published": "2026-09-18T18:20:30+00:00", "category": "frente", "relevance_score": 15, "date_added": "2026-09-18", "title_es": "El Pentágono publicó nuevos archivos sobre ovnis y un programa militar secreto", "text_es": "El Pentágono ha desclasificado y publicado el sexto lote de documentos, archivos de audio y vídeo sobre objetos voladores no identificados (OVNI). En total, estos documentos contienen 71 archivos: 55 de texto, 15 de vídeo y 1 de audio. Los datos cubren eventos ocurridos entre 1952 y 2025. La mayoría de los casos publicados de encuentros con ovnis permanecen en el estado de \"sin resolver\".\n\nEl nuevo paquete incluye archivos de archivo del Proyecto Libro Azul de la Fuerza Aérea de EE. UU., que recopiló y analizó informes de ovnis de 1952 a 1969 y fue el proyecto OVNI más grande conocido del gobierno de EE. UU. en el siglo XX. Además, el Pentágono incluyó en el paquete nuevas grabaciones de vídeo de movimientos ovni realizados por el ejército y la policía estadounidenses en 2023-2025 en Oriente Medio y el Mar Amarillo.\n\nLos expertos entrevistados por CBS News señalan que los documentos más importantes de este lote se relacionan con el programa secreto de la Agencia de Inteligencia del Departamento de Defensa de EE. UU. para el uso de sistemas avanzados de armas aeroespaciales (Advanced Aerospace Weapon System Applications Program, AAWSAP). El programa fue creado en 2007-2008 para estudiar amenazas aeroespaciales avanzadas y tecnologías disruptivas de adversarios extranjeros, así como fenómenos aéreos no identificados. Existió hasta 2012 y, a lo largo de años de trabajo, los especialistas lograron estudiar áreas como los viajes superlumínicos, la antigravedad, la energía negativa, la ingeniería del vacío y las altas energías.\n\nLa publicación de los documentos OVNI se realizó bajo la dirección del presidente estadounidense, Donald Trump, quien a mediados de abril prometió revelar datos \"interesantes\" sobre este tema. El primer lote de 158 archivos se publicó el 8 de mayo."}, {"id": "77b1b61bfddb", "title_original": "Two killed in Russian drone attack on Kherson Oblast", "text_original": "Two men were killed in a Russian drone attack on the village of Tekstylne in Kherson Oblast on the evening of 18 September.\n\nSource: Oleksandr Prokudin, Head of Kherson Oblast Military Administration\n\nDetails: Prokudin said Russian troops attacked the settlement at around 18:00.\n\nQuote: \"Two men sustained fatal injuries in the strike by an enemy drone. The relevant services are currently establishing the identities of those killed.\n\nMy sincere condolences to their families and loved ones.\"\n\nBackground: On the afternoon of 18 September, Russian forces dropped explosives from a drone onto the grounds of a hospital in Kherson, damaging service vehicles.", "link": "https://www.pravda.com.ua/eng/news/2026/09/18/8054155/", "source_id": "ukrainska_pravda_en", "source_name": "Ukrainska Pravda (EN)", "perspective": "ukraine", "language": "en", "bias_note": "Uno de los periódicos más leídos e históricos de Ucrania (versión internacional en inglés).", "published": "2026-09-18T18:16:00+00:00", "category": "drones", "relevance_score": 25, "date_added": "2026-09-18", "title_es": "Dos muertos en un ataque con drones rusos en la provincia de Jersón", "text_es": "Dos hombres murieron en un ataque con aviones no tripulados rusos contra la aldea de Tekstylne, en el óblast de Jersón, la tarde del 18 de septiembre.\n\nFuente: Oleksandr Prokudin, jefe de la administración militar de la provincia de Jersón\n\nDetalles: Prokudin dijo que las tropas rusas atacaron el asentamiento alrededor de las 18:00.\n\nCita: \"Dos hombres resultaron heridos mortalmente durante el ataque de un dron enemigo. Los servicios competentes están investigando actualmente la identidad de los fallecidos.\n\nMi más sentido pésame a sus familiares y seres queridos\".\n\nAntecedentes: En la tarde del 18 de septiembre, las fuerzas rusas arrojaron explosivos desde un dron sobre los terrenos de un hospital en Kherson, dañando vehículos de servicio."}, {"id": "90c6bfe4512d", "title_original": "Russian strikes hit central Odesa twice, injuring 10, incl two rescuers", "text_original": "The number of casualties in Odesa following two enemy drone strikes on an administrative building has risen to 10, according to Head of the regional military administration Oleh Kiper.\n\n\"The enemy brazenly attacked the central part of Odesa twice in a row. The second strike occurred while emergency and rescue services were working to deal with the aftermath of the attack and provide assistance to people,\" he said on Telegram on Friday evening.\n\n\"Currently, there are reports of ten casualties. Three of them have been hospitalized, while the others received medical care on site,\" he said.\n\nAccording to the State Emergency Service, two rescue workers are among the injured. \"Ten people were injured in the Russian attack, including two rescue workers. The strike hit an 11-story administrative building. At the time of the attack, people were taking shelter, which saved their lives. Later, Russia launched a second strike while rescuers and other emergency services were working at the scene,\" the service said on its Telegram channel.\n\nAccording to the regional military administration, the shelling damaged the administrative building and vehicles. Cleanup efforts are ongoing at the scene. The fire, which spread across several floors of the building, has already been extinguished by rescue workers. More than 70 firefighters responded to the aftermath of this attack.", "link": "https://en.interfax.com.ua/news/general/1206742.html", "source_id": "interfax_ukraine", "source_name": "Interfax-Ucrania", "perspective": "ukraine", "language": "en", "bias_note": "Agencia de noticias ucraniana de referencia para despachos militares y declaraciones gubernamentales.", "published": "2026-09-18T17:41:54+00:00", "category": "drones", "relevance_score": 25, "date_added": "2026-09-18", "title_es": "Los ataques rusos alcanzaron dos veces el centro de Odesa, hiriendo a 10, incluidos dos rescatistas", "text_es": "El número de víctimas en Odesa tras dos ataques con drones enemigos contra un edificio administrativo ha aumentado a 10, según informó el jefe de la administración militar regional, Oleh Kiper.\n\n\"El enemigo atacó descaradamente la parte central de Odesa dos veces seguidas. El segundo ataque se produjo mientras los servicios de emergencia y rescate estaban trabajando para hacer frente a las secuelas del ataque y brindar asistencia a la gente\", dijo en Telegram el viernes por la noche.\n\n\"Actualmente hay informes de diez víctimas. Tres de ellos han sido hospitalizados, mientras que los demás recibieron atención médica en el lugar\", dijo.\n\nSegún el Servicio Estatal de Emergencias, entre los heridos se encuentran dos socorristas. \"Diez personas resultaron heridas en el ataque ruso, incluidos dos socorristas. El ataque alcanzó un edificio administrativo de 11 pisos. En el momento del ataque, las personas estaban refugiándose, lo que les salvó la vida. Más tarde, Rusia lanzó un segundo ataque mientras los socorristas y otros servicios de emergencia trabajaban en el lugar\", informó el servicio en su canal Telegram.\n\nSegún la administración militar regional, el bombardeo dañó el edificio administrativo y los vehículos. Se están realizando esfuerzos de limpieza en el lugar. El fuego, que se extendió por varias plantas del edificio, ya ha sido extinguido por los socorristas. Más de 70 bomberos respondieron a las secuelas de este ataque."}, {"id": "a2803988676a", "title_original": "Reuters: Руководство АдГ намерено обсудить с Кремлем возобновление поставок газа в ФРГ", "text_original": "Руководство ультраправой партии \"Альтернатива для Германии\" (АдГ) планирует обсудить с Кремлем возобновление поставок газа из России в Германию. Об этом в пятницу, 18 сентября, сообщило агентство Reuters со ссылкой на два осведомленных источника.\n\nПо этим данным, встреча запланирована на весну 2026 года. Ожидается, что со стороны АдГ в ней примут участие сопредседатели партии Алис Вайдель (Alice Weidel) и Тино Хрупалла (Tino Chrupalla), а с российской стороны - советник президента РФ Владимира Путина Кирилл Дмитриев. В \"Альтернативе для Германии\" пока не комментировали эту информацию.\n\nReuters отмечает, что АдГ не имеет полномочий возобновлять поставки газа из России. Энергетическая политика - прерогатива правительства ФРГ, и крайне маловероятно, что ультраправые могут в него войти, указывает агентство - несмотря на недавний успех на выборах в ландтаг Саксонии-Анхальт и общий рост их рейтинга в Германии. Reuters напоминает, что другие политические силы отказываются входить в коалицию с АдГ, которую Федеральное ведомство по охране конституции (BfV) в 2025 году причислило  к правоэкстремистским объединениям.\n\nВ интервью агентству Reuters, опубликованном 30 июня, Вайдель призвала прекратить бойкот российских нефти и газа. \"Дешевая энергия из России была секретом успеха марки \"Сделано в Германии\". Нам необходимо ее вернуть\", - сказала сопредседательница АдГ. Она дала понять, что рассматривает выборы на востоке ФРГ как ступеньки к канцлерству.\n\nПеред выборами в парламент Саксонии-Анхальт \"Альтернатива для Германии\" обещала избирателям, среди прочего, добиваться окончания санкций против РФ в сфере энергетики и \"нормализации германо-российских торговых отношений\", в том числе - возобновления закупок российского трубопроводного газа по \"Северному потоку\".", "link": "https://www.dw.com/ru/reuters-руководство-адг-намерено-обсудить-с-кремлем-возобновление-поставок-газа-в-фрг/a-79333404?maca=rus-rss-ru-all-1126-xml-mrss", "source_id": "dw_russian", "source_name": "Deutsche Welle (DW Ruso)", "perspective": "international", "language": "ru", "bias_note": "Radiodifusora pública internacional de Alemania con análisis exhaustivo del conflicto para la audiencia rusoparlante.", "published": "2026-09-18T16:57:00+00:00", "category": "economia", "relevance_score": 11, "date_added": "2026-09-18", "title_es": "Reuters: La dirección de AfD tiene la intención de discutir con el Kremlin la reanudación del suministro de gas a Alemania", "text_es": "La dirección del partido de extrema derecha Alternativa para Alemania (AfD) planea discutir con el Kremlin la reanudación del suministro de gas de Rusia a Alemania. Reuters informó esto el viernes 18 de septiembre, citando dos fuentes bien informadas.\n\nSegún estos datos, la reunión está prevista para la primavera de 2026. Se espera que por parte de AfD participen los copresidentes del partido, Alice Weidel y Tino Chrupalla, y por parte rusa, el asesor del presidente ruso, Vladimir Putin, Kirill Dmitriev. Alternativa para Alemania aún no se ha pronunciado sobre esta información.\n\nReuters señala que el AfD no tiene autoridad para reanudar el suministro de gas desde Rusia. La política energética es prerrogativa del gobierno alemán y es muy poco probable que la extrema derecha pueda entrar en ella, señala la agencia, a pesar del reciente éxito en las elecciones al Landtag de Sajonia-Anhalt y del aumento general de su calificación en Alemania. Reuters recuerda que otras fuerzas políticas se niegan a formar una coalición con el AfD, que la Oficina Federal para la Protección de la Constitución (BfV) clasificó en 2025 como asociación de extrema derecha.\n\nEn una entrevista con Reuters publicada el 30 de junio, Weidel pidió el fin del boicot al petróleo y al gas rusos. \"La energía barata procedente de Rusia fue el secreto del éxito de la marca Made in Germany. Tenemos que recuperarla\", afirmó la copresidenta de AfD. Dejó claro que considera las elecciones en el este de Alemania como un trampolín hacia la cancillería.\n\nAntes de las elecciones parlamentarias en Sajonia-Anhalt, Alternativa para Alemania prometió a los votantes, entre otras cosas, buscar el fin de las sanciones contra la Federación Rusa en el sector energético y la “normalización de las relaciones comerciales entre Alemania y Rusia”, incluida la reanudación de las compras de gasoducto ruso a través del Nord Stream."}, {"id": "651497e87399", "title_original": "Russia attacks central Odesa twice, repeat strike hits during rescue operation: 10 injured – photos", "text_original": "Russian forces attacked central Odesa twice on 18 September, and the repeat strike came as first responders were working at the scene. Ten people have been injured in the attacks.\n\nSource: Serhii Lysak, Head of Odesa City Military Administration; Oleh Kiper, Head of Odesa Oblast Military Administration; Suspilne, Ukraine's national public broadcaster\n\nUpdate: Kiper said Russian forces attacked the central part of the city twice in quick succession. The repeat strike occurred while first responders were dealing with the aftermath of the first attack and helping people.\n\nAs of the evening, 10 people are known to have been injured. Three of them were hospitalised, while the others received medical treatment at the scene.\n\nThe attacks damaged an office building and vehicles.\n\nDetails: Lysak had earlier reported that a Russian drone struck an office building in a busy area in central Odesa. A fire broke out on several floors of the building following the strike.", "link": "https://www.pravda.com.ua/eng/news/2026/09/18/8054100/", "source_id": "ukrainska_pravda_en", "source_name": "Ukrainska Pravda (EN)", "perspective": "ukraine", "language": "en", "bias_note": "Uno de los periódicos más leídos e históricos de Ucrania (versión internacional en inglés).", "published": "2026-09-18T16:41:00+00:00", "category": "drones", "relevance_score": 25, "date_added": "2026-09-18", "title_es": "Rusia ataca dos veces el centro de Odesa y repite el ataque durante la operación de rescate: 10 heridos – fotos", "text_es": "Las fuerzas rusas atacaron el centro de Odesa dos veces el 18 de septiembre, y el nuevo ataque se produjo cuando los socorristas estaban trabajando en el lugar. Diez personas han resultado heridas en los ataques.\n\nFuente: Serhii Lysak, Jefe de la Administración Militar de la ciudad de Odesa; Oleh Kiper, Jefe de la Administración Militar del Óblast de Odesa; Suspilne, la emisora ​​pública nacional de Ucrania\n\nActualización: Kiper dijo que las fuerzas rusas atacaron la parte central de la ciudad dos veces en rápida sucesión. El nuevo ataque se produjo mientras los socorristas se ocupaban de las secuelas del primer ataque y ayudaban a la gente.\n\nHasta la tarde se sabía que 10 personas habían resultado heridas. Tres de ellos fueron hospitalizados, mientras que los demás recibieron atención médica en el lugar.\n\nLos ataques dañaron un edificio de oficinas y vehículos.\n\nDetalles: Lysak había informado anteriormente que un dron ruso atacó un edificio de oficinas en una zona concurrida en el centro de Odesa. Tras el ataque se produjo un incendio en varias plantas del edificio."}, {"id": "efa79926f1cc", "title_original": "Russian drone drops explosives on Kherson hospital grounds, damaging service vehicle", "text_original": "Russian occupiers dropped explosives from a drone onto the grounds of a hospital in Kherson, damaging several vehicles used by hospital staff, according to Head of Kherson City Military Administration Yaroslav Shanko.\n\n\"The enemy continues to cynically target civilian infrastructure in Kherson,\" Shanko said on Telegram on Friday.\n\nAccording to him, after 14:00, Russian occupiers dropped explosives from a drone onto the grounds of one of the city's hospitals in Korabelny district.\n\n\"Several vehicles used for official duties were damaged as a result of this attack. No reports of injuries have been received,\" the head of the city administration said.", "link": "https://en.interfax.com.ua/news/general/1206717.html", "source_id": "interfax_ukraine", "source_name": "Interfax-Ucrania", "perspective": "ukraine", "language": "en", "bias_note": "Agencia de noticias ucraniana de referencia para despachos militares y declaraciones gubernamentales.", "published": "2026-09-18T16:23:28+00:00", "category": "drones", "relevance_score": 25, "date_added": "2026-09-18", "title_es": "Un dron ruso lanza explosivos en los terrenos del hospital de Kherson y daña un vehículo de servicio", "text_es": "Los ocupantes rusos arrojaron explosivos desde un dron en los terrenos de un hospital en Kherson, dañando varios vehículos utilizados por el personal del hospital, según el jefe de la administración militar de la ciudad de Kherson, Yaroslav Shanko.\n\n\"El enemigo continúa atacando cínicamente la infraestructura civil en Kherson\", dijo Shanko en Telegram el viernes.\n\nSegún sus palabras, después de las 14:00 horas los ocupantes rusos arrojaron explosivos desde un dron en el terreno de uno de los hospitales de la ciudad en el distrito de Korabelny.\n\n\"Como resultado de este ataque, varios vehículos utilizados para tareas oficiales resultaron dañados. No se han recibido informes de heridos\", dijo el jefe de la administración de la ciudad."}, {"id": "f9d1ff280592", "title_original": "Five people injured in attack on downtown Odesa – administration", "text_original": "The number of casualties in Odesa following a strike by an enemy drone on an administrative building, which is currently engulfed in flames, has risen to five, according to Head of the regional military administration Oleh Kiper.\n\n\"We currently know of five people injured as a result of the strike on central Odesa. Most of the victims have shrapnel wounds. All are receiving the necessary medical care,\" he said on Telegram on Friday.\n\nAccording to him, the attack damaged the facade and windows of the administrative building. The resulting fire spread across several floors. Cleanup efforts are ongoing at the scene.\n\nEarlier reports had mentioned three casualties.", "link": "https://en.interfax.com.ua/news/general/1206686.html", "source_id": "interfax_ukraine", "source_name": "Interfax-Ucrania", "perspective": "ukraine", "language": "en", "bias_note": "Agencia de noticias ucraniana de referencia para despachos militares y declaraciones gubernamentales.", "published": "2026-09-18T15:14:56+00:00", "category": "drones", "relevance_score": 25, "title_es": "Cinco personas resultaron heridas en un ataque en el centro de Odesa – administración", "text_es": "El número de víctimas en Odesa tras el ataque de un dron enemigo contra un edificio administrativo actualmente envuelto en llamas ha aumentado a cinco, según informó el jefe de la administración militar regional, Oleh Kiper.\n\n\"Actualmente sabemos de cinco personas heridas como resultado del ataque en el centro de Odesa. La mayoría de las víctimas tienen heridas de metralla. Todos reciben la atención médica necesaria\", dijo el viernes en Telegram.\n\nSegún él, el ataque dañó la fachada y las ventanas del edificio administrativo. El incendio resultante se extendió por varios pisos. Se están realizando esfuerzos de limpieza en el lugar.\n\nInformes anteriores habían mencionado tres víctimas.", "date_added": "2026-09-18"}, {"id": "b17bcf844ae6", "title_original": "Russian Far East Crude Tops $120 Per Barrel as Middle East Supply Shocks Drive Chinese Demand", "text_original": "Prices for Russia’s ESPO blend of crude oil bound for China surged past $120 per barrel this week, Reuters reported Friday, citing trading sources and market data.\n\nChinese state-owned refiners rushed to lock in November and December ESPO cargoes early, although they typically purchase the grade one or two months in advance due to the short shipping distance.\n\nThe buying spree pushed the ESPO grade’s price premium over benchmark ICE Brent to record levels of $20 to $30 per barrel.\n\nESPO is a low-sulfur, light Siberian crude exported primarily via the Kozmino port in Russia's Far East. China primarily imports the unique blend, as well as Arctic and Sakhalin grades.\n\nThe surge in premium costs comes as Iran and its proxies continue to retaliate against U.S. strikes and economic warfare. Saudi Arabia shut down a critical oil pipeline last week after it said militants in Iraq launched drones at the facility, which was being used as an export route to bypass the effective closure of the Strait of Hormuz.\n\nThe rising cost of ESPO mirrors a similar surge seen with Russia’s flagship Urals blend in March and April 2026 after the United States and Israel first launched attacks against Iran.", "link": "https://www.themoscowtimes.com/2026/09/18/russian-far-east-crude-tops-120-per-barrel-as-middle-east-supply-shocks-drive-chinese-demand-a93748", "source_id": "the_moscow_times", "source_name": "The Moscow Times", "perspective": "russia_independent", "language": "en", "bias_note": "Diario independiente ruso en el exilio crítico con Putin y con cobertura de ataques en territorio ruso.", "published": "2026-09-18T14:57:46+00:00", "category": "frente", "relevance_score": 23, "title_es": "El crudo ruso del Lejano Oriente supera los 120 dólares por barril mientras los shocks de oferta en Medio Oriente impulsan la demanda china", "text_es": "Los precios de la mezcla rusa ESPO de petróleo crudo con destino a China superaron los 120 dólares por barril esta semana, informó Reuters el viernes, citando fuentes comerciales y datos del mercado.\n\nLas refinerías estatales chinas se apresuraron a asegurar con antelación los cargamentos ESPO de noviembre y diciembre, aunque normalmente compran la calidad con uno o dos meses de antelación debido a la corta distancia de envío.\n\nLa ola de compras impulsó la prima de precio del grado ESPO sobre el índice de referencia ICE Brent a niveles récord de 20 a 30 dólares por barril.\n\nESPO es un crudo siberiano ligero y bajo en azufre que se exporta principalmente a través del puerto de Kozmino en el Lejano Oriente de Rusia. China importa principalmente la mezcla única, así como las calidades Arctic y Sakhalin.\n\nEl aumento en los costos de las primas se produce mientras Irán y sus representantes continúan tomando represalias contra los ataques y la guerra económica de Estados Unidos. Arabia Saudita cerró un oleoducto crítico la semana pasada después de decir que militantes en Irak lanzaron drones contra la instalación, que estaba siendo utilizada como ruta de exportación para evitar el cierre efectivo del Estrecho de Ormuz.\n\nEl aumento del costo de ESPO refleja un aumento similar observado con la mezcla insignia de Rusia en los Urales en marzo y abril de 2026, después de que Estados Unidos e Israel lanzaran por primera vez ataques contra Irán.", "date_added": "2026-09-18"}, {"id": "0020d5a5958b", "title_original": "Ukrainian, Romanian presidents discuss SAFE, drone co-production, Black Sea security", "text_original": "During the Carpathian Eight Summit, Ukrainian President Volodymyr Zelenskyy discussed with Romanian President Nicușor Dan cooperation within the SAFE framework, joint drone production, infrastructure and humanitarian projects, as well as security in the Black Sea region.\n\n\"I am grateful for the active dialogue and substantive cooperation between us. Today we are expanding it to include another dimension – the regional one – with a focus on our shared Carpathian Mountains. This holds significant potential not only for the economy but also for security and deeper ties between our peoples,\" Zelenskyy said on Facebook on Friday.\n\nAccording to him, during the meeting, the parties discussed which projects could accelerate cooperation and provide mutual assistance.\n\n\"These include, in particular, SAFE and the joint production of drones, infrastructure and humanitarian issues, and, of course, security in the Black Sea region,\" the head of state said.", "link": "https://en.interfax.com.ua/news/general/1206666.html", "source_id": "interfax_ukraine", "source_name": "Interfax-Ucrania", "perspective": "ukraine", "language": "en", "bias_note": "Agencia de noticias ucraniana de referencia para despachos militares y declaraciones gubernamentales.", "published": "2026-09-18T14:43:30+00:00", "category": "drones", "relevance_score": 31, "title_es": "Los presidentes de Ucrania y Rumania debaten SAFE, la coproducción de drones y la seguridad del Mar Negro", "text_es": "Durante la Octava Cumbre de los Cárpatos, el presidente ucraniano Volodymyr Zelenskyy discutió con el presidente rumano Nicușor Dan la cooperación en el marco SAFE, la producción conjunta de drones, proyectos de infraestructura y humanitarios, así como la seguridad en la región del Mar Negro.\n\n\"Estoy agradecido por el diálogo activo y la cooperación sustantiva entre nosotros. Hoy lo estamos ampliando para incluir otra dimensión -la regional- con un enfoque en nuestros Cárpatos compartidos. Esto tiene un potencial significativo no sólo para la economía sino también para la seguridad y lazos más profundos entre nuestros pueblos\", dijo Zelenskyy en Facebook el viernes.\n\nSegún sus palabras, durante la reunión las partes discutieron qué proyectos podrían acelerar la cooperación y brindar asistencia mutua.\n\n\"Estos incluyen, en particular, SAFE y la producción conjunta de drones, infraestructura y cuestiones humanitarias y, por supuesto, la seguridad en la región del Mar Negro\", dijo el Jefe de Estado.", "date_added": "2026-09-18"}, {"id": "f3d5f9962f37", "title_original": "Russian drone drops explosives on hospital grounds in Kherson – photos", "text_original": "Russian forces dropped explosives from a drone onto the grounds of a hospital in Kherson on 18 September, damaging service vehicles.\n\nSource: Yaroslav Shanko, Head of Kherson City Military Administration\n\nDetails: Shanko said Russian forces attacked the hospital grounds in the city's Korabelnyi district with a drone shortly after 14:00.\n\nQuote: \"Several service vehicles have been damaged in the attack. No injuries have been reported.\"\n\nBackground: On 16 September, one person was killed and another injured in Russian drone attacks on Kherson.\n\nSupport Ukrainska Pravda on  Patreon to help us keep reporting!", "link": "https://www.pravda.com.ua/eng/news/2026/09/18/8054113/", "source_id": "ukrainska_pravda_en", "source_name": "Ukrainska Pravda (EN)", "perspective": "ukraine", "language": "en", "bias_note": "Uno de los periódicos más leídos e históricos de Ucrania (versión internacional en inglés).", "published": "2026-09-18T14:02:00+00:00", "category": "drones", "relevance_score": 25, "title_es": "Un dron ruso lanza explosivos en un hospital de Jersón – fotos", "text_es": "Las fuerzas rusas arrojaron explosivos desde un dron en los terrenos de un hospital en Kherson el 18 de septiembre, dañando vehículos de servicio.\n\nFuente: Yaroslav Shanko, jefe de la administración militar de la ciudad de Kherson\n\nDetalles: Shanko dijo que las fuerzas rusas atacaron los terrenos del hospital en el distrito Korabelnyi de la ciudad con un dron poco después de las 14:00.\n\nCita: \"En el ataque resultaron dañados varios vehículos de servicio. No se han registrado heridos\".\n\nAntecedentes: El 16 de septiembre, una persona murió y otra resultó herida en ataques con drones rusos contra Kherson.\n\n¡Apoye a Ukrainska Pravda en Patreon para ayudarnos a seguir informando!", "date_added": "2026-09-18"}, {"id": "1dffc970228c", "title_original": "Операция «Вивальди» — это и правда большой успех ВСУ? Пала ли Малая Токмачка? И как две армии готовятся к новым битвам за Донбасс? Карта боев на 18 сентября", "text_original": "Командующий 3-м армейским корпусом ВСУ Андрей Билецкий на этой неделе сообщил, что его части успешно проводят операцию «Вивальди». Первая фаза (из четырех), по его словам, близка к завершению: подразделения ВС РФ в районе города Лимана, пытавшиеся прорваться к реке Северский Донец напротив Славянска, оттеснены за реку Черный Жеребец (приток Северского Донца). Судя по опубликованным видео, положение российской группировки действительно ухудшилось в результате продолжительного (в несколько месяцев) наступления ВСУ. Однако подтверждений тому, что ВСУ вытеснили противника за Черный Жеребец, пока нет. «Медуза» ведет хронику большой войны с февраля 2022-го. За это время мы изучили тысячи документальных свидетельств конфликта, нарисовали сотни карт фронта, написали десятки сводок о ходе боевых действий (архив можно изучить здесь; предыдущее обновление — здесь). Это кропотливая работа, которая отнимает много времени и ресурсов. Чтобы мы могли продолжать рассказывать о войне в том же масштабе, пожалуйста, поддержите «Медузу»! Лиман\n\nРоссийские войска (20-я армия) в начале 2025 года форсировали Черный Жеребец в районе Макеевки, а летом (25-я армия) — южнее в районе Торского. С тех пор эти две группировки пытались пробиться к Лиману с севера и востока. В начале лета 2026-го они организовали штурм города, но потерпели неудачу. В этот момент российское наступление достигло наибольших успехов. Штурмовики 20-й армии были замечены на окраинах Святогорска, просочились в тыл ВСУ на 10–12 километров до реки Оскол и даже форсировали малыми силами Северский Донец около Пришиба к востоку от Святогорска; а 25-я армия зашла в Лиман и пыталась пробиться к переправам южнее города.Однако в этот же момент началось контрнаступление 3-го корпуса ВСУ. Уже в июле российские войска были выбиты из Лимана (кроме юго-восточной окраины). Позже украинские силы перешли в наступление на других участках: против северного фланга 20-й армии у Карповки и Редкодуба, против ее южного фланга у Яровой и на стыке с 25-й армией из «кармана» в районе села Ставки.В начале сентября Владимир Путин неожиданно сообщил, что ВС РФ захватили Святогорск. Хуже момента для такого заявления придумать было нельзя: именно тогда войска 20-й армии откатывались из лесов к востоку от Святогорска и на других участках фронта. Читайте на Медузе\nК моменту заявления Билецкого опубликованными видео были подтверждены продвижения ВСУ в районе Яровой и Новоселовки; из района Редкодуба и Краповки до села Среднее; из «кармана» в Ставках и от Лимана — в тыл 20-й армии в Колодезях и до окраин Заречного на реке Черный Жеребец.При этом 25-я армия ВС РФ продолжает удерживать позиции в районе Лимана. Пока не ясно, остаются ли ее позиции в Зеленой Долине и Шандриголово. Никаких визуальных подтверждений выхода ВСУ к Черному Жеребцу или форсирования реки (как это утверждают некоторые неофициальные украинские источники) пока не появилось.Планы следующих фаз наступления Билецкий не назвал. Стоит отметить, что несколько недель назад он получил новое назначение — и теперь командует не только корпусом, но и вновь созданной оперативно-тактической группировкой «Центр», призванной защитить Славянск и соседний Краматорск от наступления ВС РФ с севера и с востока.Вполне возможно, что ВСУ попробуют контратаками остановить намного более опасное с оперативной точки зрения наступление ВС РФ вдоль южного берега Северского Донца на город Николаевку и в районе канала Северский Донец — Донбасс к восточным окраинам Дружковки и южным окраинам Краматорска.\n\nВ последние дни подразделения ВСУ, к которым перебросили подкрепления (46-я аэромобильная бригада, ранее воевавшая на стыке Днепропетровской, Запорожской и Донецкой областей, а также как минимум один штурмовой полк), пытаются контратаковать в районе Рай-Александровки к юго-востоку от Николаевки. Российское наступление на Дружковку и Доброполье\nЧитайте на Медузе\nПохоже, российское командование осознало, что войска, наступающие на агломерацию Славянска и Краматорска, имеющимися силами добиться успеха не смогут. Группировка, которая пытается пробиться к Дружковке с запада вдоль русла реки Казенный Торец, была усилена частями 90-й танковой дивизии и 41-й общевойсковой армии, ранее более года воевавших на стыке Днепропетровской, Запорожской и Донецкой областей (в том числе против 46-й бригады ВСУ, тоже переброшенной в центр Донбасса).Пополненная группировка ВС РФ смогла пробиться на несколько километров к дороге Доброполье — Краматорск, а также подойти почти к окраинам Дружковки. Читайте на Медузе\nОдновременно часть войск, ранее наступавших на участке между Добропольем и Дружковкой, получила новую задачу: усилить давление на Доброполье с востока. Другая группировка ВС РФ начала наступление с целью обойти Доброполье с юго-запада. Однако пока эти российские удары не привели к решительному успеху.Обе армии, очевидно, готовятся к осенне-зимней кампании и тяжелым боям к юго-западу и юго-востоку от Краматорска, для чего стягивают силы в центральную часть Донбасса. Орехов и Малая Токмачка\n\nВС РФ захватили Малую Токмачку — село, ставшее мемом скорее благодаря своему названию, нежели оперативной значимости. Для подтверждения российское командование организовало большую видеосъемку с воздуха: на ней военнослужащие водрузили флаги РФ по всему селу. При этом, судя по записям, опубликованным ВСУ, фронт уже ушел на несколько километров на северо-запад от Малой Токмачки. Как Малая Токмачка превратилась в символ сопротивления ВСУШтурм Малой Токмачки стал главным военным мемом года (хотя ничего смешного в бесконечной кровавой мясорубке, конечно, нет) Но если серьезно, почему у российской армии никак не получается захватить это село? Читайте на Медузе\nЗахват Малой Токмачки стал возможен не вследствие усилий воевавшего за нее годами 70-го мотострелкового полка ВС РФ, а из-за быстрого продвижения соседей. Российские войска группировки «Днепр» через Новоданиловку вышли на окраину города Орехова (это местная «крепость» ВСУ, на которой основана вся украинская оборона в центральной части Запорожской области). В то же время другая крупная группировка ВС РФ («Восток»), наступающая со стороны Гуляйполя, несмотря на месяцы контратак ВСУ, достигла дороги Орехов — Новониколаевка, выйдя в тыл 118-й механизированной бригаде ВСУ, защищавшей Малую Токмачку. После этого оборона села стала невозможна.Положение ВСУ под Ореховом продолжает ухудшаться. Российское командование задействовало к юго-западу от города силы одной из десантно-штурмовых дивизий с явным намерением охватить город еще и с запада. Ранее эта дивизия была задействована на берегу Днепра к югу от Запорожья — в районе поселка Степногорск. Летом ВСУ контратаковали в Степногорске и окрестностях. Уже тогда высказывались предположения, что это стало возможным из-за ухода из района российских десантников — на некий неизвестный участок фронта. Теперь они «всплыли» под Ореховом в момент решительного наступления ВС РФ на город. Как меняется контроль двух армий над территориями\n \n \nИнтерактивная карта боевых действий\nОтдел «Разбор»", "link": "https://meduza.io/feature/2026/09/18/operatsiya-vivaldi-eto-i-pravda-bolshoy-uspeh-vsu-pala-li-malaya-tokmachka-i-kak-dve-armii-gotovyatsya-k-novym-bitvam-za-donbass", "source_id": "meduza_ru", "source_name": "Meduza (RU)", "perspective": "russia_independent", "language": "ru", "bias_note": "Principal medio ruso de investigación independiente prohibido por el Kremlin (sede en Letonia).", "published": "2026-09-18T13:33:38+00:00", "category": "frente", "relevance_score": 33, "title_es": "¿Es realmente la Operación Vivaldi un gran éxito para las Fuerzas Armadas de Ucrania? ¿Cayó Malaya Tokmachka? ¿Y cómo se preparan los dos ejércitos para nuevas batallas por Donbass? Cartelera de pelea para el 18 de septiembre", "text_es": "El comandante del 3.er Cuerpo de Ejército de las Fuerzas Armadas de Ucrania, Andrei Biletsky, anunció esta semana que sus unidades están llevando a cabo con éxito la Operación Vivaldi. La primera fase (de cuatro), según él, está a punto de completarse: unidades de las Fuerzas Armadas rusas en el área de la ciudad de Liman, que intentaron abrirse paso hacia el río Seversky Donets frente a Slavyansk, fueron empujadas hacia atrás más allá del río Black Stallion (un afluente del Seversky Donets). A juzgar por los vídeos publicados, la posición del grupo ruso realmente empeoró como resultado de la ofensiva de larga duración (varios meses) de las Fuerzas Armadas de Ucrania. Sin embargo, aún no hay confirmación de que las Fuerzas Armadas de Ucrania hayan obligado al enemigo a detrás del Semental Negro. Meduza narra la gran guerra desde febrero\n\nLas tropas rusas (20.º ejército) cruzaron el Semental Negro en el área de Makeevka a principios de 2025, y en el verano (25.º ejército) más al sur en el área de Torskoye. Desde entonces, estos dos grupos han estado tratando de abrirse paso hacia el Limán desde el norte y el este. A principios del verano de 2026, organizaron un asalto a la ciudad, pero fracasaron. En este punto, la ofensiva rusa logró su mayor éxito. Se avistaron tropas de asalto del 20.º ejército en las afueras de Svyatogorsk, se infiltraron en la retaguardia de las Fuerzas Armadas de Ucrania a 10 o 12 kilómetros del río Oskol e incluso cruzaron el Seversky Donets con pequeñas fuerzas cerca de Prishib al este de Svyatogorsk; y el 25.º Ejército entró en Limán e intentó abrirse camino hacia los cruces al sur de la ciudad. Sin embargo\n\nEn los últimos días, unidades de las Fuerzas Armadas de Ucrania, a las que se han transferido refuerzos (la 46.ª brigada aeromóvil, que anteriormente luchó en el cruce de las regiones de Dnepropetrovsk, Zaporozhye y Donetsk, así como al menos un regimiento de asalto), están intentando contraatacar en la zona de Rai-Alexandrovka al sureste de Nikolaevka. Ofensiva rusa sobre Druzhkovka y Dobropolye\nSigue leyendoMedusa\nParece que el mando ruso se dio cuenta de que las tropas que avanzaban hacia la aglomeración de Slavyansk y Kramatorsk no podrían lograr el éxito con las fuerzas disponibles. El grupo, que intenta avanzar hacia Druzhkovka desde el oeste a lo largo del río Kazenny Torets, fue reforzado por unidades de la 90.ª División Panzer\n\nLas Fuerzas Armadas rusas capturaron Malaya Tokmachka, una aldea que se convirtió en un meme más por su nombre que por su importancia operativa. Para confirmarlo, el mando ruso organizó una gran filmación de vídeo desde el aire: en él, militares izaron banderas rusas por todo el pueblo. Al mismo tiempo, a juzgar por los registros publicados por las Fuerzas Armadas de Ucrania, el frente ya se ha desplazado varios kilómetros al noroeste de Malaya Tokmachka. Cómo Malaya Tokmachka se convirtió en un símbolo de resistencia a las Fuerzas Armadas de Ucrania El asalto a Malaya Tokmachka se convirtió en el principal meme militar del año (aunque, por supuesto, no hay nada divertido en la interminable y sangrienta picadora de carne) Pero, en serio, ¿por qué el ejército ruso no puede capturar esta aldea? chitá", "date_added": "2026-09-18"}, {"id": "5d58d10ba277", "title_original": "Russian weekly losses top 10,000 troops killed and wounded for third week running – Estonian intelligence chief", "text_original": "Estonian intelligence has noted that Russian losses in the war against Ukraine have remained above 10,000 troops killed and wounded for a third consecutive week, exceeding the number Russia can recruit.\n\nSource: Estonian public broadcasting network ERR, citing Colonel Ants Kiviselg, Head of the Intelligence Centre of the Estonian Defence Forces, as reported by European Pravda\n\nDetails: Kiviselg said Russia's average losses this week are around 1,600 personnel per day, meaning total losses for the week amount to just over 11,000 troops killed and wounded.\n\nQuote: \"The trend therefore continues, with Russia losing more troops on the battlefield than it is able to recruit.\"\n\nMore details: Kiviselg also said that Ukraine has for the first time released data on its counteroffensive towards Lyman in Donetsk Oblast, where around 85 sq km of territory has been liberated and mopped up in the course of the operation.\n\nQuote: \"Ukrainian operations in Donetsk Oblast are currently continuing.\"", "link": "https://www.pravda.com.ua/eng/news/2026/09/18/8054087/", "source_id": "ukrainska_pravda_en", "source_name": "Ukrainska Pravda (EN)", "perspective": "ukraine", "language": "en", "bias_note": "Uno de los periódicos más leídos e históricos de Ucrania (versión internacional en inglés).", "published": "2026-09-18T12:17:00+00:00", "category": "frente", "relevance_score": 27, "title_es": "Las pérdidas semanales rusas superan los 10.000 soldados muertos y heridos por tercera semana consecutiva: jefe de inteligencia de Estonia", "text_es": "La inteligencia estonia ha observado que las pérdidas rusas en la guerra contra Ucrania se mantienen por encima de los 10.000 soldados muertos y heridos por tercera semana consecutiva, superando el número que Rusia puede reclutar.\n\nFuente: Red de radiodifusión pública de Estonia ERR, citando al coronel Ants Kiviselg, jefe del Centro de Inteligencia de las Fuerzas de Defensa de Estonia, según informó European Pravda.\n\nDetalles: Kiviselg dijo que las pérdidas promedio de Rusia esta semana son de alrededor de 1.600 efectivos por día, lo que significa que las pérdidas totales de la semana ascienden a poco más de 11.000 soldados muertos y heridos.\n\nCita: \"Por lo tanto, la tendencia continúa: Rusia pierde más tropas en el campo de batalla de las que puede reclutar\".\n\nMás detalles: Kiviselg también dijo que Ucrania ha publicado por primera vez datos sobre su contraofensiva contra Lyman en la provincia de Donetsk, donde durante la operación se han liberado y limpiado alrededor de 85 kilómetros cuadrados de territorio.\n\nCita: \"Actualmente continúan las operaciones ucranianas en la provincia de Donetsk\".", "date_added": "2026-09-18"}, {"id": "f1a7e2852d10", "title_original": "С войны - в Госдуму: кто пополняет путинскую \"новую элиту\"", "text_original": "В России с 18 по 20 сентября проходят выборы в Госдуму IX созыва. Всего будут избраны 450 членов нижней палаты парламента: 225 по партийным спискам и 225 по одномандатным округам. На выборы в Госдуму зарегистрирован 4361 кандидат: 2774 человека баллотируются по федеральным партийным спискам, еще 1587 - по одномандатным округам. Кресла депутатов могут занять участники войны против Украины - Центральная избирательная комиссия РФ насчитала 186 таких человек: 76 баллотируются по одномандатным округам, еще 110 включены в федеральные списки пяти парламентских партий: 52 - от \"Единой России\", по 11 - от ЛДПР и \"Справедливой России\", девять - от КПРФ, двое - от \"Новых людей\".\n\nЭто - кадровые военные, бывшие гражданские и политики, получившие военный статус \"участника \"СВО\". В 2024 году президент РФ Владимир Путин назвал российских участников войны в Украине \"подлинной элитой\" России и пообещал посты в государственных структурах и региональных органах власти. Незадолго до выборов он публично выступил с призывом поддержать \"настоящих патриотов\" - то есть проголосовать за \"Единую Россию\". Впрочем, до этапа выборов добрались немногие участники войны - около 630 из них выставляли свою кандидатуру на праймериз.\n\nПомощь вернувшимся с войны - одна из главных тем в интервью кандидатов с военным прошлым. Александр Зицер из \"Новых людей\" предлагает готовить консультантов из их числа. \"Очень сложно найти общий язык с психологом, который не военный\", - объяснял он \"Коммерсанту\". Константин Рыжак из \"Справедливой России\" критикует действия Центробанка и систему ЕГЭ, выступая за сокращение социального неравенства. Командир бригады имени Александра Невского Алексей Верещагин из ЛДПР называет себя \"адептом империи\" и обещает добиваться лучшего снабжения военных, включая свое подразделение. А кандидат КПРФ Антон Шилов возмущается обогащением на войне: \"Кому - война, а кому - бизнес\". При этом участник наступления на Гостомель называет ошибкой вывод российских войск из-под Киева.\n\nНо насколько они будут обладать реальной властью, получив мандат депутата? Политический обозреватель онлайн-издания \"Медуза\" Андрей Перцев в интервью DW выразил сомнение в том, что вернувшиеся с фронта получат субъектность. Ключевые посты, по его оценке, останутся за проверенными представителями системы, которая не позволит развернуться бывшим военным.\n\nПолитолог Михаил Комин в исследовании для Европейского совета по международным отношениям оценивает продвижение участников войны как способ укрепить милитаристский курс страны. Насколько влиятельными они станут в Госдуме, покажут полученные мандаты, должности в комитетах и предложенные законы.\n\nОтметка \"участник \"СВО\" в биографии кандидата не обязательно означает опыт боевых действий, отмечает журналист \"Важных историй\" Никита Кондратьев. По его словам, на практике к этой категории могут относить и тех, кто работал в органах власти на оккупированных территориях Украины или помогал российской армии. Кондратьев приводит пример медали Минобороны \"Участнику \"СВО\": ее могут вручать за выполнение трудовых обязанностей, связанных с войной. Поэтому сама награда или отметка в биографии еще не подтверждает участия в боях.", "link": "https://www.dw.com/ru/с-войны-в-госдуму-кто-пополняет-путинскую-новую-элиту/a-79325502?maca=rus-rss-ru-all-1126-xml-mrss", "source_id": "dw_russian", "source_name": "Deutsche Welle (DW Ruso)", "perspective": "international", "language": "ru", "bias_note": "Radiodifusora pública internacional de Alemania con análisis exhaustivo del conflicto para la audiencia rusoparlante.", "published": "2026-09-18T11:45:00+00:00", "category": "frente", "relevance_score": 21, "title_es": "De la guerra a la Duma Estatal: quién se suma a la “nueva élite” de Putin", "text_es": "En Rusia, del 18 al 20 de septiembre se celebran las elecciones a la Duma Estatal de la novena convocatoria. Se elegirán en total 450 miembros de la cámara baja del parlamento: 225 de listas partidistas y 225 de circunscripciones de mandato único. Para las elecciones a la Duma estatal están inscritos 4.361 candidatos: 2.774 personas se presentan en listas de partidos federales, otros 1.587 se presentan en circunscripciones de mandato único. Los escaños de diputados pueden ser ocupados por los participantes en la guerra contra Ucrania: la Comisión Electoral Central de la Federación Rusa contó 186 de esas personas: 76 se postulan en distritos electorales de mandato único, otros 110 están incluidos en las listas federales de cinco partidos parlamentarios: 52 de Rusia Unida, 11 de LDPR y Rusia Justa, nueve del Partido Comunista de la Federación Rusa.\n\nSe trata de militares de carrera, ex civiles y políticos que recibieron el estatus militar de \"participantes del Distrito Militar Norte\". En 2024, el presidente ruso Vladimir Putin llamó a los participantes rusos en la guerra de Ucrania la “verdadera élite” de Rusia y prometió puestos en las estructuras estatales y las autoridades regionales. Poco antes de las elecciones, hizo un llamado público a apoyar a los \"verdaderos patriotas\", es decir, a votar por \"Rusia Unida\". Sin embargo, pocos participantes en la guerra llegaron a la etapa electoral. alrededor de 630 de ellos se presentaron como candidatos en las primarias.\n\nLa ayuda a quienes regresan de la guerra es uno de los temas principales en las entrevistas con candidatos con experiencia militar. Alexander Zitser de New People propone formar consultores entre ellos. \"Es muy difícil encontrar un lenguaje común con un psicólogo que no es militar\", explicó a Kommersant. Konstantin Ryzhak de Rusia Justa critica las acciones del Banco Central y del sistema del Examen Estatal Unificado y aboga por una reducción de la desigualdad social. El comandante de la brigada Alexander Nevsky, Alexey Vereshchagin del LDPR, se autodenomina “adepto del imperio” y promete lograr mejores suministros para los militares, incluida su unidad. Y el candidato del Partido Comunista de la Federación Rusa, Anton Shilov, está indignado por el enriquecimiento en la guerra: “¿A quién le importa?”\n\nPero ¿cuánto poder real tendrán una vez que reciban un mandato adjunto? El observador político de la publicación en línea Meduza Andrei Pertsev, en una entrevista con DW, expresó sus dudas de que quienes regresan del frente reciban subjetividad. Los puestos clave, en su opinión, permanecerán en manos de representantes probados del sistema, lo que no permitirá que los ex militares se den la vuelta.\n\nEl politólogo Mikhail Komin, en un estudio para el Consejo Europeo de Relaciones Exteriores, evalúa la promoción de los participantes en la guerra como una forma de fortalecer el rumbo militarista del país. La influencia que tendrán en la Duma estatal se verá en los mandatos recibidos, en los puestos en los comités y en las leyes propuestas.\n\nLa marca \"participante de SVO\" en la biografía de un candidato no significa necesariamente experiencia de combate, señala el periodista de \"Important Stories\", Nikita Kondratyev. Según él, en la práctica también pueden incluirse en esta categoría aquellos que trabajaron en organismos gubernamentales en los territorios ocupados de Ucrania o ayudaron al ejército ruso. Kondratyev da un ejemplo de medalla del Ministerio de Defensa para “participante de la SVO”: se puede otorgar por el desempeño de tareas laborales relacionadas con la guerra. Por lo tanto, el premio en sí o una marca en la biografía aún no confirma la participación en las batallas.", "date_added": "2026-09-18"}, {"id": "1c795ca4403d", "title_original": "Уоррен Баффетт ушел с поста председателя совета директоров Berkshire Hathaway", "text_original": "96-летний инвестор Уоррен Баффетт покинул пост председателя совета директоров компании Berkshire Hathaway, сообщает The New York Times.\n\nБаффетт стал почетным председателем компании и сохраняет за собой место в совете директоров. Новым председателем станет его сын Говард Баффетт.\n\n«Возможность быть председателем [совета директоров] стала для меня величайшей честью всей жизни, и я никогда не воспринимал ваше доверие как должное», — говорится в письме Баффетта акционерам. Он добавил, что «время берет свое».\n\nУоррен Баффетт купил Berkshire Hathaway в 1965 году — тогда это была небольшая текстильная мануфактура из Небраски, родного штата инвестора. На ее основе Баффетт построил огромный конгломерат, занимающийся инвестициями и страховым бизнесом. Forbes оценивает состояние Баффета в 144 миллиарда долларов. Он занимает 10-е место в рейтинге богатейших людей мира по версии журнала.\n\nВ мае 2025 года Баффетт покинул пост генерального директора компании. Его занял его давний заместитель Грег Абель.", "link": "https://meduza.io/news/2026/09/18/uorren-baffett-ushel-s-posta-predsedatelya-soveta-direktorov-berkshire-hathaway", "source_id": "meduza_ru", "source_name": "Meduza (RU)", "perspective": "russia_independent", "language": "ru", "bias_note": "Principal medio ruso de investigación independiente prohibido por el Kremlin (sede en Letonia).", "published": "2026-09-18T11:14:06+00:00", "category": "frente", "relevance_score": 15, "title_es": "Warren Buffett deja el cargo de presidente del consejo de administración de Berkshire Hathaway", "text_es": "El inversor Warren Buffett, de 96 años, ha dejado su cargo de presidente del consejo de administración de Berkshire Hathaway, informa The New York Times.\n\nBuffett se convirtió en presidente emérito de la empresa y conserva su puesto en la junta directiva. Su hijo Howard Buffett será el nuevo presidente.\n\n\"La oportunidad de servir como presidente [de la junta] ha sido el mayor honor de mi vida, y nunca he dado por sentada su confianza\", dijo Buffett en su carta a los accionistas. Añadió que “el tiempo está pasando factura”.\n\nWarren Buffett compró Berkshire Hathaway en 1965, entonces un pequeño fabricante textil en Nebraska, el estado natal del inversor. Sobre esta base, Buffett construyó un enorme conglomerado dedicado a inversiones y negocios de seguros. Forbes estima la riqueza de Buffett en 144 mil millones de dólares. Ocupa el décimo lugar en el ranking de la revista de las personas más ricas del mundo.\n\nEn mayo de 2025, Buffett dejó el cargo de director ejecutivo de la empresa. Lo ocupó su antiguo adjunto, Greg Abel.", "date_added": "2026-09-18"}, {"id": "9cf3593bc622", "title_original": "Drone Attacks Disrupt First Day of Voting in Southern Russia and Occupied Ukraine", "text_original": "Ukrainian drone strikes disrupted the work of election workers at polling stations in southern Russia and parts of occupied Ukraine, Russian authorities said Friday, the first day of a three-day voting period for parliamentary and regional races.\n\n“There are small incidents I can’t fail to mention,” Russia’s Central Election Commission (CEC) chief Ella Pamfilova told reporters during a morning press conference. “In the Krasnodar region, one polling station had to be moved to an alternative location because the windows were broken due to damage from a drone.”\n\nFourteen polling stations in the occupied Luhansk region of eastern Ukraine briefly lost power after drones damaged energy infrastructure, Pamfilova said, though the sites eventually switched to backup power supplies.\n\nAndrei Proshunin, the mayor of the southern resort city of Sochi, said election workers and voters were forced to seek shelter Friday morning due to an air raid alert. He did not say whether any additional safety measures had been introduced across the city’s more than 240 polling stations amid near-daily drone attacks.\n\nRussia is holding elections for the lower-house State Duma for the first time since President Vladimir Putin ordered the full-scale invasion of Ukraine in February 2022. Alongside parliamentary races, gubernatorial elections and votes for local legislative assemblies are taking place in several regions.\n\nEarlier this week, the CEC said one of its members was killed in a drone attack in the occupied Zaporizhzhia region. Voting is also taking place in parts of occupied Ukraine, which Russia claims to have annexed in September 2022.", "link": "https://www.themoscowtimes.com/2026/09/18/drone-attacks-disrupt-first-day-of-voting-in-southern-russia-and-occupied-ukraine-a93742", "source_id": "the_moscow_times", "source_name": "The Moscow Times", "perspective": "russia_independent", "language": "en", "bias_note": "Diario independiente ruso en el exilio crítico con Putin y con cobertura de ataques en territorio ruso.", "published": "2026-09-18T08:59:00+00:00", "category": "drones", "relevance_score": 31, "title_es": "Ataques con aviones no tripulados interrumpen el primer día de elecciones en el sur de Rusia y la Ucrania ocupada", "text_es": "Los ataques con drones ucranianos perturbaron el trabajo de los trabajadores electorales en los colegios electorales en el sur de Rusia y en partes de la Ucrania ocupada, dijeron las autoridades rusas el viernes, el primer día de un período de votación de tres días para las elecciones parlamentarias y regionales.\n\n\"Hay pequeños incidentes que no puedo dejar de mencionar\", dijo a los periodistas la jefa de la Comisión Electoral Central (CEC) de Rusia, Ella Pamfilova, durante una conferencia de prensa matutina. \"En la región de Krasnodar, un colegio electoral tuvo que ser trasladado a un lugar alternativo porque las ventanas se rompieron debido a los daños causados ​​por un dron\".\n\nCatorce colegios electorales en la región ocupada de Luhansk, en el este de Ucrania, se quedaron brevemente sin electricidad después de que los drones dañaran la infraestructura energética, dijo Pamfilova, aunque los sitios finalmente cambiaron a suministros de energía de respaldo.\n\nAndrei Proshunin, alcalde de la ciudad turística sureña de Sochi, dijo que los trabajadores electorales y los votantes se vieron obligados a buscar refugio el viernes por la mañana debido a una alerta de ataque aéreo. No dijo si se habían introducido medidas de seguridad adicionales en los más de 240 colegios electorales de la ciudad en medio de ataques casi diarios con drones.\n\nRusia está celebrando elecciones para la Duma Estatal de la cámara baja por primera vez desde que el presidente Vladimir Putin ordenó la invasión a gran escala de Ucrania en febrero de 2022. Además de las elecciones parlamentarias, en varias regiones se están celebrando elecciones para gobernador y votaciones para las asambleas legislativas locales.\n\nA principios de esta semana, la CCA dijo que uno de sus miembros murió en un ataque con aviones no tripulados en la región ocupada de Zaporizhzhia. También se están llevando a cabo votaciones en partes de la Ucrania ocupada, que Rusia afirma haber anexado en septiembre de 2022.", "date_added": "2026-09-18"}, {"id": "d57e5cddb5bc", "title_original": "«Планируем все необходимые шаги для защиты своих прав». В Nestle и «Ашан» прокомментировали указ Путина о введении временного управления в компаниях", "text_original": "Компания Nestle «принимает к сведению» указ президента России, по которому в «Нестле Россия» вводится «временная внешняя администрация».\n\n«Компания оценивает ситуацию и возможные варианты действий. Nestlе планирует предпринять все необходимые шаги для защиты своих прав и обеспечения непрерывности бизнес-операций в интересах всех заинтересованных сторон, особенно своих сотрудников», — говорится в заявлении компании.\n\nРоссийская «дочка» французской Auchan — ООО «Ашан» — после указа Путина продолжает работать в штатном режиме. Компания «направила запрос о разъяснениях» указа (кому именно, не уточняется»).\n\n«После получения соответствующей информации мы сможем предоставить более детальный комментарий. На сегодняшний день компания и все ее объекты продолжают работать в штатном режиме, без каких-либо изменений», — сказали РБК в компании.\n\nКомпания «Л.Е.В. Менеджмент» была зарегистрирована в октябре 2024 года в Москве. Ее генеральным директором значится Андрей Краюшкин. По данным «Новой газеты Европа», полное имя гендиректора «Л.Е.В. Менеджмент», а также его дата рождения, совпадают с именем генерал-майора МВД Андрея Краюшкина — бывшего первого заместителя управления по вопросам миграции.", "link": "https://meduza.io/news/2026/09/18/planiruem-vse-neobhodimye-shagi-dlya-zaschity-svoih-prav-v-nestle-i-ashan-prokommentirovali-ukaz-putina-o-vvedenii-vremennogo-upravleniya-v-kompaniyah", "source_id": "meduza_ru", "source_name": "Meduza (RU)", "perspective": "russia_independent", "language": "ru", "bias_note": "Principal medio ruso de investigación independiente prohibido por el Kremlin (sede en Letonia).", "published": "2026-09-18T08:40:32+00:00", "category": "economia", "relevance_score": 21, "title_es": "\"Estamos planeando todas las medidas necesarias para proteger nuestros derechos\". Nestlé y Auchan comentaron el decreto de Putin sobre la introducción de la gestión temporal en las empresas", "text_es": "La empresa Nestlé “toma nota” del decreto del presidente ruso según el cual se introduce en Nestlé Rusia una “administración externa temporal”.\n\n\"La empresa está evaluando la situación y los posibles cursos de acción. Nestlé planea tomar todas las medidas necesarias para proteger sus derechos y garantizar la continuidad de las operaciones comerciales en interés de todas las partes interesadas, especialmente de sus empleados\", dijo la empresa en un comunicado.\n\nLa filial rusa de la francesa Auchan, Auchan LLC, sigue funcionando con normalidad tras el decreto de Putin. La empresa “envió una solicitud de aclaración” del decreto (a quién no se especificó exactamente).\n\n\"Una vez que recibamos la información relevante, podremos hacer un comentario más detallado. A día de hoy, la empresa y todas sus instalaciones siguen funcionando con normalidad, sin ningún cambio\", dijo la empresa a RBC.\n\nLa empresa \"L.E.V. Management\" se registró en octubre de 2024 en Moscú. Su director general es Andrey Krayushkin. Según Novaya Gazeta Europa, el nombre completo del director general de L.E.V. Gestión”, así como su fecha de nacimiento, coincide con el nombre del mayor general del Ministerio del Interior, Andrei Krayushkin, ex primer subdirector de asuntos migratorios.", "date_added": "2026-09-18"}, {"id": "1944a45be20a", "title_original": "NBC News: США могут вывести из Европы до половины военного контингента", "text_original": "По информации телекомпании NBC News, Пентагон рассматривает возможность вывода из Европы почти трети американского контингента. Европейские страны могут покинуть 25 тысяч и более американских военнослужащих, сообщает телеканал в четверг, 17 сентября, со ссылкой на семь действующих и бывших американских и западных должностных лиц.\n\nДва собеседника журналистов отметили, что сокращение может быть еще больше - до 40 000 военнослужащих, что составляет около половины американского контингента в Европе.\n\nПо всей вероятности, сокращение контингента затронет Германию, Италию и Испанию, указали три действующих и один бывший американские чиновники и еще одно западное официальное лицо. В этих трех странах базируется основная часть американских войск в Европе, при этом их лидеры вступали в конфликт с президентом США Дональдом Трампом из-за войны с Ираном, напоминает NBC News.\n\nПлан радикального сокращения военного присутствия США в Европе предусматривает также вывод авиации, кораблей и вооружений. Если эти намерения будут реализованы, это станет самым значительным сокращением 80-тысячного американского военного присутствия в Европе со времен окончания холодной войны.\n\nНикаких решений в этой связи пока не принято, отмечает телеканал со ссылкой на высокопоставленного чиновника Минобороны США и двух других официальных лиц.\n\nСтоль масштабные меры изучаются Соединенными Штатами, несмотря на предупреждения союзников по НАТО о растущей угрозе российской агрессии в Европе, отмечает телеканал. Этот шаг может радикально изменить отношения США с ключевыми союзниками и вынудить европейские страны налаживать новые партнерские отношения во времена нестабильности из-за войн в Украине и на Ближнем Востоке, указывается в материале.", "link": "https://www.dw.com/ru/nbc-news-сша-могут-вывести-из-европы-до-половины-военного-контингента/a-79318872?maca=rus-rss-ru-all-1126-xml-mrss", "source_id": "dw_russian", "source_name": "Deutsche Welle (DW Ruso)", "perspective": "international", "language": "ru", "bias_note": "Radiodifusora pública internacional de Alemania con análisis exhaustivo del conflicto para la audiencia rusoparlante.", "published": "2026-09-18T07:01:00+00:00", "category": "frente", "relevance_score": 15, "title_es": "NBC News: Estados Unidos puede retirar hasta la mitad de su contingente militar de Europa", "text_es": "Según NBC News, el Pentágono está considerando la posibilidad de retirar casi un tercio del contingente estadounidense de Europa. Los países europeos pueden dejar 25 mil o más tropas estadounidenses, informó el canal de televisión el jueves 17 de septiembre, citando a siete funcionarios estadounidenses y occidentales actuales y anteriores.\n\nDos interlocutores de los periodistas señalaron que la reducción podría ser aún mayor: hasta 40.000 soldados, aproximadamente la mitad del contingente estadounidense en Europa.\n\nEs probable que la reducción afecte a Alemania, Italia y España, dijeron tres funcionarios estadounidenses actuales y un ex, y un funcionario occidental. Estos tres países albergan la mayor parte de las tropas estadounidenses en Europa, y sus líderes se han enfrentado con el presidente estadounidense, Donald Trump, por la guerra con Irán, recuerda NBC News.\n\nEl plan para una reducción radical de la presencia militar estadounidense en Europa prevé también la retirada de aviones, barcos y armas. Si estas intenciones se implementan, será la mayor reducción de la presencia militar estadounidense de 80.000 efectivos en Europa desde el final de la Guerra Fría.\n\nAún no se ha tomado ninguna decisión al respecto, señala el canal de televisión citando a un alto funcionario del Departamento de Defensa de Estados Unidos y a otros dos funcionarios.\n\nEstados Unidos está estudiando medidas de este tipo a gran escala, a pesar de las advertencias de los aliados de la OTAN sobre la crecie
